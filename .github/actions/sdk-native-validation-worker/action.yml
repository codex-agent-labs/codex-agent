name: Validate one elected native SDK on its actual host
description: Consume the original prepared SDKs under caller-provisioned tooling policy and dependency caches; this action does not acquire signing or evidence authority.
inputs:
  plan-id:
    required: true
    description: Exact original plan upload ID.
  artifact-id:
    required: true
    description: Current state upload ID.
  artifact-sha256:
    required: true
    description: Current state upload digest.
  state-wave:
    default: '0'
    description: Current Runtime wave.
  sdk-state-wave:
    default: ''
    description: Current SDK wave when applicable.
  preparation-state-id:
    required: true
    description: Original preparation state upload ID.
  preparation-state-sha256:
    required: true
    description: Original preparation state upload digest.
  preparation-state-wave:
    default: '0'
    description: Original preparation Runtime wave.
  preparation-sdk-state-wave:
    default: ''
    description: Original preparation SDK wave when applicable.
  preparation-component:
    required: true
    description: Exact original preparation package component.
  preparation-build-key:
    required: true
    description: Exact original preparation package key.
  prepared-artifact-id:
    required: true
    description: Single original prepared source and SDK upload ID.
  prepared-artifact-sha256:
    required: true
    description: Exact prepared upload digest.
  sdk-inputs-id:
    required: true
    description: Original authenticated SDK inputs upload ID.
  sdk-inputs-sha256:
    required: true
    description: Exact SDK inputs upload digest.
  sdk-validation-tooling:
    required: true
    description: Absolute caller-owned canonical six-field tooling policy path; evidence, public key and Java must already exist. Never sourced from downloaded worker/state content.
  trusted-workflow-sha:
    required: true
    description: Caller-pinned reviewed product workflow revision.
  component:
    required: true
    description: Exact elected native language.
  target:
    required: true
    description: Exact elected matching-host classifier.
  build-key:
    required: true
    description: Exact elected validation key.
  tree:
    required: true
    description: Exact original plan tree.
  dotnet-executable:
    default: ''
    description: Optional caller-provisioned dotnet executable with installed SDK/reference packs. The C# producer restores with empty feeds inside its private source snapshot, never into the checkout.
  dart-executable:
    default: ''
    description: Optional caller-provisioned Dart executable.
  dart-package-config:
    default: ''
    description: Optional existing resolved Dart package configuration selecting the exact binding. Caller must provision dependency caches/configuration without untracked checkout writes.
  dart-pub-cache:
    default: ''
    description: Existing prepopulated writable absolute pub cache outside the checkout, required for Dart when no explicit package config is supplied. Locked offline resolution may update pub metadata but never downloads dependencies.
runs:
  using: composite
  steps:
    - id: policy
      name: Pin the caller tooling policy before any state capture
      shell: bash
      env:
        SDK_VALIDATION_TOOLING: ${{ inputs.sdk-validation-tooling }}
      run: |
        python3 -B - <<'PY'
        import os
        from pathlib import Path
        from ci.products.inventory import load_canonical_json_bytes, read_regular_file_bytes, require_exact_keys, sha256_bytes
        path = Path(os.environ['SDK_VALIDATION_TOOLING'])
        if not path.is_absolute():
            raise ValueError('Caller tooling policy must have an explicit absolute path')
        raw = read_regular_file_bytes(path, reject_symlink_parents=True)
        policy = require_exact_keys(load_canonical_json_bytes(raw),
            {'evidence', 'publicKey', 'javaExecutable', 'requiredTrustDomain', 'keyring', 'keysDirectory'}, 'Caller SDK tooling')
        trust = policy['requiredTrustDomain']
        if trust not in ('development', 'release') or ((trust == 'release') != (policy['keyring'] is not None and policy['keysDirectory'] is not None)):
            raise ValueError('Caller tooling trust and public keys disagree')
        if trust == 'development' and (policy['keyring'] is not None or policy['keysDirectory'] is not None):
            raise ValueError('Development tooling cannot import release keys')
        if any(policy[name] is None for name in ('evidence', 'publicKey', 'javaExecutable')):
            raise ValueError('Caller tooling evidence, public key and Java are required')
        for name in ('evidence', 'publicKey', 'javaExecutable', 'keyring', 'keysDirectory'):
            if policy[name] is not None and (not isinstance(policy[name], str) or not Path(policy[name]).is_absolute()):
                raise ValueError('Caller tooling paths must be explicit absolute paths')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('sha256=' + sha256_bytes(raw) + '\n')
        PY
    - id: dart-inputs
      if: inputs.component == 'dart'
      name: Require caller-owned Dart dependencies before capture or setup
      shell: bash
      env:
        DART_PACKAGE_CONFIG: ${{ inputs.dart-package-config }}
        DART_PUB_CACHE: ${{ inputs.dart-pub-cache }}
      run: |
        python3 -B - <<'PY'
        import os
        from pathlib import Path
        from ci.products.inventory import read_regular_file_bytes
        config = os.environ['DART_PACKAGE_CONFIG']
        selected = config or os.environ['DART_PUB_CACHE']
        if not selected or not Path(selected).is_absolute():
            raise ValueError('Dart requires an explicit external package config or prepopulated pub cache')
        path = Path(selected)
        if any(parent.is_symlink() for parent in (path, *path.parents)):
            raise ValueError('Dart dependency input must not be symbolic')
        resolved, checkout = path.resolve(strict=True), Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
        if resolved.is_relative_to(checkout) or checkout.is_relative_to(resolved):
            raise ValueError('Dart dependency input must be outside and separate from the checkout')
        if config:
            read_regular_file_bytes(path, reject_symlink_parents=True)
        elif not path.is_dir() or not any(path.iterdir()):
            raise ValueError('Dart requires an existing prepopulated pub cache')
        PY
    - id: captured
      uses: ./.github/actions/capture-runtime-state
      with:
        product: sdk
        sdk-family: native-validation
        plan-id: ${{ inputs.plan-id }}
        artifact-id: ${{ inputs.artifact-id }}
        artifact-sha256: ${{ inputs.artifact-sha256 }}
        state-wave: ${{ inputs.state-wave }}
        sdk-state-wave: ${{ inputs.sdk-state-wave }}
        sdk-validation-tooling: ${{ inputs.sdk-validation-tooling }}
        trusted-workflow-sha: ${{ inputs.trusted-workflow-sha }}
    - id: preparation
      name: Capture original preparation state independently
      shell: bash
      env:
        PLAN: ${{ steps.captured.outputs.plan-path }}
        ARTIFACT_ID: ${{ inputs.preparation-state-id }}
        ARTIFACT_SHA256: ${{ inputs.preparation-state-sha256 }}
        STATE_WAVE: ${{ inputs.preparation-state-wave }}
        SDK_STATE_WAVE: ${{ inputs.preparation-sdk-state-wave }}
        SDK_VALIDATION_TOOLING: ${{ inputs.sdk-validation-tooling }}
        TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted-workflow-sha }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        selected=()
        if [ -n "$SDK_STATE_WAVE" ]; then selected=(--sdk-state-wave "$SDK_STATE_WAVE"); fi
        python3 -B -m ci.sdk_workflow capture --family native-package --plan "$PLAN" \
          --destination "$GITHUB_WORKSPACE/build/native-preparation-input" \
          --repository-root "$GITHUB_WORKSPACE" --artifact-id "$ARTIFACT_ID" \
          --artifact-sha256 "$ARTIFACT_SHA256" --state-wave "$STATE_WAVE" \
          --sdk-validation-tooling "$SDK_VALIDATION_TOOLING" --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
          --github-output "$GITHUB_OUTPUT" ${selected[@]+"${selected[@]}"}
    - id: identity
      shell: bash
      env:
        MATRIX: ${{ steps.captured.outputs.sdk-matrix }}
        PREPARATION_MATRIX: ${{ steps.preparation.outputs.sdk_matrix }}
        PLAN: ${{ steps.captured.outputs.plan-path }}
        COMPONENT: ${{ inputs.component }}
        TARGET: ${{ inputs.target }}
        BUILD_KEY: ${{ inputs.build-key }}
        PREPARATION_COMPONENT: ${{ inputs.preparation-component }}
        PREPARATION_BUILD_KEY: ${{ inputs.preparation-build-key }}
        TREE: ${{ inputs.tree }}
        SDK_VALIDATION_TOOLING: ${{ inputs.sdk-validation-tooling }}
        POLICY_SHA256: ${{ steps.policy.outputs.sha256 }}
      run: |
        python3 -B - <<'PY'
        import json, os, re, sys
        from pathlib import Path
        sys.path.insert(0, str(Path.cwd() / 'ci'))
        from native_wrappers import HOSTS, LANGUAGES, host_classifier
        from products.inventory import read_regular_file_bytes, sha256_bytes
        host = host_classifier()
        if os.environ['TARGET'] != host:
            raise ValueError('Native validation must execute on its actual elected host')
        for prefix, phase, target, topology in (('', 'validation', host, HOSTS[host][2:4]),
                ('PREPARATION_', 'package', 'desktop', ('Linux', 'X64'))):
            component, key = os.environ[prefix + 'COMPONENT'], os.environ[prefix + 'BUILD_KEY']
            rows = [row for row in json.loads(os.environ[prefix + 'MATRIX'])['include']
                    if (row['product'], row['component'], row['phase'], row['target']) == ('sdk', component, phase, target)]
            if (component not in LANGUAGES or len(rows) != 1 or rows[0]['buildKey'] != key or
                    not re.fullmatch(r'sha256:[0-9a-f]{64}', key) or
                    (rows[0]['runnerOs'], rows[0]['runnerArch']) != topology):
                raise ValueError('Native validation or preparation differs from its original election')
        if sha256_bytes(read_regular_file_bytes(Path(os.environ['SDK_VALIDATION_TOOLING']), reject_symlink_parents=True)) != os.environ['POLICY_SHA256']:
            raise ValueError('Caller tooling policy changed during state capture')
        with open(os.environ['PLAN']) as source:
            plan = json.load(source)
        if plan['validationTree'] != os.environ['TREE'] or not re.fullmatch(r'[0-9a-f]{40}', plan['validationCommit']):
            raise ValueError('Native validation source differs from its captured plan')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('key_hex=' + os.environ['BUILD_KEY'].removeprefix('sha256:') + '\n')
            output.write('policy_revision=' + plan['validationCommit'] + '\n')
        PY
    - uses: ./.github/actions/setup-kmp
      with:
        cache-read-only: 'true'
        product-worker: 'true'
    - uses: ./.github/actions/setup-msvc
    - if: inputs.component == 'python'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    - if: inputs.component == 'csharp'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '8.0.419'
    - if: inputs.component == 'rust'
      uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
    - if: inputs.component == 'dart'
      uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      with:
        sdk: '3.13.2'
    - id: execute
      name: Execute the fixed original-input validation controller
      shell: bash
      env:
        PLAN: ${{ steps.captured.outputs.plan-path }}
        DISCOVERY: ${{ steps.captured.outputs.discovery-root }}
        STATE: ${{ steps.captured.outputs.state-root }}
        PREPARATION_STATE: ${{ steps.preparation.outputs.state_root }}
        COMPONENT: ${{ inputs.component }}
        TARGET: ${{ inputs.target }}
        BUILD_KEY: ${{ inputs.build-key }}
        PREPARATION_COMPONENT: ${{ inputs.preparation-component }}
        PREPARATION_BUILD_KEY: ${{ inputs.preparation-build-key }}
        PREPARED_ARTIFACT_ID: ${{ inputs.prepared-artifact-id }}
        PREPARED_ARTIFACT_SHA256: ${{ inputs.prepared-artifact-sha256 }}
        SDK_INPUTS_ID: ${{ inputs.sdk-inputs-id }}
        SDK_INPUTS_SHA256: ${{ inputs.sdk-inputs-sha256 }}
        SDK_VALIDATION_TOOLING: ${{ inputs.sdk-validation-tooling }}
        POLICY_SHA256: ${{ steps.policy.outputs.sha256 }}
        POLICY_REVISION: ${{ steps.identity.outputs.policy_revision }}
        TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted-workflow-sha }}
        DOTNET_EXECUTABLE: ${{ inputs.dotnet-executable }}
        DART_EXECUTABLE: ${{ inputs.dart-executable }}
        DART_PACKAGE_CONFIG: ${{ inputs.dart-package-config }}
        DART_PUB_CACHE: ${{ inputs.dart-pub-cache }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        python3 -B - <<'PY'
        import json, os, shutil, subprocess, sys, tempfile
        from pathlib import Path
        from ci.products.inventory import load_canonical_json_bytes, read_regular_file_bytes, sha256_bytes
        raw = read_regular_file_bytes(Path(os.environ['SDK_VALIDATION_TOOLING']), reject_symlink_parents=True)
        if sha256_bytes(raw) != os.environ['POLICY_SHA256']:
            raise ValueError('Caller tooling policy changed before execution')
        policy = load_canonical_json_bytes(raw)
        fields = {'plan': os.environ['PLAN'], 'discovery-root': os.environ['DISCOVERY'],
            'state-root': os.environ['STATE'], 'preparation-state-root': os.environ['PREPARATION_STATE'],
            'destination': str(Path(os.environ['GITHUB_WORKSPACE']) / 'build/sdk-worker'),
            'repository-root': os.environ['GITHUB_WORKSPACE'], 'component': os.environ['COMPONENT'],
            'target': os.environ['TARGET'], 'expected-build-key': os.environ['BUILD_KEY'],
            'preparation-component': os.environ['PREPARATION_COMPONENT'], 'preparation-build-key': os.environ['PREPARATION_BUILD_KEY'],
            'prepared-artifact-id': os.environ['PREPARED_ARTIFACT_ID'], 'prepared-artifact-sha256': os.environ['PREPARED_ARTIFACT_SHA256'],
            'sdk-inputs-artifact-id': os.environ['SDK_INPUTS_ID'], 'sdk-inputs-artifact-sha256': os.environ['SDK_INPUTS_SHA256'],
            'trusted-workflow-sha': os.environ['TRUSTED_WORKFLOW_SHA'], 'policy-revision': os.environ['POLICY_REVISION'],
            'keyring': str(Path(os.environ['GITHUB_WORKSPACE']) / 'gradle/release/product-signing-keys.json'),
            'keys-directory': str(Path(os.environ['GITHUB_WORKSPACE']) / 'gradle/release/keys'),
            'tooling-evidence': policy['evidence'], 'tooling-public-key': policy['publicKey'],
            'java-executable': policy['javaExecutable'], 'required-trust-domain': policy['requiredTrustDomain']}
        if policy['keyring'] is not None:
            fields.update({'tooling-keyring': policy['keyring'], 'tooling-keys-directory': policy['keysDirectory']})
        for name, variable in (('dotnet-executable', 'DOTNET_EXECUTABLE'), ('dart-executable', 'DART_EXECUTABLE'),
                               ('dart-package-config', 'DART_PACKAGE_CONFIG')):
            if os.environ[variable]:
                fields[name] = os.environ[variable]
        if os.environ['COMPONENT'] == 'csharp' and 'dotnet-executable' not in fields:
            executable = shutil.which('dotnet')
            if executable is None:
                raise ValueError('Selected C# validation requires installed dotnet')
            fields['dotnet-executable'] = str(Path(executable).resolve(strict=True))
        if os.environ['COMPONENT'] == 'dart':
            executable = fields.get('dart-executable') or shutil.which('dart')
            if not executable or not Path(executable).is_absolute():
                raise ValueError('Selected Dart validation requires installed pinned Dart')
            fields['dart-executable'] = str(Path(executable).resolve(strict=True))
            if 'dart-package-config' not in fields:
                from ci.product_reuse import _runtime_worker_checkout, _runtime_worker_environment
                checkout = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
                plan = json.loads(read_regular_file_bytes(Path(os.environ['PLAN']), reject_symlink_parents=True))
                original = {'commit': plan['validationCommit'], 'tree': plan['validationTree']}
                _runtime_worker_checkout(checkout, original)
                cache = os.environ['DART_PUB_CACHE']
                if not cache or not Path(cache).is_absolute():
                    raise ValueError('Dart offline provisioning requires the caller pub cache')
                temporary = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
                if temporary.is_relative_to(checkout) or checkout.is_relative_to(temporary):
                    raise ValueError('Dart provisioning scratch must be outside the checkout')
                scratch = Path(tempfile.mkdtemp(prefix='sdk-dart-dependencies-', dir=temporary))
                output = scratch / 'provisioned'
                environment, _ = _runtime_worker_environment(checkout, original, scratch, os.environ)
                bytecode = scratch / 'python-bytecode'
                if bytecode.exists() or bytecode.is_symlink():
                    raise ValueError('Dart provisioning private Python bytecode namespace was modified')
                with open(os.environ['GITHUB_OUTPUT'], 'a') as diagnostic_output:
                    diagnostic_output.write('dart_diagnostics=' + str(output) + '\n')
                try:
                    subprocess.run([sys.executable, '-B', str(checkout / 'codex-agent-bindings/dart/tool/provision_dependencies.py'),
                        '--dart-executable', fields['dart-executable'], '--pub-cache', cache, '--output', str(output)],
                        cwd=checkout, env=environment, check=True)
                finally:
                    if bytecode.exists() or bytecode.is_symlink():
                        raise ValueError('Dart provisioning private Python bytecode namespace was modified')
                    _runtime_worker_checkout(checkout, original)
                fields['dart-package-config'] = str(output / 'package_config.json')
        command = [sys.executable, '-B', '-m', 'ci.sdk_workflow', 'native-validation',
                   *(value for name, item in fields.items() for value in ('--' + name, item))]
        subprocess.run(command, cwd=os.environ['GITHUB_WORKSPACE'], env=os.environ, check=True)
        PY
    - name: Retain exact external Dart provisioning diagnostics, including failures
      if: always() && steps.identity.outcome == 'success' && steps.execute.outputs.dart_diagnostics != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: codex-agent-sdk-dart-dependencies-validation-${{ inputs.target }}-${{ steps.identity.outputs.key_hex }}-${{ inputs.tree }}-attempt-${{ github.run_attempt }}
        path: ${{ steps.execute.outputs.dart_diagnostics }}
        if-no-files-found: warn
        overwrite: false
        include-hidden-files: true
        compression-level: 0
        retention-days: 90
    - if: always() && steps.identity.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: codex-agent-sdk-worker-${{ inputs.component }}-validation-${{ inputs.target }}-${{ steps.identity.outputs.key_hex }}-${{ inputs.tree }}-attempt-${{ github.run_attempt }}
        path: build/sdk-worker
        if-no-files-found: warn
        overwrite: false
        include-hidden-files: true
        compression-level: 0
        retention-days: 90
