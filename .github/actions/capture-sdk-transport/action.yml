name: Capture original SDK state transport
description: Authenticate one exact official SDK state upload before caller metadata policy election; this does not elect or admit product work.
inputs:
  plan-id:
    required: true
    description: Caller-owned current plan artifact ID.
  artifact-id:
    required: true
    description: Caller-owned original SDK state artifact ID.
  artifact-sha256:
    required: true
    description: Caller-owned original SDK state upload digest.
  sdk-state-wave:
    required: true
    description: Exact original completed SDK collector wave, one through eighteen.
  trusted-workflow-sha:
    required: true
    description: Reviewed literal product workflow revision.
outputs:
  plan-path:
    value: ${{ steps.capture.outputs.plan_path }}
  discovery-root:
    value: ${{ steps.capture.outputs.discovery_root }}
  state-root:
    value: ${{ steps.capture.outputs.state_root }}
  input-root:
    value: ${{ steps.capture.outputs.input_root }}
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ inputs.plan-id }}
        path: build/sdk-transport-plan
        merge-multiple: true
    - id: capture
      shell: bash
      env:
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        ARTIFACT_SHA256: ${{ inputs.artifact-sha256 }}
        SDK_STATE_WAVE: ${{ inputs.sdk-state-wave }}
        TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted-workflow-sha }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 -B -m ci.sdk_workflow capture-transport \
          --plan build/sdk-transport-plan/impact-plan.json \
          --destination build/sdk-transport-state \
          --artifact-id "$ARTIFACT_ID" --artifact-sha256 "$ARTIFACT_SHA256" \
          --sdk-state-wave "$SDK_STATE_WAVE" \
          --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
          --repository-root "$GITHUB_WORKSPACE" \
          --github-output "$GITHUB_OUTPUT"
