name: Execute elected JavaScript SDK phase
description: Capture and replay original state before setup, execute the fixed SDK phase, retain every result.
inputs:
  plan-id:
    required: true
    description: Exact original plan upload.
  artifact-id:
    required: true
    description: Exact predecessor state upload.
  artifact-sha256:
    required: true
    description: Exact predecessor state digest.
  state-wave:
    default: '0'
    description: Original Runtime state wave.
  sdk-state-wave:
    default: ''
    description: Original SDK state wave when applicable.
  sdk-validation-tooling:
    default: ''
    description: Optional current caller-owned local tooling policy; never selected from captured state.
  sdk-apple-validation-policy:
    default: ''
    description: Optional caller-owned local Apple policy for replaying retained validation state.
  sdk-inputs-id:
    required: true
    description: Exact SDK inputs upload ID.
  sdk-inputs-sha256:
    required: true
    description: Exact SDK inputs upload digest.
  trusted-workflow-sha:
    required: true
    description: Reviewed product workflow revision.
  phase:
    required: true
    description: Elected package or validation phase.
  build-key:
    required: true
    description: Exact elected phase key.
  tree:
    required: true
    description: Exact tested tree.
runs:
  using: composite
  steps:
    - id: captured
      uses: ./.github/actions/capture-runtime-state
      with:
        product: sdk
        plan-id: ${{ inputs.plan-id }}
        artifact-id: ${{ inputs.artifact-id }}
        artifact-sha256: ${{ inputs.artifact-sha256 }}
        state-wave: ${{ inputs.state-wave }}
        sdk-state-wave: ${{ inputs.sdk-state-wave }}
        sdk-validation-tooling: ${{ inputs.sdk-validation-tooling }}
        sdk-apple-validation-policy: ${{ inputs.sdk-apple-validation-policy }}
        trusted-workflow-sha: ${{ inputs.trusted-workflow-sha }}
    - id: identity
      shell: bash
      env:
        MATRIX: ${{ steps.captured.outputs.sdk-matrix }}
        PHASE: ${{ inputs.phase }}
        BUILD_KEY: ${{ inputs.build-key }}
      run: |
        python3 - <<'PY'
        import json, os, re
        key = os.environ['BUILD_KEY']
        rows = [row for row in json.loads(os.environ['MATRIX'])['include']
                if (row['product'], row['component'], row['phase'], row['target']) ==
                   ('sdk', 'javascript', os.environ['PHASE'], 'node')]
        if len(rows) != 1 or rows[0]['buildKey'] != key or not re.fullmatch(r'sha256:[0-9a-f]{64}', key):
            raise ValueError('JavaScript worker differs from the original replay election')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('key_hex=' + key.removeprefix('sha256:') + '\n')
        PY
    - uses: ./.github/actions/setup-kmp
      with:
        cache-read-only: 'false'
        node-version: '24.18.0'
        product-worker: 'true'
    - name: Provision locked consumer dependencies before offline validation
      if: inputs.phase == 'validation'
      shell: bash
      env:
        npm_config_offline: 'false'
        npm_config_engine_strict: 'true'
      run: |
        set -euo pipefail
        consumer_inputs=$(mktemp -d "$RUNNER_TEMP/sdk-js-consumer-inputs.XXXXXX")
        cp "$GITHUB_WORKSPACE/codex-agent-bindings/javascript/consumer/package.json" \
          "$GITHUB_WORKSPACE/codex-agent-bindings/javascript/consumer/package-lock.json" "$consumer_inputs/"
        npm ci --prefix "$consumer_inputs" --ignore-scripts --no-audit --no-fund \
          --cache "$GITHUB_WORKSPACE/codex-agent-sdk/build/npm/cache"
        typescript_spec=$(node -p '"typescript@" + require(process.argv[1]).packages["node_modules/typescript"].version' "$consumer_inputs/package-lock.json")
        npm cache add "$typescript_spec" --ignore-scripts \
          --cache "$GITHUB_WORKSPACE/codex-agent-sdk/build/npm/cache"
    - name: Execute exact SDK phase within verified original input lifetimes
      shell: bash
      env:
        PLAN: ${{ steps.captured.outputs.plan-path }}
        DISCOVERY: ${{ steps.captured.outputs.discovery-root }}
        STATE: ${{ steps.captured.outputs.state-root }}
        PHASE: ${{ inputs.phase }}
        BUILD_KEY: ${{ inputs.build-key }}
        SDK_INPUTS_ID: ${{ inputs.sdk-inputs-id }}
        SDK_INPUTS_SHA256: ${{ inputs.sdk-inputs-sha256 }}
        SDK_VALIDATION_TOOLING: ${{ inputs.sdk-validation-tooling }}
        SDK_APPLE_VALIDATION_POLICY: ${{ inputs.sdk-apple-validation-policy }}
        TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted-workflow-sha }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        selected=()
        if [ -n "$SDK_VALIDATION_TOOLING" ]; then selected=(--sdk-validation-tooling "$SDK_VALIDATION_TOOLING"); fi
        if [ -n "${SDK_APPLE_VALIDATION_POLICY:-}" ]; then selected+=(--sdk-apple-validation-policy "$SDK_APPLE_VALIDATION_POLICY"); fi
        reuse=()
        if [ -n "${CODEX_AGENT_COMPLETED_REUSE_POLICY:-}" ]; then reuse+=(--completed-frozen-policy "$CODEX_AGENT_COMPLETED_REUSE_POLICY"); fi
        if [ -n "${CODEX_AGENT_RETAINED_SDK_INPUTS_SOURCE:-}" ]; then reuse+=(--retained-sdk-inputs-source "$CODEX_AGENT_RETAINED_SDK_INPUTS_SOURCE"); fi
        python3 -B -m ci.sdk_workflow javascript --plan "$PLAN" --discovery-root "$DISCOVERY" \
          --state-root "$STATE" --destination "$GITHUB_WORKSPACE/build/sdk-worker" \
          --repository-root "$GITHUB_WORKSPACE" --phase "$PHASE" --expected-build-key "$BUILD_KEY" \
          --artifact-id "$SDK_INPUTS_ID" --artifact-sha256 "$SDK_INPUTS_SHA256" \
          --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
          --keyring "$GITHUB_WORKSPACE/gradle/release/product-signing-keys.json" \
          --keys-directory "$GITHUB_WORKSPACE/gradle/release/keys" ${selected[@]+"${selected[@]}"} ${reuse[@]+"${reuse[@]}"}
    - if: always() && steps.identity.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: codex-agent-sdk-worker-javascript-${{ inputs.phase }}-node-${{ steps.identity.outputs.key_hex }}-${{ inputs.tree }}-attempt-${{ github.run_attempt }}
        path: |
          build/sdk-worker/shard
          build/sdk-worker/worker/execution.json
          build/sdk-worker/worker/gradle.log
          ${{ job.status != 'success' && 'build/sdk-worker' || '' }}
        if-no-files-found: warn
        overwrite: false
        include-hidden-files: true
        compression-level: 0
        retention-days: 90
