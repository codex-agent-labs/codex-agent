name: Execute elected JavaScript SDK metadata
description: Replay original state and validation execution with caller-owned tooling; retain the complete admitted worker result.
inputs:
  plan-id:
    required: true
    description: Exact original plan upload ID.
  artifact-id:
    required: true
    description: Original predecessor state upload ID.
  artifact-sha256:
    required: true
    description: Exact predecessor state digest.
  state-wave:
    default: '0'
    description: Original Runtime state wave.
  sdk-state-wave:
    default: ''
    description: Original SDK state wave when applicable.
  sdk-inputs-id:
    required: true
    description: Exact authenticated SDK inputs upload ID.
  sdk-inputs-sha256:
    required: true
    description: Exact SDK inputs upload digest.
  validation-artifact-id:
    default: ''
    description: Optional exact original validation upload ID; when both locator fields are empty, locate from the authenticated original receipt.
  validation-artifact-sha256:
    default: ''
    description: Exact original validation upload digest.
  trusted-workflow-sha:
    required: true
    description: Reviewed product workflow revision.
  build-key:
    required: true
    description: Exact elected JavaScript metadata key.
  tree:
    required: true
    description: Exact tested source tree.
  sdk-validation-tooling:
    required: true
    description: Caller-owned canonical six-field policy; caller provisions authenticated evidence, public policy and Java before invocation.
runs:
  using: composite
  steps:
    - id: policy
      shell: bash
      env:
        SDK_VALIDATION_TOOLING: ${{ inputs.sdk-validation-tooling }}
      run: |
        python3 -B - <<'PY'
        import os
        from pathlib import Path
        from ci.products.inventory import load_canonical_json_bytes, read_regular_file_bytes, require_exact_keys, sha256_bytes
        path = Path(os.environ['SDK_VALIDATION_TOOLING'])
        if not path.is_absolute():
            raise ValueError('Caller tooling policy must be an explicit absolute path')
        raw = read_regular_file_bytes(path, reject_symlink_parents=True)
        policy = require_exact_keys(load_canonical_json_bytes(raw),
            {'evidence', 'publicKey', 'javaExecutable', 'requiredTrustDomain', 'keyring', 'keysDirectory'},
            'Caller SDK tooling policy')
        trust = policy['requiredTrustDomain']
        if (trust not in ('development', 'release')
                or (trust == 'release' and (policy['keyring'] is None or policy['keysDirectory'] is None))
                or (trust == 'development' and (policy['keyring'] is not None or policy['keysDirectory'] is not None))):
            raise ValueError('Caller tooling trust requires exact paired release policy or development trust')
        for name in ('evidence', 'publicKey', 'javaExecutable', 'keyring', 'keysDirectory'):
            value = policy[name]
            if value is None and name in ('keyring', 'keysDirectory'):
                continue
            if type(value) is not str or not Path(value).is_absolute():
                raise ValueError('Caller tooling fields must be explicit absolute paths')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('sha256=' + sha256_bytes(raw) + '\n')
        PY
    - id: captured
      uses: ./.github/actions/capture-runtime-state
      with:
        product: sdk
        sdk-family: javascript-metadata
        plan-id: ${{ inputs.plan-id }}
        artifact-id: ${{ inputs.artifact-id }}
        artifact-sha256: ${{ inputs.artifact-sha256 }}
        state-wave: ${{ inputs.state-wave }}
        sdk-state-wave: ${{ inputs.sdk-state-wave }}
        sdk-validation-tooling: ${{ inputs.sdk-validation-tooling }}
        trusted-workflow-sha: ${{ inputs.trusted-workflow-sha }}
    - id: identity
      shell: bash
      env:
        MATRIX: ${{ steps.captured.outputs.sdk-matrix }}
        PLAN: ${{ steps.captured.outputs.plan-path }}
        BUILD_KEY: ${{ inputs.build-key }}
        TREE: ${{ inputs.tree }}
        SDK_VALIDATION_TOOLING: ${{ inputs.sdk-validation-tooling }}
        POLICY_SHA256: ${{ steps.policy.outputs.sha256 }}
      run: |
        python3 -B - <<'PY'
        import json, os, re, sys
        from pathlib import Path
        sys.path.insert(0, str(Path.cwd() / 'ci'))
        from native_wrappers import host_classifier
        from ci.products.inventory import read_regular_file_bytes, sha256_bytes
        if host_classifier() != 'linux-x64':
            raise ValueError('JavaScript metadata requires its elected Linux X64 host')
        if sha256_bytes(read_regular_file_bytes(Path(os.environ['SDK_VALIDATION_TOOLING']), reject_symlink_parents=True)) != os.environ['POLICY_SHA256']:
            raise ValueError('Caller tooling policy changed during capture')
        key = os.environ['BUILD_KEY']
        rows = [row for row in json.loads(os.environ['MATRIX'])['include']
                if (row['product'], row['component'], row['phase'], row['target']) ==
                   ('sdk', 'javascript', 'metadata', 'node')]
        if (len(rows) != 1 or rows[0]['buildKey'] != key or not re.fullmatch(r'sha256:[0-9a-f]{64}', key)
                or (rows[0]['runnerOs'], rows[0]['runnerArch']) != ('Linux', 'X64')):
            raise ValueError('JavaScript metadata differs from its original replay election')
        with open(os.environ['PLAN']) as source:
            plan = json.load(source)
        if (not re.fullmatch(r'[0-9a-f]{40}', os.environ['TREE']) or plan['validationTree'] != os.environ['TREE']
                or not re.fullmatch(r'[0-9a-f]{40}', plan['validationCommit'])):
            raise ValueError('JavaScript metadata differs from its original plan')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('key_hex=' + key.removeprefix('sha256:') + '\n')
            output.write('policy_revision=' + plan['validationCommit'] + '\n')
        PY
    - uses: ./.github/actions/setup-kmp
      with:
        cache-read-only: 'true'
        product-worker: 'true'
    - id: execute
      shell: bash
      env:
        PLAN: ${{ steps.captured.outputs.plan-path }}
        DISCOVERY: ${{ steps.captured.outputs.discovery-root }}
        STATE: ${{ steps.captured.outputs.state-root }}
        BUILD_KEY: ${{ inputs.build-key }}
        SDK_INPUTS_ID: ${{ inputs.sdk-inputs-id }}
        SDK_INPUTS_SHA256: ${{ inputs.sdk-inputs-sha256 }}
        VALIDATION_ARTIFACT_ID: ${{ inputs.validation-artifact-id }}
        VALIDATION_ARTIFACT_SHA256: ${{ inputs.validation-artifact-sha256 }}
        TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted-workflow-sha }}
        SDK_VALIDATION_TOOLING: ${{ inputs.sdk-validation-tooling }}
        POLICY_SHA256: ${{ steps.policy.outputs.sha256 }}
        POLICY_REVISION: ${{ steps.identity.outputs.policy_revision }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        python3 -B - <<'PY'
        import os, subprocess, sys
        from pathlib import Path
        from ci.products.inventory import load_canonical_json_bytes, read_regular_file_bytes, sha256_bytes
        root = Path(os.environ['GITHUB_WORKSPACE'])
        raw = read_regular_file_bytes(Path(os.environ['SDK_VALIDATION_TOOLING']), reject_symlink_parents=True)
        if sha256_bytes(raw) != os.environ['POLICY_SHA256']:
            raise ValueError('Caller tooling policy changed before metadata execution')
        policy = load_canonical_json_bytes(raw)
        fields = {
            '--plan': os.environ['PLAN'], '--discovery-root': os.environ['DISCOVERY'], '--state-root': os.environ['STATE'],
            '--destination': str(root / 'build/sdk-worker'), '--repository-root': str(root),
            '--expected-build-key': os.environ['BUILD_KEY'],
            '--sdk-inputs-artifact-id': os.environ['SDK_INPUTS_ID'], '--sdk-inputs-artifact-sha256': os.environ['SDK_INPUTS_SHA256'],
            '--trusted-workflow-sha': os.environ['TRUSTED_WORKFLOW_SHA'], '--policy-revision': os.environ['POLICY_REVISION'],
            '--keyring': str(root / 'gradle/release/product-signing-keys.json'), '--keys-directory': str(root / 'gradle/release/keys'),
            '--required-trust-domain': policy['requiredTrustDomain'],
        }
        validation_id, validation_digest = os.environ['VALIDATION_ARTIFACT_ID'], os.environ['VALIDATION_ARTIFACT_SHA256']
        if bool(validation_id) != bool(validation_digest):
            raise ValueError('Original validation upload ID and digest must be supplied together')
        if validation_id:
            fields['--validation-artifact-id'] = validation_id
            fields['--validation-artifact-sha256'] = validation_digest
        for name, flag in (('evidence', '--tooling-evidence'), ('publicKey', '--tooling-public-key'),
                           ('javaExecutable', '--java-executable'), ('keyring', '--tooling-keyring'), ('keysDirectory', '--tooling-keys-directory')):
            if policy[name] is not None:
                fields[flag] = policy[name]
        command = [sys.executable, '-B', '-m', 'ci.sdk_workflow', 'javascript-metadata']
        command += [part for flag, value in fields.items() for part in (flag, value)]
        subprocess.run(command, cwd=root, check=True)
        PY
    - if: always() && steps.identity.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: codex-agent-sdk-worker-javascript-metadata-node-${{ steps.identity.outputs.key_hex }}-${{ inputs.tree }}-attempt-${{ github.run_attempt }}
        path: build/sdk-worker
        if-no-files-found: warn
        overwrite: false
        include-hidden-files: true
        compression-level: 0
        retention-days: 90
