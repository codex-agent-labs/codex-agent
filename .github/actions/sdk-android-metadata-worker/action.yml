name: Execute elected Android metadata phase
description: Re-observe the caller-pinned protected Android/Firebase validation before finalizing metadata.
inputs:
  plan-id:
    required: true
    description: Original plan artifact ID.
  artifact-id:
    required: true
    description: Predecessor SDK state artifact ID.
  artifact-sha256:
    required: true
    description: Exact predecessor SDK state digest.
  sdk-state-wave:
    required: true
    description: Exact preceding SDK state wave.
  trusted-workflow-sha:
    required: true
    description: Reviewed product workflow revision.
  build-key:
    required: true
    description: Exact elected Android metadata phase key.
  tree:
    required: true
    description: Exact tested source tree.
  original-policy:
    required: true
    description: External canonical caller policy with the original final Android upload and source/tool pins.
  sdk-apple-validation-policy:
    default: ''
    description: Optional independently supplied Apple replay policy.
  sdk-facade-metadata-policy:
    default: ''
    description: Optional independently supplied Core metadata replay policy.
  sdk-android-metadata-policy:
    default: ''
    description: Optional independently supplied retained Android metadata replay policy.
runs:
  using: composite
  steps:
    - id: policy
      name: Pin complete independent Android original policy before capture
      shell: bash
      env:
        ORIGINAL_POLICY: ${{ inputs.original-policy }}
        APPLE_POLICY: ${{ inputs.sdk-apple-validation-policy }}
        CORE_METADATA_POLICY: ${{ inputs.sdk-facade-metadata-policy }}
        ANDROID_METADATA_POLICY: ${{ inputs.sdk-android-metadata-policy }}
        SDK_STATE_WAVE: ${{ inputs.sdk-state-wave }}
      run: |
        python3 -B - <<'PY'
        import os, re, sys
        from pathlib import Path
        sys.path.insert(0, str(Path.cwd() / 'ci'))
        from products.inventory import canonical_json_bytes, load_canonical_json_bytes, read_regular_file_bytes, regular_file_inventory, require_exact_keys, require_integer, require_sha256, sha256_bytes, sha256_file
        from products.sdk_validation_inputs import _request_inventory
        from products.sdk_android_validation_phase import _contract_sources
        from products.signing_isolation import require_no_signing_secret
        from ci.sdk_policy_snapshot import snapshot_policy_closure
        require_no_signing_secret(os.environ)
        if os.environ['SDK_STATE_WAVE'] != '17':
            raise ValueError('Android metadata requires exact preceding SDK wave 17')
        root = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
        names = ('ORIGINAL_POLICY', 'APPLE_POLICY', 'CORE_METADATA_POLICY', 'ANDROID_METADATA_POLICY')
        controls, digests = {}, {}
        for name in names:
            value = os.environ[name]
            if name == 'ORIGINAL_POLICY' and not value:
                raise ValueError('Android metadata requires independent original policy')
            if not value:
                continue
            path = Path(value)
            if not path.is_absolute() or path.resolve(strict=True) != path or path == root or root in path.parents:
                raise ValueError('Android metadata caller policy must be external, absolute and non-symbolic')
            raw = read_regular_file_bytes(path, reject_symlink_parents=True)
            controls[name] = load_canonical_json_bytes(raw)
            kind = {'APPLE_POLICY': 'apple-validation', 'CORE_METADATA_POLICY': 'core-metadata',
                    'ANDROID_METADATA_POLICY': 'android-metadata'}.get(name)
            digests[name] = sha256_bytes(raw) if kind is None else snapshot_policy_closure(kind, path)
        policy = require_exact_keys(controls['ORIGINAL_POLICY'], {
            'schemaVersion', 'packageStage', 'packageReceipt', 'binaryStage', 'binaryReceipt',
            'compatibilityRequest', 'binaryContractEvidence', 'trustedSourceCommit', 'trustedSourceTree',
            'toolingEvidence', 'toolingPublicKey', 'javaExecutable', 'apkanalyzerExecutable',
            'toolingTrustDomain', 'toolingKeyring', 'toolingKeysDirectory', 'validationArtifactId',
            'validationArtifactSha256', 'trustedAndroidWorkflowSha', 'expectedOriginalRunId',
            'expectedOriginalRunAttempt'}, 'Android metadata original policy')
        if type(policy['schemaVersion']) is not int or policy['schemaVersion'] != 1:
            raise ValueError('Android metadata original policy schema is unsupported')
        for field in ('validationArtifactId', 'expectedOriginalRunId', 'expectedOriginalRunAttempt'):
            require_integer(policy[field], 'Android metadata ' + field, 1)
        require_sha256(policy['validationArtifactSha256'], 'Android original validation artifact')
        for field in ('trustedSourceCommit', 'trustedSourceTree', 'trustedAndroidWorkflowSha'):
            if type(policy[field]) is not str or re.fullmatch(r'[0-9a-f]{40}', policy[field]) is None:
                raise ValueError('Android metadata source and workflow pins must be exact Git SHAs')
        trust = policy['toolingTrustDomain']
        if (trust not in ('development', 'release') or
                (policy['toolingKeyring'] is None) != (policy['toolingKeysDirectory'] is None) or
                (trust == 'release') != (policy['toolingKeyring'] is not None)):
            raise ValueError('Android metadata tooling trust policy is incomplete')
        for field in ('packageStage', 'packageReceipt', 'binaryStage', 'binaryReceipt',
                      'compatibilityRequest', 'toolingEvidence', 'toolingPublicKey', 'javaExecutable',
                      'apkanalyzerExecutable', 'binaryContractEvidence'):
            value = policy[field]
            path = Path(value) if type(value) is str else None
            if path is None or not path.is_absolute() or path.resolve(strict=True) != path:
                raise ValueError('Android metadata original paths must be absolute and non-symbolic')
        for field in ('toolingKeyring', 'toolingKeysDirectory'):
            value = policy[field]
            if value is not None:
                path = Path(value) if type(value) is str else None
                if path is None or not path.is_absolute() or path.resolve(strict=True) != path:
                    raise ValueError('Android metadata tooling trust paths must be absolute and non-symbolic')
        contract = Path(policy['binaryContractEvidence'])
        if contract == root or root in contract.parents:
            raise ValueError('Android metadata Contract authority must be caller-owned outside source')
        raw = read_regular_file_bytes(contract, reject_symlink_parents=True)
        evidence = load_canonical_json_bytes(raw)
        contract_trees, contract_files = _contract_sources(evidence)
        trees = {Path(policy[name]) for name in ('packageStage', 'binaryStage', 'toolingEvidence')}
        trees.update(contract_trees.values())
        files = {Path(policy[name]) for name in ('packageReceipt', 'binaryReceipt', 'compatibilityRequest',
            'toolingPublicKey', 'javaExecutable', 'apkanalyzerExecutable')}
        files.update(contract_files.values())
        files.add(contract)
        if policy['toolingKeyring'] is not None:
            files.add(Path(policy['toolingKeyring']))
            trees.add(Path(policy['toolingKeysDirectory']))
        files.update(_request_inventory(Path(policy['compatibilityRequest'])))
        for path in trees | files:
            if not path.is_absolute() or path.resolve(strict=True) != path:
                raise ValueError('Android metadata transitive original input is not normalized')
        closure = {'files': {str(path): sha256_file(path, reject_symlink_parents=True) for path in sorted(files)},
                   'trees': {str(path): regular_file_inventory(path, allow_empty=True) for path in sorted(trees)}}
        digests['ORIGINAL_CLOSURE'] = sha256_bytes(canonical_json_bytes(closure))
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('policy_sha256=' + sha256_bytes(canonical_json_bytes(digests)) + '\n')
        PY
    - id: captured
      uses: ./.github/actions/capture-runtime-state
      with:
        product: sdk
        sdk-family: android-metadata
        plan-id: ${{ inputs.plan-id }}
        artifact-id: ${{ inputs.artifact-id }}
        artifact-sha256: ${{ inputs.artifact-sha256 }}
        sdk-state-wave: ${{ inputs.sdk-state-wave }}
        trusted-workflow-sha: ${{ inputs.trusted-workflow-sha }}
        sdk-apple-validation-policy: ${{ inputs.sdk-apple-validation-policy }}
        sdk-facade-metadata-policy: ${{ inputs.sdk-facade-metadata-policy }}
        sdk-android-metadata-policy: ${{ inputs.sdk-android-metadata-policy }}
    - id: identity
      name: Require exact elected Android metadata row before setup
      shell: bash
      env:
        MATRIX: ${{ steps.captured.outputs.sdk-matrix }}
        REQUIRED: ${{ steps.captured.outputs.sdk-workers-required }}
        PLAN: ${{ steps.captured.outputs.plan-path }}
        BUILD_KEY: ${{ inputs.build-key }}
        TREE: ${{ inputs.tree }}
        ORIGINAL_POLICY: ${{ inputs.original-policy }}
        APPLE_POLICY: ${{ inputs.sdk-apple-validation-policy }}
        CORE_METADATA_POLICY: ${{ inputs.sdk-facade-metadata-policy }}
        ANDROID_METADATA_POLICY: ${{ inputs.sdk-android-metadata-policy }}
        POLICY_SHA256: ${{ steps.policy.outputs.policy_sha256 }}
      run: |
        python3 -B - <<'PY'
        import json, os, re, sys
        from pathlib import Path
        sys.path.insert(0, str(Path.cwd() / 'ci'))
        from native_wrappers import host_classifier
        from products.inventory import canonical_json_bytes, load_canonical_json_bytes, read_regular_file_bytes, regular_file_inventory, sha256_bytes, sha256_file
        from products.sdk_validation_inputs import _request_inventory
        from products.sdk_android_validation_phase import _contract_sources
        from products.signing_isolation import require_no_signing_secret
        from ci.sdk_policy_snapshot import snapshot_policy_closure
        require_no_signing_secret(os.environ)
        names = ('ORIGINAL_POLICY', 'APPLE_POLICY', 'CORE_METADATA_POLICY', 'ANDROID_METADATA_POLICY')
        digests = {name: (sha256_bytes(read_regular_file_bytes(Path(os.environ[name]), reject_symlink_parents=True))
                   if name == 'ORIGINAL_POLICY' else snapshot_policy_closure({
                       'APPLE_POLICY': 'apple-validation', 'CORE_METADATA_POLICY': 'core-metadata',
                       'ANDROID_METADATA_POLICY': 'android-metadata'}[name], Path(os.environ[name])))
                   for name in names if os.environ[name]}
        original = load_canonical_json_bytes(read_regular_file_bytes(Path(os.environ['ORIGINAL_POLICY']), reject_symlink_parents=True))
        contract = Path(original['binaryContractEvidence'])
        contract_trees, contract_files = _contract_sources(load_canonical_json_bytes(
            read_regular_file_bytes(contract, reject_symlink_parents=True)))
        trees = {Path(original[name]) for name in ('packageStage', 'binaryStage', 'toolingEvidence')}
        trees.update(contract_trees.values())
        files = {Path(original[name]) for name in ('packageReceipt', 'binaryReceipt', 'compatibilityRequest',
            'toolingPublicKey', 'javaExecutable', 'apkanalyzerExecutable')}
        files.update(contract_files.values())
        files.add(contract)
        if original['toolingKeyring'] is not None:
            files.add(Path(original['toolingKeyring']))
            trees.add(Path(original['toolingKeysDirectory']))
        files.update(_request_inventory(Path(original['compatibilityRequest'])))
        closure = {'files': {str(path): sha256_file(path, reject_symlink_parents=True) for path in sorted(files)},
                   'trees': {str(path): regular_file_inventory(path, allow_empty=True) for path in sorted(trees)}}
        digests['ORIGINAL_CLOSURE'] = sha256_bytes(canonical_json_bytes(closure))
        if sha256_bytes(canonical_json_bytes(digests)) != os.environ['POLICY_SHA256']:
            raise ValueError('Android metadata caller policy changed during state capture')
        rows = json.loads(os.environ['MATRIX'])['include']
        key, tree = os.environ['BUILD_KEY'], os.environ['TREE']
        if (host_classifier() != 'linux-x64' or os.environ['REQUIRED'] != 'true'
                or type(rows) is not list or len(rows) != 1 or type(rows[0]) is not dict
                or tuple(rows[0].get(name) for name in ('product', 'component', 'phase', 'target')) !=
                   ('sdk', 'sdk-android', 'metadata', 'android')
                or tuple(rows[0].get(name) for name in ('runner', 'runnerOs', 'runnerArch')) !=
                   ('ubuntu-24.04', 'Linux', 'X64')
                or rows[0].get('buildKey') != key or not re.fullmatch(r'sha256:[0-9a-f]{64}', key)
                or not re.fullmatch(r'[0-9a-f]{40}', tree)):
            raise ValueError('Android metadata differs from its elected host, target or key')
        with open(os.environ['PLAN']) as source:
            if json.load(source)['validationTree'] != tree:
                raise ValueError('Android metadata tree differs from authenticated plan')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('key_hex=' + key.removeprefix('sha256:') + '\n')
        PY
    - uses: ./.github/actions/setup-kmp
      with:
        cache-read-only: 'true'
        product-worker: 'true'
    - name: Execute exact Android metadata controller
      shell: bash
      env:
        PLAN: ${{ steps.captured.outputs.plan-path }}
        DISCOVERY: ${{ steps.captured.outputs.discovery-root }}
        STATE: ${{ steps.captured.outputs.state-root }}
        BUILD_KEY: ${{ inputs.build-key }}
        ORIGINAL_POLICY: ${{ inputs.original-policy }}
        APPLE_POLICY: ${{ inputs.sdk-apple-validation-policy }}
        CORE_METADATA_POLICY: ${{ inputs.sdk-facade-metadata-policy }}
        ANDROID_METADATA_POLICY: ${{ inputs.sdk-android-metadata-policy }}
        POLICY_SHA256: ${{ steps.policy.outputs.policy_sha256 }}
        TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted-workflow-sha }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        python3 -B - <<'PY'
        import os, subprocess, sys
        from pathlib import Path
        sys.path.insert(0, str(Path.cwd() / 'ci'))
        from products.inventory import canonical_json_bytes, load_canonical_json_bytes, read_regular_file_bytes, regular_file_inventory, sha256_bytes, sha256_file
        from products.sdk_validation_inputs import _request_inventory
        from products.sdk_android_validation_phase import _contract_sources
        from products.signing_isolation import require_no_signing_secret
        from ci.sdk_policy_snapshot import snapshot_policy_closure
        require_no_signing_secret(os.environ)
        root = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
        names = ('ORIGINAL_POLICY', 'APPLE_POLICY', 'CORE_METADATA_POLICY', 'ANDROID_METADATA_POLICY')
        def held_policy_digest():
            digests = {name: (sha256_bytes(read_regular_file_bytes(Path(os.environ[name]), reject_symlink_parents=True))
                       if name == 'ORIGINAL_POLICY' else snapshot_policy_closure({
                           'APPLE_POLICY': 'apple-validation', 'CORE_METADATA_POLICY': 'core-metadata',
                           'ANDROID_METADATA_POLICY': 'android-metadata'}[name], Path(os.environ[name])))
                       for name in names if os.environ[name]}
            selected = load_canonical_json_bytes(read_regular_file_bytes(
                Path(os.environ['ORIGINAL_POLICY']), reject_symlink_parents=True))
            contract = Path(selected['binaryContractEvidence'])
            contract_trees, contract_files = _contract_sources(load_canonical_json_bytes(
                read_regular_file_bytes(contract, reject_symlink_parents=True)))
            trees = {Path(selected[name]) for name in ('packageStage', 'binaryStage', 'toolingEvidence')}
            trees.update(contract_trees.values())
            files = {Path(selected[name]) for name in ('packageReceipt', 'binaryReceipt', 'compatibilityRequest',
                'toolingPublicKey', 'javaExecutable', 'apkanalyzerExecutable')}
            files.update(contract_files.values())
            files.add(contract)
            if selected['toolingKeyring'] is not None:
                files.add(Path(selected['toolingKeyring']))
                trees.add(Path(selected['toolingKeysDirectory']))
            files.update(_request_inventory(Path(selected['compatibilityRequest'])))
            closure = {'files': {str(path): sha256_file(path, reject_symlink_parents=True) for path in sorted(files)},
                       'trees': {str(path): regular_file_inventory(path, allow_empty=True) for path in sorted(trees)}}
            digests['ORIGINAL_CLOSURE'] = sha256_bytes(canonical_json_bytes(closure))
            return sha256_bytes(canonical_json_bytes(digests)), selected
        before, original = held_policy_digest()
        if before != os.environ['POLICY_SHA256']:
            raise ValueError('Android metadata caller policy changed before execution')
        fields = {'--plan': os.environ['PLAN'], '--discovery-root': os.environ['DISCOVERY'],
            '--state-root': os.environ['STATE'], '--destination': str(root / 'build/sdk-android-metadata-worker'),
            '--repository-root': str(root), '--expected-build-key': os.environ['BUILD_KEY'],
            '--policy-revision': load_canonical_json_bytes(read_regular_file_bytes(Path(os.environ['PLAN'])))['validationCommit'],
            '--trusted-workflow-sha': os.environ['TRUSTED_WORKFLOW_SHA'],
            '--package-stage': original['packageStage'], '--package-receipt': original['packageReceipt'],
            '--binary-stage': original['binaryStage'], '--binary-receipt': original['binaryReceipt'],
            '--compatibility-request': original['compatibilityRequest'],
            '--binary-contract-evidence': original['binaryContractEvidence'],
            '--trusted-source-commit': original['trustedSourceCommit'],
            '--trusted-source-tree': original['trustedSourceTree'],
            '--tooling-evidence': original['toolingEvidence'], '--tooling-public-key': original['toolingPublicKey'],
            '--java-executable': original['javaExecutable'], '--apkanalyzer-executable': original['apkanalyzerExecutable'],
            '--required-trust-domain': original['toolingTrustDomain'],
            '--validation-artifact-id': str(original['validationArtifactId']),
            '--validation-artifact-sha256': original['validationArtifactSha256'],
            '--trusted-android-workflow-sha': original['trustedAndroidWorkflowSha'],
            '--expected-original-run-id': str(original['expectedOriginalRunId']),
            '--expected-original-run-attempt': str(original['expectedOriginalRunAttempt'])}
        if original['toolingKeyring'] is not None:
            fields['--tooling-keyring'] = original['toolingKeyring']
            fields['--tooling-keys-directory'] = original['toolingKeysDirectory']
        for name, flag in (('APPLE_POLICY', '--sdk-apple-validation-policy'),
                           ('CORE_METADATA_POLICY', '--sdk-facade-metadata-policy'),
                           ('ANDROID_METADATA_POLICY', '--sdk-android-metadata-policy')):
            if os.environ[name]:
                fields[flag] = os.environ[name]
        command = [sys.executable, '-B', '-m', 'ci.sdk_workflow', 'android-metadata']
        command += [part for flag, value in fields.items() for part in (flag, value)]
        subprocess.run(command, cwd=root, check=True)
        if held_policy_digest()[0] != before:
            raise ValueError('Android metadata caller policy changed after original reader exit')
        require_no_signing_secret(os.environ)
        PY
    - if: always() && steps.identity.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: codex-agent-sdk-worker-sdk-android-metadata-android-${{ steps.identity.outputs.key_hex }}-${{ inputs.tree }}-attempt-${{ github.run_attempt }}
        path: build/sdk-android-metadata-worker
        if-no-files-found: warn
        overwrite: false
        include-hidden-files: true
        compression-level: 0
