name: Execute elected C# SDK binary
description: Replay the exact SDK state and original signed inputs before compiling one reusable C# binary.
inputs:
  plan-id:
    required: true
    description: Exact original plan upload ID.
  artifact-id:
    required: true
    description: Authenticated predecessor state upload ID.
  artifact-sha256:
    required: true
    description: Authenticated predecessor state upload digest.
  state-wave:
    default: '0'
    description: Runtime state wave.
  sdk-state-wave:
    default: ''
    description: SDK state wave, if any.
  sdk-inputs-id:
    required: true
    description: Exact original SDK inputs upload ID.
  sdk-inputs-sha256:
    required: true
    description: Exact original SDK inputs upload digest.
  trusted-workflow-sha:
    required: true
    description: Reviewed product workflow revision.
  build-key:
    required: true
    description: Exact elected C# binary build key.
  tree:
    required: true
    description: Exact tested source tree.
  sdk-validation-tooling:
    default: ''
    description: Caller-owned tooling policy path.
  sdk-apple-validation-policy:
    default: ''
    description: Caller-owned Apple policy for replaying retained SDK state.
runs:
  using: composite
  steps:
    - id: captured
      uses: ./.github/actions/capture-runtime-state
      with:
        product: sdk
        sdk-family: csharp-binary
        sdk-validation-tooling: ${{ inputs.sdk-validation-tooling }}
        sdk-apple-validation-policy: ${{ inputs.sdk-apple-validation-policy }}
        plan-id: ${{ inputs.plan-id }}
        artifact-id: ${{ inputs.artifact-id }}
        artifact-sha256: ${{ inputs.artifact-sha256 }}
        state-wave: ${{ inputs.state-wave }}
        sdk-state-wave: ${{ inputs.sdk-state-wave }}
        trusted-workflow-sha: ${{ inputs.trusted-workflow-sha }}
    - id: identity
      shell: bash
      env:
        MATRIX: ${{ steps.captured.outputs.sdk-matrix }}
        PLAN: ${{ steps.captured.outputs.plan-path }}
        BUILD_KEY: ${{ inputs.build-key }}
        TREE: ${{ inputs.tree }}
      run: |
        python3 - <<'PY'
        import json, os, re
        key = os.environ['BUILD_KEY']
        rows = json.loads(os.environ['MATRIX'])['include']
        if (len(rows) != 1 or (rows[0]['product'], rows[0]['component'], rows[0]['phase'], rows[0]['target'])
                != ('sdk', 'csharp', 'binary', 'desktop') or rows[0]['buildKey'] != key
                or (rows[0]['runnerOs'], rows[0]['runnerArch']) != ('Linux', 'X64')
                or not re.fullmatch(r'sha256:[0-9a-f]{64}', key)):
            raise ValueError('C# binary differs from its authenticated election')
        with open(os.environ['PLAN']) as plan:
            if json.load(plan)['validationTree'] != os.environ['TREE']:
                raise ValueError('C# binary tree differs from the original plan')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('key_hex=' + key.removeprefix('sha256:') + '\n')
        PY
    - uses: ./.github/actions/setup-kmp
      with:
        cache-read-only: 'true'
        product-worker: 'true'
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '8.0.419'
    - name: Compile the exact elected C# binary from original signed inputs
      shell: bash
      env:
        PLAN: ${{ steps.captured.outputs.plan-path }}
        DISCOVERY: ${{ steps.captured.outputs.discovery-root }}
        STATE: ${{ steps.captured.outputs.state-root }}
        BUILD_KEY: ${{ inputs.build-key }}
        SDK_INPUTS_ID: ${{ inputs.sdk-inputs-id }}
        SDK_INPUTS_SHA256: ${{ inputs.sdk-inputs-sha256 }}
        SDK_VALIDATION_TOOLING: ${{ inputs.sdk-validation-tooling }}
        SDK_APPLE_VALIDATION_POLICY: ${{ inputs.sdk-apple-validation-policy }}
        TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted-workflow-sha }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        policies=()
        if [ -n "${SDK_VALIDATION_TOOLING:-}" ]; then policies+=(--sdk-validation-tooling "$SDK_VALIDATION_TOOLING"); fi
        if [ -n "${SDK_APPLE_VALIDATION_POLICY:-}" ]; then policies+=(--sdk-apple-validation-policy "$SDK_APPLE_VALIDATION_POLICY"); fi
        python3 -B ci/sdk_csharp_binary_workflow.py \
          --plan "$PLAN" --discovery-root "$DISCOVERY" --state-root "$STATE" \
          --destination "$GITHUB_WORKSPACE/build/sdk-csharp-binary-worker" \
          --repository-root "$GITHUB_WORKSPACE" --expected-build-key "$BUILD_KEY" \
          --sdk-inputs-artifact-id "$SDK_INPUTS_ID" --sdk-inputs-artifact-sha256 "$SDK_INPUTS_SHA256" \
          --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
          --keyring "$GITHUB_WORKSPACE/gradle/release/product-signing-keys.json" \
          --keys-directory "$GITHUB_WORKSPACE/gradle/release/keys" ${policies[@]+"${policies[@]}"}
    - if: always() && steps.identity.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: codex-agent-sdk-worker-sdk-csharp-binary-desktop-${{ steps.identity.outputs.key_hex }}-${{ inputs.tree }}-attempt-${{ github.run_attempt }}
        path: build/sdk-csharp-binary-worker
        if-no-files-found: warn
        overwrite: false
        include-hidden-files: true
        compression-level: 0
        retention-days: 90
