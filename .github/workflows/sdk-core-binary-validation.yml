name: SDK Core Binary Validation

on:
  workflow_call:
    inputs:
      planOutputs:
        required: true
        type: string
      sdkPlan:
        required: true
        type: string
      iosMetadataResult:
        required: true
        type: string
      trustedWorkflowSha:
        required: true
        type: string
    outputs:
      artifact_id:
        value: ${{ jobs.sdk-core-binary-result.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.sdk-core-binary-result.outputs.artifact_digest }}
      state_wave:
        value: ${{ jobs.sdk-core-binary-result.outputs.state_wave }}
      sdk_state_wave:
        value: ${{ jobs.sdk-core-binary-result.outputs.sdk_state_wave }}
      binary_artifact_id:
        value: ${{ jobs.sdk-core-binary-result.outputs.binary_artifact_id }}
      binary_artifact_sha256:
        value: ${{ jobs.sdk-core-binary-result.outputs.binary_artifact_sha256 }}
      binary_original_context:
        value: ${{ jobs.sdk-core-binary-result.outputs.binary_original_context }}

permissions:
  actions: read
  contents: read

jobs:
  sdk-core-binary-plan:
    if: >-
      always() && fromJSON(inputs.planOutputs).event_authorized == 'true' &&
      fromJSON(inputs.planOutputs).remote_build_authorized == 'true' &&
      fromJSON(inputs.iosMetadataResult).result == 'success' &&
      fromJSON(inputs.iosMetadataResult).outputs.artifact_id != '' && fromJSON(inputs.sdkPlan).result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      sdk_matrix: ${{ steps.capture.outputs.sdk-matrix }}
      sdk_workers_required: ${{ steps.capture.outputs.sdk-workers-required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ fromJSON(inputs.planOutputs).validation_commit }}
      - name: Select installed caller Java
        if: fromJSON(inputs.planOutputs).tooling_required == 'true'
        run: |
          set -euo pipefail
          java_home_variable="JAVA_HOME_17_${RUNNER_ARCH}"
          selected_java_home="${!java_home_variable}"
          test -f "$selected_java_home/bin/java"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        if: fromJSON(inputs.planOutputs).tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          artifact-id: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_artifact_id }}
          artifact-sha256: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ fromJSON(inputs.planOutputs).validation_commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: fromJSON(inputs.planOutputs).tooling_required == 'true'
        with:
          artifact-ids: ${{ fromJSON(inputs.planOutputs).plan_id }}
          path: ${{ runner.temp }}/sdk-apple-plan
          merge-multiple: true
      - id: apple-policy
        if: fromJSON(inputs.planOutputs).tooling_required == 'true'
        uses: ./.github/actions/prepare-sdk-apple-policy
        with:
          plan-path: ${{ runner.temp }}/sdk-apple-plan/impact-plan.json
          tooling-policy: ${{ steps.tooling.outputs.tooling-policy }}
      - id: capture
        uses: ./.github/actions/capture-runtime-state
        with:
          product: sdk
          sdk-family: core-binary
          plan-id: ${{ fromJSON(inputs.planOutputs).plan_id }}
          artifact-id: ${{ fromJSON(inputs.iosMetadataResult).outputs.artifact_id }}
          artifact-sha256: ${{ fromJSON(inputs.iosMetadataResult).outputs.artifact_digest }}
          state-wave: ${{ fromJSON(inputs.iosMetadataResult).outputs.state_wave }}
          sdk-state-wave: ${{ fromJSON(inputs.iosMetadataResult).outputs.sdk_state_wave }}
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.apple-policy.outputs.apple-policy }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}

  sdk-core-binary:
    name: sdk-core-binary-common
    needs: [sdk-core-binary-plan]
    if: >-
      always() && fromJSON(inputs.planOutputs).event_authorized == 'true' &&
      fromJSON(inputs.planOutputs).remote_build_authorized == 'true' &&
      fromJSON(inputs.iosMetadataResult).result == 'success' && fromJSON(inputs.sdkPlan).result == 'success' &&
      needs.sdk-core-binary-plan.result == 'success' &&
      needs.sdk-core-binary-plan.outputs.sdk_workers_required == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.sdk-core-binary-plan.outputs.sdk_matrix || '{"include":[]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    outputs:
      binary_artifact_id: ${{ steps.binary.outputs.binary-artifact-id }}
      binary_artifact_sha256: ${{ steps.binary.outputs.binary-artifact-sha256 }}
      binary_original_context: ${{ steps.binary.outputs.binary-original-context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ fromJSON(inputs.planOutputs).validation_commit }}
      - name: Select installed caller Java
        run: |
          set -euo pipefail
          java_home_variable="JAVA_HOME_17_${RUNNER_ARCH}"
          selected_java_home="${!java_home_variable}"
          test -f "$selected_java_home/bin/java"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        uses: ./.github/actions/capture-sdk-tooling
        with:
          artifact-id: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_artifact_id }}
          artifact-sha256: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ fromJSON(inputs.planOutputs).validation_commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ fromJSON(inputs.planOutputs).plan_id }}
          path: ${{ runner.temp }}/sdk-apple-plan
          merge-multiple: true
      - id: apple-policy
        uses: ./.github/actions/prepare-sdk-apple-policy
        with:
          plan-path: ${{ runner.temp }}/sdk-apple-plan/impact-plan.json
          tooling-policy: ${{ steps.tooling.outputs.tooling-policy }}
      - id: binary
        uses: ./.github/actions/sdk-core-maven-worker
        with:
          phase: binary
          plan-id: ${{ fromJSON(inputs.planOutputs).plan_id }}
          artifact-id: ${{ fromJSON(inputs.iosMetadataResult).outputs.artifact_id }}
          artifact-sha256: ${{ fromJSON(inputs.iosMetadataResult).outputs.artifact_digest }}
          state-wave: ${{ fromJSON(inputs.iosMetadataResult).outputs.state_wave }}
          sdk-state-wave: ${{ fromJSON(inputs.iosMetadataResult).outputs.sdk_state_wave }}
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.apple-policy.outputs.apple-policy }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          build-key: ${{ matrix.buildKey }}
          tree: ${{ fromJSON(inputs.planOutputs).validation_tree }}

  sdk-collect-11:
    needs: [sdk-core-binary-plan, sdk-core-binary]
    if: >-
      always() && fromJSON(inputs.planOutputs).event_authorized == 'true' &&
      fromJSON(inputs.planOutputs).remote_build_authorized == 'true' &&
      fromJSON(inputs.iosMetadataResult).result == 'success' && fromJSON(inputs.sdkPlan).result == 'success' &&
      needs.sdk-core-binary-plan.result == 'success' &&
      needs.sdk-core-binary-plan.outputs.sdk_workers_required == 'true'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.collect.outputs.artifact-id }}
      artifact_digest: ${{ steps.collect.outputs.artifact-sha256 }}
      wave_failed: ${{ steps.collect.outputs.wave-failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ fromJSON(inputs.planOutputs).validation_commit }}
      - name: Select installed caller Java
        run: |
          set -euo pipefail
          java_home_variable="JAVA_HOME_17_${RUNNER_ARCH}"
          selected_java_home="${!java_home_variable}"
          test -f "$selected_java_home/bin/java"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        uses: ./.github/actions/capture-sdk-tooling
        with:
          artifact-id: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_artifact_id }}
          artifact-sha256: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ fromJSON(inputs.planOutputs).validation_commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ fromJSON(inputs.planOutputs).plan_id }}
          path: ${{ runner.temp }}/sdk-apple-plan
          merge-multiple: true
      - id: apple-policy
        uses: ./.github/actions/prepare-sdk-apple-policy
        with:
          plan-path: ${{ runner.temp }}/sdk-apple-plan/impact-plan.json
          tooling-policy: ${{ steps.tooling.outputs.tooling-policy }}
      - id: collect
        uses: ./.github/actions/collect-runtime-wave
        with:
          product: sdk
          sdk-family: core-binary
          plan-id: ${{ fromJSON(inputs.planOutputs).plan_id }}
          artifact-id: ${{ fromJSON(inputs.iosMetadataResult).outputs.artifact_id }}
          artifact-sha256: ${{ fromJSON(inputs.iosMetadataResult).outputs.artifact_digest }}
          state-wave: ${{ fromJSON(inputs.iosMetadataResult).outputs.state_wave }}
          sdk-state-wave: ${{ fromJSON(inputs.iosMetadataResult).outputs.sdk_state_wave }}
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.apple-policy.outputs.apple-policy }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          wave: '11'
          tree: ${{ fromJSON(inputs.planOutputs).validation_tree }}
          sdk-worker-workflow-path: .github/workflows/sdk-core-binary-validation.yml
          sdk-worker-job-name: product-validation / sdk-core-binary-wave / sdk-core-binary-common

  sdk-core-binary-result:
    needs: [sdk-core-binary-plan, sdk-core-binary, sdk-collect-11]
    if: >-
      always() && fromJSON(inputs.planOutputs).event_authorized == 'true' &&
      fromJSON(inputs.planOutputs).remote_build_authorized == 'true' &&
      fromJSON(inputs.sdkPlan).result == 'success' &&
      fromJSON(inputs.iosMetadataResult).result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.result.outputs.artifact_id }}
      artifact_digest: ${{ steps.result.outputs.artifact_digest }}
      state_wave: ${{ steps.result.outputs.state_wave }}
      sdk_state_wave: ${{ steps.result.outputs.sdk_state_wave }}
      binary_artifact_id: ${{ steps.result.outputs.binary_artifact_id }}
      binary_artifact_sha256: ${{ steps.result.outputs.binary_artifact_sha256 }}
      binary_original_context: ${{ steps.result.outputs.binary_original_context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ fromJSON(inputs.planOutputs).validation_commit }}
      - id: result
        name: Fail only after collecting Core binary results
        env:
          RESULTS: ${{ toJSON(needs) }}
          IOS_METADATA_RESULT: ${{ inputs.iosMetadataResult }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          from ci.products.inventory import canonical_json_bytes, require_exact_keys, require_sha256
          from ci.sdk_maven_original import _context
          from ci.sdk_native_continuation import select_native_state
          from ci.reuse import github_output
          needs = json.loads(os.environ['RESULTS'])
          needs['sdk-ios-metadata-result'] = json.loads(os.environ['IOS_METADATA_RESULT'])
          result = select_native_state(needs, stage='core-binary')
          original = needs['sdk-core-binary']['outputs']
          fields = ('binary_artifact_id', 'binary_artifact_sha256', 'binary_original_context')
          if result['sdk_state_wave'] == '11':
              identifier, digest, context = (original.get(field, '') for field in fields)
              if not isinstance(identifier, str) or re.fullmatch(r'[1-9][0-9]*', identifier) is None:
                  raise ValueError('Collected Core binary lacks its official upload ID')
              require_sha256(digest, 'Collected Core binary upload')
              if not isinstance(context, str):
                  raise ValueError('Collected Core binary lacks its original caller context')
              value = require_exact_keys(json.loads(context), {'repositoryRoot', 'workerRoot'},
                                         'Collected Core binary original context')
              if canonical_json_bytes(value).decode().strip() != context or _context(value, 'binary') != value:
                  raise ValueError('Collected Core binary context is not canonical')
              result.update(zip(fields, (identifier, digest, context)))
          elif any(original.get(field, '') for field in fields):
              raise ValueError('Reused Core binary cannot expose a current-run original upload')
          github_output(Path(os.environ['GITHUB_OUTPUT']), result)
          PY
