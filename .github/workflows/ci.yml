name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-merge-group-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.3"
          cache: false
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: '"$HOME/go/bin/actionlint"'
      - run: python3 -m unittest discover -s ci/tests -v

  merge-gate:
    name: CI / merge-gate
    if: always()
    needs: workflow-lint
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Trusted product validation is disabled during the immutable-workflow bootstrap.' >&2
          exit 1
