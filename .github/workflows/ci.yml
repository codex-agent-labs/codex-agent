name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      purpose:
        description: Validation or protected custody/attestation of a prior run
        required: true
        type: choice
        default: validation
        options: [validation, build-logic-diagnostics, sdk-catalog-custody, runtime-toolchain-capture, runtime-phase10-record, contract-phase10-record, sdk-phase10-authority, sdk-phase10-record, sdk-phase10-maven-sidecars, sdk-runtime-library-validation, runtime-library-authorizations]
      baseCommit:
        description: Exact base commit SHA
        required: false
        type: string
      validationCommit:
        description: Exact candidate commit SHA
        required: false
        type: string
      validationTree:
        description: Exact candidate tree SHA
        required: false
        type: string
      producerJson:
        description: Exact canonical SDK producer or product attestation control JSON
        required: false
        type: string
      catalogArtifactId:
        description: Independently approved original failed-catalog upload ID
        required: false
        type: string
      catalogArtifactSha256:
        description: Independently approved original failed-catalog upload SHA-256
        required: false
        type: string
      trustedWorkflowSha:
        description: Independently reviewed original catalog workflow SHA
        required: false
        type: string
      trustedWorkflowPath:
        description: Independently reviewed original catalog child workflow path
        required: false
        type: string
      trustedJobName:
        description: Independently reviewed original catalog job name
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('ci-merge-group-{0}', github.ref) || format('ci-dispatch-{0}-{1}', github.sha, inputs.purpose) }}
  cancel-in-progress: true

jobs:
  build-logic-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'build-logic-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind diagnostics to the exact dispatched source
        env:
          VALIDATION_COMMIT: ${{ inputs.validationCommit }}
          VALIDATION_TREE: ${{ inputs.validationTree }}
        run: |
          [[ "$VALIDATION_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VALIDATION_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$VALIDATION_COMMIT" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$VALIDATION_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$VALIDATION_TREE"
      - run: sudo install -d -m 1777 /private/tmp
      - uses: ./.github/actions/setup-kmp
        with:
          cache-read-only: "true"
      - name: Resolve declared plugin inputs before offline fixture checks
        run: ./gradlew help -Pkotlin.daemon.jvmargs=-Xmx2g --no-configuration-cache --stacktrace
      - name: Capture nested offline fixture failures without product orchestration
        run: >-
          ./gradlew -p gradle/build-logic test
          --tests '*AppleBinaryPackageGraphTest'
          --tests '*AppleCanonicalPackageGraphTest'
          --tests '*ContractIsolationFixtureTest'
          --tests '*SdkVerificationTaskGraphTest'
          --tests '*IosSdkValidationGraphTest'
          --tests '*JavaScriptSdkValidationArtifactGraphTest'
          -Pkotlin.daemon.jvmargs=-Xmx2g
          --configuration-cache --configuration-cache-problems=fail --no-build-cache --info --stacktrace
      - name: Preserve original nested exceptions even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logic-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: gradle/build-logic/build/test-results/test/*.xml
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  product-validation:
    if: github.event_name != 'workflow_dispatch' || inputs.purpose == 'validation'
    permissions:
      actions: read
      contents: read
      deployments: read
      id-token: write
    uses: codex-agent-labs/codex-agent/.github/workflows/product-validation.yml@reuse-authority
    with:
      runtimeRecoveryOnly: false
      sdkRecoveryOnly: true
      runtimeAggregateRequalification: false
      runtimeAggregateHandoffRecovery: '{"artifactId":12021053682,"artifactSha256":"sha256:c4de19acd6e52ab33bef962e2d091bf780c5d5f9b81a4cf4664721f1c79e770c","originalProducer":{"commit":"b1f647efebe105abba89bcb31de3a8d25b580406","event":"pull_request","pullRequest":31,"repository":"codex-agent-labs/codex-agent","runAttempt":1,"runId":38835706077,"tree":"3fe366739c0dbf3c11f305d77609e9509262093d","workflowPath":".github/workflows/ci.yml"},"trustedWorkflowSha":"b0947995481dec088fce8e9490a17a3399e9dc2b"}'
      runtimeNativeHandoffRecovery: '{"producer":{"commit":"db38c174a2db6f02ff6b6e2091e809681d83a4d9","event":"pull_request","pullRequest":31,"repository":"codex-agent-labs/codex-agent","runAttempt":1,"runId":37081083913,"tree":"9e500ae9373416a16f09fb4a264cd0c9c22513e8","workflowPath":".github/workflows/ci.yml"},"trustedWorkflowSha":"cec458a479c0556d39aa6a75b18311500ce66d71","artifacts":[{"target":"linux-x64","artifactId":11265028687,"artifactSha256":"sha256:5439399cc545371fe535eadfc5882741437fde1f19b9717ee438b9310ebc3884"},{"target":"linux-arm64","artifactId":11264924644,"artifactSha256":"sha256:b8efecc9dd1c19069b1cea2ecfe58d5fe6b74943225bf6b24250b3a38460d672"},{"target":"macos-x64","artifactId":11265498341,"artifactSha256":"sha256:4fdcf01eee7db8302b45ecddbfb64e0438746ebf253d15af47023c51b2ba008a"},{"target":"macos-arm64","artifactId":11265627180,"artifactSha256":"sha256:892cd3ab3dbb2d6d1b2e0a33342097e77a4d52b024250fb8be20746d1704bb85"},{"target":"windows-x64","artifactId":11265542901,"artifactSha256":"sha256:b97b5a0e3c5d6c8e31f45e47cd4e9e01e692800bed67238bf0b670f1526dde80"}]}'
      baseCommit: ${{ inputs.baseCommit || '' }}
      validationCommit: ${{ inputs.validationCommit || '' }}
      validationTree: ${{ inputs.validationTree || '' }}
    secrets: inherit

  sdk-failed-catalog-custody:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'sdk-catalog-custody'
    permissions:
      actions: read
      contents: read
    uses: codex-agent-labs/codex-agent/.github/workflows/sdk-failed-catalog-custody.yml@reuse-authority
    with:
      producerJson: ${{ inputs.producerJson }}
      catalogArtifactId: ${{ inputs.catalogArtifactId }}
      catalogArtifactSha256: ${{ inputs.catalogArtifactSha256 }}
      trustedWorkflowSha: ${{ inputs.trustedWorkflowSha }}
      trustedWorkflowPath: ${{ inputs.trustedWorkflowPath }}
      trustedJobName: ${{ inputs.trustedJobName }}
    secrets: inherit

  runtime-toolchain-capture:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'runtime-toolchain-capture'
    permissions:
      actions: read
      contents: read
      deployments: read
    uses: ./.github/workflows/runtime-toolchain-capture.yml
    with:
      validationCommit: ${{ inputs.validationCommit }}
      validationTree: ${{ inputs.validationTree }}

  runtime-phase10-record:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'runtime-phase10-record'
    permissions:
      actions: read
      contents: read
    uses: codex-agent-labs/codex-agent/.github/workflows/runtime-phase10-output-record.yml@reuse-authority
    with:
      attestationJson: ${{ inputs.producerJson }}
    secrets: inherit

  contract-phase10-record:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'contract-phase10-record'
    permissions:
      actions: read
      contents: read
    uses: codex-agent-labs/codex-agent/.github/workflows/contract-phase10-later-record.yml@reuse-authority
    with:
      attestationJson: ${{ inputs.producerJson }}
    secrets: inherit

  sdk-phase10-authority:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'sdk-phase10-authority'
    permissions:
      actions: read
      contents: read
    uses: codex-agent-labs/codex-agent/.github/workflows/sdk-phase10-later-authority.yml@reuse-authority

  sdk-phase10-record:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'sdk-phase10-record'
    permissions:
      actions: read
      contents: read
    uses: codex-agent-labs/codex-agent/.github/workflows/sdk-phase10-later-record.yml@reuse-authority
    secrets: inherit

  sdk-phase10-maven-sidecars:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'sdk-phase10-maven-sidecars'
    permissions:
      actions: read
      contents: read
    uses: codex-agent-labs/codex-agent/.github/workflows/sdk-phase10-maven-sidecars.yml@reuse-authority
    secrets: inherit

  sdk-runtime-library-validation:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'sdk-runtime-library-validation'
    permissions:
      actions: read
      contents: read
    uses: codex-agent-labs/codex-agent/.github/workflows/runtime-library-authorizations.yml@reuse-authority
    with:
      validation-only: true
      attestationJson: ${{ inputs.producerJson }}
    secrets: inherit

  runtime-library-authorizations:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'runtime-library-authorizations'
    permissions:
      actions: read
      contents: read
    uses: codex-agent-labs/codex-agent/.github/workflows/runtime-library-authorizations.yml@reuse-authority
    with:
      validation-only: false
      attestationJson: ${{ inputs.producerJson }}
    secrets: inherit

  merge-gate:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'build-logic-diagnostics' && 'Build logic diagnostics / complete' || github.event_name == 'workflow_dispatch' && inputs.purpose == 'sdk-catalog-custody' && 'SDK custody / complete' || github.event_name == 'workflow_dispatch' && inputs.purpose == 'runtime-toolchain-capture' && 'Runtime toolchain / complete' || github.event_name == 'workflow_dispatch' && inputs.purpose == 'runtime-phase10-record' && 'Runtime record / complete' || github.event_name == 'workflow_dispatch' && inputs.purpose == 'contract-phase10-record' && 'Contract record / complete' || github.event_name == 'workflow_dispatch' && inputs.purpose == 'sdk-phase10-authority' && 'SDK authority / complete' || github.event_name == 'workflow_dispatch' && inputs.purpose == 'sdk-phase10-record' && 'SDK record / complete' || github.event_name == 'workflow_dispatch' && inputs.purpose == 'sdk-phase10-maven-sidecars' && 'SDK Maven sidecars / complete' || github.event_name == 'workflow_dispatch' && inputs.purpose == 'sdk-runtime-library-validation' && 'SDK Runtime trust / complete' || github.event_name == 'workflow_dispatch' && inputs.purpose == 'runtime-library-authorizations' && 'Runtime library authorizations / complete' || 'CI / merge-gate' }}
    if: always()
    needs: [product-validation, build-logic-diagnostics, sdk-failed-catalog-custody, runtime-toolchain-capture, runtime-phase10-record, contract-phase10-record, sdk-phase10-authority, sdk-phase10-record, sdk-phase10-maven-sidecars, sdk-runtime-library-validation, runtime-library-authorizations]
    runs-on: ubuntu-24.04
    steps:
      - name: Require exactly the selected trusted workflow
        env:
          EVENT: ${{ github.event_name }}
          PURPOSE: ${{ inputs.purpose }}
          PRODUCT_VALIDATION_RESULT: ${{ needs.product-validation.result }}
          FULL_ACCEPTANCE_CURRENT: ${{ needs.product-validation.outputs.fullAcceptanceCurrent }}
          DIAGNOSTICS_RESULT: ${{ needs.build-logic-diagnostics.result }}
          SDK_CUSTODY_RESULT: ${{ needs.sdk-failed-catalog-custody.result }}
          TOOLCHAIN_CAPTURE_RESULT: ${{ needs.runtime-toolchain-capture.result }}
          RUNTIME_RECORD_RESULT: ${{ needs.runtime-phase10-record.result }}
          RUNTIME_RECORD_ARTIFACT_ID: ${{ needs.runtime-phase10-record.outputs.recordArtifactId }}
          RUNTIME_RECORD_ARTIFACT_SHA256: ${{ needs.runtime-phase10-record.outputs.recordArtifactSha256 }}
          RUNTIME_TRANSPORT_ARTIFACT_ID: ${{ needs.runtime-phase10-record.outputs.transportArtifactId }}
          RUNTIME_TRANSPORT_ARTIFACT_SHA256: ${{ needs.runtime-phase10-record.outputs.transportArtifactSha256 }}
          CONTRACT_RECORD_RESULT: ${{ needs.contract-phase10-record.result }}
          CONTRACT_RECORD_ARTIFACT_ID: ${{ needs.contract-phase10-record.outputs.recordArtifactId }}
          CONTRACT_RECORD_ARTIFACT_SHA256: ${{ needs.contract-phase10-record.outputs.recordArtifactSha256 }}
          SDK_AUTHORITY_RESULT: ${{ needs.sdk-phase10-authority.result }}
          SDK_AUTHORITY_ARTIFACT_ID: ${{ needs.sdk-phase10-authority.outputs.authorityArtifactId }}
          SDK_AUTHORITY_ARTIFACT_SHA256: ${{ needs.sdk-phase10-authority.outputs.authorityArtifactSha256 }}
          SDK_RECORD_RESULT: ${{ needs.sdk-phase10-record.result }}
          SDK_RECORD_ARTIFACT_ID: ${{ needs.sdk-phase10-record.outputs.recordArtifactId }}
          SDK_RECORD_ARTIFACT_SHA256: ${{ needs.sdk-phase10-record.outputs.recordArtifactSha256 }}
          SDK_MAVEN_RESULT: ${{ needs.sdk-phase10-maven-sidecars.result }}
          SDK_MAVEN_CORE_ID: ${{ needs.sdk-phase10-maven-sidecars.outputs.coreArtifactId }}
          SDK_MAVEN_CORE_SHA256: ${{ needs.sdk-phase10-maven-sidecars.outputs.coreArtifactSha256 }}
          SDK_MAVEN_ANDROID_ID: ${{ needs.sdk-phase10-maven-sidecars.outputs.androidArtifactId }}
          SDK_MAVEN_ANDROID_SHA256: ${{ needs.sdk-phase10-maven-sidecars.outputs.androidArtifactSha256 }}
          SDK_MAVEN_IOS_ID: ${{ needs.sdk-phase10-maven-sidecars.outputs.iosArtifactId }}
          SDK_MAVEN_IOS_SHA256: ${{ needs.sdk-phase10-maven-sidecars.outputs.iosArtifactSha256 }}
          SDK_MAVEN_RECORD_ID: ${{ needs.sdk-phase10-maven-sidecars.outputs.recordArtifactId }}
          SDK_MAVEN_RECORD_SHA256: ${{ needs.sdk-phase10-maven-sidecars.outputs.recordArtifactSha256 }}
          SDK_MAVEN_INDEX_ID: ${{ needs.sdk-phase10-maven-sidecars.outputs.indexAdmissionArtifactId }}
          SDK_MAVEN_INDEX_SHA256: ${{ needs.sdk-phase10-maven-sidecars.outputs.indexAdmissionArtifactSha256 }}
          SDK_RUNTIME_TRUST_RESULT: ${{ needs.sdk-runtime-library-validation.result }}
          SDK_RUNTIME_TRUST_ID: ${{ needs.sdk-runtime-library-validation.outputs.authorizationsArtifactId }}
          SDK_RUNTIME_TRUST_SHA256: ${{ needs.sdk-runtime-library-validation.outputs.authorizationsArtifactSha256 }}
          RUNTIME_LIBRARY_RESULT: ${{ needs.runtime-library-authorizations.result }}
          RUNTIME_LIBRARY_ROOT_ID: ${{ needs.runtime-library-authorizations.outputs.delegationArtifactId }}
          RUNTIME_LIBRARY_ROOT_SHA256: ${{ needs.runtime-library-authorizations.outputs.delegationArtifactSha256 }}
          RUNTIME_LIBRARY_CAPTURE_ID: ${{ needs.runtime-library-authorizations.outputs.captureArtifactId }}
          RUNTIME_LIBRARY_CAPTURE_SHA256: ${{ needs.runtime-library-authorizations.outputs.captureArtifactSha256 }}
          RUNTIME_LIBRARY_ID: ${{ needs.runtime-library-authorizations.outputs.authorizationsArtifactId }}
          RUNTIME_LIBRARY_SHA256: ${{ needs.runtime-library-authorizations.outputs.authorizationsArtifactSha256 }}
        run: |
          if [ "$PURPOSE" = build-logic-diagnostics ]; then
            test "$EVENT" = workflow_dispatch
            test "$PRODUCT_VALIDATION_RESULT" = skipped
            test "$DIAGNOSTICS_RESULT" = success
          else
            test "$DIAGNOSTICS_RESULT" = skipped
          fi
          if [ "$PURPOSE" != runtime-toolchain-capture ]; then
            test "$TOOLCHAIN_CAPTURE_RESULT" = skipped
          fi
          if [ "$PURPOSE" != sdk-phase10-maven-sidecars ]; then
            test "$SDK_MAVEN_RESULT" = skipped
          fi
          if [ "$PURPOSE" != sdk-runtime-library-validation ]; then
            test "$SDK_RUNTIME_TRUST_RESULT" = skipped
          fi
          if [ "$PURPOSE" != runtime-library-authorizations ]; then
            test "$RUNTIME_LIBRARY_RESULT" = skipped
          fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$PURPOSE" = build-logic-diagnostics ]; then
            test "$SDK_CUSTODY_RESULT" = skipped
            test "$RUNTIME_RECORD_RESULT" = skipped
            test "$CONTRACT_RECORD_RESULT" = skipped
            test "$SDK_AUTHORITY_RESULT" = skipped
            test "$SDK_RECORD_RESULT" = skipped
          elif [ "$EVENT" = workflow_dispatch ] && [ "$PURPOSE" = sdk-catalog-custody ]; then
            test "$PRODUCT_VALIDATION_RESULT" = skipped
            test "$SDK_CUSTODY_RESULT" = success
            test "$RUNTIME_RECORD_RESULT" = skipped
            test "$CONTRACT_RECORD_RESULT" = skipped
            test "$SDK_AUTHORITY_RESULT" = skipped
            test "$SDK_RECORD_RESULT" = skipped
          elif [ "$EVENT" = workflow_dispatch ] && [ "$PURPOSE" = runtime-toolchain-capture ]; then
            test "$PRODUCT_VALIDATION_RESULT" = skipped
            test "$SDK_CUSTODY_RESULT" = skipped
            test "$TOOLCHAIN_CAPTURE_RESULT" = success
            test "$RUNTIME_RECORD_RESULT" = skipped
            test "$CONTRACT_RECORD_RESULT" = skipped
            test "$SDK_AUTHORITY_RESULT" = skipped
            test "$SDK_RECORD_RESULT" = skipped
          elif [ "$EVENT" = workflow_dispatch ] && [ "$PURPOSE" = runtime-phase10-record ]; then
            test "$PRODUCT_VALIDATION_RESULT" = skipped
            test "$SDK_CUSTODY_RESULT" = skipped
            test "$RUNTIME_RECORD_RESULT" = success
            test "$CONTRACT_RECORD_RESULT" = skipped
            test "$SDK_AUTHORITY_RESULT" = skipped
            test "$SDK_RECORD_RESULT" = skipped
            [[ "$RUNTIME_RECORD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$RUNTIME_RECORD_ARTIFACT_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            [[ "$RUNTIME_TRANSPORT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$RUNTIME_TRANSPORT_ARTIFACT_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          elif [ "$EVENT" = workflow_dispatch ] && [ "$PURPOSE" = contract-phase10-record ]; then
            test "$PRODUCT_VALIDATION_RESULT" = skipped
            test "$SDK_CUSTODY_RESULT" = skipped
            test "$RUNTIME_RECORD_RESULT" = skipped
            test "$CONTRACT_RECORD_RESULT" = success
            test "$SDK_AUTHORITY_RESULT" = skipped
            test "$SDK_RECORD_RESULT" = skipped
            [[ "$CONTRACT_RECORD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$CONTRACT_RECORD_ARTIFACT_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          elif [ "$EVENT" = workflow_dispatch ] && [ "$PURPOSE" = sdk-phase10-authority ]; then
            test "$PRODUCT_VALIDATION_RESULT" = skipped
            test "$SDK_CUSTODY_RESULT" = skipped
            test "$RUNTIME_RECORD_RESULT" = skipped
            test "$CONTRACT_RECORD_RESULT" = skipped
            test "$SDK_AUTHORITY_RESULT" = success
            test "$SDK_RECORD_RESULT" = skipped
            [[ "$SDK_AUTHORITY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$SDK_AUTHORITY_ARTIFACT_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          elif [ "$EVENT" = workflow_dispatch ] && [ "$PURPOSE" = sdk-phase10-record ]; then
            test "$PRODUCT_VALIDATION_RESULT" = skipped
            test "$SDK_CUSTODY_RESULT" = skipped
            test "$RUNTIME_RECORD_RESULT" = skipped
            test "$CONTRACT_RECORD_RESULT" = skipped
            test "$SDK_AUTHORITY_RESULT" = skipped
            test "$SDK_RECORD_RESULT" = success
            [[ "$SDK_RECORD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$SDK_RECORD_ARTIFACT_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          elif [ "$EVENT" = workflow_dispatch ] && [ "$PURPOSE" = sdk-phase10-maven-sidecars ]; then
            test "$PRODUCT_VALIDATION_RESULT" = skipped
            test "$SDK_CUSTODY_RESULT" = skipped
            test "$RUNTIME_RECORD_RESULT" = skipped
            test "$CONTRACT_RECORD_RESULT" = skipped
            test "$SDK_AUTHORITY_RESULT" = skipped
            test "$SDK_RECORD_RESULT" = skipped
            test "$SDK_MAVEN_RESULT" = success
            for id in "$SDK_MAVEN_CORE_ID" "$SDK_MAVEN_ANDROID_ID" "$SDK_MAVEN_IOS_ID" "$SDK_MAVEN_RECORD_ID" "$SDK_MAVEN_INDEX_ID"; do
              [[ "$id" =~ ^[1-9][0-9]*$ ]] || exit 1
            done
            for digest in "$SDK_MAVEN_CORE_SHA256" "$SDK_MAVEN_ANDROID_SHA256" "$SDK_MAVEN_IOS_SHA256" "$SDK_MAVEN_RECORD_SHA256" "$SDK_MAVEN_INDEX_SHA256"; do
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            done
          elif [ "$EVENT" = workflow_dispatch ] && [ "$PURPOSE" = runtime-library-authorizations ]; then
            test "$PRODUCT_VALIDATION_RESULT" = skipped
            test "$SDK_CUSTODY_RESULT" = skipped
            test "$RUNTIME_RECORD_RESULT" = skipped
            test "$CONTRACT_RECORD_RESULT" = skipped
            test "$SDK_AUTHORITY_RESULT" = skipped
            test "$SDK_RECORD_RESULT" = skipped
            test "$RUNTIME_LIBRARY_RESULT" = success
            for id in "$RUNTIME_LIBRARY_ROOT_ID" "$RUNTIME_LIBRARY_CAPTURE_ID" "$RUNTIME_LIBRARY_ID"; do
              [[ "$id" =~ ^[1-9][0-9]*$ ]] || exit 1
            done
            for digest in "$RUNTIME_LIBRARY_ROOT_SHA256" "$RUNTIME_LIBRARY_CAPTURE_SHA256" "$RUNTIME_LIBRARY_SHA256"; do
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            done
          elif [ "$EVENT" = workflow_dispatch ] && [ "$PURPOSE" = sdk-runtime-library-validation ]; then
            test "$PRODUCT_VALIDATION_RESULT" = skipped
            test "$SDK_CUSTODY_RESULT" = skipped
            test "$RUNTIME_RECORD_RESULT" = skipped
            test "$CONTRACT_RECORD_RESULT" = skipped
            test "$SDK_AUTHORITY_RESULT" = skipped
            test "$SDK_RECORD_RESULT" = skipped
            test "$SDK_RUNTIME_TRUST_RESULT" = success
            [[ "$SDK_RUNTIME_TRUST_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$SDK_RUNTIME_TRUST_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          else
            test "$EVENT" != workflow_dispatch || test "$PURPOSE" = validation
            test "$PRODUCT_VALIDATION_RESULT" = success
            test "$FULL_ACCEPTANCE_CURRENT" = true
            test "$SDK_CUSTODY_RESULT" = skipped
            test "$RUNTIME_RECORD_RESULT" = skipped
            test "$CONTRACT_RECORD_RESULT" = skipped
            test "$SDK_AUTHORITY_RESULT" = skipped
            test "$SDK_RECORD_RESULT" = skipped
          fi
