name: SDK Installed Consumer Validation

on:
  workflow_call:
    inputs:
      planArtifact:
        required: true
        type: string
      validationCommit:
        required: true
        type: string
      validationTree:
        required: true
        type: string
      matrix:
        required: true
        type: string
      retainedInstalledConsumers:
        required: false
        type: boolean
        default: false
      retainedAndroidConsumer:
        required: false
        type: boolean
        default: false
      sdkOutputs:
        required: true
        type: string
      trustedWorkflowSha:
        required: true
        type: string
    secrets:
      authority_read_token:
        required: false

permissions:
  actions: read
  contents: read

jobs:
  consumers:
    if: ${{ !inputs.retainedInstalledConsumers }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
          fetch-depth: ${{ matrix.lane == 'consumer-android' && inputs.retainedAndroidConsumer && '0' || '1' }}
      - id: native-state
        if: matrix.lane == 'consumer-android' && inputs.retainedAndroidConsumer
        env:
          SDK_OUTPUTS: ${{ inputs.sdkOutputs }}
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import json, os
          from pathlib import Path
          from ci.sdk_completion_state import _state
          from ci.reuse import github_output
          outputs = json.loads(os.environ['SDK_OUTPUTS'])
          if outputs.get('full_reuse') != 'true' or outputs.get('wave_failed') != 'false':
              raise ValueError('Retained Android consumer requires successful full-reuse product resume')
          github_output(Path(os.environ['GITHUB_OUTPUT']), _state(outputs, runtime_wave='0', sdk_wave=''))
          PYCODE
      - if: matrix.lane == 'consumer-android' && inputs.retainedAndroidConsumer
        uses: codex-agent-labs/codex-agent/.github/actions/restore-reuse-qualification@reuse-authority
        with:
          authority-read-token: ${{ secrets.authority_read_token }}
      - if: matrix.lane == 'consumer-desktop' || matrix.lane == 'consumer-node-js' || matrix.lane == 'consumer-node-wasm'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-agent-ci-desktop-*-${{ inputs.validationTree }}
          path: build/ci/desktop-lanes
      - if: matrix.lane == 'consumer-desktop' || matrix.lane == 'consumer-node-js' || matrix.lane == 'consumer-node-wasm'
        shell: bash
        run: |
          mkdir -p build/ci/desktop-classifiers
          mapfile -t app_archives < <(find build/ci/desktop-lanes -type f -name '*-app-server-*.zip' -print)
          mapfile -t c_abi_archives < <(find build/ci/desktop-lanes -type f -name '*-c-abi-*.zip' -print)
          test "${#app_archives[@]}" -eq 5
          test "${#c_abi_archives[@]}" -eq 5
          cp "${app_archives[@]}" "${c_abi_archives[@]}" build/ci/desktop-classifiers/
          test "$(find build/ci/desktop-classifiers -type f -name '*-app-server-*.zip' | wc -l | tr -d ' ')" -eq 5
          test "$(find build/ci/desktop-classifiers -type f -name '*-c-abi-*.zip' | wc -l | tr -d ' ')" -eq 5
          printf 'DESKTOP_CLASSIFIERS=%s/build/ci/desktop-classifiers\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - if: matrix.lane == 'consumer-android' && !inputs.retainedAndroidConsumer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-agent-ci-android-${{ inputs.validationTree }}
          path: build/ci/android-lane
      - if: matrix.lane == 'consumer-android' && !inputs.retainedAndroidConsumer
        shell: bash
        run: |
          aar=$(find build/ci/android-lane/payload -type f -name codex-agent-runtime-android-release.aar -print -quit)
          evidence=$(find build/ci/android-lane/payload -type f -name android-runtime-evidence.json -print -quit)
          test -n "$aar"
          if [ -n "$evidence" ]; then
            printf 'ANDROID_RELEASE_AAR=%s/%s\nANDROID_EVIDENCE=%s/%s\n' \
              "$GITHUB_WORKSPACE" "$aar" "$GITHUB_WORKSPACE" "$(dirname "$evidence")" >> "$GITHUB_ENV"
          fi
      - uses: ./.github/actions/run-ci-lane
        env:
          GITHUB_TOKEN: ${{ matrix.lane == 'consumer-android' && inputs.retainedAndroidConsumer && github.token || '' }}
          SDK_STATE_ARTIFACT_ID: ${{ steps.native-state.outputs.artifact_id }}
          SDK_STATE_ARTIFACT_SHA256: ${{ steps.native-state.outputs.artifact_digest }}
          SDK_STATE_WAVE: ${{ steps.native-state.outputs.state_wave }}
          SDK_STATE_SDK_WAVE: ${{ steps.native-state.outputs.sdk_state_wave }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
        with:
          lane: ${{ matrix.lane }}
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          build: ${{ matrix.build }}
          test: ${{ matrix.test }}
          metadata: ${{ matrix.metadata }}
          android-installed-consumer: ${{ matrix.lane == 'consumer-android' && inputs.retainedAndroidConsumer && 'true' || 'false' }}
          node-version: ${{ contains(matrix.lane, 'node') && '24.18.0' || 'none' }}

  installed-consumer:
    name: ${{ matrix.lane }}
    if: inputs.retainedInstalledConsumers
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CODEX_AGENT_THROUGHPUT_TRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
          fetch-depth: 0
      - id: native-state
        env:
          SDK_OUTPUTS: ${{ inputs.sdkOutputs }}
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import json, os
          from pathlib import Path
          from ci.sdk_completion_state import _state
          from ci.reuse import github_output
          outputs = json.loads(os.environ['SDK_OUTPUTS'])
          if outputs.get('full_reuse') != 'true' or outputs.get('wave_failed') != 'false':
              raise ValueError('Installed consumers require the successful exact retained state')
          github_output(Path(os.environ['GITHUB_OUTPUT']), _state(outputs, runtime_wave='0', sdk_wave=''))
          PYCODE
      - uses: codex-agent-labs/codex-agent/.github/actions/restore-reuse-qualification@reuse-authority
        with:
          authority-read-token: ${{ secrets.authority_read_token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.planArtifact }}
          path: build/ci
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          test -d /Applications/Xcode_26.6.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer' >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-kmp
        with:
          cache-read-only: 'true'
          node-version: ${{ contains(matrix.lane, 'node') && '24.18.0' || '' }}
          xcode-fingerprint: ${{ runner.os == 'macOS' && 'auto' || 'none' }}
      - id: verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANE: ${{ matrix.lane }}
          CI_VALIDATION_COMMIT: ${{ inputs.validationCommit }}
          CI_VALIDATION_TREE: ${{ inputs.validationTree }}
          ARTIFACT_ID: ${{ steps.native-state.outputs.artifact_id }}
          ARTIFACT_SHA256: ${{ steps.native-state.outputs.artifact_digest }}
          STATE_WAVE: ${{ steps.native-state.outputs.state_wave }}
          SDK_STATE_WAVE: ${{ steps.native-state.outputs.sdk_state_wave }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
        shell: bash
        run: |
          set -euo pipefail
          completion=(--completed-frozen-policy "${CODEX_AGENT_COMPLETED_REUSE_POLICY:?native authority required}")
          if [ -n "$SDK_STATE_WAVE" ]; then completion+=(--sdk-state-wave "$SDK_STATE_WAVE"); fi
          python3 -B -m ci.sdk_completion capture \
            --plan "$PWD/build/ci/impact-plan.json" \
            --destination "$RUNNER_TEMP/installed-consumer-state" \
            --artifact-id "$ARTIFACT_ID" --artifact-sha256 "$ARTIFACT_SHA256" \
            --state-wave "$STATE_WAVE" --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
            --repository-root "$PWD" --github-output "$GITHUB_OUTPUT" \
            --installed-consumer "$LANE" \
            --installed-consumer-output "$RUNNER_TEMP/installed-consumer-controls" "${completion[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-installed-consumer-${{ matrix.lane }}-${{ inputs.validationTree }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-consumer-controls
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 90
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-installed-consumer-diagnostics-${{ matrix.lane }}-${{ inputs.validationTree }}-attempt-${{ github.run_attempt }}
          path: |
            build/protected-candidate/${{ inputs.validationCommit }}/reports/kmp-consumer-*.json
            build/protected-candidate/${{ inputs.validationCommit }}/reports/maven-inventory-*.json
          if-no-files-found: warn
          overwrite: false
          compression-level: 0
          retention-days: 90
