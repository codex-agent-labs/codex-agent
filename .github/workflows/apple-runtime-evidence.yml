name: Apple Runtime Evidence

on:
  workflow_call:
    inputs:
      planArtifact:
        required: true
        type: string
      validationCommit:
        required: true
        type: string
      validationTree:
        required: true
        type: string
      retainedInstalledConsumers:
        required: false
        default: false
        type: boolean
      retainedAppleChecks:
        description: Fixed canonical B and two-V contribution; never a legacy payload alias
        required: false
        default: false
        type: boolean
      retainedAppleReviewedChecks:
        description: Scoped checks from the current protected publisher's reviewed Apple record
        required: false
        default: false
        type: boolean
      retainedSwiftSourceOnly:
        type: boolean
        default: false
      retainedSwiftSourceChecks:
        type: boolean
        default: false
      retainedPackageOnly:
        description: Run only the hosted ios-package lane from the original SDK iOS binary frameworks
        type: boolean
        default: false
      retainedPackageChecks:
        description: The separate retained-package caller owns the selected ios-package duties
        type: boolean
        default: false
      planControlId:
        type: string
        default: ''
      resumeOutputs:
        type: string
        default: ''
      sdkBinaryOnly:
        description: Select only the three native prerequisites of an elected SDK iOS binary
        required: false
        default: false
        type: boolean
      trustedWorkflowSha:
        description: Reviewed product workflow authority for native SDK prerequisite reuse
        required: false
        default: ''
        type: string
    secrets:
      authority_read_token:
        required: false
    outputs:
      native_tests_artifact_id:
        value: ${{ jobs.native-tests.outputs.artifact_id }}
      native_tests_artifact_digest:
        value: ${{ jobs.native-tests.outputs.artifact_digest }}
      rust_device_artifact_id:
        value: ${{ jobs.rust-device.outputs.artifact_id }}
      rust_device_artifact_digest:
        value: ${{ jobs.rust-device.outputs.artifact_digest }}
      rust_simulator_artifact_id:
        value: ${{ jobs.rust-simulator.outputs.artifact_id }}
      rust_simulator_artifact_digest:
        value: ${{ jobs.rust-simulator.outputs.artifact_digest }}
      swift_artifact_id:
        value: ${{ jobs.swift-tests.outputs.artifact_id }}
      swift_artifact_digest:
        value: ${{ jobs.swift-tests.outputs.artifact_digest }}

permissions:
  actions: read
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  retained-swift-source:
    name: retained-swift-simulator
    if: inputs.retainedSwiftSourceOnly && !inputs.retainedPackageOnly && !inputs.sdkBinaryOnly
    runs-on: macos-26
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CODEX_AGENT_THROUGHPUT_TRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
          fetch-depth: 0
      - uses: codex-agent-labs/codex-agent/.github/actions/restore-reuse-qualification@reuse-authority
        with:
          authority-read-token: ${{ secrets.authority_read_token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.planControlId }}
          path: build/ci
          merge-multiple: true
      - uses: ./.github/actions/setup-kmp
        with:
          cache-read-only: 'true'
          xcode-fingerprint: auto
          product-worker: 'true'
      - id: original
        env:
          RESUME_OUTPUTS: ${{ inputs.resumeOutputs }}
        run: |
          python3 -B - <<'PYCODE'
          import json, os
          from pathlib import Path
          from ci.sdk_completion_state import _state
          from ci.reuse import github_output
          outputs = json.loads(os.environ['RESUME_OUTPUTS'])
          if outputs.get('full_reuse') != 'true' or outputs.get('wave_failed') != 'false':
              raise ValueError('Swift source checks require successful exact product resume')
          github_output(Path(os.environ['GITHUB_OUTPUT']), _state(outputs, runtime_wave='0', sdk_wave=''))
          PYCODE
      - name: Compile current Swift package and tests with only the original simulator framework
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_VALIDATION_COMMIT: ${{ inputs.validationCommit }}
          CI_VALIDATION_TREE: ${{ inputs.validationTree }}
          ARTIFACT_ID: ${{ steps.original.outputs.artifact_id }}
          ARTIFACT_SHA256: ${{ steps.original.outputs.artifact_digest }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
        run: |
          set -euo pipefail
          python3 -B .github/actions/run-ci-lane/apple_source_validation.py \
            --plan "$PWD/build/ci/impact-plan.json" \
            --artifact-id "$ARTIFACT_ID" --artifact-sha256 "$ARTIFACT_SHA256" \
            --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
            --completed-frozen-policy "${CODEX_AGENT_COMPLETED_REUSE_POLICY:?native authority required}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-retained-swift-source-${{ inputs.validationTree }}-attempt-${{ github.run_attempt }}
          path: build/ci/retained-swift-source/controls
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 90
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-swift-source-diagnostics-${{ inputs.validationTree }}-attempt-${{ github.run_attempt }}
          path: build/ci/retained-swift-source/failure.log
          if-no-files-found: ignore
          overwrite: false
          compression-level: 0
          retention-days: 14

  retained-package:
    name: retained-package
    if: inputs.retainedPackageOnly && !inputs.retainedSwiftSourceOnly && !inputs.sdkBinaryOnly
    runs-on: macos-26
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CODEX_AGENT_THROUGHPUT_TRACE: '1'
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
          fetch-depth: 0
      - uses: codex-agent-labs/codex-agent/.github/actions/restore-reuse-qualification@reuse-authority
        with:
          authority-read-token: ${{ secrets.authority_read_token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.planControlId }}
          path: build/ci-retained-package
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.planArtifact }}
          path: build/ci
      - name: Require the one exact authorized plan
        run: cmp build/ci-retained-package/impact-plan.json build/ci/impact-plan.json
      - id: original
        env:
          RESUME_OUTPUTS: ${{ inputs.resumeOutputs }}
        run: |
          python3 -B - <<'PYCODE'
          import json, os
          from pathlib import Path
          from ci.sdk_completion_state import _state
          from ci.reuse import github_output
          outputs = json.loads(os.environ['RESUME_OUTPUTS'])
          if outputs.get('full_reuse') != 'true' or outputs.get('wave_failed') != 'false':
              raise ValueError('Apple package inputs require successful exact product resume')
          github_output(Path(os.environ['GITHUB_OUTPUT']), _state(outputs, runtime_wave='0', sdk_wave=''))
          PYCODE
      - name: Stage only the original SDK iOS binary frameworks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_VALIDATION_COMMIT: ${{ inputs.validationCommit }}
          CI_VALIDATION_TREE: ${{ inputs.validationTree }}
          ARTIFACT_ID: ${{ steps.original.outputs.artifact_id }}
          ARTIFACT_SHA256: ${{ steps.original.outputs.artifact_digest }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
        run: |
          set -euo pipefail
          python3 -B .github/actions/run-ci-lane/apple_package_inputs.py \
            --plan "$PWD/build/ci-retained-package/impact-plan.json" \
            --artifact-id "$ARTIFACT_ID" --artifact-sha256 "$ARTIFACT_SHA256" \
            --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
            --completed-frozen-policy "${CODEX_AGENT_COMPLETED_REUSE_POLICY:?native authority required}"
          frameworks="$PWD/build/ci/retained-package/frameworks"
          test -d "$frameworks/device/CodexAgent.framework"
          test -d "$frameworks/simulator/CodexAgent.framework"
          printf 'IOS_DEVICE_FRAMEWORK=%s\nIOS_SIMULATOR_FRAMEWORK=%s\n' \
            "$frameworks/device/CodexAgent.framework" "$frameworks/simulator/CodexAgent.framework" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-retained-apple-package-inputs-${{ inputs.validationTree }}-attempt-${{ github.run_attempt }}
          path: build/ci/retained-package/retained-apple-package-inputs.json
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 90
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-package
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  select:
    if: ${{ !inputs.retainedSwiftSourceOnly && !inputs.retainedPackageOnly }}
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.lanes.outputs.ios_native_tests }}
      native_test: ${{ steps.lanes.outputs.ios_native_tests_test }}
      rust_device: ${{ steps.lanes.outputs.ios_rust_device }}
      rust_device_build: ${{ steps.lanes.outputs.ios_rust_device_build }}
      rust_simulator: ${{ steps.lanes.outputs.ios_rust_simulator }}
      rust_simulator_build: ${{ steps.lanes.outputs.ios_rust_simulator_build }}
      framework_device: ${{ steps.lanes.outputs.ios_framework_device }}
      framework_device_build: ${{ steps.lanes.outputs.ios_framework_device_build }}
      framework_simulator: ${{ steps.lanes.outputs.ios_framework_simulator }}
      framework_simulator_build: ${{ steps.lanes.outputs.ios_framework_simulator_build }}
      kotlin: ${{ steps.lanes.outputs.ios_kotlin_tests }}
      kotlin_test: ${{ steps.lanes.outputs.ios_kotlin_tests_test }}
      swift_build: ${{ steps.lanes.outputs.ios_swift_build }}
      swift_build_action: ${{ steps.lanes.outputs.ios_swift_build_build }}
      swift_build_test: ${{ steps.lanes.outputs.ios_swift_build_test }}
      swift_tests: ${{ steps.lanes.outputs.ios_swift_tests }}
      swift_tests_test: ${{ steps.lanes.outputs.ios_swift_tests_test }}
      package: ${{ steps.lanes.outputs.ios_package }}
      package_build: ${{ steps.lanes.outputs.ios_package_build }}
      privacy: ${{ steps.lanes.outputs.ios_privacy_metrics }}
      privacy_test: ${{ steps.lanes.outputs.ios_privacy_metrics_test }}
      consumer_common: ${{ steps.lanes.outputs.consumer_common }}
      consumer_common_build: ${{ steps.lanes.outputs.consumer_common_build }}
      consumer_device: ${{ steps.lanes.outputs.consumer_ios_device }}
      consumer_device_build: ${{ steps.lanes.outputs.consumer_ios_device_build }}
      consumer_simulator: ${{ steps.lanes.outputs.consumer_ios_simulator }}
      consumer_simulator_build: ${{ steps.lanes.outputs.consumer_ios_simulator_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.planArtifact }}
          path: build/ci
      - id: lanes
        env:
          SDK_BINARY_ONLY: ${{ inputs.sdkBinaryOnly }}
          RETAINED_CONSUMERS: ${{ inputs.retainedInstalledConsumers }}
          RETAINED_APPLE: ${{ inputs.retainedAppleChecks }}
          RETAINED_APPLE_REVIEWED: ${{ inputs.retainedAppleReviewedChecks }}
          RETAINED_SWIFT_SOURCE: ${{ inputs.retainedSwiftSourceChecks }}
          RETAINED_PACKAGE: ${{ inputs.retainedPackageChecks }}
        run: |
          lanes=(--lane ios-native-tests --lane ios-rust-device --lane ios-rust-simulator)
          if [ "$SDK_BINARY_ONLY" != true ]; then
            if [ "$RETAINED_APPLE" = true ]; then
              # Do not fall back to product compilation or missing legacy framework downloads.
              # Remaining duties must get their own retained-input caller before broad ordinary dispatch.
          python3 -B - <<'PYCODE'
          import json, os
          from pathlib import Path
          plan = json.loads(Path('build/ci/impact-plan.json').read_text())
          remaining = [lane for lane in ('ios-native-tests', 'ios-rust-device', 'ios-rust-simulator',
              'ios-kotlin-tests', 'ios-swift-build', 'ios-package')
              if any(plan['lanes'][lane][a] for a in ('build', 'test', 'metadata'))]
          if os.environ['RETAINED_APPLE_REVIEWED'] == 'true':
              remaining = [lane for lane in remaining if lane not in ('ios-kotlin-tests', 'ios-native-tests', 'ios-rust-device', 'ios-rust-simulator')]
          if os.environ['RETAINED_SWIFT_SOURCE'] == 'true':
              remaining = [lane for lane in remaining if lane != 'ios-swift-build']
          if os.environ['RETAINED_PACKAGE'] == 'true':
              # The separate retained-package caller runs the unchanged hosted lane from original frameworks.
              remaining = [lane for lane in remaining if lane != 'ios-package']
          if remaining:
              raise ValueError('Ordinary Apple still requires distinct retained-input checks: ' + ', '.join(remaining))
          PYCODE
              lanes=()
              if [ "$RETAINED_APPLE_REVIEWED" != true ]; then
                lanes+=(--lane ios-privacy-metrics)
              fi
            else
              if [ "$RETAINED_APPLE_REVIEWED" = true ]; then
                echo 'Reviewed Apple checks require retained Apple mode' >&2; exit 1
              fi
              if [ "$RETAINED_PACKAGE" = true ]; then
                echo 'Retained Apple package checks require retained Apple mode' >&2; exit 1
              fi
              lanes+=(--lane ios-framework-device --lane ios-framework-simulator --lane ios-kotlin-tests
                --lane ios-swift-build --lane ios-swift-tests --lane ios-package
                --lane ios-privacy-metrics)
            fi
            if [ "$RETAINED_CONSUMERS" != true ]; then
              lanes+=(--lane consumer-common --lane consumer-ios-device --lane consumer-ios-simulator)
            fi
          fi
          if [ "${#lanes[@]}" -gt 0 ]; then
            python3 ci/lane_selection.py --plan build/ci/impact-plan.json --github-output "$GITHUB_OUTPUT" "${lanes[@]}"
          fi

  native-tests:
    if: needs.select.outputs.native == 'true'
    needs: select
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
      artifact_id: ${{ steps.lane.outputs.artifact_id }}
      artifact_digest: ${{ steps.lane.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-native-tests
          sdk-prerequisite-reuse: ${{ inputs.sdkBinaryOnly }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  rust-device:
    if: needs.select.outputs.rust_device == 'true'
    needs: select
    runs-on: macos-26
    timeout-minutes: ${{ inputs.sdkBinaryOnly && 240 || 120 }}
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
      artifact_id: ${{ steps.lane.outputs.artifact_id }}
      artifact_digest: ${{ steps.lane.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-rust-device
          sdk-prerequisite-reuse: ${{ inputs.sdkBinaryOnly }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  rust-simulator:
    if: needs.select.outputs.rust_simulator == 'true'
    needs: select
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
      artifact_id: ${{ steps.lane.outputs.artifact_id }}
      artifact_digest: ${{ steps.lane.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-rust-simulator
          sdk-prerequisite-reuse: ${{ inputs.sdkBinaryOnly }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  framework-device:
    if: always() && needs.select.outputs.framework_device == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, rust-device]
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - if: needs.select.outputs.framework_device_build == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.rust-device.outputs.artifact_name }}
          path: build/ci/device-rust
      - if: needs.select.outputs.framework_device_build == 'true'
        shell: bash
        run: |
          archive=$(find build/ci/device-rust/payload -type f -name codex-agent-ios-arm64.a -print -quit)
          test -n "$archive"
          printf 'IOS_DEVICE_RUST_EVIDENCE=%s/%s\n' "$GITHUB_WORKSPACE" "$(dirname "$archive")" >> "$GITHUB_ENV"
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-framework-device
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  framework-simulator:
    if: always() && needs.select.outputs.framework_simulator == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, rust-simulator]
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - if: needs.select.outputs.framework_simulator_build == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.rust-simulator.outputs.artifact_name }}
          path: build/ci/simulator-rust
      - if: needs.select.outputs.framework_simulator_build == 'true'
        shell: bash
        run: |
          archive=$(find build/ci/simulator-rust/payload -type f -name codex-agent-ios-simulator-arm64.a -print -quit)
          test -n "$archive"
          printf 'IOS_SIMULATOR_RUST_EVIDENCE=%s/%s\n' "$GITHUB_WORKSPACE" "$(dirname "$archive")" >> "$GITHUB_ENV"
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-framework-simulator
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  kotlin-tests:
    if: always() && needs.select.outputs.kotlin == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, rust-simulator]
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - if: needs.select.outputs.kotlin_test == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.rust-simulator.outputs.artifact_name }}
          path: build/ci/simulator-rust
      - if: needs.select.outputs.kotlin_test == 'true'
        run: |
          archive=$(find build/ci/simulator-rust/payload -type f -name codex-agent-ios-simulator-arm64.a -print -quit)
          test -n "$archive"
          evidence=$(dirname "$archive")
          printf 'IOS_SIMULATOR_RUST_EVIDENCE=%s/%s\n' "$GITHUB_WORKSPACE" "$evidence" >> "$GITHUB_ENV"
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-kotlin-tests
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  swift-build:
    if: always() && needs.select.outputs.swift_build == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, framework-simulator]
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - if: needs.select.outputs.swift_build_action == 'true' || needs.select.outputs.swift_build_test == 'true' || needs.select.outputs.swift_tests_test == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.framework-simulator.outputs.artifact_name }}
          path: build/ci/framework
      - if: needs.select.outputs.swift_build_action == 'true' || needs.select.outputs.swift_build_test == 'true' || needs.select.outputs.swift_tests_test == 'true'
        run: |
          framework=$(find build/ci/framework/payload -type d -name CodexAgent.framework -print -quit)
          test -n "$framework"
          printf 'IOS_SIMULATOR_FRAMEWORK=%s/%s\n' "$GITHUB_WORKSPACE" "$framework" >> "$GITHUB_ENV"
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-swift-build
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          xcode-version: "26.6"

  swift-tests:
    if: always() && needs.select.outputs.swift_tests == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, framework-device, framework-simulator, swift-build]
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
      artifact_id: ${{ steps.lane.outputs.artifact_id }}
      artifact_digest: ${{ steps.lane.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - if: needs.select.outputs.swift_tests_test == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.framework-device.outputs.artifact_name }}
          path: build/ci/device-framework
      - if: needs.select.outputs.swift_tests_test == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.framework-simulator.outputs.artifact_name }}
          path: build/ci/simulator-framework
      - if: needs.select.outputs.swift_tests_test == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.swift-build.outputs.artifact_name }}
          path: build/ci/swift-compilation
      - if: needs.select.outputs.swift_tests_test == 'true'
        run: |
          device=$(find build/ci/device-framework/payload -type d -name CodexAgent.framework -print -quit)
          simulator=$(find build/ci/simulator-framework/payload -type d -name CodexAgent.framework -print -quit)
          compilation_archive=$(find build/ci/swift-compilation/payload -type f -name swift-simulator-compilation-products.tar -print -quit)
          test -n "$device"
          test -n "$simulator"
          test -n "$compilation_archive"
          python3 ci/stage.py extract-tar --archive "$compilation_archive" --output build/ci/swift-products
          compilation=$(find build/ci/swift-products -type d -name swift-simulator-compilation-products -print -quit)
          test -n "$compilation"
          printf 'IOS_DEVICE_FRAMEWORK=%s/%s\nIOS_SIMULATOR_FRAMEWORK=%s/%s\nCODEX_AGENT_SWIFT_COMPILATION_DIRECTORY=%s/%s\n' \
            "$GITHUB_WORKSPACE" "$device" "$GITHUB_WORKSPACE" "$simulator" \
            "$GITHUB_WORKSPACE" "$compilation" >> "$GITHUB_ENV"
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-swift-tests
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  package:
    if: always() && needs.select.outputs.package == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, framework-device, framework-simulator]
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - if: needs.select.outputs.package_build == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.framework-device.outputs.artifact_name }}
          path: build/ci/device-framework
      - if: needs.select.outputs.package_build == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.framework-simulator.outputs.artifact_name }}
          path: build/ci/simulator-framework
      - if: needs.select.outputs.package_build == 'true'
        run: |
          device=$(find build/ci/device-framework/payload -type d -name CodexAgent.framework -print -quit)
          simulator=$(find build/ci/simulator-framework/payload -type d -name CodexAgent.framework -print -quit)
          test -n "$device"
          test -n "$simulator"
          printf 'IOS_DEVICE_FRAMEWORK=%s/%s\nIOS_SIMULATOR_FRAMEWORK=%s/%s\n' \
            "$GITHUB_WORKSPACE" "$device" "$GITHUB_WORKSPACE" "$simulator" >> "$GITHUB_ENV"
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-package
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  privacy-metrics:
    if: always() && needs.select.outputs.privacy == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, framework-device, framework-simulator]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.framework-device.outputs.artifact_name }}
          path: build/ci/privacy-inputs/device
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.framework-simulator.outputs.artifact_name }}
          path: build/ci/privacy-inputs/simulator
      - shell: bash
        run: |
          for payload in build/ci/privacy-inputs/*/payload; do
            test ! -d "$payload" || cp -R "$payload/." .
          done
          device=$(find build/ci/privacy-inputs/device/payload -type d -name CodexAgent.framework -print -quit)
          simulator=$(find build/ci/privacy-inputs/simulator/payload -type d -name CodexAgent.framework -print -quit)
          test -n "$device"
          test -n "$simulator"
          printf 'IOS_DEVICE_FRAMEWORK=%s/%s\nIOS_SIMULATOR_FRAMEWORK=%s/%s\n' \
            "$GITHUB_WORKSPACE" "$device" "$GITHUB_WORKSPACE" "$simulator" >> "$GITHUB_ENV"
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-privacy-metrics
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  consumer-common:
    if: always() && needs.select.outputs.consumer_common == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select]
    runs-on: macos-26
    timeout-minutes: 180
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: consumer-common
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          node-version: "24.18.0"
          rust-version: "1.95.0"
          xcode-version: "26.6"

  consumer-ios-device:
    if: always() && needs.select.outputs.consumer_device == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, rust-device, rust-simulator]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.rust-device.outputs.artifact_name }}
          path: build/ci/consumer-rust/device
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.rust-simulator.outputs.artifact_name }}
          path: build/ci/consumer-rust/simulator
      - shell: bash
        run: |
          device=$(find build/ci/consumer-rust/device/payload -type f -name codex-agent-ios-arm64.a -print -quit)
          simulator=$(find build/ci/consumer-rust/simulator/payload -type f -name codex-agent-ios-simulator-arm64.a -print -quit)
          test -n "$device"
          test -n "$simulator"
          printf 'IOS_DEVICE_RUST_EVIDENCE=%s/%s\nIOS_SIMULATOR_RUST_EVIDENCE=%s/%s\n' \
            "$GITHUB_WORKSPACE" "$(dirname "$device")" "$GITHUB_WORKSPACE" "$(dirname "$simulator")" >> "$GITHUB_ENV"
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: consumer-ios-device
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  consumer-ios-simulator:
    if: always() && needs.select.outputs.consumer_simulator == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, rust-device, rust-simulator]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.rust-device.outputs.artifact_name }}
          path: build/ci/consumer-rust/device
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.rust-simulator.outputs.artifact_name }}
          path: build/ci/consumer-rust/simulator
      - shell: bash
        run: |
          device=$(find build/ci/consumer-rust/device/payload -type f -name codex-agent-ios-arm64.a -print -quit)
          simulator=$(find build/ci/consumer-rust/simulator/payload -type f -name codex-agent-ios-simulator-arm64.a -print -quit)
          test -n "$device"
          test -n "$simulator"
          printf 'IOS_DEVICE_RUST_EVIDENCE=%s/%s\nIOS_SIMULATOR_RUST_EVIDENCE=%s/%s\n' \
            "$GITHUB_WORKSPACE" "$(dirname "$device")" "$GITHUB_WORKSPACE" "$(dirname "$simulator")" >> "$GITHUB_ENV"
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: consumer-ios-simulator
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"
