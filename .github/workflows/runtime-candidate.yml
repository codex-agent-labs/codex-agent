name: Runtime candidate

on:
  push:
    tags:
      - candidate/runtime/v*-rc.*

permissions:
  actions: read
  contents: read

concurrency:
  group: runtime-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    environment: release-candidate
    timeout-minutes: 30
    steps:
      - name: Require protected tag and independently approved S1048 controls
        id: authority
        shell: bash
        env:
          SELECTION_JSON: ${{ vars.CODEX_AGENT_RUNTIME_CANDIDATE_SELECTION_JSON }}
          SELECTION_SHA256: ${{ vars.CODEX_AGENT_RUNTIME_CANDIDATE_SELECTION_SHA256 }}
          PINS_JSON: ${{ vars.CODEX_AGENT_RUNTIME_CANDIDATE_PINS_JSON }}
          PINS_SHA256: ${{ vars.CODEX_AGENT_RUNTIME_CANDIDATE_PINS_SHA256 }}
          PGP_PUBLIC_KEY: ${{ vars.CODEX_AGENT_PRODUCT_PGP_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_PROTECTED" = true
          [[ "$GITHUB_REF_NAME" =~ ^candidate/runtime/v([0-9]+\.[0-9]+\.[0-9]+)-rc\.([1-9][0-9]*)$ ]]
          candidate_version="${BASH_REMATCH[1]}"
          [[ "$SELECTION_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PINS_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s' "$SELECTION_JSON" > "$RUNNER_TEMP/runtime-candidate-selection.json"
          printf '%s' "$PINS_JSON" > "$RUNNER_TEMP/runtime-candidate-pins.json"
          printf '%s' "$PGP_PUBLIC_KEY" > "$RUNNER_TEMP/runtime-candidate-pgp.asc"
          test "sha256:$(sha256sum "$RUNNER_TEMP/runtime-candidate-selection.json" | cut -d ' ' -f 1)" = "$SELECTION_SHA256"
          test "sha256:$(sha256sum "$RUNNER_TEMP/runtime-candidate-pins.json" | cut -d ' ' -f 1)" = "$PINS_SHA256"
          test "$(jq -er '.schemaVersion' "$RUNNER_TEMP/runtime-candidate-selection.json")" = 2
          test "$(jq -er '.phase11Pins.expected_runtime_version' "$RUNNER_TEMP/runtime-candidate-pins.json")" = "$candidate_version"
          test "sha256:$(sha256sum "$RUNNER_TEMP/runtime-candidate-pgp.asc" | cut -d ' ' -f 1)" = "$(jq -er '.phase11Pins.expected_pgp_key_sha256' "$RUNNER_TEMP/runtime-candidate-pins.json")"
          source_sha=$(jq -er '.phase11Pins.expected_source_commit' "$RUNNER_TEMP/runtime-candidate-pins.json")
          validation_sha=$(jq -er '.phase10.originalProducer.commit' "$RUNNER_TEMP/runtime-candidate-selection.json")
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$validation_sha" =~ ^[0-9a-f]{40}$ ]]
          {
            printf 'selection_sha256=%s\n' "$SELECTION_SHA256"
            printf 'pins_sha256=%s\n' "$PINS_SHA256"
            printf 'source_sha=%s\n' "$source_sha"
            printf 'validation_sha=%s\n' "$validation_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Check out the exact landed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: landed-source
      - name: Require the candidate commit on main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C landed-source rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C landed-source rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git -C landed-source fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git -C landed-source merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -z "$(git -C landed-source status --porcelain --untracked-files=no)"
      - name: Check out reviewed verifier at its independently pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.authority.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted-source
      - name: Check out original validated Runtime source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.authority.outputs.validation_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: validation-source
      - name: Capture only the selected catalog record and retained sidecar uploads
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SELECTION_SHA256: ${{ steps.authority.outputs.selection_sha256 }}
        run: |
          set -euo pipefail
          python3 -B trusted-source/ci/runtime_candidate_transport.py \
            --selection "$RUNNER_TEMP/runtime-candidate-selection.json" \
            --expected-selection-sha256 "$SELECTION_SHA256" \
            --destination "$RUNNER_TEMP/runtime-candidate-transports"
      - name: Verify offline and forward exact Phase-10 bytes without rebuilding
        shell: bash
        env:
          SELECTION_SHA256: ${{ steps.authority.outputs.selection_sha256 }}
          PINS_SHA256: ${{ steps.authority.outputs.pins_sha256 }}
        run: |
          set -euo pipefail
          python3 -B trusted-source/ci/runtime_candidate_join.py \
            --selection "$RUNNER_TEMP/runtime-candidate-selection.json" \
            --expected-selection-sha256 "$SELECTION_SHA256" \
            --pins "$RUNNER_TEMP/runtime-candidate-pins.json" \
            --expected-pins-sha256 "$PINS_SHA256" \
            --transports "$RUNNER_TEMP/runtime-candidate-transports" \
            --trusted-repository trusted-source \
            --validation-repository validation-source \
            --landed-repository landed-source \
            --pgp-public-key "$RUNNER_TEMP/runtime-candidate-pgp.asc" \
            --destination "$RUNNER_TEMP/runtime-candidate"
      - name: Retain only the verified unchanged candidate bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-runtime-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-candidate
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
          compression-level: 0
          retention-days: 90
