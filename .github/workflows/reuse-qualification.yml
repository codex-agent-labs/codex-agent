name: Authenticate frozen reuse qualification

on:
  workflow_call:
    outputs:
      artifact-id:
        value: ${{ jobs.qualify.outputs.artifact-id }}
      artifact-sha256:
        value: ${{ jobs.qualify.outputs.artifact-sha256 }}
      issuer-sha:
        value: ${{ jobs.qualify.outputs.issuer-sha }}

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    if: github.repository == 'codex-agent-labs/codex-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      artifact-id: ${{ steps.preserve.outputs.artifact-id }}
      artifact-sha256: ${{ steps.preserve.outputs.artifact-digest }}
      issuer-sha: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retain the exact original Git policy tree before authentication
        run: |
          git cat-file -e 'db38c174a2db6f02ff6b6e2091e809681d83a4d9^{tree}' || git fetch --no-tags origin db38c174a2db6f02ff6b6e2091e809681d83a4d9
          git cat-file -e 'db38c174a2db6f02ff6b6e2091e809681d83a4d9^{tree}'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - id: identity
        env:
          ISSUER_REPOSITORY: ${{ job.workflow_repository }}
          ISSUER_PATH: ${{ job.workflow_file_path }}
          ISSUER_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$ISSUER_REPOSITORY" = codex-agent-labs/codex-agent
          test "$ISSUER_PATH" = .github/workflows/reuse-qualification.yml
          test "$(git rev-parse HEAD)" = "$ISSUER_SHA"
          echo "commit=$ISSUER_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "QUALIFICATION_ISSUER_REPOSITORY=$ISSUER_REPOSITORY"
            echo "QUALIFICATION_ISSUER_PATH=$ISSUER_PATH"
            echo "QUALIFICATION_ISSUER_SHA=$ISSUER_SHA"
            echo "CODEX_AGENT_HYDRATED_EVIDENCE=$RUNNER_TEMP/hydrated-evidence"
            echo "CODEX_AGENT_PRODUCT_CACHE=$RUNNER_TEMP/private-product-cache"
            echo "PROOF_WORK=$RUNNER_TEMP/qualification-proof"
          } >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .github/actions/hydrated-evidence-cache
      - name: Fully authenticate originals and preserve the frozen closure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/reuse_qualification.py issue-frozen --work "$PROOF_WORK"
      - uses: ./.github/actions/hydrated-evidence-cache
        with:
          mode: save
          root: ${{ env.CODEX_AGENT_HYDRATED_EVIDENCE }}
          manifest: ${{ env.PROOF_WORK }}/cache-manifest.json
          report: ${{ env.PROOF_WORK }}/cache-save.json
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.PROOF_WORK }}/qualification.json
          create-storage-record: false
      - name: Preserve the independent native authority bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "$PROOF_WORK/bundle.jsonl"
      - id: preserve
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reuse-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PROOF_WORK }}/qualification.json
            ${{ env.PROOF_WORK }}/bundle.jsonl
            ${{ env.PROOF_WORK }}/qualification-issue.json
            ${{ env.PROOF_WORK }}/proof.json
            ${{ env.PROOF_WORK }}/prepare.json
            ${{ env.PROOF_WORK }}/cache-save.json
          if-no-files-found: error
