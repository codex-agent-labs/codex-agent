name: Contract Phase-10 Output Upload

on:
  workflow_call:
    inputs:
      planOutputs:
        required: true
        type: string
      trustedWorkflowSha:
        required: true
        type: string
      phase10OutputArtifactId:
        required: true
        type: string
    outputs:
      phase10OutputArtifactId:
        value: ${{ jobs.upload.outputs.artifact_id }}
      phase10OutputArtifactSha256:
        value: ${{ jobs.upload.outputs.artifact_sha256 }}

permissions:
  actions: read
  contents: read

jobs:
  upload:
    name: contract-phase10-output
    if: >-
      fromJSON(inputs.planOutputs).event_authorized == 'true' &&
      fromJSON(inputs.planOutputs).remote_build_authorized == 'true' &&
      github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_sha256: sha256:${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Download finalized Phase-10 output without rebuilding it
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.phase10OutputArtifactId }}
          merge-multiple: true
          path: phase10-output
      - name: Preserve exact output for official job-window observation
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          name: codex-agent-contract-phase10-maven-${{ fromJSON(inputs.planOutputs).validation_tree }}-attempt-${{ github.run_attempt }}
          path: phase10-output
          compression-level: 0
          retention-days: 90
