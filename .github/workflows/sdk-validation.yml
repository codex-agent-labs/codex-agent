name: SDK Validation

on:
  workflow_call:
    inputs:
      planArtifact:
        required: true
        type: string
      validationCommit:
        required: true
        type: string
      validationTree:
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  CODEX_AGENT_THROUGHPUT_TRACE: '1'

concurrency:
  group: ci-sdk-${{ inputs.validationTree }}
  cancel-in-progress: true

jobs:
  native-wrapper-source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.validationCommit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.planArtifact }}
          path: build/ci/plan
      - name: Select source checks from the validated product plan
        id: selection
        shell: bash
        env:
          PLAN_PATH: build/ci/plan/impact-plan.json
          VALIDATION_COMMIT: ${{ inputs.validationCommit }}
          VALIDATION_TREE: ${{ inputs.validationTree }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B - <<'PYCODE'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / 'ci'))
          from product_reuse import _requested, _validate_plan
          plan = _validate_plan(Path(os.environ['PLAN_PATH']), Path.cwd())
          if (plan['validationCommit'] != os.environ['VALIDATION_COMMIT'] or
                  plan['validationTree'] != os.environ['VALIDATION_TREE'] or
                  plan['remoteBuildAuthorized'] is not True):
              raise ValueError('Source checks require the exact authorized current plan')
          selected = {item.component for item in _requested(plan) if item.product == 'sdk'}
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              for language in ('python', 'cpp', 'rust', 'dart'):
                  output.write(f'{language}={str(language in selected).lower()}\n')
          PYCODE
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: ${{ !cancelled() && steps.selection.outcome == 'success' && (steps.selection.outputs.python == 'true' || steps.selection.outputs.cpp == 'true') }}
        with:
          python-version: "3.11"
      - name: Install the reviewed Python package tools
        if: ${{ !cancelled() && steps.selection.outcome == 'success' && (steps.selection.outputs.python == 'true') }}
        run: python -m pip install build==1.3.0 setuptools==80.9.0 wheel==0.45.1
      - name: Prove Python package-only paths need no compiler
        if: ${{ !cancelled() && steps.selection.outcome == 'success' && (steps.selection.outputs.python == 'true') }}
        run: python -m unittest discover -s codex-agent-bindings/python/tests -p test_package_only_process.py -v
      - name: Prove C++ package-only paths need no compiler
        if: ${{ !cancelled() && steps.selection.outcome == 'success' && (steps.selection.outputs.cpp == 'true') }}
        run: |
          command -v cmake
          python -m unittest discover -s codex-agent-bindings/cpp/tools/tests -p test_package_only_process.py -v
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        if: ${{ !cancelled() && steps.selection.outcome == 'success' && (steps.selection.outputs.rust == 'true') }}
        with:
          components: rustfmt,clippy
      - name: Check Rust formatting and lints
        if: ${{ !cancelled() && steps.selection.outcome == 'success' && (steps.selection.outputs.rust == 'true') }}
        run: |
          cargo fetch --manifest-path codex-agent-bindings/rust/Cargo.toml --locked
          cargo fmt --manifest-path codex-agent-bindings/rust/Cargo.toml -- --check
          cargo clippy --manifest-path codex-agent-bindings/rust/Cargo.toml --all-targets --locked --offline -- -D warnings
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        if: ${{ !cancelled() && steps.selection.outcome == 'success' && (steps.selection.outputs.dart == 'true') }}
        with:
          sdk: "3.6.0"
      - name: Check Dart formatting and analysis at its SDK floor
        if: ${{ !cancelled() && steps.selection.outcome == 'success' && (steps.selection.outputs.dart == 'true') }}
        working-directory: codex-agent-bindings/dart
        run: |
          dart pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed .
          dart analyze
