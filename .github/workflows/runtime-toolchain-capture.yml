name: Runtime Toolchain Capture

on:
  workflow_call:
    inputs:
      validationCommit:
        required: true
        type: string
      validationTree:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      validationCommit:
        description: Exact commit containing the capture workflow and authorities
        required: true
        type: string
      validationTree:
        description: Exact tree for validationCommit
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: runtime-toolchain-capture-${{ inputs.validationTree }}
  cancel-in-progress: false

jobs:
  observe:
    environment: product-attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: macos-arm64
            role: builder
            runner: macos-26
          - profile: macos-x64
            role: builder
            runner: macos-26-intel
          - profile: linux-arm64
            role: cross-builder
            runner: ubuntu-24.04
          - profile: linux-x64
            role: builder
            runner: ubuntu-24.04
          - profile: windows-x64
            role: builder
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: ${{ startsWith(matrix.profile, 'macos-') && '/Applications/Xcode_26.6.app/Contents/Developer' || '' }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.validationCommit }}
      - name: Bind the protected dispatch to one exact Git object
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_COMMIT: ${{ inputs.validationCommit }}
          VALIDATION_TREE: ${{ inputs.validationTree }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = codex-agent-labs/codex-agent
          test "$GITHUB_SHA" = "$VALIDATION_COMMIT"
          test "$(git rev-parse 'HEAD^{commit}')" = "$VALIDATION_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$VALIDATION_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          environment=$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/product-attestation")
          jq -e '
            .name == "product-attestation" and
            .can_admins_bypass == false and
            .deployment_branch_policy == {
              protected_branches: false,
              custom_branch_policies: true
            } and
            any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length) > 0) and
            any(.protection_rules[]?; .type == "branch_policy")
          ' <<<"$environment" >/dev/null || {
            echo '::error::product-attestation requires reviewers, disabled admin bypass, and an exact branch policy' >&2
            exit 1
          }
          policies=$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/product-attestation/deployment-branch-policies")
          jq -e '.total_count > 0 and (.branch_policies | length) == .total_count' \
            <<<"$policies" >/dev/null || {
            echo '::error::product-attestation has no configured deployment branch policy' >&2
            exit 1
          }
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
      - uses: ./.github/actions/setup-kmp
        with:
          cache-read-only: "true"
          xcode-fingerprint: ${{ runner.os == 'macOS' && 'auto' || 'none' }}
      - name: Verify and provision pinned capture tools without a product build
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          VALIDATION_COMMIT: ${{ inputs.validationCommit }}
        run: |
          set -euo pipefail
          python3 -m ci.products.toolchain_capture_bootstrap \
            --repository-root . \
            --repository-revision "$VALIDATION_COMMIT" \
            --profile-id "$PROFILE" \
            --output-dir "build/ci/toolchain-inputs/$PROFILE" \
            --konan-data-dir "$(python3 -c 'from pathlib import Path; print(Path.home() / ".konan")')"
      - name: Observe exact pre-existing producer tools
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          ROLE: ${{ matrix.role }}
          VALIDATION_COMMIT: ${{ inputs.validationCommit }}
        run: |
          mkdir -p build/ci/toolchain-observation
          paths="build/ci/toolchain-inputs/$PROFILE/paths.json"
          python3 -m ci.products.toolchain observe-producer \
            --repository-root . \
            --repository-revision "$VALIDATION_COMMIT" \
            --profile-id "$PROFILE" \
            --producer-role "$ROLE" \
            --target "$PROFILE" \
            --konan-data-dir "$(jq -r .konanDataDir "$paths")" \
            --kotlin-plugin-jar "$(jq -r .plugin "$paths")" \
            --native-archive "$(jq -r .archive "$paths")" \
            --output "build/ci/toolchain-observation/$PROFILE-$ROLE.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          name: codex-agent-runtime-toolchain-${{ matrix.profile }}-${{ matrix.role }}-${{ inputs.validationTree }}
          path: build/ci/toolchain-observation/${{ matrix.profile }}-${{ matrix.role }}.json
          compression-level: 0
          retention-days: 1

  linux-arm64-supervisor:
    needs: observe
    runs-on: ubuntu-24.04-arm
    environment: product-attestation
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.validationCommit }}
      - name: Bind the protected dispatch to one exact Git object
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_COMMIT: ${{ inputs.validationCommit }}
          VALIDATION_TREE: ${{ inputs.validationTree }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = codex-agent-labs/codex-agent
          test "$GITHUB_SHA" = "$VALIDATION_COMMIT"
          test "$(git rev-parse 'HEAD^{commit}')" = "$VALIDATION_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$VALIDATION_TREE"
          environment=$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/product-attestation")
          jq -e '
            .name == "product-attestation" and
            .can_admins_bypass == false and
            .deployment_branch_policy == {
              protected_branches: false,
              custom_branch_policies: true
            } and
            any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length) > 0) and
            any(.protection_rules[]?; .type == "branch_policy")
          ' <<<"$environment" >/dev/null || {
            echo '::error::product-attestation requires reviewers, disabled admin bypass, and an exact branch policy' >&2
            exit 1
          }
          policies=$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/product-attestation/deployment-branch-policies")
          jq -e '.total_count > 0 and (.branch_policies | length) == .total_count' \
            <<<"$policies" >/dev/null || {
            echo '::error::product-attestation has no configured deployment branch policy' >&2
            exit 1
          }
      - uses: ./.github/actions/setup-kmp
        with:
          cache-read-only: "true"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-agent-runtime-toolchain-*-${{ inputs.validationTree }}
          path: build/ci/toolchain-downloads
      - name: Assemble and verify the exact five-profile capture
        env:
          VALIDATION_COMMIT: ${{ inputs.validationCommit }}
          VALIDATION_TREE: ${{ inputs.validationTree }}
        run: |
          set -euo pipefail
          capture=build/ci/runtime-toolchain-capture
          mkdir -p "$capture/observations"/{linux-arm64,linux-x64,macos-arm64,macos-x64,windows-x64} "$capture/profiles"
          expected=(
            "codex-agent-runtime-toolchain-linux-arm64-cross-builder-$VALIDATION_TREE/linux-arm64-cross-builder.json"
            "codex-agent-runtime-toolchain-linux-x64-builder-$VALIDATION_TREE/linux-x64-builder.json"
            "codex-agent-runtime-toolchain-macos-arm64-builder-$VALIDATION_TREE/macos-arm64-builder.json"
            "codex-agent-runtime-toolchain-macos-x64-builder-$VALIDATION_TREE/macos-x64-builder.json"
            "codex-agent-runtime-toolchain-windows-x64-builder-$VALIDATION_TREE/windows-x64-builder.json"
          )
          test "$(find build/ci/toolchain-downloads -mindepth 1 -print | wc -l | tr -d ' ')" -eq 10
          for relative in "${expected[@]}"; do
            directory=build/ci/toolchain-downloads/${relative%%/*}
            file=build/ci/toolchain-downloads/$relative
            test -d "$directory"
            test ! -L "$directory"
            test -f "$file"
            test ! -L "$file"
          done
          for identity in \
            linux-arm64:cross-builder \
            linux-x64:builder macos-arm64:builder macos-x64:builder windows-x64:builder; do
            profile=${identity%%:*}
            role=${identity#*:}
            source="build/ci/toolchain-downloads/codex-agent-runtime-toolchain-$profile-$role-$VALIDATION_TREE/$profile-$role.json"
            test -f "$source"
            cp "$source" "$capture/observations/$profile/$role.json"
          done
          python3 -m ci.products.toolchain observe-producer \
            --repository-root . \
            --repository-revision "$VALIDATION_COMMIT" \
            --profile-id linux-arm64 \
            --producer-role supervisor-builder \
            --target linux-arm64 \
            --output "$capture/observations/linux-arm64/supervisor-builder.json"
          python3 -m ci.products.toolchain assemble-profile --profile-id linux-arm64 \
            --producer "$capture/observations/linux-arm64/cross-builder.json" \
            --producer "$capture/observations/linux-arm64/supervisor-builder.json" \
            --output "$capture/profiles/linux-arm64.json"
          for profile in linux-x64 macos-arm64 macos-x64 windows-x64; do
            python3 -m ci.products.toolchain assemble-profile --profile-id "$profile" \
              --producer "$capture/observations/$profile/builder.json" \
              --output "$capture/profiles/$profile.json"
          done
          python3 -m ci.products.toolchain verify-capture \
            --directory "$capture" \
            --repository-revision "$VALIDATION_COMMIT" \
            --repository-tree "$VALIDATION_TREE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          name: codex-agent-runtime-toolchain-capture-${{ inputs.validationTree }}
          path: build/ci/runtime-toolchain-capture
          compression-level: 0
          retention-days: 30
