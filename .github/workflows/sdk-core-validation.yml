name: SDK Core Validation

on:
  workflow_call:
    inputs:
      planOutputs:
        required: true
        type: string
      sdkPlan:
        required: true
        type: string
      sdkInputs:
        required: true
        type: string
      packageWave:
        required: true
        type: string
      trustedWorkflowSha:
        required: true
        type: string
      reuseQualification:
        description: Optional JSON with artifactId, artifactSha256, runId, runAttempt, issuerSha and sourceSha. Authority pins must be independently reviewed and supplied by the trusted calling workflow, never product-plan or event data.
        default: ''
        type: string
    secrets:
      authority_read_token:
        description: Read-only protected reuse-authority credential, scoped to qualification restoration
        required: false
    outputs:
      artifact_id:
        value: ${{ jobs.sdk-core-validation-result.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.sdk-core-validation-result.outputs.artifact_digest }}
      state_wave:
        value: ${{ jobs.sdk-core-validation-result.outputs.state_wave }}
      sdk_state_wave:
        value: ${{ jobs.sdk-core-validation-result.outputs.sdk_state_wave }}

permissions:
  actions: read
  contents: read

jobs:
  sdk-core-validation-plan:
    if: >-
      always() && fromJSON(inputs.planOutputs).event_authorized == 'true' &&
      fromJSON(inputs.planOutputs).remote_build_authorized == 'true' &&
      fromJSON(inputs.sdkPlan).result == 'success' &&
      fromJSON(inputs.packageWave).result == 'success' &&
      fromJSON(inputs.packageWave).outputs.artifact_id != ''
    runs-on: ubuntu-24.04
    outputs:
      sdk_matrix: ${{ steps.capture.outputs.sdk-matrix }}
      sdk_workers_required: ${{ steps.capture.outputs.sdk-workers-required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ fromJSON(inputs.planOutputs).validation_commit }}
      - if: inputs.reuseQualification == ''
        uses: codex-agent-labs/codex-agent/.github/actions/restore-reuse-qualification@reuse-authority
        with:
          authority-read-token: ${{ secrets.authority_read_token }}
      - if: inputs.reuseQualification != ''
        uses: ./.github/actions/restore-reuse-qualification
        with:
          authority-read-token: ${{ secrets.authority_read_token }}
          artifact-id: ${{ fromJSON(inputs.reuseQualification).artifactId }}
          artifact-sha256: ${{ fromJSON(inputs.reuseQualification).artifactSha256 }}
          run-id: ${{ fromJSON(inputs.reuseQualification).runId }}
          run-attempt: ${{ fromJSON(inputs.reuseQualification).runAttempt }}
          issuer-sha: ${{ fromJSON(inputs.reuseQualification).issuerSha }}
          source-sha: ${{ fromJSON(inputs.reuseQualification).sourceSha }}
      - name: Select installed caller Java
        if: fromJSON(inputs.planOutputs).tooling_required == 'true'
        run: |
          set -euo pipefail
          source ci/select_caller_java.sh
          test -f "$selected_java_home/bin/java"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        if: fromJSON(inputs.planOutputs).tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          artifact-id: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_artifact_id }}
          artifact-sha256: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / tooling-attestation
          policy-revision: ${{ fromJSON(inputs.planOutputs).validation_commit }}
          plan-id: ${{ fromJSON(inputs.planOutputs).plan_id }}
      - id: capture
        uses: ./.github/actions/capture-runtime-state
        with:
          product: sdk
          sdk-family: core-validation
          plan-id: ${{ fromJSON(inputs.planOutputs).plan_id }}
          artifact-id: ${{ fromJSON(inputs.packageWave).outputs.artifact_id }}
          artifact-sha256: ${{ fromJSON(inputs.packageWave).outputs.artifact_digest }}
          state-wave: ${{ fromJSON(inputs.packageWave).outputs.state_wave }}
          sdk-state-wave: ${{ fromJSON(inputs.packageWave).outputs.sdk_state_wave }}
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}

  sdk-core-validation:
    name: sdk-core-validation-${{ matrix.target }}
    needs: [sdk-core-validation-plan]
    if: >-
      always() && fromJSON(inputs.planOutputs).event_authorized == 'true' &&
      fromJSON(inputs.planOutputs).remote_build_authorized == 'true' &&
      fromJSON(inputs.sdkPlan).result == 'success' && fromJSON(inputs.sdkInputs).result == 'success' &&
      fromJSON(inputs.packageWave).result == 'success' &&
      needs.sdk-core-validation-plan.result == 'success' &&
      needs.sdk-core-validation-plan.outputs.sdk_workers_required == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.sdk-core-validation-plan.outputs.sdk_matrix || '{"include":[]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ fromJSON(inputs.planOutputs).validation_commit }}
      - if: inputs.reuseQualification == ''
        uses: codex-agent-labs/codex-agent/.github/actions/restore-reuse-qualification@reuse-authority
        with:
          authority-read-token: ${{ secrets.authority_read_token }}
      - if: inputs.reuseQualification != ''
        uses: ./.github/actions/restore-reuse-qualification
        with:
          authority-read-token: ${{ secrets.authority_read_token }}
          artifact-id: ${{ fromJSON(inputs.reuseQualification).artifactId }}
          artifact-sha256: ${{ fromJSON(inputs.reuseQualification).artifactSha256 }}
          run-id: ${{ fromJSON(inputs.reuseQualification).runId }}
          run-attempt: ${{ fromJSON(inputs.reuseQualification).runAttempt }}
          issuer-sha: ${{ fromJSON(inputs.reuseQualification).issuerSha }}
          source-sha: ${{ fromJSON(inputs.reuseQualification).sourceSha }}
      - name: Select installed caller Java
        shell: bash
        run: |
          set -euo pipefail
          source ci/select_caller_java.sh
          test -f "$selected_java_home/bin/java"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        uses: ./.github/actions/capture-sdk-tooling
        with:
          artifact-id: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_artifact_id }}
          artifact-sha256: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / tooling-attestation
          policy-revision: ${{ fromJSON(inputs.planOutputs).validation_commit }}
          plan-id: ${{ fromJSON(inputs.planOutputs).plan_id }}
      - id: native-archive
        name: Provision only Git-pinned native compiler archives
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            jvm|android|node-js|node-wasm) exit 0 ;;
          esac
          archive=$(python3 -B -m ci.sdk_core_native_archive_provision \
            --plan "${{ steps.tooling.outputs.plan-directory }}/impact-plan.json" \
            --target "$TARGET" \
            --destination "$RUNNER_TEMP/sdk-core-native-archive.tar.gz" \
            --repository-root "$GITHUB_WORKSPACE")
          echo "native_compiler_archive=$archive" >> "$GITHUB_OUTPUT"
      - id: validation
        uses: ./.github/actions/sdk-core-validation-worker
        with:
          plan-id: ${{ fromJSON(inputs.planOutputs).plan_id }}
          artifact-id: ${{ fromJSON(inputs.packageWave).outputs.artifact_id }}
          artifact-sha256: ${{ fromJSON(inputs.packageWave).outputs.artifact_digest }}
          state-wave: ${{ fromJSON(inputs.packageWave).outputs.state_wave }}
          sdk-state-wave: ${{ fromJSON(inputs.packageWave).outputs.sdk_state_wave }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          target: ${{ matrix.target }}
          build-key: ${{ matrix.buildKey }}
          tree: ${{ fromJSON(inputs.planOutputs).validation_tree }}
          sdk-inputs-id: ${{ fromJSON(inputs.sdkInputs).outputs.artifact_id }}
          sdk-inputs-sha256: ${{ fromJSON(inputs.sdkInputs).outputs.artifact_digest }}
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          native-compiler-archive: ${{ steps.native-archive.outputs.native_compiler_archive }}

  sdk-collect-13:
    needs: [sdk-core-validation-plan, sdk-core-validation]
    if: >-
      always() && fromJSON(inputs.planOutputs).event_authorized == 'true' &&
      fromJSON(inputs.planOutputs).remote_build_authorized == 'true' &&
      fromJSON(inputs.sdkPlan).result == 'success' && fromJSON(inputs.packageWave).result == 'success' &&
      needs.sdk-core-validation-plan.result == 'success' &&
      needs.sdk-core-validation-plan.outputs.sdk_workers_required == 'true'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.collect.outputs.artifact-id }}
      artifact_digest: ${{ steps.collect.outputs.artifact-sha256 }}
      wave_failed: ${{ steps.collect.outputs.wave-failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ fromJSON(inputs.planOutputs).validation_commit }}
      - if: inputs.reuseQualification == ''
        uses: codex-agent-labs/codex-agent/.github/actions/restore-reuse-qualification@reuse-authority
        with:
          authority-read-token: ${{ secrets.authority_read_token }}
      - if: inputs.reuseQualification != ''
        uses: ./.github/actions/restore-reuse-qualification
        with:
          authority-read-token: ${{ secrets.authority_read_token }}
          artifact-id: ${{ fromJSON(inputs.reuseQualification).artifactId }}
          artifact-sha256: ${{ fromJSON(inputs.reuseQualification).artifactSha256 }}
          run-id: ${{ fromJSON(inputs.reuseQualification).runId }}
          run-attempt: ${{ fromJSON(inputs.reuseQualification).runAttempt }}
          issuer-sha: ${{ fromJSON(inputs.reuseQualification).issuerSha }}
          source-sha: ${{ fromJSON(inputs.reuseQualification).sourceSha }}
      - name: Select installed caller Java
        run: |
          set -euo pipefail
          source ci/select_caller_java.sh
          test -f "$selected_java_home/bin/java"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        uses: ./.github/actions/capture-sdk-tooling
        with:
          artifact-id: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_artifact_id }}
          artifact-sha256: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ fromJSON(inputs.sdkPlan).outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / tooling-attestation
          policy-revision: ${{ fromJSON(inputs.planOutputs).validation_commit }}
          plan-id: ${{ fromJSON(inputs.planOutputs).plan_id }}
      - id: collect
        uses: ./.github/actions/collect-runtime-wave
        with:
          product: sdk
          sdk-family: core-validation
          plan-id: ${{ fromJSON(inputs.planOutputs).plan_id }}
          artifact-id: ${{ fromJSON(inputs.packageWave).outputs.artifact_id }}
          artifact-sha256: ${{ fromJSON(inputs.packageWave).outputs.artifact_digest }}
          state-wave: ${{ fromJSON(inputs.packageWave).outputs.state_wave }}
          sdk-state-wave: ${{ fromJSON(inputs.packageWave).outputs.sdk_state_wave }}
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          wave: '13'
          tree: ${{ fromJSON(inputs.planOutputs).validation_tree }}
          sdk-worker-workflow-path: .github/workflows/sdk-core-validation.yml
          sdk-worker-job-name: product-validation / sdk-core-validation-wave / sdk-core-validation-{target}

  sdk-core-validation-result:
    needs: [sdk-core-validation-plan, sdk-core-validation, sdk-collect-13]
    if: >-
      always() && fromJSON(inputs.planOutputs).event_authorized == 'true' &&
      fromJSON(inputs.planOutputs).remote_build_authorized == 'true' &&
      fromJSON(inputs.sdkPlan).result == 'success' && fromJSON(inputs.packageWave).result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.result.outputs.artifact_id }}
      artifact_digest: ${{ steps.result.outputs.artifact_digest }}
      state_wave: ${{ steps.result.outputs.state_wave }}
      sdk_state_wave: ${{ steps.result.outputs.sdk_state_wave }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ fromJSON(inputs.planOutputs).validation_commit }}
      - id: result
        name: Fail only after collecting Core validation results
        env:
          RESULTS: ${{ toJSON(needs) }}
          PACKAGE_RESULT: ${{ inputs.packageWave }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from ci.sdk_native_continuation import select_native_state
          from ci.reuse import github_output
          needs = json.loads(os.environ['RESULTS'])
          needs['sdk-core-package-wave'] = json.loads(os.environ['PACKAGE_RESULT'])
          result = select_native_state(needs, stage='core-validation')
          github_output(Path(os.environ['GITHUB_OUTPUT']), result)
          PY
