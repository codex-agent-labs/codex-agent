  core-validation-diagnostics:
    if: >-
      github.event.label.name == 'ci:core-validation-diagnostics' &&
      github.repository == 'codex-agent-labs/codex-agent' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check exact checkout and portable archive publication
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess, sys, urllib.parse, urllib.request
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          print(json.dumps({'diagnosticOnly': True, 'source': source, 'productExecuted': False,
              'autocrlf': subprocess.run(['git', 'config', '--get', 'core.autocrlf'], capture_output=True, text=True).stdout.strip()}), flush=True)
          sys.path.insert(0, str(pathlib.Path.cwd() / 'ci'))
          from reuse_qualification import read_blobs
          changed = []
          selected = []
          listing = subprocess.check_output(['git', 'ls-tree', '-rz', 'HEAD', '--', 'ci', '.github'])
          for row in listing.split(b'\0'):
              if not row:
                  continue
              header, name = row.split(b'\t', 1)
              path = pathlib.Path(name.decode())
              if path.suffix not in {'.py', '.json', '.yml', '.yaml', '.sh', '.js', '.mjs'} or 'tests' in path.parts:
                  continue
              selected.append((path, header.split()[2].decode()))
          blobs = read_blobs(pathlib.Path.cwd(), (oid for _, oid in selected),
              max_bytes=16 * 1024**2, total_bytes=64 * 1024**2)
          for path, oid in selected:
              expected = blobs[oid]
              actual = path.read_bytes()
              if expected != actual:
                  changed.append({'path': path.as_posix(), 'expectedSha256': hashlib.sha256(expected).hexdigest(),
                      'actualSha256': hashlib.sha256(actual).hexdigest(), 'crlfOnly': actual.replace(b'\r\n', b'\n') == expected})
          print(json.dumps({'changedControlCount': len(changed), 'changedControls': changed}), flush=True)
          import sdk_core_native_archive_provision as provider
          class ObservedRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  value = urllib.parse.urlsplit(new_url)
                  print(json.dumps({'redirectCode': code, 'scheme': value.scheme, 'host': value.hostname, 'port': value.port}), flush=True)
                  provider._github_https(new_url)
                  return super().redirect_request(request, response, code, message, headers, new_url)
          url = provider._RELEASE_ROOT + '/v2.3.10/kotlin-native-prebuilt-2.3.10-macos-aarch64.tar.gz'
          with urllib.request.build_opener(ObservedRedirect()).open(urllib.request.Request(url), timeout=30) as response:
              print(json.dumps({'status': response.status, 'finalHost': urllib.parse.urlsplit(response.geturl()).hostname,
                  'declaredBytes': response.headers.get('Content-Length'), 'archiveBodyBytesRead': 0}), flush=True)
              provider._github_https(response.geturl())
          subprocess.run([sys.executable, '-B', '-m', 'unittest',
              'ci.tests.test_sdk_android_archive_provision',
              'ci.tests.test_sdk_core_native_archive_provision',
              'ci.tests.test_product_sdk_maven.SdkMavenPackagingTest.test_every_component_packages_its_exact_carrier_set'], check=True)
          import tempfile
          from products.sdk_facade_source import capture_facade_validation_sources
          from products.restore import _stage_fingerprint
          with tempfile.TemporaryDirectory(prefix='core-source-host-check-') as temporary:
              captured = pathlib.Path(temporary).resolve() / 'source'
              result = capture_facade_validation_sources(pathlib.Path.cwd(), source, captured)
              assert result['tree'] == subprocess.check_output(['git', 'rev-parse', source + '^{tree}'], text=True).strip()
              fingerprint = _stage_fingerprint(captured)
              assert fingerprint == _stage_fingerprint(captured)
              print(json.dumps({'exactGitSourceCapture': 'pass', 'heldStageFingerprint': 'pass',
                  'sourceFiles': len(result['files']), 'productExecuted': False}), flush=True)
      - name: Exercise hydrated cache command bootstrap on the actual host
