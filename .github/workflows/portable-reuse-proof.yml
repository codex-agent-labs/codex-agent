name: Portable frozen reuse qualification proof

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

jobs:
  phase9-runtime-mutation-preflight:
    if: >-
      (github.event.label.name == 'ci:phase9-runtime-mutation-preflight' ||
       github.event.label.name == 'ci:phase9-runtime-windows-preflight') &&
      github.repository == 'codex-agent-labs/codex-agent' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ github.event.label.name == 'ci:phase9-runtime-windows-preflight' &&
              fromJSON('[{"target":"windows-x64","role":"builder","runner":"windows-2025"}]') ||
              fromJSON('[{"target":"macos-x64","role":"builder","runner":"macos-26-intel"},
                         {"target":"linux-x64","role":"builder","runner":"ubuntu-24.04"},
                         {"target":"windows-x64","role":"builder","runner":"windows-2025"},
                         {"target":"linux-arm64","role":"cross-builder","runner":"ubuntu-24.04"},
                         {"target":"linux-arm64","role":"supervisor-builder","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: ${{ matrix.target == 'macos-x64' && '/Applications/Xcode_26.6.app/Contents/Developer' || '' }}
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
      - uses: ./.github/actions/setup-kmp
        with:
          product-worker: 'true'
          cache-read-only: 'true'
          xcode-fingerprint: ${{ runner.os == 'macOS' && 'auto' || 'none' }}
      - name: Observe actual missing-target tools; no product or release work
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_TARGET: ${{ matrix.target }}
          MUTATION_ROLE: ${{ matrix.role }}
        run: |
          mkdir -p build/phase9-runtime-lfs
          python3 -B ci/tests/phase9_runtime_mutation.py hosted "$MUTATION_TARGET" "$MUTATION_ROLE" \
            "$GITHUB_WORKSPACE/build/phase9-runtime-mutation" "$GITHUB_WORKSPACE/build/phase9-runtime-lfs"
      - name: Retain actual observations and original context even on profile mismatch
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-runtime-preflight-${{ matrix.target }}-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/phase9-runtime-mutation/*.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  phase9-ios-package-check:
    if: >-
      github.event.label.name == 'ci:phase9-ios-package-check' &&
      github.repository == 'codex-agent-labs/codex-agent' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify preserved local B/P with signed tooling; no product production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/phase9-ios-package-lfs"
          java_home=$(/usr/libexec/java_home -v 21)
          python3 -B ci/tests/phase9_ios_package_check.py \
            "$RUNNER_TEMP/phase9-ios-package-check" "$RUNNER_TEMP/phase9-ios-package-lfs" "$java_home/bin/java"
      - name: Preserve original observations and verifier result before bulk evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-ios-package-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/phase9-ios-package-check/*.json
            ${{ runner.temp }}/phase9-ios-package-check/apple-execution/input-binding.json
          if-no-files-found: warn
          overwrite: false
          retention-days: 90
      - name: Preserve actual Apple replay effects, including partial failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-ios-package-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase9-ios-package-check/apple-execution
          if-no-files-found: warn
          overwrite: false
          compression-level: 1
          retention-days: 90

  phase9-xcode-probe:
    if: >-
      (github.event.label.name == 'ci:phase9-xcode-probe' ||
       github.event.label.name == 'ci:phase9-xcode-provision') &&
      github.repository == 'codex-agent-labs/codex-agent' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Inspect the matching Apple-signed installation without building or exporting it
        if: github.event.label.name == 'ci:phase9-xcode-probe'
        run: python3 -B ci/tests/phase9_xcode_probe.py "$RUNNER_TEMP/phase9-xcode-probe"
      - name: Provision only the matching Apple-signed toolchain through private encrypted transport
        if: github.event.label.name == 'ci:phase9-xcode-provision'
        run: python3 -B ci/tests/phase9_xcode_probe.py "$RUNNER_TEMP/phase9-xcode-probe" --provision
      - name: Retain small original observations even when signature verification fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-xcode-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/phase9-xcode-probe/observations.json
            ${{ runner.temp }}/phase9-xcode-probe/provisioning.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Retain encrypted delivery only; the recipient private key stays on the local Mac
        if: success() && github.event.label.name == 'ci:phase9-xcode-provision'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-xcode-private-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase9-xcode-probe/xcode-26.6.dmg.cms
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  phase9-ios-mutation:
    if: >-
      github.event.label.name == 'ci:phase9-ios-mutation' &&
      github.repository == 'codex-agent-labs/codex-agent' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-kmp
        with:
          product-worker: 'true'
          cache-read-only: 'true'
          xcode-fingerprint: auto
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          toolchain: '1.95.0'
          components: rust-src
      - name: Reuse exact Contract and native originals; execute only the missing mutation binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/phase9-ios-lfs
          python3 -B ci/tests/phase9_ios_mutation.py hosted \
            "$GITHUB_WORKSPACE/build/phase9-ios-mutation" "$GITHUB_WORKSPACE/build/phase9-ios-lfs"
      - name: Preserve any genuine new binary before later diagnostic failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-ios-mutation-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/phase9-ios-mutation/source/build/product-stage/sdk/sdk-ios/binary
          if-no-files-found: warn
          overwrite: false
          compression-level: 0
          retention-days: 90
      - name: Preserve small original authority and real diagnostics, not duplicate native bodies
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-ios-mutation-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/phase9-ios-mutation/*.json
            build/phase9-ios-mutation/native/*.json
            build/phase9-ios-mutation/native/*/qualification.json
            build/phase9-ios-mutation/native/*/lane/lane-receipt.json
            build/phase9-ios-mutation/source/build/mutation-worker/**/*.json
            build/phase9-ios-mutation/source/build/mutation-worker/**/*.log
            build/phase9-ios-mutation/source/build/mutation-worker-dependency-seed/**/*.json
            build/phase9-ios-mutation/source/build/mutation-worker-dependency-seed/**/*.log
          if-no-files-found: warn
          overwrite: false
          retention-days: 90

  github-read-app-proof:
    if: >-
      github.event.label.name == 'ci:github-read-app-proof' &&
      github.repository == 'codex-agent-labs/codex-agent' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    environment: product-read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify real scoped App reads and renewal without product builds
        shell: bash
        env:
          READ_APP_ID: ${{ vars.PRODUCT_READ_APP_ID }}
          READ_INSTALLATION_ID: ${{ vars.PRODUCT_READ_INSTALLATION_ID }}
          READ_APP_PRIVATE_KEY: ${{ secrets.PRODUCT_READ_APP_PRIVATE_KEY }}
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, sys, time, urllib.request
          sys.path.insert(0, 'ci')
          import runtime_reference_transport as auth
          source = auth.subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['EXPECTED_SOURCE']
          auth.configure_read_app()
          url = 'https://api.github.com/repos/codex-agent-labs/codex-agent/actions/artifacts/12125719858'
          observations = []
          counters = {}
          scope = auth._MEASUREMENTS.set((counters,))
          started = time.perf_counter()
          try:
              for iteration in range(2):
                  token = auth.token_for(url, '')
                  for _ in range(1000):
                      assert auth.token_for(url, '') == token
                  request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      artifact = json.load(response)
                      assert artifact['id'] == 12125719858 and not artifact['expired']
                      quota = {name: int(response.headers['x-ratelimit-' + name]) for name in ('limit', 'remaining', 'used')}
                      assert quota['limit'] >= 5000
                      observations.append(quota)
                  if iteration == 0:
                      # Exercise the actual renewal branch without occupying a runner for an hour.
                      auth._cached = (auth._cached[0], token, time.time() + 299)
              assert counters['githubAppTokenRenewals'] == 2
          finally:
              auth._MEASUREMENTS.reset(scope)
          report = dict(runner=os.environ['RUNNER_OS'], runId=os.environ['GITHUB_RUN_ID'],
              source=source, workflowMerge=os.environ['GITHUB_SHA'], elapsedSeconds=time.perf_counter()-started,
              quota=observations, counters=counters, forcedExpiryBoundary=True,
              actualApiReads=2, productBuilds=0, artifactBodyDownloads=0)
          print(json.dumps(report, sort_keys=True))
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'github-read-app-proof'
          destination.mkdir()
          (destination / 'result.json').write_text(json.dumps(report, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-read-app-proof-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-read-app-proof/result.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  native-validation-diagnostics:
    if: >-
      (github.event.label.name == 'ci:native-validation-diagnostics' ||
       github.event.label.name == 'ci:dart-validation-diagnostics' ||
       github.event.label.name == 'ci:dart-lifecycle-diagnostics') &&
      github.repository == 'codex-agent-labs/codex-agent' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - uses: ./.github/actions/setup-msvc
      - name: Reproduce the exact MSVC consumer compilation
        if: github.event.label.name == 'ci:native-validation-diagnostics'
        id: cpp
        continue-on-error: true
        shell: pwsh
        run: python -B ci/tests/native_windows_diagnostic.py cpp "$env:RUNNER_TEMP/native-diagnostics/cpp"
      - name: Compile the private C-sharp fixture with strict Clang warnings
        if: github.event.label.name == 'ci:native-validation-diagnostics'
        id: csharp
        continue-on-error: true
        shell: pwsh
        run: python -B ci/tests/native_windows_diagnostic.py csharp "$env:RUNNER_TEMP/native-diagnostics/csharp"
      - id: dart-cache
        uses: ./.github/actions/provision-sdk-dart-cache
        with:
          revision: ${{ github.event.pull_request.head.sha }}
      - name: Resolve the already authenticated locked Dart cache offline
        shell: pwsh
        working-directory: codex-agent-bindings/dart
        env:
          PUB_CACHE: ${{ steps.dart-cache.outputs.pub-cache }}
        run: dart pub get --enforce-lockfile --offline
      - name: Exercise Windows root delegation, exact paths and tamper rejection
        if: github.event.label.name != 'ci:dart-lifecycle-diagnostics'
        id: dart-identity
        continue-on-error: true
        shell: pwsh
        env:
          PUB_CACHE: ${{ steps.dart-cache.outputs.pub-cache }}
        run: python -B ci/tests/native_windows_diagnostic.py dart-identity "$env:RUNNER_TEMP/native-diagnostics/dart-identity"
      - name: Exercise signed Windows native lifecycle fixtures
        id: dart-lifecycle
        continue-on-error: true
        shell: pwsh
        env:
          PUB_CACHE: ${{ steps.dart-cache.outputs.pub-cache }}
        run: python -B ci/tests/native_windows_diagnostic.py dart-lifecycle "$env:RUNNER_TEMP/native-diagnostics/dart-lifecycle"
      - name: Preserve diagnostic logs, not product receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-diagnostics
            ${{ steps.dart-cache.outputs.diagnostics }}
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Fail after collecting every diagnostic
        if: always()
        shell: python
        env:
          DIAGNOSTIC_STEPS: ${{ toJSON(steps) }}
          DIAGNOSTIC_LABEL: ${{ github.event.label.name }}
        run: |
          import json, os
          results = json.loads(os.environ['DIAGNOSTIC_STEPS'])
          required = ('cpp', 'csharp', 'dart-identity', 'dart-lifecycle')
          if os.environ['DIAGNOSTIC_LABEL'] == 'ci:dart-validation-diagnostics':
              required = ('dart-identity', 'dart-lifecycle')
          elif os.environ['DIAGNOSTIC_LABEL'] == 'ci:dart-lifecycle-diagnostics':
              required = ('dart-lifecycle',)
          assert all(results.get(name, {}).get('outcome') == 'success' for name in required), results

  windows-control-diagnostics:
    if: >-
      github.event.label.name == 'ci:windows-control-diagnostics' &&
      github.repository == 'codex-agent-labs/codex-agent' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.10'
      - uses: ./.github/actions/setup-msvc
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0, same as the Rust worker
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0, same as the C# worker
        if: runner.os == 'Windows'
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/codex-agent-dotnet-8.0.419
        with:
          dotnet-version: '8.0.419'
      - id: csharp-loader-security
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: python -B ci/tests/native_windows_diagnostic.py csharp-loader-security "$env:RUNNER_TEMP/windows-controls/csharp-loader-security"
      - id: cpp-leaf-preprocessor
        continue-on-error: true
        shell: pwsh
        run: python -B ci/tests/native_windows_diagnostic.py cpp-leaf-preprocessor "$env:RUNNER_TEMP/windows-controls/cpp-leaf-preprocessor"
      - id: rust-fixture-compiler
        continue-on-error: true
        shell: pwsh
        run: python -B ci/tests/native_windows_diagnostic.py rust-fixture-compiler "$env:RUNNER_TEMP/windows-controls/rust-fixture-compiler"
      - name: Preserve all raw diagnostic outcomes before failing
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-control-diagnostics-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-controls
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Require complete diagnostic collection, not product acceptance
        if: always()
        shell: python
        env:
          DIAGNOSTIC_STEPS: ${{ toJSON(steps) }}
        run: |
          import json, os
          results = json.loads(os.environ['DIAGNOSTIC_STEPS'])
          required = ('csharp-loader-security', 'cpp-leaf-preprocessor', 'rust-fixture-compiler')
          assert all(results.get(name, {}).get('outcome') == 'success' for name in required), results

  core-validation-diagnostics:
    if: >-
      github.event.label.name == 'ci:core-validation-diagnostics' &&
      github.repository == 'codex-agent-labs/codex-agent' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check exact checkout and portable archive publication
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess, sys, urllib.parse, urllib.request
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          print(json.dumps({'diagnosticOnly': True, 'source': source, 'productExecuted': False,
              'autocrlf': subprocess.run(['git', 'config', '--get', 'core.autocrlf'], capture_output=True, text=True).stdout.strip()}), flush=True)
          sys.path.insert(0, str(pathlib.Path.cwd() / 'ci'))
          from reuse_qualification import read_blobs
          changed = []
          selected = []
          listing = subprocess.check_output(['git', 'ls-tree', '-rz', 'HEAD', '--', 'ci', '.github'])
          for row in listing.split(b'\0'):
              if not row:
                  continue
              header, name = row.split(b'\t', 1)
              path = pathlib.Path(name.decode())
              if path.suffix not in {'.py', '.json', '.yml', '.yaml', '.sh', '.js', '.mjs'} or 'tests' in path.parts:
                  continue
              selected.append((path, header.split()[2].decode()))
          blobs = read_blobs(pathlib.Path.cwd(), (oid for _, oid in selected),
              max_bytes=16 * 1024**2, total_bytes=64 * 1024**2)
          for path, oid in selected:
              expected = blobs[oid]
              actual = path.read_bytes()
              if expected != actual:
                  changed.append({'path': path.as_posix(), 'expectedSha256': hashlib.sha256(expected).hexdigest(),
                      'actualSha256': hashlib.sha256(actual).hexdigest(), 'crlfOnly': actual.replace(b'\r\n', b'\n') == expected})
          print(json.dumps({'changedControlCount': len(changed), 'changedControls': changed}), flush=True)
          import sdk_core_native_archive_provision as provider
          class ObservedRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  value = urllib.parse.urlsplit(new_url)
                  print(json.dumps({'redirectCode': code, 'scheme': value.scheme, 'host': value.hostname, 'port': value.port}), flush=True)
                  provider._github_https(new_url)
                  return super().redirect_request(request, response, code, message, headers, new_url)
          url = provider._RELEASE_ROOT + '/v2.3.10/kotlin-native-prebuilt-2.3.10-macos-aarch64.tar.gz'
          with urllib.request.build_opener(ObservedRedirect()).open(urllib.request.Request(url), timeout=30) as response:
              print(json.dumps({'status': response.status, 'finalHost': urllib.parse.urlsplit(response.geturl()).hostname,
                  'declaredBytes': response.headers.get('Content-Length'), 'archiveBodyBytesRead': 0}), flush=True)
              provider._github_https(response.geturl())
          subprocess.run([sys.executable, '-B', '-m', 'unittest',
              'ci.tests.test_sdk_android_archive_provision',
              'ci.tests.test_sdk_core_native_archive_provision',
              'ci.tests.test_product_sdk_maven.SdkMavenPackagingTest.test_every_component_packages_its_exact_carrier_set'], check=True)
          import tempfile
          from products.sdk_facade_source import capture_facade_validation_sources
          from products.restore import _stage_fingerprint
          with tempfile.TemporaryDirectory(prefix='core-source-host-check-') as temporary:
              captured = pathlib.Path(temporary).resolve() / 'source'
              result = capture_facade_validation_sources(pathlib.Path.cwd(), source, captured)
              assert result['tree'] == subprocess.check_output(['git', 'rev-parse', source + '^{tree}'], text=True).strip()
              fingerprint = _stage_fingerprint(captured)
              assert fingerprint == _stage_fingerprint(captured)
              print(json.dumps({'exactGitSourceCapture': 'pass', 'heldStageFingerprint': 'pass',
                  'sourceFiles': len(result['files']), 'productExecuted': False}), flush=True)
      - name: Exercise hydrated cache command bootstrap on the actual host
        uses: ./.github/actions/hydrated-evidence-cache
        with:
          mode: execute
          script: |
            node --input-type=module - <<'JS'
            import assert from 'node:assert/strict';
            import {isAbsolute} from 'node:path';
            import {pathToFileURL} from 'node:url';
            assert.ok(isAbsolute(process.env.CODEX_AGENT_HYDRATED_EVIDENCE));
            const toolkit = await import(pathToFileURL(process.env.CODEX_AGENT_HOSTED_CACHE_BACKEND));
            assert.equal(typeof toolkit.main, 'function');
            console.log('Actual host npm bootstrap, bash child and pinned cache toolkit import passed');
            JS
      - if: runner.os == 'Linux'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - name: Observe caller API access and rate-limit headers
        if: always()
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import json, os, pathlib, sys, urllib.error, urllib.request
          sys.path.insert(0, str(pathlib.Path.cwd() / 'ci'))
          from reuse import OriginBoundRedirectHandler
          from runtime_reference_transport import report_api_error
          opener = urllib.request.build_opener(OriginBoundRedirectHandler())
          for endpoint in ('rate_limit', 'repos/codex-agent-labs/codex-agent/actions/runs/38645987435/attempts/1'):
              request = urllib.request.Request('https://api.github.com/' + endpoint,
                  headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with opener.open(request, timeout=30) as response:
                      headers = {name: response.headers.get(name) for name in (
                          'x-ratelimit-limit', 'x-ratelimit-remaining', 'x-ratelimit-used', 'x-ratelimit-reset')}
                      print(json.dumps({'endpoint': endpoint, 'status': response.status, 'rateLimit': headers}), flush=True)
              except urllib.error.HTTPError as error:
                  report_api_error(error)
                  raise
  recovery-diagnostics:
    if: >-
      github.event.label.name == 'ci:reuse-recovery-diagnostics' &&
      github.repository == 'codex-agent-labs/codex-agent' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 32da1aafe48c1e41576ca91f4bd7c7349c2e63c3
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: codex-agent-labs/codex-agent/.github/actions/restore-reuse-qualification@320d594e358c84d511b59db3eb5a60b7c604a352
        with:
          authority-read-token: ${{ secrets.REUSE_AUTHORITY_READ_TOKEN }}
      - name: Retrieve the exact original plan for authenticated capture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 11501403340
          github-token: ${{ github.token }}
          run-id: 37662871186
          path: build/recovery-original-plan
          merge-multiple: true
      - name: Select installed caller Java for tooling verification
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - id: diagnostic-tooling
        uses: ./.github/actions/capture-sdk-tooling
        with:
          artifact-id: 11372310363
          artifact-sha256: sha256:32639b8d7e56ab9891f71a163e3d4b29aadee3d4308c50f1b22ef900f1672829
          transport-producer: '{"commit":"7ad4880c2fef5d4bc021cf8c9beb283f5885efa7","tree":"ecbc35685fd083765eca88528f95f753adb8fe36","event":"pull_request","repository":"codex-agent-labs/codex-agent","pullRequest":31,"runId":37374073958,"runAttempt":1,"workflowPath":".github/workflows/ci.yml"}'
          trusted-workflow-sha: 00feb2e6ffc0e633042ac4cebfb6495718fb82f7
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / tooling-attestation
          policy-revision: 32da1aafe48c1e41576ca91f4bd7c7349c2e63c3
      - id: diagnostic-apple-policy
        uses: ./.github/actions/prepare-sdk-apple-policy
        with:
          plan-path: ${{ github.workspace }}/build/recovery-original-plan/impact-plan.json
          tooling-policy: ${{ steps.diagnostic-tooling.outputs.tooling-policy }}
      - name: Replay the complete original resume without product execution
        uses: ./.github/actions/hydrated-evidence-cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDK_VALIDATION_TOOLING: ${{ steps.diagnostic-tooling.outputs.tooling-policy }}
          SDK_APPLE_VALIDATION_POLICY: ${{ steps.diagnostic-apple-policy.outputs.apple-policy }}
        with:
          mode: execute
          script: |
            python3 -u - <<'PY'
            import json, os, subprocess, sys, time
            from pathlib import Path
            sys.path.insert(0, str(Path.cwd() / 'ci'))
            import product_reuse as products
            import reuse_qualification
            from products.inventory import load_canonical_json_bytes, write_canonical_json
            from products.restore import verification_session
            from products.verified_evidence import _source_identity
            root = Path(os.environ['RUNNER_TEMP']) / 'recovery-diagnostics'
            root.mkdir(exist_ok=False)
            report = {'diagnosticOnly': True, 'productExecuted': False,
                      'executionRun': int(os.environ['GITHUB_RUN_ID']),
                      'executionAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
                      'executionSource': os.environ['GITHUB_SHA'],
                      'verificationSource': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                      'replayContext': 'original successful inputs and original consumer; diagnostic execution is separate',
                      'originalConsumer': {'repository': 'codex-agent-labs/codex-agent',
                          'workflowPath': '.github/workflows/ci.yml',
                          'commit': '32da1aafe48c1e41576ca91f4bd7c7349c2e63c3',
                          'tree': '0689ecd71853a215ff430a7f75f40345adc25d7c',
                          'event': 'pull_request', 'runId': 37662871186,
                          'runAttempt': 1, 'pullRequest': 31},
                      'stages': []}
            try:
                assert report['verificationSource'] == '32da1aafe48c1e41576ca91f4bd7c7349c2e63c3'
                workspace = Path.cwd()
                # Explicit historical replay context; never a claim about this diagnostic's producer.
                original_environment = {**os.environ, 'GITHUB_RUN_ID': '37662871186', 'GITHUB_RUN_ATTEMPT': '1'}
                plan_path = workspace / 'build/recovery-original-plan/impact-plan.json'
                plan = products._validate_plan(plan_path, workspace)
                assert products._consumer(plan, original_environment)['producer'] == report['originalConsumer']
                token = os.environ['GITHUB_TOKEN']
                pin = '320d594e358c84d511b59db3eb5a60b7c604a352'
                uploads = {
                    'plan': {'artifactId': 11501403340,
                        'artifactSha256': 'sha256:f3f7f05b8697912cdf3cfe0a6da1f1f5a2bb62fa015cae9ea93fef68147202ed'},
                    'state': {'artifactId': 11501493625,
                        'artifactSha256': 'sha256:ec0fb829e82403384af6a8714c253b5f19b93e395d1458e5c1b1ad76ac1a7235'},
                    'release': {'artifactId': 11501878831,
                        'artifactSha256': 'sha256:db0b248ef1572997f8f38d05181d5a4772b31e97492c08ffb62c1db8a2c8146a'},
                }
                inputs = workspace / 'build/recovery-diagnostic-inputs'
                state = workspace / 'build/recovery-diagnostic-state'
                policy = _source_identity(portable=True)
                assert reuse_qualification._compatible_verifier(report['verificationSource']) == policy
                report['verifierPolicyBefore'] = policy
                with verification_session():
                    transport = products.capture_product_resume_inputs(plan_path, inputs, uploads=uploads,
                        trusted_workflow_sha=pin, repository_root=workspace, environ=original_environment, token=token,
                        trusted_contract_workflow_path='.github/workflows/contract-validation.yml',
                        trusted_contract_continuation_job='product-validation / contract-validation / contract-continuation')
                    report['authenticatedInputUploads'] = {name: {'id': artifact['id'], 'digest': artifact['digest']}
                        for name, artifact in transport['artifacts'].items()}
                command = [sys.executable, '-u', 'ci/product_reuse.py', 'resume-products', '--runtime-matrix',
                    '--plan', str(inputs / 'plan/impact-plan.json'),
                    '--discovery-root', str(inputs / 'plan/product-reuse'), '--state-root', str(inputs / 'state'),
                    '--contract-handoff', str(inputs / 'release/contract-input'), '--destination', str(state),
                    '--sdk-original-workflow-sha', pin, '--github-output', str(root / 'outputs'),
                    '--sdk-validation-tooling', os.environ['SDK_VALIDATION_TOOLING'],
                    '--sdk-apple-validation-policy', os.environ['SDK_APPLE_VALIDATION_POLICY']]
                stage = {'stage': 'original-cli', 'startedNs': time.time_ns()}
                report['stages'].append(stage)
                write_canonical_json(root / 'report.json', report)
                completed = subprocess.run(command, cwd=workspace, env=original_environment, check=False)
                stage.update(completedNs=time.time_ns(), returnCode=completed.returncode)
                if (state / 'reuse-wave-result.json').exists():
                    result = load_canonical_json_bytes((state / 'reuse-wave-result.json').read_bytes())
                    report['replayedPhases'] = [{name: phase[name] for name in ('product', 'component', 'phase',
                        'target', 'state', 'buildKey', 'receiptSha256', 'objectSha256')} for phase in result['phases']]
                if (root / 'outputs').exists():
                    report['cliOutputs'] = (root / 'outputs').read_text()
                assert reuse_qualification._compatible_verifier(report['verificationSource']) == policy
                report['verifierPolicyAfter'] = _source_identity(portable=True)
                assert report['verifierPolicyAfter'] == policy
                completed.check_returncode()
                report['result'] = 'diagnostic-complete'
            except Exception as error:
                report['result'] = 'diagnostic-failure'
                report['error'] = type(error).__name__ + ': ' + str(error)
                raise
            finally:
                write_canonical_json(root / 'report.json', report)
                print(json.dumps({key: report[key] for key in ('diagnosticOnly', 'productExecuted',
                    'executionRun', 'verificationSource', 'result')}, sort_keys=True), flush=True)
            PY
      - name: Preserve diagnostic observations, never product acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reuse-recovery-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/recovery-diagnostics/report.json
            ${{ runner.temp }}/recovery-diagnostics/outputs
            build/recovery-diagnostic-state/reuse-wave-request.json
            build/recovery-diagnostic-state/reuse-wave-result.json
            build/recovery-diagnostic-state/producer.json
            build/recovery-diagnostic-state/phase-plans/*.json
          if-no-files-found: warn
          overwrite: false
          retention-days: 90

