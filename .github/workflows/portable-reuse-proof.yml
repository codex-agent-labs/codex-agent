            import {pathToFileURL} from 'node:url';
            assert.ok(isAbsolute(process.env.CODEX_AGENT_HYDRATED_EVIDENCE));
            const toolkit = await import(pathToFileURL(process.env.CODEX_AGENT_HOSTED_CACHE_BACKEND));
