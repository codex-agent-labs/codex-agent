      SDK_TREE: 154946541b10f9e1f2d172e4c626d0ff7cb8769f
      SDK_CARRIER: ${{ github.workspace }}/build/phase9-sdk-host-validation
      DEVELOPER_DIR: ${{ matrix.target == 'macos-x64' && '/Applications/Xcode_26.6.app/Contents/Developer' || '' }}
