name: Portable frozen reuse qualification proof

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

jobs:
  storage-diagnostics:
    if: >-
      github.event.label.name == 'ci:storage-diagnostics' &&
      github.repository == 'codex-agent-labs/codex-agent' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: macos-arm64
            runner: macos-26
          - profile: macos-x64
            runner: macos-26-intel
          - profile: linux-arm64
            runner: ubuntu-24.04-arm
          - profile: linux-x64
            runner: ubuntu-24.04
          - profile: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - id: storage
        name: Observe actual staging filesystems and isolated copy behavior
        continue-on-error: true
        shell: python
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
          STORAGE_PROFILE: ${{ matrix.profile }}
        run: |
          import contextlib, json, os, pathlib, platform, subprocess, sys, tempfile, time, unittest
          root = pathlib.Path.cwd().resolve()
          sys.path.insert(0, str(root))
          output = pathlib.Path(os.environ['RUNNER_TEMP']).resolve() / 'storage-diagnostics'
          output.mkdir(mode=0o700, exist_ok=False)
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['EXPECTED_SOURCE']
          assert not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'])
          report = {'diagnosticOnly': True, 'productExecuted': False, 'source': source,
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'workflowRef': os.environ['GITHUB_WORKFLOW_REF'], 'workflowSha': os.environ['GITHUB_WORKFLOW_SHA'],
              'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'job': os.environ['GITHUB_JOB'], 'profile': os.environ['STORAGE_PROFILE'],
              'python': sys.version, 'executable': sys.executable, 'platform': platform.platform(),
              'machine': platform.machine(), 'runnerTemp': os.environ['RUNNER_TEMP'], 'volumes': [],
              'limits': 'Tiny local fixtures on observed hosted volumes; skips are not native-clone proof. '
                        'No product admission, original-body reuse, physical extents or hosted throughput claim.'}
          selectors = {
              'darwin': [
                  'ApplePrivateSnapshotTest.test_native_snapshot_has_independent_files_and_preserves_bytes_modes_empty_directories',
                  'ApplePrivateSnapshotTest.test_partial_clone_falls_back_only_for_supported_filesystem_errors',
                  'ApplePrivateSnapshotTest.test_single_file_clone_and_fallback_preserve_original_and_exclusive_destination'],
              'linux': [
                  'LinuxPrivateSnapshotTest.test_real_linux_reflink_is_independent_when_filesystem_supports_it',
                  'LinuxPrivateSnapshotTest.test_unsupported_ioctl_removes_only_created_leaf_then_uses_existing_fallback'],
              'win32': ['WindowsPrivateSnapshotTest.test_ordinary_copy_preserves_bytes_and_independent_writes']}
          tests = ['ci.tests.test_sdk_apple_content.' + name for name in selectors[sys.platform]]
          workspace_staging = root / 'build'
          workspace_staging.mkdir(exist_ok=True)
          parents = [('default-temp', pathlib.Path(tempfile.gettempdir()).resolve()),
                     ('workspace-staging', workspace_staging)]
          successful = True
          try:
              for label, parent in parents:
                  scratch = pathlib.Path(tempfile.mkdtemp(prefix='codex-storage-probe-', dir=parent))
                  value = scratch.stat()
                  observation = {'scope': label, 'parent': str(parent), 'scratch': str(scratch),
                      'device': value.st_dev, 'inode': value.st_ino, 'mode': value.st_mode,
                      'tests': tests, 'filesystemCommands': []}
                  report['volumes'].append(observation)
                  commands = {
                      'darwin': [['/bin/df', '-P', str(scratch)]],
                      'linux': [['findmnt', '--json', '--target', str(scratch), '--output', 'TARGET,SOURCE,FSTYPE,OPTIONS']],
                      'win32': [['powershell', '-NoProfile', '-NonInteractive', '-Command',
                          '$ErrorActionPreference="Stop"; Get-Volume -FilePath $env:STORAGE_PROBE | '
                          'Select-Object DriveLetter,FileSystemType,Path,UniqueId,HealthStatus | ConvertTo-Json -Depth 4']]}
                  for index, command in enumerate(commands[sys.platform]):
                      completed = subprocess.run(command, capture_output=True, timeout=30,
                          env={**os.environ, 'STORAGE_PROBE': str(scratch)})
                      prefix = output / (label + '-filesystem-' + str(index))
                      prefix.with_suffix('.stdout').write_bytes(completed.stdout)
                      prefix.with_suffix('.stderr').write_bytes(completed.stderr)
                      observation['filesystemCommands'].append({'args': command, 'returncode': completed.returncode})
                      successful = successful and completed.returncode == 0 and bool(completed.stdout.strip())
                      if sys.platform == 'darwin' and index == 0:
                          rows = completed.stdout.decode().splitlines()
                          assert completed.returncode == 0 and len(rows) == 2
                          device = rows[1].split()[0]
                          assert device.startswith('/dev/') and pathlib.Path(device).stat().st_rdev == value.st_dev
                          commands['darwin'].append(['/usr/sbin/diskutil', 'info', '-plist', device])
                  saved_tempdir = tempfile.tempdir
                  try:
                      tempfile.tempdir = str(scratch)
                      with (output / (label + '-tests.log')).open('x', encoding='utf-8') as log:
                          with contextlib.redirect_stdout(log), contextlib.redirect_stderr(log):
                              suite = unittest.defaultTestLoader.loadTestsFromNames(tests)
                              started = time.monotonic_ns()
                              result = unittest.TextTestRunner(stream=log, verbosity=2).run(suite)
                              elapsed = time.monotonic_ns() - started
                      observation.update({'elapsedNs': elapsed, 'testsRun': result.testsRun,
                          'successful': result.wasSuccessful(),
                          'skipped': [{'test': test.id(), 'reason': reason} for test, reason in result.skipped],
                          'failures': [test.id() for test, _ in result.failures],
                          'errors': [test.id() for test, _ in result.errors]})
                      successful = successful and result.wasSuccessful() and result.testsRun == len(tests)
                  finally:
                      tempfile.tempdir = saved_tempdir
          finally:
              with (output / 'observations.json').open('x', encoding='utf-8') as stream:
                  json.dump(report, stream, sort_keys=True, indent=2)
                  stream.write('\n')
          assert successful, 'Storage diagnostics failed; inspect preserved raw observations and test outcomes'
      - name: Preserve filesystem observations and all test outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storage-diagnostics-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storage-diagnostics
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Require diagnostic collection without claiming product acceptance
        if: always()
        shell: python
        env:
          STORAGE_OUTCOME: ${{ steps.storage.outcome }}
        run: |
          import os
          assert os.environ['STORAGE_OUTCOME'] == 'success'

  phase9-native-artifact-validation:
    if: >-
      github.event.label.name == 'ci:phase9-native-artifact-validation' &&
      github.repository == 'codex-agent-labs/codex-agent' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: macos-26-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate only the preserved Mac x64 package on genuine Intel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAVA_HOME=$(/usr/libexec/java_home -v 17)
          export JAVA_HOME
          export PATH="$JAVA_HOME/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/phase9-native-lfs"
          python3 -B ci/tests/phase9_native_validation.py \
            "$RUNNER_TEMP/phase9-native-validation" "$RUNNER_TEMP/phase9-native-lfs"
      - name: Preserve validation evidence and raw diagnostics, never duplicate input bodies
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-native-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/phase9-native-validation/*.json
            ${{ runner.temp }}/phase9-native-validation/*.log
            ${{ runner.temp }}/phase9-native-validation/reports
            ${{ runner.temp }}/phase9-native-validation/raw
            ${{ runner.temp }}/phase9-native-validation/stage
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  phase9-native-windows-artifact-validation:
    if: >-
      github.event.label.name == 'ci:phase9-native-windows-artifact-validation' &&
      github.repository == 'codex-agent-labs/codex-agent' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-msvc
      - uses: ./.github/actions/setup-kmp
        with:
          product-worker: 'true'
          cache-read-only: 'true'
          xcode-fingerprint: 'none'
      - name: Validate only the preserved Windows package on genuine Windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/phase9-native-lfs
          python3 -B ci/tests/phase9_native_validation.py --windows \
            "$GITHUB_WORKSPACE/build/phase9-native-windows-validation" "$GITHUB_WORKSPACE/build/phase9-native-lfs"
      - name: Preserve original Windows validation evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-native-windows-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/phase9-native-windows-validation/*.json
            build/phase9-native-windows-validation/*.log
            build/phase9-native-windows-validation/reports
            build/phase9-native-windows-validation/raw
            build/phase9-native-windows-validation/stage
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  phase9-adapter-artifact-validation:
    name: Phase9 adapter collection (${{ matrix.target }})
    if: >-
      github.event.label.name == 'ci:phase9-adapter-artifact-validation' &&
      github.repository == 'codex-agent-labs/codex-agent' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x64
            runner: macos-26-intel
          - target: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      ADAPTER_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Provision only the checksum-pinned Gradle launcher
        shell: bash
        run: ./gradlew --version
      - id: prepare
        name: Authenticate one shared consumed-input set for this host
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B ci/tests/phase9_adapter_validation.py --prepare --target "$ADAPTER_TARGET"             "$RUNNER_TEMP/phase9-adapter-$ADAPTER_TARGET" "$RUNNER_TEMP/phase9-adapter-lfs"
      - id: jvm
        name: Execute only missing jvm validation
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          python3 -B ci/tests/phase9_adapter_validation.py --component jvm --target "$ADAPTER_TARGET" \
            "$RUNNER_TEMP/phase9-adapter-$ADAPTER_TARGET"
      - name: Preserve jvm outputs before the next component
        if: ${{ !cancelled() && steps.jvm.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-adapter-${{ matrix.target }}-jvm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/phase9-adapter-${{ matrix.target }}/jvm/*.json
            ${{ runner.temp }}/phase9-adapter-${{ matrix.target }}/jvm/*.log
            ${{ runner.temp }}/phase9-adapter-${{ matrix.target }}/jvm/reports
            ${{ runner.temp }}/phase9-adapter-${{ matrix.target }}/jvm/stage
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - id: node_js
        name: Execute only missing node-js validation
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          python3 -B ci/tests/phase9_adapter_validation.py --component node-js --target "$ADAPTER_TARGET" \
            "$RUNNER_TEMP/phase9-adapter-$ADAPTER_TARGET"
      - name: Preserve node-js outputs before the next component
        if: ${{ !cancelled() && steps.node_js.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-adapter-${{ matrix.target }}-node-js-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/phase9-adapter-${{ matrix.target }}/node-js/*.json
            ${{ runner.temp }}/phase9-adapter-${{ matrix.target }}/node-js/*.log
            ${{ runner.temp }}/phase9-adapter-${{ matrix.target }}/node-js/reports
            ${{ runner.temp }}/phase9-adapter-${{ matrix.target }}/node-js/stage
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - id: node_wasm
        name: Execute only missing node-wasm validation
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          python3 -B ci/tests/phase9_adapter_validation.py --component node-wasm --target "$ADAPTER_TARGET" \
            "$RUNNER_TEMP/phase9-adapter-$ADAPTER_TARGET"
      - name: Preserve node-wasm outputs before the next component
        if: ${{ !cancelled() && steps.node_wasm.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-adapter-${{ matrix.target }}-node-wasm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/phase9-adapter-${{ matrix.target }}/node-wasm/*.json
            ${{ runner.temp }}/phase9-adapter-${{ matrix.target }}/node-wasm/*.log
            ${{ runner.temp }}/phase9-adapter-${{ matrix.target }}/node-wasm/reports
            ${{ runner.temp }}/phase9-adapter-${{ matrix.target }}/node-wasm/stage
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Record collection outcomes independently from phase acceptance
        if: always()
        shell: python
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          JVM_OUTCOME: ${{ steps.jvm.outcome }}
          JS_OUTCOME: ${{ steps.node_js.outcome }}
          WASM_OUTCOME: ${{ steps.node_wasm.outcome }}
        run: |
          import json, os, pathlib
          target = os.environ['ADAPTER_TARGET']
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / ('phase9-adapter-' + target)
          root.mkdir(exist_ok=True)
          status = {'schemaVersion': 1, 'target': target, 'prepare': os.environ['PREPARE_OUTCOME'],
              'components': {'jvm': os.environ['JVM_OUTCOME'], 'node-js': os.environ['JS_OUTCOME'],
                             'node-wasm': os.environ['WASM_OUTCOME']},
              'phaseAdmission': False, 'releaseAdmission': False}
          with (root / (target + '-status.json')).open('x', encoding='utf-8') as stream:
              json.dump(status, stream, sort_keys=True)
              stream.write('\n')
      - name: Preserve shared intake diagnostics without duplicating product bodies
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-adapter-controls-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/phase9-adapter-${{ matrix.target }}/*.json
            ${{ runner.temp }}/phase9-adapter-${{ matrix.target }}/*.log
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Forward only the collection status to the final gate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-adapter-status-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase9-adapter-${{ matrix.target }}/${{ matrix.target }}-status.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  phase9-adapter-execution-gate:
    needs: phase9-adapter-artifact-validation
    if: >-
      always() && github.event.label.name == 'ci:phase9-adapter-artifact-validation' &&
      github.repository == 'codex-agent-labs/codex-agent' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Receive only the two small collection statuses
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: phase9-adapter-status-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: statuses
          merge-multiple: true
      - name: Fail after collection if any missing execution did not succeed
        shell: python
        env:
          COLLECTION_RESULT: ${{ needs.phase9-adapter-artifact-validation.result }}
        run: |
          import json, os, pathlib
          assert os.environ['COLLECTION_RESULT'] == 'success', 'One collection job failed'
          root = pathlib.Path('statuses')
          targets = {'macos-x64', 'windows-x64'}
          assert {p.name for p in root.iterdir()} == {t + '-status.json' for t in targets}
          for target in sorted(targets):
              value = json.loads((root / (target + '-status.json')).read_bytes())
              assert value == {'schemaVersion': 1, 'target': target, 'prepare': 'success',
                  'components': {'jvm': 'success', 'node-js': 'success', 'node-wasm': 'success'},
                  'phaseAdmission': False, 'releaseAdmission': False}, value
          print('Six adapter executions collected; independent artifact admission remains required.')

  phase9-runtime-mutation-preflight:
    if: >-
      (github.event.label.name == 'ci:phase9-runtime-mutation-preflight' ||
       github.event.label.name == 'ci:phase9-runtime-windows-preflight') &&
      github.repository == 'codex-agent-labs/codex-agent' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ github.event.label.name == 'ci:phase9-runtime-windows-preflight' &&
              fromJSON('[{"target":"windows-x64","role":"builder","runner":"windows-2025"}]') ||
              fromJSON('[{"target":"macos-x64","role":"builder","runner":"macos-26-intel"},
                         {"target":"linux-x64","role":"builder","runner":"ubuntu-24.04"},
                         {"target":"windows-x64","role":"builder","runner":"windows-2025"},
                         {"target":"linux-arm64","role":"cross-builder","runner":"ubuntu-24.04"},
                         {"target":"linux-arm64","role":"supervisor-builder","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: ${{ matrix.target == 'macos-x64' && '/Applications/Xcode_26.6.app/Contents/Developer' || '' }}
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
      - uses: ./.github/actions/setup-kmp
        with:
          product-worker: 'true'
          cache-read-only: 'true'
          xcode-fingerprint: ${{ runner.os == 'macOS' && 'auto' || 'none' }}
      - name: Observe actual missing-target tools; no product or release work
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_TARGET: ${{ matrix.target }}
          MUTATION_ROLE: ${{ matrix.role }}
        run: |
          mkdir -p build/phase9-runtime-lfs
          python3 -B ci/tests/phase9_runtime_mutation.py hosted "$MUTATION_TARGET" "$MUTATION_ROLE" \
            "$GITHUB_WORKSPACE/build/phase9-runtime-mutation" "$GITHUB_WORKSPACE/build/phase9-runtime-lfs"
      - name: Retain actual observations and original context even on profile mismatch
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-runtime-preflight-${{ matrix.target }}-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/phase9-runtime-mutation/*.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  phase9-runtime-windows-binary:
    if: >-
      github.event.label.name == 'ci:phase9-runtime-windows-binary' &&
      github.repository == 'codex-agent-labs/codex-agent' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: windows-2025
    timeout-minutes: 120
    env:
