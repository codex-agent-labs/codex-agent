          artifact-sha256: sha256:32639b8d7e56ab9891f71a163e3d4b29aadee3d4308c50f1b22ef900f1672829
          transport-producer: '{"commit":"7ad4880c2fef5d4bc021cf8c9beb283f5885efa7","tree":"ecbc35685fd083765eca88528f95f753adb8fe36","event":"pull_request","repository":"codex-agent-labs/codex-agent","pullRequest":31,"runId":37374073958,"runAttempt":1,"workflowPath":".github/workflows/ci.yml"}'
          trusted-workflow-sha: 00feb2e6ffc0e633042ac4cebfb6495718fb82f7
          trusted-workflow-path: .github/workflows/contract-validation.yml
