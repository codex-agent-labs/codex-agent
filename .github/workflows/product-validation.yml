      sdk_workers_required: ${{ steps.capture.outputs.sdk-workers-required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - name: Select installed caller Java
        if: needs.plan.outputs.tooling_required == 'true'
        run: |
          set -euo pipefail
          java_home_variable="JAVA_HOME_17_${RUNNER_ARCH}"
          selected_java_home="${!java_home_variable}"
          test -f "$selected_java_home/bin/java"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          artifact-id: ${{ needs.sdk-plan.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.sdk-plan.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.sdk-plan.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
          plan-id: ${{ needs.plan.outputs.plan_id }}
      - id: capture
        uses: ./.github/actions/capture-runtime-state
        with:
          product: sdk
          sdk-family: android-package
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.sdk-android-binary-result.outputs.artifact_id }}
          artifact-sha256: ${{ needs.sdk-android-binary-result.outputs.artifact_digest }}
          state-wave: ${{ needs.sdk-android-binary-result.outputs.state_wave }}
          sdk-state-wave: ${{ needs.sdk-android-binary-result.outputs.sdk_state_wave }}
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}

  sdk-android-package-result:
    needs: [plan, sdk-plan, sdk-inputs, sdk-core-validation-wave, sdk-core-metadata-wave, sdk-android-binary-result, sdk-android-package-plan]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.sdk-plan.result == 'success' && needs.sdk-inputs.result == 'success' &&
      needs.sdk-core-validation-wave.result == 'success' &&
      needs.sdk-core-metadata-wave.result == 'success' &&
      needs.sdk-android-binary-result.result == 'success' &&
      needs.sdk-android-package-plan.result == 'success'
    uses: ./.github/workflows/sdk-android-package-validation.yml
    with:
      planOutputs: ${{ toJSON(needs.plan.outputs) }}
      sdkPlan: ${{ toJSON(needs.sdk-plan) }}
      sdkInputs: ${{ toJSON(needs.sdk-inputs) }}
      validationWave: ${{ toJSON(needs.sdk-core-validation-wave) }}
      metadataWave: ${{ toJSON(needs.sdk-core-metadata-wave) }}
      binaryWave: ${{ toJSON(needs.sdk-android-binary-result) }}
      packagePlan: ${{ toJSON(needs.sdk-android-package-plan) }}
      trustedWorkflowSha: ${{ inputs.trustedWorkflowSha }}

  sdk-completion:
    needs: [plan, contract-validation, product-resume, runtime-continuation, runtime-aggregate-continuation, sdk-ios-binary-plan, sdk-ios-binary, sdk-collect-3, sdk-plan, sdk-native-result, sdk-ios-validation-result, sdk-ios-metadata-result, sdk-core-binary-wave, sdk-core-package-wave, sdk-core-validation-wave, sdk-core-metadata-wave, sdk-android-binary-result, sdk-android-package-result]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.product-resume.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      complete: ${{ steps.completion.outputs.complete }}
      phase_count: ${{ steps.completion.outputs.phaseCount }}
      full_reuse: ${{ steps.completion.outputs.fullReuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - id: parent
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from ci.sdk_completion_state import select_sdk_completion_state
          from ci.reuse import github_output
          state = select_sdk_completion_state(json.loads(os.environ['RESULTS']))
          github_output(Path(os.environ['GITHUB_OUTPUT']), state)
          PY
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        run: |
          set -euo pipefail
          java_home_variable="JAVA_HOME_17_${RUNNER_ARCH}"
          selected_java_home="${!java_home_variable}"
          test -f "$selected_java_home/bin/java"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          artifact-id: ${{ needs.contract-validation.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.contract-validation.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.contract-validation.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.plan.outputs.tooling_required == 'true'
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_id }}
          path: ${{ runner.temp }}/sdk-apple-plan
          merge-multiple: true
      - id: apple-policy
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/prepare-sdk-apple-policy
        with:
          plan-path: ${{ runner.temp }}/sdk-apple-plan/impact-plan.json
          tooling-policy: ${{ steps.tooling.outputs.tooling-policy }}
      - id: capture
        uses: ./.github/actions/capture-runtime-state
        with:
          product: sdk
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ steps.parent.outputs.artifact_id }}
          artifact-sha256: ${{ steps.parent.outputs.artifact_digest }}
          state-wave: ${{ steps.parent.outputs.state_wave }}
          sdk-state-wave: ${{ steps.parent.outputs.sdk_state_wave }}
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.apple-policy.outputs.apple-policy }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
      - name: Require every selected SDK phase to be complete
        id: completion
        env:
          PLAN: ${{ steps.capture.outputs.plan-path }}
          DISCOVERY_ROOT: ${{ steps.capture.outputs.discovery-root }}
          STATE_ROOT: ${{ steps.capture.outputs.state-root }}
          SDK_VALIDATION_TOOLING: ${{ steps.tooling.outputs.tooling-policy }}
          SDK_APPLE_VALIDATION_POLICY: ${{ steps.apple-policy.outputs.apple-policy }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tooling=()
          if [ -n "$SDK_VALIDATION_TOOLING" ]; then
            tooling=(--sdk-validation-tooling "$SDK_VALIDATION_TOOLING")
          fi
          if [ -n "${SDK_APPLE_VALIDATION_POLICY:-}" ]; then
            tooling+=(--sdk-apple-validation-policy "$SDK_APPLE_VALIDATION_POLICY")
          fi
          python3 -B -m ci.sdk_completion --plan "$PLAN" \
            --discovery-root "$DISCOVERY_ROOT" --state-root "$STATE_ROOT" \
            --sdk-original-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
            --repository-root "$GITHUB_WORKSPACE" --github-output "$GITHUB_OUTPUT" \
            ${tooling[@]+"${tooling[@]}"}

  sdk-parity:
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.plan.outputs.validation_reused != 'true' &&
      (needs.plan.outputs.lane_ios_swift_tests_test == 'true' ||
       needs.plan.outputs.native_wrappers == 'true') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs: [workflow-lint, plan, product, contract-validation, product-resume, runtime-linux-arm64-supervisor, runtime-workers-1, runtime-collect-1, runtime-workers-2, runtime-collect-2, runtime-workers-3, runtime-collect-3, runtime-workers-4, runtime-collect-4, runtime-continuation, runtime-signing-prepare-native, runtime-native-attestation, runtime-aggregate, runtime-collect-5, runtime-aggregate-continuation, runtime-signing-prepare-aggregate, runtime-aggregate-attestation, sdk-inputs, sdk-ios-binary-plan, sdk-ios-binary, sdk-collect-3, android, android-runtime-evidence, desktop, sdk-native-wrappers, apple, consumers, sdk-javascript, sdk-native-packages, sdk-ios-packages, sdk-javascript-metadata-result, sdk-native-result, sdk-android-binary-result, sdk-android-package-result, sdk-completion]
    uses: ./.github/workflows/sdk-binding-parity.yml
    with:
      validationCommit: ${{ needs.plan.outputs.validation_commit }}
      validationTree: ${{ needs.plan.outputs.validation_tree }}
      nodeJs: ${{ fromJSON(needs.plan.outputs.lane_node_js) }}
      nativeWrappers: ${{ fromJSON(needs.plan.outputs.native_wrappers) }}

  merge-gate:
    name: CI / merge-gate
    if: always()
    needs: [workflow-lint, plan, product, contract-validation, product-resume, runtime-linux-arm64-supervisor, runtime-workers-1, runtime-collect-1, runtime-workers-2, runtime-collect-2, runtime-workers-3, runtime-collect-3, runtime-workers-4, runtime-collect-4, runtime-continuation, runtime-signing-prepare-native, runtime-native-attestation, runtime-aggregate, runtime-collect-5, runtime-aggregate-continuation, runtime-signing-prepare-aggregate, runtime-aggregate-attestation, sdk-inputs, sdk-ios-binary-plan, sdk-ios-binary, sdk-collect-3, android, android-runtime-evidence, desktop, sdk-native-wrappers, apple, consumers, sdk-javascript, sdk-native-packages, sdk-ios-packages, sdk-javascript-metadata-result, sdk-native-result, sdk-android-binary-result, sdk-android-package-result, sdk-completion, sdk-parity]
    runs-on: ubuntu-24.04
    steps:
      - name: Require readiness and successful prerequisites
        env:
          EVENT_AUTHORIZED: ${{ needs.plan.outputs.event_authorized }}
          MERGE_READY: ${{ needs.plan.outputs.merge_ready }}
          REMOTE_BUILD_AUTHORIZED: ${{ needs.plan.outputs.remote_build_authorized }}
          REMOTE_BUILD_AUTHORIZATION_REASON: ${{ needs.plan.outputs.remote_build_authorization_reason }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          TOOLING_MISS: ${{ needs.plan.outputs.tooling_miss }}
          CONTRACT_BINARY_REQUIRED: ${{ needs.plan.outputs.contract_matrix != '{"include":[]}' }}
          CONTRACT_BINARY_RESULT: ${{ needs.contract-validation.outputs.contract_binary_result }}
          TOOLING_ATTESTATION_RESULT: ${{ needs.contract-validation.outputs.tooling_attestation_result }}
          TOOLING_ARTIFACT_ID: ${{ needs.contract-validation.outputs.tooling_attestation_artifact_id }}
          TOOLING_ARTIFACT_SHA256: ${{ needs.contract-validation.outputs.tooling_attestation_artifact_sha256 }}
          CONTRACT_COMPLETE: ${{ needs.contract-validation.outputs.contract_complete }}
          CONTRACT_ATTESTATION_RESULT: ${{ needs.contract-validation.outputs.contract_attestation_result }}
          CONTRACT_ATTESTATION_ARTIFACT_ID: ${{ needs.contract-validation.outputs.contract_attestation_artifact_id }}
          CONTRACT_ATTESTATION_ARTIFACT_DIGEST: ${{ needs.contract-validation.outputs.contract_attestation_artifact_digest }}
          PRODUCT_RESUME_RESULT: ${{ needs.product-resume.result }}
          SDK_COMPLETION_RESULT: ${{ needs.sdk-completion.result }}
          SDK_COMPLETE: ${{ needs.sdk-completion.outputs.complete }}
          PRODUCT_RESUME_ARTIFACT_ID: ${{ needs.product-resume.outputs.artifact_id }}
          PRODUCT_RESUME_ARTIFACT_DIGEST: ${{ needs.product-resume.outputs.artifact_digest }}
          AGGREGATE_STATE: ${{ needs.runtime-continuation.outputs.aggregate_state }}
          AGGREGATE_PAYLOAD_COMPLETE: ${{ needs.runtime-aggregate-continuation.outputs.aggregate_payload_complete }}
          AGGREGATE_ATTESTATION_RESULT: ${{ needs.runtime-aggregate-attestation.result }}
          AGGREGATE_ATTESTATION_ARTIFACT_ID: ${{ needs.runtime-aggregate-attestation.outputs.artifact_id }}
          AGGREGATE_ATTESTATION_ARTIFACT_DIGEST: ${{ needs.runtime-aggregate-attestation.outputs.artifact_digest }}
          SDK_INPUTS_REQUIRED: ${{ needs.runtime-continuation.outputs.sdk_handoff_required }}
          SDK_INPUTS_RESULT: ${{ needs.sdk-inputs.result }}
          SDK_INPUTS_ARTIFACT_ID: ${{ needs.sdk-inputs.outputs.artifact_id }}
          SDK_INPUTS_ARTIFACT_DIGEST: ${{ needs.sdk-inputs.outputs.artifact_digest }}
          RUNTIME_WAVE_FAILED: ${{ needs.runtime-collect-1.outputs.wave_failed }} ${{ needs.runtime-collect-2.outputs.wave_failed }} ${{ needs.runtime-collect-3.outputs.wave_failed }} ${{ needs.runtime-collect-4.outputs.wave_failed }} ${{ needs.runtime-collect-5.outputs.wave_failed }}
          PRODUCT_FULL_REUSE: ${{ needs.sdk-completion.outputs.full_reuse }}
          NATIVE_WRAPPERS_REQUIRED: ${{ needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.native_wrappers == 'true' }}
          NATIVE_WRAPPERS_RESULT: ${{ needs.sdk-native-wrappers.result }}
          SDK_PARITY_REQUIRED: ${{ needs.plan.outputs.validation_reused != 'true' && (needs.plan.outputs.lane_ios_swift_tests_test == 'true' || needs.plan.outputs.native_wrappers == 'true') }}
          SDK_PARITY_RESULT: ${{ needs.sdk-parity.result }}
          SDK_PARITY_ARTIFACT_ID: ${{ needs.sdk-parity.outputs.artifact_id }}
          SDK_PARITY_ARTIFACT_DIGEST: ${{ needs.sdk-parity.outputs.artifact_digest }}
        run: |
          if [ "$EVENT_AUTHORIZED" != true ]; then
            echo 'The workflow-owned event gate did not authorize remote product CI.' >&2
            exit 1
          fi
          if [ "$REMOTE_BUILD_AUTHORIZED" != true ]; then
            echo "Remote product CI is not authorized: $REMOTE_BUILD_AUTHORIZATION_REASON" >&2
            exit 1
          fi
          if [ "$MERGE_READY" != true ]; then
            echo 'The merge-ready label is required before product CI can pass.' >&2
            exit 1
          fi
          if grep -Eq 'failure|cancelled' <<<"$RESULTS"; then
            exit 1
          fi
          if [ "$NATIVE_WRAPPERS_REQUIRED" = true ]; then
            test "$NATIVE_WRAPPERS_RESULT" = success || exit 1
          fi
          if [ "$SDK_PARITY_REQUIRED" = true ]; then
            test "$SDK_PARITY_RESULT" = success || exit 1
            [[ "$SDK_PARITY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$SDK_PARITY_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          fi
          if [ "$CONTRACT_BINARY_REQUIRED" = true ]; then
            test "$CONTRACT_BINARY_RESULT" = success || exit 1
          fi
          if [ "$TOOLING_MISS" = true ]; then
            test "$TOOLING_ATTESTATION_RESULT" = success || exit 1
            [[ "$TOOLING_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$TOOLING_ARTIFACT_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          fi
          if [ "$PRODUCT_RESUME_RESULT" = success ]; then
            test "$SDK_COMPLETION_RESULT" = success || exit 1
            test "$SDK_COMPLETE" = true || exit 1
          fi
          if [ -n "$AGGREGATE_STATE" ] && [ "$AGGREGATE_STATE" != not-selected ]; then
            test "$AGGREGATE_PAYLOAD_COMPLETE" = true || exit 1
            test "$AGGREGATE_ATTESTATION_RESULT" = success || exit 1
            [[ "$AGGREGATE_ATTESTATION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$AGGREGATE_ATTESTATION_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          fi
          if [ "$SDK_INPUTS_REQUIRED" = true ]; then
            test "$SDK_INPUTS_RESULT" = success || exit 1
            [[ "$SDK_INPUTS_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$SDK_INPUTS_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          fi
          if [ "$CONTRACT_COMPLETE" = true ]; then
            if [[ "$RUNTIME_WAVE_FAILED" = *true* ]] || [ "$PRODUCT_FULL_REUSE" != true ]; then
              echo 'Product continuation is incomplete or a collected Runtime wave failed.' >&2
              exit 1
            fi
            test "$CONTRACT_ATTESTATION_RESULT" = success
            test -n "$CONTRACT_ATTESTATION_ARTIFACT_ID"
            [[ "$CONTRACT_ATTESTATION_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            test "$PRODUCT_RESUME_RESULT" = success
            [[ "$PRODUCT_RESUME_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$PRODUCT_RESUME_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.validation_commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: build/ci/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-agent-ci-*
          path: build/ci/receipts
      - if: needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.lane_node_js == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-agent-sdk-javascript-parity-${{ needs.plan.outputs.validation_tree }}
          path: build/ci/receipts/sdk-javascript
      - name: Restore the exact reused native-wrapper release
        id: restore-reused-native-wrapper-release
        if: needs.plan.outputs.validation_reused == 'true'
        run: |
          source=build/ci/plan/reused-native-wrapper-release
          if [ ! -d "$source" ]; then
            echo 'restored=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -d "$source/packages"
          test -d "$source/evidence"
          test -d "$source/sdks"
          cp -R "$source" build/ci/native-wrapper-release
          echo 'restored=true' >> "$GITHUB_OUTPUT"
      - name: Require an exact receipt set
        env:
          VALIDATION_REUSED: ${{ needs.plan.outputs.validation_reused }}
          TOOLING_MISS: ${{ needs.plan.outputs.tooling_miss }}
        run: |
          if [ "$VALIDATION_REUSED" = true ]; then
            python3 ci/validation_reuse.py materialize --plan build/ci/plan/impact-plan.json \
              --destination build/ci/plan/reused-validation \
              --output build/ci/validation-receipt.json
          else
            auxiliary=()
            if [ "$TOOLING_MISS" = true ] && python3 -c 'import json; p=json.load(open("build/ci/plan/impact-plan.json")); s=p["lanes"]["contracts"]; raise SystemExit(any(s[k] for k in ("build", "test", "metadata")))'; then
              auxiliary=(--auxiliary-contracts)
            fi
            python3 ci/receipt.py aggregate --plan build/ci/plan/impact-plan.json \
              --receipts build/ci/receipts --output build/ci/validation-receipt.json "${auxiliary[@]}"
          fi
      - if: needs.plan.outputs.validation_reused != 'true' && (needs.plan.outputs.lane_ios_swift_tests_test == 'true' || needs.plan.outputs.native_wrappers == 'true')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sdk-parity.outputs.artifact_id }}
          path: build/ci/cross-language-bindings
      - name: Stage the exact reusable validation artifact
        env:
          M8_REQUIRED: ${{ needs.plan.outputs.lane_ios_swift_tests_test }}
          M11_REQUIRED: ${{ needs.plan.outputs.native_wrappers }}
        shell: bash
        run: |
          validation_root=build/ci/final-validation
          mkdir -p "$validation_root"
          cp build/ci/plan/impact-plan.json "$validation_root/impact-plan.json"
          cp build/ci/validation-receipt.json "$validation_root/validation-receipt.json"
          if [ -d build/ci/cross-language-bindings/m11 ]; then
            cp build/ci/cross-language-bindings/m11/*.json "$validation_root/"
          elif [ -f build/ci/binding-obligations-m11.json ]; then
            for evidence in canonical-api.json canonical-coverage.json kotlin-parity.json java-parity.json \
                javascript-typescript-parity.json swift-parity.json objective-c-parity.json \
                c-abi-parity.json python-parity.json csharp-parity.json rust-parity.json \
                cpp-parity.json dart-parity.json binding-obligations-m11.json; do
              test -f "build/ci/$evidence"
              cp "build/ci/$evidence" "$validation_root/$evidence"
            done
          elif [ -d build/ci/cross-language-bindings/m8 ]; then
            cp build/ci/cross-language-bindings/m8/*.json "$validation_root/"
          elif [ -f build/ci/binding-obligations-m8.json ]; then
            for evidence in canonical-api.json canonical-coverage.json kotlin-parity.json java-parity.json \
                javascript-typescript-parity.json swift-parity.json objective-c-parity.json \
                c-abi-parity.json binding-obligations-m8.json; do
              test -f "build/ci/$evidence"
              cp "build/ci/$evidence" "$validation_root/$evidence"
            done
          else
            test "$M8_REQUIRED" != true
          fi
          if [ "$M11_REQUIRED" = true ]; then
            test -f "$validation_root/binding-obligations-m11.json"
          fi
          count=$(find "$validation_root" -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$count" -eq 2 || test "$count" -eq 11 || test "$count" -eq 16
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-ci-validation-${{ needs.plan.outputs.validation_tree }}
          path: build/ci/final-validation/*
          compression-level: 0
          retention-days: 90
      - if: steps.restore-reused-native-wrapper-release.outputs.restored == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true
          name: codex-agent-native-wrapper-packages-${{ needs.plan.outputs.validation_tree }}
          path: build/ci/native-wrapper-release
          compression-level: 0
          retention-days: 90
