    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - id: identity
        shell: bash
        env:
          BUILD_KEY: ${{ matrix.buildKey }}
        run: echo "key_hex=${BUILD_KEY#sha256:}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/run-runtime-product-phase
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.runtime-collect-3.outputs.artifact_id }}
          artifact-sha256: ${{ needs.runtime-collect-3.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          state-wave: '3'
          component: ${{ matrix.component }}
          phase: ${{ matrix.phase }}
          target: ${{ matrix.target }}
          build-key: ${{ matrix.buildKey }}
          revision: ${{ needs.plan.outputs.validation_commit }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-runtime-worker-${{ matrix.component }}-${{ matrix.phase }}-${{ matrix.target }}-${{ steps.identity.outputs.key_hex }}-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: build/runtime-worker
          if-no-files-found: warn
          overwrite: false
          include-hidden-files: true
          compression-level: 0
          retention-days: 90
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-runtime-worker-diagnostics-${{ matrix.component }}-${{ matrix.phase }}-${{ matrix.target }}-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: |
            build/runtime-input/capture-transport.json
            build/runtime-plan
          if-no-files-found: warn
          overwrite: false
          include-hidden-files: true
          retention-days: 90

  runtime-collect-4:
    name: runtime-collect-4
    needs: [plan, runtime-collect-3, runtime-workers-4]
    if: >-
      always() && needs.runtime-collect-3.result == 'success' &&
      needs.runtime-collect-3.outputs.runtime_workers_required == 'true' &&
      needs.runtime-collect-3.outputs.wave_failed != 'true'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.collect.outputs.artifact-id }}
      artifact_digest: ${{ steps.collect.outputs.artifact-sha256 }}
      runtime_matrix: ${{ steps.collect.outputs.runtime-matrix }}
      runtime_workers_required: ${{ steps.collect.outputs.runtime-workers-required }}
      wave_failed: ${{ steps.collect.outputs.wave-failed }}
      full_reuse: ${{ steps.collect.outputs.full-reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - id: collect
        uses: ./.github/actions/collect-runtime-wave
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.runtime-collect-3.outputs.artifact_id }}
          artifact-sha256: ${{ needs.runtime-collect-3.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          state-wave: '3'
          wave: '4'
          tree: ${{ needs.plan.outputs.validation_tree }}


  runtime-continuation:
    name: runtime-continuation
    needs: [plan, product-resume, runtime-workers-1, runtime-collect-1, runtime-workers-2, runtime-collect-2, runtime-workers-3, runtime-collect-3, runtime-workers-4, runtime-collect-4]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.product-resume.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    outputs:
      state_wave: ${{ steps.parent.outputs.state_wave }}
      artifact_id: ${{ steps.parent.outputs.artifact_id }}
      artifact_digest: ${{ steps.parent.outputs.artifact_digest }}
      native_attestation_matrix: ${{ steps.route.outputs.native_attestation_matrix }}
      aggregate_state: ${{ steps.route.outputs.aggregate_state }}
      aggregate_key: ${{ steps.route.outputs.aggregate_key }}
      aggregate_receipt_sha256: ${{ steps.route.outputs.aggregate_receipt_sha256 }}
      aggregate_required: ${{ steps.route.outputs.aggregate_required }}
      aggregate_payload_complete: ${{ steps.route.outputs.aggregate_payload_complete }}
      sdk_handoff_required: ${{ steps.route.outputs.sdk_handoff_required }}
      sdk_input_selection: ${{ steps.route.outputs.sdk_input_selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - name: Select the latest successful original state upload
        id: parent
        env:
          PREDECESSORS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, re
          needs = json.loads(os.environ['PREDECESSORS'])
          selected = None
          for wave in range(5):
              name = 'product-resume' if wave == 0 else f'runtime-collect-{wave}'
              job = needs[name]
              if job['result'] == 'skipped' and wave:
                  continue
              if job['result'] != 'success' or job['outputs'].get('wave_failed') != 'false':
                  raise ValueError('Cannot route failed or incomplete Runtime state')
              outputs = job['outputs']
              artifact = outputs.get('artifact_id', '')
              digest = outputs.get('artifact_digest', '')
              if not re.fullmatch(r'[1-9][0-9]*', artifact) or not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                  raise ValueError('Runtime state upload identity is missing')
              selected = wave, artifact, digest
          if selected is None:
              raise ValueError('No original Runtime state was selected')
          wave, artifact, digest = selected
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'state_wave={wave}\nartifact_id={artifact}\nartifact_digest={digest}\n')
          PY
      - id: captured
        uses: ./.github/actions/capture-runtime-state
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ steps.parent.outputs.artifact_id }}
          artifact-sha256: ${{ steps.parent.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          state-wave: ${{ steps.parent.outputs.state_wave }}
      - name: Replay exact aggregate predecessors before routing
        id: route
        env:
          PLAN: ${{ steps.captured.outputs.plan-path }}
          DISCOVERY: ${{ steps.captured.outputs.discovery-root }}
          STATE: ${{ steps.captured.outputs.state-root }}
        run: |
          python3 -B ci/runtime_workflow.py continuation --if-selected \
            --plan "$PLAN" --discovery-root "$DISCOVERY" --state-root "$STATE" \
            --github-output "$GITHUB_OUTPUT"

  runtime-native-attestation:
    name: runtime-native-attestation-${{ matrix.target }}
    needs: [workflow-lint, plan, runtime-continuation]
    if: >-
      needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      github.event_name != 'workflow_dispatch' &&
      needs.runtime-continuation.result == 'success' &&
      needs.runtime-continuation.outputs.aggregate_state != 'not-selected' &&
      needs.runtime-continuation.outputs.native_attestation_matrix != '{"include":[]}'
    runs-on: ubuntu-24.04
    environment: product-attestation
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtime-continuation.outputs.native_attestation_matrix) }}
    steps:
      - name: Check out reviewed signer code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codex-agent-labs/codex-agent
          ref: d6903e84eb5c6dba359abc9f2cea5d96bb05d556
          path: trusted-source
          persist-credentials: false
      - name: Check out candidate as inventory data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.validation_commit }}
          path: candidate-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_id }}
          path: ${{ runner.temp }}/runtime-attestation-plan
          merge-multiple: true
      - name: Verify original selected bytes and preserve or establish detached release trust
        env:
          TRUSTED_SOURCE_SHA: d6903e84eb5c6dba359abc9f2cea5d96bb05d556
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
          ARTIFACT_ID: ${{ needs.runtime-continuation.outputs.artifact_id }}
          ARTIFACT_SHA256: ${{ needs.runtime-continuation.outputs.artifact_digest }}
          STATE_WAVE: ${{ needs.runtime-continuation.outputs.state_wave }}
          TARGET: ${{ matrix.target }}
          BUILD_KEY: ${{ matrix.buildKey }}
          VALIDATION_TREE: ${{ needs.plan.outputs.validation_tree }}
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_AGENT_PRODUCT_ED25519_PRIVATE_KEY: ${{ secrets.CODEX_AGENT_PRODUCT_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 -B trusted-source/ci/runtime_release.py \
            --repository-root "$GITHUB_WORKSPACE/trusted-source" \
            --candidate-root "$GITHUB_WORKSPACE/candidate-source" \
            --plan "$RUNNER_TEMP/runtime-attestation-plan/impact-plan.json" \
            --destination "$RUNNER_TEMP/runtime-release-evidence" \
            --target "$TARGET" --expected-build-key "$BUILD_KEY" \
            --artifact-id "$ARTIFACT_ID" --artifact-sha256 "$ARTIFACT_SHA256" \
            --state-wave "$STATE_WAVE" --trusted-source-sha "$TRUSTED_SOURCE_SHA" \
            --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" --validation-tree "$VALIDATION_TREE"
      - name: Preserve the exact native handoff and external original evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          name: codex-agent-runtime-release-handoff-${{ matrix.target }}-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-release-evidence
          compression-level: 0
          retention-days: 90

  runtime-aggregate:
    name: runtime-runtime-aggregate-metadata-aggregate
    needs: [plan, runtime-continuation, runtime-native-attestation]
    if: >-
      needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.runtime-continuation.result == 'success' &&
      needs.runtime-continuation.outputs.aggregate_required == 'true' &&
      needs.runtime-native-attestation.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.validation_commit }}
          fetch-depth: 0
          persist-credentials: false
      - id: captured
        uses: ./.github/actions/capture-runtime-state
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.runtime-continuation.outputs.artifact_id }}
          artifact-sha256: ${{ needs.runtime-continuation.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          state-wave: ${{ needs.runtime-continuation.outputs.state_wave }}
          component: runtime-aggregate
          phase: metadata
          target: aggregate
          build-key: ${{ needs.runtime-continuation.outputs.aggregate_key }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-agent-runtime-release-handoff-*-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: build/runtime-native-handoffs
          merge-multiple: false
      - name: Verify and project the five original detached native trust closures
        env:
          TREE: ${{ needs.plan.outputs.validation_tree }}
        run: |
          set -euo pipefail
          handoffs=()
          for target in macos-arm64 macos-x64 linux-arm64 linux-x64 windows-x64; do
            handoffs+=(--variant-handoff "$target=build/runtime-native-handoffs/codex-agent-runtime-release-handoff-$target-$TREE-attempt-$GITHUB_RUN_ATTEMPT/runtime-input")
          done
          python3 -B ci/runtime_workflow.py variant-trust "${handoffs[@]}" \
            --destination build/runtime-variant-trust \
            --keyring gradle/release/product-signing-keys.json --keys-directory gradle/release/keys
      - uses: ./.github/actions/setup-kmp
        with:
          product-worker: 'true'
          cache-read-only: 'true'
          xcode-fingerprint: none
      - id: identity
        env:
          BUILD_KEY: ${{ needs.runtime-continuation.outputs.aggregate_key }}
        run: echo "key_hex=${BUILD_KEY#sha256:}" >> "$GITHUB_OUTPUT"
      - name: Execute only the elected aggregate metadata phase
        env:
          PLAN: ${{ steps.captured.outputs.plan-path }}
          DISCOVERY: ${{ steps.captured.outputs.discovery-root }}
          STATE: ${{ steps.captured.outputs.state-root }}
          BUILD_KEY: ${{ needs.runtime-continuation.outputs.aggregate_key }}
        run: |
          python3 -B ci/product_reuse.py execute-runtime-aggregate \
            --plan "$PLAN" --discovery-root "$DISCOVERY" --state-root "$STATE" \
            --expected-build-key "$BUILD_KEY" --variant-trust-root build/runtime-variant-trust \
            --destination build/runtime-aggregate-worker
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-runtime-worker-runtime-aggregate-metadata-aggregate-${{ steps.identity.outputs.key_hex }}-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: build/runtime-aggregate-worker
          if-no-files-found: warn
          overwrite: false
          include-hidden-files: true
          compression-level: 0
          retention-days: 90

  runtime-collect-5:
    name: runtime-collect-5
    needs: [plan, runtime-continuation, runtime-aggregate]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.runtime-continuation.result == 'success' &&
      needs.runtime-continuation.outputs.aggregate_required == 'true'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.collect.outputs.artifact-id }}
      artifact_digest: ${{ steps.collect.outputs.artifact-sha256 }}
      wave_failed: ${{ steps.collect.outputs.wave-failed }}
      full_reuse: ${{ steps.collect.outputs.full-reuse }}
      aggregate_payload_complete: ${{ steps.collect.outputs.aggregate-payload-complete }}
      aggregate_key: ${{ steps.collect.outputs.aggregate-key }}
      aggregate_receipt_sha256: ${{ steps.collect.outputs.aggregate-receipt-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.validation_commit }}
          fetch-depth: 0
          persist-credentials: false
      - id: collect
        uses: ./.github/actions/collect-runtime-wave
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.runtime-continuation.outputs.artifact_id }}
          artifact-sha256: ${{ needs.runtime-continuation.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          state-wave: ${{ needs.runtime-continuation.outputs.state_wave }}
          wave: '5'
          tree: ${{ needs.plan.outputs.validation_tree }}

  runtime-aggregate-continuation:
    name: runtime-aggregate-continuation
    needs: [plan, runtime-continuation, runtime-collect-5]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.runtime-continuation.result == 'success' &&
      needs.runtime-continuation.outputs.aggregate_state != 'not-selected' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    outputs:
      state_wave: ${{ steps.parent.outputs.state_wave }}
      artifact_id: ${{ steps.parent.outputs.artifact_id }}
      artifact_digest: ${{ steps.parent.outputs.artifact_digest }}
      aggregate_key: ${{ steps.route.outputs.aggregate_key }}
      aggregate_receipt_sha256: ${{ steps.route.outputs.aggregate_receipt_sha256 }}
      aggregate_payload_complete: ${{ steps.route.outputs.aggregate_payload_complete }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.validation_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the exact completed original aggregate state
        id: parent
        env:
          PREDECESSORS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, re
          needs = json.loads(os.environ['PREDECESSORS'])
          prior = needs['runtime-continuation']
          collected = needs['runtime-collect-5']
          if prior['result'] != 'success':
              raise ValueError('Original Runtime continuation did not succeed')
          original = prior['outputs']
          if original['aggregate_required'] == 'true':
              if collected['result'] != 'success' or collected['outputs'].get('wave_failed') != 'false':
                  raise ValueError('Aggregate collection failed or is incomplete')
              selected, wave = collected['outputs'], '5'
          elif original['aggregate_required'] == 'false' and collected['result'] == 'skipped':
              if original.get('aggregate_state') != 'completed':
                  raise ValueError('Original aggregate is not completed')
              selected, wave = original, original['state_wave']
              if not re.fullmatch(r'[0-4]', wave):
                  raise ValueError('Invalid original Runtime state wave')
          else:
              raise ValueError('Unexpected aggregate collection state')
          if selected.get('aggregate_payload_complete') != 'true':
              raise ValueError('Aggregate payload completion is missing')
          key = selected['aggregate_key']
          receipt = selected['aggregate_receipt_sha256']
          artifact, digest = selected['artifact_id'], selected['artifact_digest']
          if key != original['aggregate_key'] or not re.fullmatch(r'[1-9][0-9]*', artifact):
              raise ValueError('Aggregate key or upload identity differs')
          if any(not re.fullmatch(r'sha256:[0-9a-f]{64}', value) for value in (key, receipt, digest)):
              raise ValueError('Aggregate original digest is missing or malformed')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'state_wave={wave}\nartifact_id={artifact}\nartifact_digest={digest}\n')
          PY
      - id: captured
        uses: ./.github/actions/capture-runtime-state
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ steps.parent.outputs.artifact_id }}
          artifact-sha256: ${{ steps.parent.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          state-wave: ${{ steps.parent.outputs.state_wave }}
      - name: Replay the full completed aggregate closure
        id: route
        env:
          PLAN: ${{ steps.captured.outputs.plan-path }}
          DISCOVERY: ${{ steps.captured.outputs.discovery-root }}
          STATE: ${{ steps.captured.outputs.state-root }}
        run: |
          python3 -B ci/runtime_workflow.py continuation --require-completed \
            --plan "$PLAN" --discovery-root "$DISCOVERY" --state-root "$STATE" \
            --github-output "$GITHUB_OUTPUT"

  runtime-aggregate-attestation:
    name: runtime-aggregate-attestation
    needs: [workflow-lint, plan, runtime-native-attestation, runtime-aggregate-continuation]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      github.event_name != 'workflow_dispatch' &&
      needs.runtime-aggregate-continuation.result == 'success' &&
      needs.runtime-aggregate-continuation.outputs.aggregate_payload_complete == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    environment: product-attestation
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: sha256:${{ steps.upload.outputs.artifact-digest }}
      aggregate_key: ${{ needs.runtime-aggregate-continuation.outputs.aggregate_key }}
      aggregate_receipt_sha256: ${{ needs.runtime-aggregate-continuation.outputs.aggregate_receipt_sha256 }}
    steps:
      - name: Check out reviewed signer code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codex-agent-labs/codex-agent
          ref: 0ee0b7b054606c75de00e714bad06b03b0dc2535
          path: trusted-source
          persist-credentials: false
      - name: Check out candidate as inventory data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.validation_commit }}
          path: candidate-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_id }}
          path: ${{ runner.temp }}/runtime-aggregate-attestation-plan
          merge-multiple: true
      - if: needs.runtime-native-attestation.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-agent-runtime-release-handoff-*-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-aggregate-native-handoffs
          merge-multiple: false
      - name: Authenticate completed originals and preserve or establish external aggregate trust
        env:
          TRUSTED_SOURCE_SHA: 0ee0b7b054606c75de00e714bad06b03b0dc2535
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
          ARTIFACT_ID: ${{ needs.runtime-aggregate-continuation.outputs.artifact_id }}
          ARTIFACT_SHA256: ${{ needs.runtime-aggregate-continuation.outputs.artifact_digest }}
          STATE_WAVE: ${{ needs.runtime-aggregate-continuation.outputs.state_wave }}
          BUILD_KEY: ${{ needs.runtime-aggregate-continuation.outputs.aggregate_key }}
          NATIVE_RESULT: ${{ needs.runtime-native-attestation.result }}
          VALIDATION_TREE: ${{ needs.plan.outputs.validation_tree }}
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_AGENT_PRODUCT_ED25519_PRIVATE_KEY: ${{ secrets.CODEX_AGENT_PRODUCT_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set --
          if [ "$NATIVE_RESULT" = success ]; then
            for target in macos-arm64 macos-x64 linux-arm64 linux-x64 windows-x64; do
              set -- "$@" --variant-handoff "$target=$RUNNER_TEMP/runtime-aggregate-native-handoffs/codex-agent-runtime-release-handoff-$target-$VALIDATION_TREE-attempt-$GITHUB_RUN_ATTEMPT/runtime-input"
            done
          elif [ "$NATIVE_RESULT" != skipped ]; then
            echo 'Native attestation did not succeed or reuse its complete carrier.' >&2
            exit 1
          fi
          python3 -B trusted-source/ci/runtime_release.py \
            --repository-root "$GITHUB_WORKSPACE/trusted-source" \
            --candidate-root "$GITHUB_WORKSPACE/candidate-source" \
            --plan "$RUNNER_TEMP/runtime-aggregate-attestation-plan/impact-plan.json" \
            --destination "$RUNNER_TEMP/runtime-aggregate-release-evidence" \
            --target aggregate --expected-build-key "$BUILD_KEY" \
            --artifact-id "$ARTIFACT_ID" --artifact-sha256 "$ARTIFACT_SHA256" \
            --state-wave "$STATE_WAVE" --trusted-source-sha "$TRUSTED_SOURCE_SHA" \
            --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" --validation-tree "$VALIDATION_TREE" \
            "$@"
      - name: Preserve the exact aggregate handoff and external original evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          name: codex-agent-runtime-aggregate-release-handoff-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-aggregate-release-evidence
          compression-level: 0
          retention-days: 90

  sdk-inputs:
    name: sdk-inputs
    needs: [workflow-lint, plan, runtime-continuation, runtime-aggregate-attestation]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.workflow-lint.result == 'success' &&
      needs.runtime-continuation.result == 'success' &&
      needs.runtime-continuation.outputs.sdk_handoff_required == 'true' &&
      (fromJSON(needs.runtime-continuation.outputs.sdk_input_selection || '{}').source == 'released-default' ||
       needs.runtime-aggregate-attestation.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: sha256:${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.validation_commit }}
      - id: captured
        uses: ./.github/actions/capture-runtime-state
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.runtime-continuation.outputs.artifact_id }}
          artifact-sha256: ${{ needs.runtime-continuation.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          state-wave: ${{ needs.runtime-continuation.outputs.state_wave }}
      - name: Stage SDK inputs from the independently verified selection
        id: staged
        env:
          PLAN: ${{ steps.captured.outputs.plan-path }}
          DISCOVERY: ${{ steps.captured.outputs.discovery-root }}
          STATE: ${{ steps.captured.outputs.state-root }}
          SDK_SOURCE: ${{ fromJSON(needs.runtime-continuation.outputs.sdk_input_selection).source }}
          ARTIFACT_ID: ${{ needs.runtime-aggregate-attestation.outputs.artifact_id }}
          ARTIFACT_SHA256: ${{ needs.runtime-aggregate-attestation.outputs.artifact_digest }}
          AGGREGATE_KEY: ${{ needs.runtime-aggregate-attestation.outputs.aggregate_key }}
          AGGREGATE_RECEIPT: ${{ needs.runtime-aggregate-attestation.outputs.aggregate_receipt_sha256 }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fresh=()
          case "$SDK_SOURCE" in
            released-default) destination="$GITHUB_WORKSPACE/build/sdk-inputs" ;;
            current-runtime)
              destination="$RUNNER_TEMP/sdk-inputs"
              fresh=(--artifact-id "$ARTIFACT_ID" --artifact-sha256 "$ARTIFACT_SHA256"
                --expected-build-key "$AGGREGATE_KEY" --expected-metadata-receipt-sha256 "$AGGREGATE_RECEIPT"
                --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA") ;;
            *) echo 'Unknown replayed SDK input source' >&2; exit 1 ;;
          esac
          python3 -B -m ci.sdk_workflow --plan "$PLAN" --discovery-root "$DISCOVERY" --state-root "$STATE" \
            --destination "$destination" --repository-root "$GITHUB_WORKSPACE" \
            --keyring "$GITHUB_WORKSPACE/gradle/release/product-signing-keys.json" \
            --keys-directory "$GITHUB_WORKSPACE/gradle/release/keys" "${fresh[@]}"
          printf 'path=%s\n' "$destination" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-sdk-inputs-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.staged.outputs.path }}
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 1

  android:
    if: needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true' && needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.lane_android == 'true'
    needs: [workflow-lint, plan]
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
      reused: ${{ steps.lane.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.validation_commit }}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: android
          plan-artifact: ${{ needs.plan.outputs.plan_artifact }}
          validation-commit: ${{ needs.plan.outputs.validation_commit }}
          validation-tree: ${{ needs.plan.outputs.validation_tree }}
          build: ${{ needs.plan.outputs.lane_android_build }}
          test: ${{ needs.plan.outputs.lane_android_test }}
          metadata: ${{ needs.plan.outputs.lane_android_metadata }}

  android-runtime-evidence:
    if: >-
      needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.plan.outputs.validation_reused != 'true' &&
      needs.plan.outputs.android_evidence_required == 'true'
    needs: [plan, android]
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: codex-agent-labs/codex-agent/.github/workflows/android-runtime-evidence.yml@main
    with:
      candidateCommit: ${{ needs.plan.outputs.validation_commit }}
      ciRunId: ${{ github.run_id }}
      artifactName: ${{ needs.android.outputs.artifact_name }}
      planArtifact: ${{ needs.plan.outputs.plan_artifact }}

  desktop:
    if: always() && needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true' && needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.any_desktop == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [workflow-lint, plan, product]
    uses: ./.github/workflows/desktop-runtime-evidence.yml
    with:
      planArtifact: ${{ needs.plan.outputs.plan_artifact }}
      validationCommit: ${{ needs.plan.outputs.validation_commit }}
      validationTree: ${{ needs.plan.outputs.validation_tree }}
      matrix: ${{ needs.plan.outputs.desktop_matrix }}
      linuxArm64: ${{ fromJSON(needs.plan.outputs.lane_desktop_linux_arm64) }}
      linuxArm64Build: ${{ fromJSON(needs.plan.outputs.lane_desktop_linux_arm64_build) }}
      linuxArm64Test: ${{ fromJSON(needs.plan.outputs.lane_desktop_linux_arm64_test) }}
      linuxArm64Metadata: ${{ fromJSON(needs.plan.outputs.lane_desktop_linux_arm64_metadata) }}
      nativeWrappers: ${{ fromJSON(needs.plan.outputs.native_wrappers) }}

  apple:
    if: needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true' && needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.any_apple == 'true'
    needs: [workflow-lint, plan]
    uses: ./.github/workflows/apple-runtime-evidence.yml
    with:
      planArtifact: ${{ needs.plan.outputs.plan_artifact }}
      validationCommit: ${{ needs.plan.outputs.validation_commit }}
      validationTree: ${{ needs.plan.outputs.validation_tree }}

  consumers:
    if: always() && needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true' && needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.consumer_matrix != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [workflow-lint, plan, product, android, android-runtime-evidence, desktop, apple]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.consumer_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.validation_commit }}
      - if: matrix.lane == 'consumer-desktop' || matrix.lane == 'consumer-node-js' || matrix.lane == 'consumer-node-wasm'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-agent-ci-desktop-*-${{ needs.plan.outputs.validation_tree }}
          path: build/ci/desktop-lanes
      - if: matrix.lane == 'consumer-desktop' || matrix.lane == 'consumer-node-js' || matrix.lane == 'consumer-node-wasm'
        shell: bash
        run: |
          mkdir -p build/ci/desktop-classifiers
          mapfile -t app_archives < <(find build/ci/desktop-lanes -type f -name '*-app-server-*.zip' -print)
          mapfile -t c_abi_archives < <(find build/ci/desktop-lanes -type f -name '*-c-abi-*.zip' -print)
          test "${#app_archives[@]}" -eq 5
          test "${#c_abi_archives[@]}" -eq 5
          cp "${app_archives[@]}" "${c_abi_archives[@]}" build/ci/desktop-classifiers/
          test "$(find build/ci/desktop-classifiers -type f -name '*-app-server-*.zip' | wc -l | tr -d ' ')" -eq 5
          test "$(find build/ci/desktop-classifiers -type f -name '*-c-abi-*.zip' | wc -l | tr -d ' ')" -eq 5
          printf 'DESKTOP_CLASSIFIERS=%s/build/ci/desktop-classifiers\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - if: matrix.lane == 'consumer-android'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-agent-ci-android-${{ needs.plan.outputs.validation_tree }}
          path: build/ci/android-lane
      - if: matrix.lane == 'consumer-android'
        shell: bash
        run: |
          aar=$(find build/ci/android-lane/payload -type f -name codex-agent-runtime-android-release.aar -print -quit)
          evidence=$(find build/ci/android-lane/payload -type f -name android-runtime-evidence.json -print -quit)
          test -n "$aar"
          if [ -n "$evidence" ]; then
            printf 'ANDROID_RELEASE_AAR=%s/%s\nANDROID_EVIDENCE=%s/%s\n' \
              "$GITHUB_WORKSPACE" "$aar" "$GITHUB_WORKSPACE" "$(dirname "$evidence")" >> "$GITHUB_ENV"
          fi
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: ${{ matrix.lane }}
          plan-artifact: ${{ needs.plan.outputs.plan_artifact }}
          validation-commit: ${{ needs.plan.outputs.validation_commit }}
          validation-tree: ${{ needs.plan.outputs.validation_tree }}
          build: ${{ matrix.build }}
          test: ${{ matrix.test }}
          metadata: ${{ matrix.metadata }}
          node-version: ${{ contains(matrix.lane, 'node') && '24.18.0' || 'none' }}

  sdk-plan:
    needs: [plan, runtime-continuation, runtime-aggregate-continuation, sdk-inputs]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' && needs.sdk-inputs.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.parent.outputs.artifact_id }}
      artifact_digest: ${{ steps.parent.outputs.artifact_digest }}
      state_wave: ${{ steps.parent.outputs.state_wave }}
      sdk_matrix: ${{ steps.capture.outputs.sdk-matrix }}
      sdk_workers_required: ${{ steps.capture.outputs.sdk-workers-required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - id: parent
        env:
          PREDECESSORS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['PREDECESSORS'])
          source = json.loads(needs['runtime-continuation']['outputs']['sdk_input_selection'])['source']
          if source not in ('released-default', 'current-runtime'):
              raise ValueError('Unknown SDK Runtime source')
          parent = needs['runtime-aggregate-continuation' if source == 'current-runtime' else 'runtime-continuation']
          if parent['result'] != 'success':
              raise ValueError('SDK predecessor state is incomplete')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name in ('artifact_id', 'artifact_digest', 'state_wave'):
                  output.write(name + '=' + parent['outputs'][name] + '\n')
          PY
      - id: capture
        uses: ./.github/actions/capture-runtime-state
        with:
          product: sdk
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ steps.parent.outputs.artifact_id }}
          artifact-sha256: ${{ steps.parent.outputs.artifact_digest }}
          state-wave: ${{ steps.parent.outputs.state_wave }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}

  sdk-workers-1:
    name: sdk-javascript-${{ matrix.phase }}-node
    needs: [plan, sdk-plan, sdk-inputs]
    if: >-
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.sdk-plan.outputs.sdk_workers_required == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.sdk-plan.outputs.sdk_matrix || '{"include":[]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - uses: ./.github/actions/sdk-javascript-worker
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.sdk-plan.outputs.artifact_id }}
          artifact-sha256: ${{ needs.sdk-plan.outputs.artifact_digest }}
          state-wave: ${{ needs.sdk-plan.outputs.state_wave }}
          sdk-inputs-id: ${{ needs.sdk-inputs.outputs.artifact_id }}
          sdk-inputs-sha256: ${{ needs.sdk-inputs.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          phase: ${{ matrix.phase }}
          build-key: ${{ matrix.buildKey }}
          tree: ${{ needs.plan.outputs.validation_tree }}

  sdk-collect-1:
    name: sdk-collect-1
    needs: [plan, sdk-plan, sdk-workers-1]
    if: >-
      always() && needs.sdk-plan.result == 'success' &&
      needs.sdk-plan.outputs.sdk_workers_required == 'true'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.collect.outputs.artifact-id }}
      artifact_digest: ${{ steps.collect.outputs.artifact-sha256 }}
      sdk_matrix: ${{ steps.collect.outputs.sdk-matrix }}
      sdk_workers_required: ${{ steps.collect.outputs.sdk-workers-required }}
      wave_failed: ${{ steps.collect.outputs.wave-failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - id: collect
        uses: ./.github/actions/collect-runtime-wave
        with:
          product: sdk
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.sdk-plan.outputs.artifact_id }}
          artifact-sha256: ${{ needs.sdk-plan.outputs.artifact_digest }}
          state-wave: ${{ needs.sdk-plan.outputs.state_wave }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          wave: '1'
          tree: ${{ needs.plan.outputs.validation_tree }}

  sdk-workers-2:
    name: sdk-javascript-${{ matrix.phase }}-node
    needs: [plan, sdk-collect-1, sdk-inputs]
    if: >-
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.sdk-collect-1.outputs.wave_failed == 'false' &&
      needs.sdk-collect-1.outputs.sdk_workers_required == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.sdk-collect-1.outputs.sdk_matrix || '{"include":[]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - uses: ./.github/actions/sdk-javascript-worker
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.sdk-collect-1.outputs.artifact_id }}
          artifact-sha256: ${{ needs.sdk-collect-1.outputs.artifact_digest }}
          sdk-state-wave: '1'
          sdk-inputs-id: ${{ needs.sdk-inputs.outputs.artifact_id }}
          sdk-inputs-sha256: ${{ needs.sdk-inputs.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          phase: ${{ matrix.phase }}
          build-key: ${{ matrix.buildKey }}
          tree: ${{ needs.plan.outputs.validation_tree }}

  sdk-collect-2:
    name: sdk-collect-2
    needs: [plan, sdk-collect-1, sdk-workers-2]
    if: >-
      always() && needs.sdk-collect-1.result == 'success' &&
      needs.sdk-collect-1.outputs.wave_failed == 'false' &&
      needs.sdk-collect-1.outputs.sdk_workers_required == 'true'
    runs-on: ubuntu-24.04
    outputs:
      wave_failed: ${{ steps.collect.outputs.wave-failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - id: collect
        uses: ./.github/actions/collect-runtime-wave
        with:
          product: sdk
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.sdk-collect-1.outputs.artifact_id }}
          artifact-sha256: ${{ needs.sdk-collect-1.outputs.artifact_digest }}
          state-wave: '0'
          sdk-state-wave: '1'
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          wave: '2'
          tree: ${{ needs.plan.outputs.validation_tree }}

  sdk-javascript:
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.runtime-continuation.result == 'success'
    needs: [plan, runtime-continuation, sdk-plan, sdk-collect-1, sdk-collect-2]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail after collecting every elected JavaScript result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          planned = needs['sdk-plan']
          if planned['result'] == 'skipped':
              if needs['runtime-continuation']['outputs'].get('sdk_handoff_required') != 'false':
                  raise ValueError('Required SDK plan did not execute')
          elif planned['result'] != 'success':
              raise ValueError('SDK replay planning failed')
          else:
              required = planned['outputs'].get('sdk_workers_required')
              if required not in ('true', 'false'):
                  raise ValueError('SDK work election is missing')
              for wave in (1, 2):
                  job = needs[f'sdk-collect-{wave}']
                  if required == 'true':
                      if job['result'] != 'success' or job['outputs'].get('wave_failed') != 'false':
                          raise ValueError(f'SDK wave {wave} failed or was not collected')
                      required = job['outputs'].get('sdk_workers_required') if wave == 1 else 'false'
                      if required not in ('true', 'false'):
                          raise ValueError('SDK next-wave election is missing')
                  elif job['result'] != 'skipped':
                      raise ValueError('Unelected SDK collection executed')
          PY

  merge-gate:
    name: CI / merge-gate
    if: always()
    needs: [workflow-lint, plan, product, contract-continuation, contract-attestation, product-resume, runtime-linux-arm64-supervisor, runtime-workers-1, runtime-collect-1, runtime-workers-2, runtime-collect-2, runtime-workers-3, runtime-collect-3, runtime-workers-4, runtime-collect-4, runtime-continuation, runtime-native-attestation, runtime-aggregate, runtime-collect-5, runtime-aggregate-continuation, runtime-aggregate-attestation, sdk-inputs, android, android-runtime-evidence, desktop, apple, consumers, sdk-javascript]
    runs-on: ubuntu-24.04
    steps:
      - name: Require readiness and successful prerequisites
        env:
          EVENT_AUTHORIZED: ${{ needs.plan.outputs.event_authorized }}
          MERGE_READY: ${{ needs.plan.outputs.merge_ready }}
          REMOTE_BUILD_AUTHORIZED: ${{ needs.plan.outputs.remote_build_authorized }}
          REMOTE_BUILD_AUTHORIZATION_REASON: ${{ needs.plan.outputs.remote_build_authorization_reason }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CONTRACT_COMPLETE: ${{ needs.contract-continuation.outputs.contract_complete }}
          CONTRACT_ATTESTATION_RESULT: ${{ needs.contract-attestation.result }}
          CONTRACT_ATTESTATION_ARTIFACT_ID: ${{ needs.contract-attestation.outputs.artifact_id }}
          CONTRACT_ATTESTATION_ARTIFACT_DIGEST: ${{ needs.contract-attestation.outputs.artifact_digest }}
          PRODUCT_RESUME_RESULT: ${{ needs.product-resume.result }}
          PRODUCT_RESUME_ARTIFACT_ID: ${{ needs.product-resume.outputs.artifact_id }}
          PRODUCT_RESUME_ARTIFACT_DIGEST: ${{ needs.product-resume.outputs.artifact_digest }}
          AGGREGATE_STATE: ${{ needs.runtime-continuation.outputs.aggregate_state }}
          AGGREGATE_PAYLOAD_COMPLETE: ${{ needs.runtime-aggregate-continuation.outputs.aggregate_payload_complete }}
          AGGREGATE_ATTESTATION_RESULT: ${{ needs.runtime-aggregate-attestation.result }}
          AGGREGATE_ATTESTATION_ARTIFACT_ID: ${{ needs.runtime-aggregate-attestation.outputs.artifact_id }}
          AGGREGATE_ATTESTATION_ARTIFACT_DIGEST: ${{ needs.runtime-aggregate-attestation.outputs.artifact_digest }}
          SDK_INPUTS_REQUIRED: ${{ needs.runtime-continuation.outputs.sdk_handoff_required }}
          SDK_INPUTS_RESULT: ${{ needs.sdk-inputs.result }}
          SDK_INPUTS_ARTIFACT_ID: ${{ needs.sdk-inputs.outputs.artifact_id }}
          SDK_INPUTS_ARTIFACT_DIGEST: ${{ needs.sdk-inputs.outputs.artifact_digest }}
          RUNTIME_WAVE_FAILED: ${{ needs.runtime-collect-1.outputs.wave_failed }} ${{ needs.runtime-collect-2.outputs.wave_failed }} ${{ needs.runtime-collect-3.outputs.wave_failed }} ${{ needs.runtime-collect-4.outputs.wave_failed }} ${{ needs.runtime-collect-5.outputs.wave_failed }}
          PRODUCT_FULL_REUSE: ${{ needs.runtime-collect-5.outputs.full_reuse || needs.runtime-collect-4.outputs.full_reuse || needs.runtime-collect-3.outputs.full_reuse || needs.runtime-collect-2.outputs.full_reuse || needs.runtime-collect-1.outputs.full_reuse || needs.product-resume.outputs.full_reuse }}
        run: |
          if [ "$EVENT_AUTHORIZED" != true ]; then
            echo 'The workflow-owned event gate did not authorize remote product CI.' >&2
            exit 1
          fi
          if [ "$REMOTE_BUILD_AUTHORIZED" != true ]; then
            echo "Remote product CI is not authorized: $REMOTE_BUILD_AUTHORIZATION_REASON" >&2
            exit 1
          fi
          if [ "$MERGE_READY" != true ]; then
            echo 'The merge-ready label is required before product CI can pass.' >&2
            exit 1
          fi
          if grep -Eq 'failure|cancelled' <<<"$RESULTS"; then
            exit 1
          fi
          if [ -n "$AGGREGATE_STATE" ] && [ "$AGGREGATE_STATE" != not-selected ]; then
            test "$AGGREGATE_PAYLOAD_COMPLETE" = true || exit 1
            test "$AGGREGATE_ATTESTATION_RESULT" = success || exit 1
            [[ "$AGGREGATE_ATTESTATION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$AGGREGATE_ATTESTATION_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          fi
          if [ "$SDK_INPUTS_REQUIRED" = true ]; then
            test "$SDK_INPUTS_RESULT" = success || exit 1
            [[ "$SDK_INPUTS_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$SDK_INPUTS_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          fi
          if [ "$CONTRACT_COMPLETE" = true ]; then
            if [[ "$RUNTIME_WAVE_FAILED" = *true* ]] || [ "$PRODUCT_FULL_REUSE" != true ]; then
              echo 'Product continuation is incomplete or a collected Runtime wave failed.' >&2
              exit 1
            fi
            test "$CONTRACT_ATTESTATION_RESULT" = success
            test -n "$CONTRACT_ATTESTATION_ARTIFACT_ID"
            [[ "$CONTRACT_ATTESTATION_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            test "$PRODUCT_RESUME_RESULT" = success
            [[ "$PRODUCT_RESUME_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$PRODUCT_RESUME_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.validation_commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: build/ci/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-agent-ci-*
          path: build/ci/receipts
      - if: needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.lane_node_js == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-agent-sdk-javascript-parity-${{ needs.plan.outputs.validation_tree }}
          path: build/ci/receipts/sdk-javascript
      - if: needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.native_wrappers == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-agent-native-wrapper-packages-${{ needs.plan.outputs.validation_tree }}
          path: build/ci/native-wrapper-release
      - if: needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.native_wrappers == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-agent-native-wrapper-host-*-${{ needs.plan.outputs.validation_tree }}
          path: build/ci/native-wrapper-hosts
      - name: Restore the exact reused native-wrapper release
        id: restore-reused-native-wrapper-release
        if: needs.plan.outputs.validation_reused == 'true'
        run: |
          source=build/ci/plan/reused-native-wrapper-release
          if [ ! -d "$source" ]; then
            echo 'restored=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -d "$source/packages"
          test -d "$source/evidence"
          test -d "$source/sdks"
          cp -R "$source" build/ci/native-wrapper-release
          echo 'restored=true' >> "$GITHUB_OUTPUT"
      - name: Require an exact receipt set
        env:
          VALIDATION_REUSED: ${{ needs.plan.outputs.validation_reused }}
        run: |
          if [ "$VALIDATION_REUSED" = true ]; then
            python3 ci/validation_reuse.py materialize --plan build/ci/plan/impact-plan.json \
              --destination build/ci/plan/reused-validation \
              --output build/ci/validation-receipt.json
          else
            python3 ci/receipt.py aggregate --plan build/ci/plan/impact-plan.json \
              --receipts build/ci/receipts --output build/ci/validation-receipt.json
          fi
      - name: Require complete six-language M8 binding parity
        if: >-
          needs.plan.outputs.validation_reused != 'true' &&
          (needs.plan.outputs.lane_ios_swift_tests_test == 'true' || needs.plan.outputs.native_wrappers == 'true')
        env:
          VALIDATION_COMMIT: ${{ needs.plan.outputs.validation_commit }}
          VALIDATION_TREE: ${{ needs.plan.outputs.validation_tree }}
        shell: bash
        run: |
          one_file() {
            mapfile -t matches < <(find build/ci/receipts -type f -name "$1" -print)
            test "${#matches[@]}" -eq 1
            printf '%s\n' "${matches[0]}"
          }
          one_desktop_file() {
            mapfile -t matches < <(find build/ci/receipts -type f \
              -path '*/payload/codex-agent-runtime-desktop/build/*' -name "$1" -print)
            test "${#matches[@]}" -eq 1
            printf '%s\n' "${matches[0]}"
          }
          binding_root=build/ci/cross-language-bindings
          mkdir -p "$binding_root/receipts" "$binding_root/c-abi-packages" "$binding_root/c-abi-proofs"
          release_tool=$(one_file codex-agent-release-tooling.jar)
          api_report=$(one_file canonical-api.json)
          coverage_receipt=$(one_file canonical-coverage.json)
          bootstrap=$(one_desktop_file bootstrap-evidence.json)
          scenario_proof=$(one_desktop_file c-abi-scenarios.json)
          for proof in c-abi-package-macos-arm64.json c-abi-package-macos-x64.json \
              c-abi-package-linux-arm64.json c-abi-package-linux-x64.json c-abi-package-windows-x64.json; do
            cp "$(one_desktop_file "$proof")" "$binding_root/c-abi-proofs/$proof"
          done
          mapfile -t versions < <(jq -r '.libraryVersion' "$binding_root"/c-abi-proofs/*.json | sort -u)
          test "${#versions[@]}" -eq 1
          version=${versions[0]}
          test -n "$version"
          for classifier in macos-arm64 macos-x64 linux-arm64 linux-x64 windows-x64; do
            archive=$(one_desktop_file "*-$version-c-abi-$classifier.zip")
            cp "$archive" "$binding_root/c-abi-packages/$(basename "$archive")"
          done
          java -jar "$release_tool" assemble-c-abi-binding-receipt \
            --repository "$PWD" \
            --bootstrap "$bootstrap" \
            --scenario-proof "$scenario_proof" \
            --packages "$binding_root/c-abi-packages" \
            --proofs "$binding_root/c-abi-proofs" \
            --version "$version" \
            --commit "$VALIDATION_COMMIT" \
            --tree "$VALIDATION_TREE" \
            --output "$binding_root/receipts/c-abi-parity.json"
          for receipt in kotlin-parity.json java-parity.json javascript-typescript-parity.json swift-parity.json objective-c-parity.json; do
            cp "$(one_file "$receipt")" "$binding_root/receipts/$receipt"
          done
          java -jar "$release_tool" audit-cross-language-bindings \
            --phase M8 \
            --api-report "$api_report" \
            --coverage-receipt "$coverage_receipt" \
            --receipts "$binding_root/receipts" \
            --output "$binding_root/binding-obligations-m8.json"
          jq -e '
            .result == "complete" and .phase == "M8" and
            .summary == {
              total: 6116, active: 3324, pending: 2780,
              excluded: 12, satisfied: 3324, missing: 0
            }
          ' "$binding_root/binding-obligations-m8.json" >/dev/null
          mkdir -p "$binding_root/m8"
          cp "$api_report" "$binding_root/m8/canonical-api.json"
          cp "$coverage_receipt" "$binding_root/m8/canonical-coverage.json"
          cp "$binding_root"/receipts/*.json "$binding_root/m8/"
          cp "$binding_root/binding-obligations-m8.json" "$binding_root/m8/"
          test "$(find "$binding_root/m8" -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 9
      - name: Require complete native-wrapper parity through M11
        if: needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.native_wrappers == 'true'
        env:
          VALIDATION_COMMIT: ${{ needs.plan.outputs.validation_commit }}
          VALIDATION_TREE: ${{ needs.plan.outputs.validation_tree }}
        shell: bash
        run: |
          set -euo pipefail
          one_file() {
            mapfile -t matches < <(find build/ci/receipts -type f -name "$1" -print)
            test "${#matches[@]}" -eq 1
            printf '%s\n' "${matches[0]}"
          }
          one_host_evidence() {
            mapfile -t matches < <(find build/ci/native-wrapper-hosts -type f \
              -path "*/evidence/$1/$2.tsv" -print)
            test "${#matches[@]}" -eq 1
            printf '%s\n' "${matches[0]}"
          }
          binding_root=build/ci/cross-language-bindings
          release=build/ci/native-wrapper-release
          release_tool=$(one_file codex-agent-release-tooling.jar)
          api_report=$(one_file canonical-api.json)
          coverage_receipt=$(one_file canonical-coverage.json)
          mapfile -t bootstraps < <(find build/ci/receipts -type f \
            -path '*/payload/codex-agent-runtime-desktop/build/*' \
            -name bootstrap-evidence.json -print)
          test "${#bootstraps[@]}" -eq 1
          bootstrap=${bootstraps[0]}
          for classifier in macos-arm64 macos-x64 linux-arm64 linux-x64 windows-x64; do
            for language in python csharp rust cpp dart; do
              evidence=$(one_host_evidence "$language" "$classifier")
              artifact_root=$(dirname "$(dirname "$(dirname "$evidence")")")
              test -f "$artifact_root/lane-receipt.json"
              host="$binding_root/host/$language"
              mkdir -p "$host"
              cp "$evidence" "$host/$classifier.tsv"
              cp "$artifact_root/lane-receipt.json" "$host/$classifier-lane-receipt.json"
            done
          done
          ./gradlew \
            :codex-agent-sdk:verifyPythonBindingParity \
            :codex-agent-sdk:verifyCSharpBindingParity \
            :codex-agent-sdk:verifyRustBindingParity \
            :codex-agent-sdk:verifyCppBindingParity \
            :codex-agent-sdk:verifyDartBindingParity \
            -PcodexAgent.nativeWrapperReleaseDirectory="$PWD/$release" \
            -PcodexAgent.nativeWrapperHostEvidenceDirectory="$PWD/$binding_root/host" \
            -PcodexAgent.nativeWrapperApiReport="$PWD/$api_report" \
            -PcodexAgent.nativeWrapperCoverageReceipt="$PWD/$coverage_receipt" \
            -PcodexAgent.nativeWrapperBootstrapEvidence="$PWD/$bootstrap" \
            --stacktrace

          languages=(python csharp rust cpp dart)
          phases=(M9_PYTHON M9_CSHARP M9_RUST M9_CPP M9_DART)
          satisfied=(3880 4436 4992 5548 6104)
          pending=(2224 1668 1112 556 0)
          previous="$binding_root/m8"
          for index in "${!languages[@]}"; do
            language=${languages[$index]}
            phase=${phases[$index]}
            phase_root="$binding_root/${phase,,}"
            receipts="$phase_root/receipts"
            mkdir -p "$receipts"
            for source in "$previous"/*-parity.json; do
              java -jar "$release_tool" advance-cross-language-binding-receipt \
                --phase "$phase" --source "$source" --output "$receipts/$(basename "$source")"
            done
            cp "codex-agent-sdk/build/reports/cross-language-api/bindings/$language-parity.json" \
              "$receipts/$language-parity.json"
            audit="$phase_root/binding-obligations-${phase,,}.json"
            java -jar "$release_tool" audit-cross-language-bindings \
              --phase "$phase" \
              --api-report "$api_report" \
              --coverage-receipt "$coverage_receipt" \
              --receipts "$receipts" \
              --output "$audit"
            jq -e --arg phase "$phase" --argjson satisfied "${satisfied[$index]}" \
              --argjson pending "${pending[$index]}" '
                .result == "complete" and .phase == $phase and
                .summary == {
                  total: 6116, active: 6104, pending: $pending,
                  excluded: 12, satisfied: $satisfied, missing: 0
                }
              ' "$audit" >/dev/null
            previous="$receipts"
          done

          m11_receipts="$binding_root/m11-receipts"
          mkdir -p "$m11_receipts"
          for source in "$previous"/*-parity.json; do
            java -jar "$release_tool" advance-cross-language-binding-receipt \
              --phase M11 --source "$source" --output "$m11_receipts/$(basename "$source")"
          done
          m11_audit="$binding_root/binding-obligations-m11.json"
          java -jar "$release_tool" audit-cross-language-bindings \
            --phase M11 \
            --api-report "$api_report" \
            --coverage-receipt "$coverage_receipt" \
            --receipts "$m11_receipts" \
            --output "$m11_audit"
          jq -e '
            .result == "complete" and .phase == "M11" and
            .summary == {
              total: 6116, active: 6104, pending: 0,
              excluded: 12, satisfied: 6104, missing: 0
            }
          ' "$m11_audit" >/dev/null
          mkdir -p "$binding_root/m11"
          cp "$api_report" "$binding_root/m11/canonical-api.json"
          cp "$coverage_receipt" "$binding_root/m11/canonical-coverage.json"
          cp "$m11_receipts"/*.json "$binding_root/m11/"
          cp "$m11_audit" "$binding_root/m11/"
          test "$(find "$binding_root/m11" -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 14
          ./gradlew verifySdkBindingParity \
            -PcodexAgent.sdkBindingEvidenceDirectory="$PWD/$binding_root/m11" \
            -PcodexAgent.sdkCanonicalApiReport="$PWD/$api_report" \
            -PcodexAgent.sdkCanonicalCoverageReceipt="$PWD/$coverage_receipt" \
            --stacktrace
      - name: Stage the exact reusable validation artifact
        env:
          M8_REQUIRED: ${{ needs.plan.outputs.lane_ios_swift_tests_test }}
          M11_REQUIRED: ${{ needs.plan.outputs.native_wrappers }}
        shell: bash
        run: |
          validation_root=build/ci/final-validation
          mkdir -p "$validation_root"
          cp build/ci/plan/impact-plan.json "$validation_root/impact-plan.json"
          cp build/ci/validation-receipt.json "$validation_root/validation-receipt.json"
          if [ -d build/ci/cross-language-bindings/m11 ]; then
            cp build/ci/cross-language-bindings/m11/*.json "$validation_root/"
          elif [ -f build/ci/binding-obligations-m11.json ]; then
            for evidence in canonical-api.json canonical-coverage.json kotlin-parity.json java-parity.json \
                javascript-typescript-parity.json swift-parity.json objective-c-parity.json \
                c-abi-parity.json python-parity.json csharp-parity.json rust-parity.json \
                cpp-parity.json dart-parity.json binding-obligations-m11.json; do
              test -f "build/ci/$evidence"
              cp "build/ci/$evidence" "$validation_root/$evidence"
            done
          elif [ -d build/ci/cross-language-bindings/m8 ]; then
            cp build/ci/cross-language-bindings/m8/*.json "$validation_root/"
          elif [ -f build/ci/binding-obligations-m8.json ]; then
            for evidence in canonical-api.json canonical-coverage.json kotlin-parity.json java-parity.json \
                javascript-typescript-parity.json swift-parity.json objective-c-parity.json \
                c-abi-parity.json binding-obligations-m8.json; do
              test -f "build/ci/$evidence"
              cp "build/ci/$evidence" "$validation_root/$evidence"
            done
          else
            test "$M8_REQUIRED" != true
          fi
          if [ "$M11_REQUIRED" = true ]; then
            test -f "$validation_root/binding-obligations-m11.json"
          fi
          count=$(find "$validation_root" -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$count" -eq 2 || test "$count" -eq 11 || test "$count" -eq 16
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-ci-validation-${{ needs.plan.outputs.validation_tree }}
          path: build/ci/final-validation/*
          compression-level: 0
          retention-days: 90
      - if: steps.restore-reused-native-wrapper-release.outputs.restored == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true
          name: codex-agent-native-wrapper-packages-${{ needs.plan.outputs.validation_tree }}
          path: build/ci/native-wrapper-release
          compression-level: 0
          retention-days: 90
