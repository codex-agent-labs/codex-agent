name: Product Validation

on:
  workflow_call:
    inputs:
      baseCommit:
        required: false
        type: string
      validationCommit:
        required: false
        type: string
      validationTree:
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  dispatch-authorization:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: product-attestation
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      approved: ${{ steps.verify.outputs.approved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.validationCommit }}
      - id: verify
        name: Verify protected approval and exact candidate identity
        env:
          BASE_COMMIT: ${{ inputs.baseCommit }}
          VALIDATION_COMMIT: ${{ inputs.validationCommit }}
          VALIDATION_TREE: ${{ inputs.validationTree }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = codex-agent-labs/codex-agent
          test "$GITHUB_SHA" = "$VALIDATION_COMMIT"
          test "$(git rev-parse 'HEAD^{commit}')" = "$VALIDATION_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$VALIDATION_TREE"
          git cat-file -e "$BASE_COMMIT^{commit}"
          git merge-base --is-ancestor "$BASE_COMMIT" "$VALIDATION_COMMIT"
          environment=$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/product-attestation")
          jq -e '
            .name == "product-attestation" and
            .can_admins_bypass == false and
            .deployment_branch_policy == {
              protected_branches: false,
              custom_branch_policies: true
            } and
            any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length) > 0) and
            any(.protection_rules[]?; .type == "branch_policy")
          ' <<<"$environment" >/dev/null
          policies=$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/product-attestation/deployment-branch-policies")
          jq -e '.total_count > 0 and (.branch_policies | length) == .total_count' \
            <<<"$policies" >/dev/null
          echo 'approved=true' >> "$GITHUB_OUTPUT"

  workflow-lint:
    if: always()
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.3"
          cache: false
      - id: actionlint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/actionlint
          key: actionlint-v1-${{ runner.os }}-${{ runner.arch }}-v1.7.12
      - if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: '"$HOME/go/bin/actionlint"'
      - run: python3 -m unittest discover -s ci/tests -v
      - if: needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true'
        uses: ./.github/actions/setup-kmp
        with:
          cache-read-only: "true"
      - name: Reject configuration-cache-incompatible CI task actions
        if: needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true'
        run: >-
          ./gradlew :build-logic:test
          :codex-agent-runtime-desktop:verifyJavaScriptTypeScriptBindingParity
          :codex-agent-runtime-desktop:generateMingwX64MsvcImportLibrary
          --dry-run --configuration-cache --configuration-cache-problems=fail --no-build-cache
      - if: github.event_name == 'pull_request' && steps.actionlint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/actionlint
          key: ${{ steps.actionlint-cache.outputs.cache-primary-key }}

  plan:
    if: always()
    needs: dispatch-authorization
    runs-on: ubuntu-24.04
    outputs:
      merge_ready: ${{ steps.impact.outputs.merge_ready }}
      event_authorized: ${{ steps.event-authorization.outputs.authorized }}
      remote_build_authorized: ${{ steps.impact.outputs.remote_build_authorized }}
      remote_build_authorization_reason: ${{ steps.impact.outputs.remote_build_authorization_reason }}
      validation_commit: ${{ steps.impact.outputs.validation_commit }}
      validation_tree: ${{ steps.impact.outputs.validation_tree }}
      android_evidence_required: ${{ steps.impact.outputs.android_evidence_required }}
      plan_artifact: codex-agent-ci-plan-${{ steps.impact.outputs.validation_tree }}
      product_matrix: ${{ steps.impact.outputs.product_matrix }}
      consumer_matrix: ${{ steps.impact.outputs.consumer_matrix }}
      desktop_matrix: ${{ steps.impact.outputs.desktop_matrix }}
      any_desktop: ${{ steps.impact.outputs.any_desktop }}
      native_wrappers: ${{ steps.impact.outputs.native_wrappers }}
      any_apple: ${{ steps.impact.outputs.any_apple }}
      lane_android: ${{ steps.impact.outputs.lane_android }}
      lane_android_build: ${{ steps.impact.outputs.lane_android_build }}
      lane_android_test: ${{ steps.impact.outputs.lane_android_test }}
      lane_android_metadata: ${{ steps.impact.outputs.lane_android_metadata }}
      lane_desktop_linux_arm64: ${{ steps.impact.outputs.lane_desktop_linux_arm64 }}
      lane_desktop_linux_arm64_build: ${{ steps.impact.outputs.lane_desktop_linux_arm64_build }}
      lane_desktop_linux_arm64_test: ${{ steps.impact.outputs.lane_desktop_linux_arm64_test }}
      lane_desktop_linux_arm64_metadata: ${{ steps.impact.outputs.lane_desktop_linux_arm64_metadata }}
      lane_ios_swift_tests_test: ${{ steps.impact.outputs.lane_ios_swift_tests_test }}
      validation_reused: ${{ steps.validation-reuse.outputs.reused }}
      validation_source_run_id: ${{ steps.validation-reuse.outputs.source_run_id }}
    steps:
      - id: event-authorization
        env:
          EVENT_AUTHORIZED: >-
            ${{ github.event_name == 'merge_group' && github.event.action == 'checks_requested' && github.sha == github.event.merge_group.head_sha && github.ref == github.event.merge_group.head_ref || github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ci:remote-final' && github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'merge-ready') && contains(github.event.pull_request.labels.*.name, 'ci:remote-final') && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false && github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && needs.dispatch-authorization.result == 'success' && needs.dispatch-authorization.outputs.approved == 'true' && github.sha == inputs.validationCommit }}
        run: |
          case "$EVENT_AUTHORIZED" in
            true|false) ;;
            *) exit 1 ;;
          esac
          echo "authorized=$EVENT_AUTHORIZED" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.validationCommit || github.sha }}
      - id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.baseCommit }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || inputs.validationCommit }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          QUEUE_ENABLED: ${{ vars.CI_MERGE_QUEUE_ENABLED }}
          DISPATCH_APPROVED: ${{ needs.dispatch-authorization.result == 'success' && needs.dispatch-authorization.outputs.approved == 'true' }}
        run: |
          pr="$PR_NUMBER"
          if [ -z "$pr" ] && [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            pr=${GITHUB_REF#*pr-}
            pr=${pr%%-*}
          fi
          flags=()
          [ -z "$pr" ] || flags+=(--pull-request "$pr")
          [ "$DISPATCH_APPROVED" != true ] || flags+=(--dispatch-approved)
          if [ "$FORCE_FULL" = true ] || { [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$QUEUE_ENABLED" != true ]; }; then
            flags+=(--full)
          fi
          flags+=(--require-android-evidence)
          python3 ci/impact.py --base "$BASE_SHA" --target HEAD --head "$HEAD_SHA" \
            --event "$GITHUB_EVENT_NAME" --event-payload "$GITHUB_EVENT_PATH" \
            --github-ref "$GITHUB_REF" --github-sha "$GITHUB_SHA" \
            --output build/ci/impact-plan.json \
            --github-output "$GITHUB_OUTPUT" "${flags[@]}"
      - id: validation-reuse
        if: steps.event-authorization.outputs.authorized == 'true' && steps.impact.outputs.remote_build_authorized == 'true' && github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 ci/validation_reuse.py discover --plan build/ci/impact-plan.json
          --destination build/ci/reused-validation --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-ci-plan-${{ steps.impact.outputs.validation_tree }}
          path: build/ci
          compression-level: 0
          retention-days: 90

  product:
    if: needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true' && needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.product_matrix != '[]'
    needs: [workflow-lint, plan]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.product_matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.validation_commit }}
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: ${{ matrix.lane }}
          plan-artifact: ${{ needs.plan.outputs.plan_artifact }}
          validation-commit: ${{ needs.plan.outputs.validation_commit }}
          validation-tree: ${{ needs.plan.outputs.validation_tree }}
          build: ${{ matrix.build }}
          test: ${{ matrix.test }}
          metadata: ${{ matrix.metadata }}
          node-version: ${{ (matrix.lane == 'contracts' || contains(matrix.lane, 'node')) && '24.18.0' || 'none' }}

  android:
    if: needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true' && needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.lane_android == 'true'
    needs: [workflow-lint, plan]
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
      reused: ${{ steps.lane.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.validation_commit }}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: android
          plan-artifact: ${{ needs.plan.outputs.plan_artifact }}
          validation-commit: ${{ needs.plan.outputs.validation_commit }}
          validation-tree: ${{ needs.plan.outputs.validation_tree }}
          build: ${{ needs.plan.outputs.lane_android_build }}
          test: ${{ needs.plan.outputs.lane_android_test }}
          metadata: ${{ needs.plan.outputs.lane_android_metadata }}

  android-runtime-evidence:
    if: >-
      needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.plan.outputs.validation_reused != 'true' &&
      needs.plan.outputs.android_evidence_required == 'true'
    needs: [plan, android]
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: codex-agent-labs/codex-agent/.github/workflows/android-runtime-evidence.yml@main
    with:
      candidateCommit: ${{ needs.plan.outputs.validation_commit }}
      ciRunId: ${{ github.run_id }}
      artifactName: ${{ needs.android.outputs.artifact_name }}
      planArtifact: ${{ needs.plan.outputs.plan_artifact }}

  desktop:
    if: always() && needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true' && needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.any_desktop == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [workflow-lint, plan, product]
    uses: ./.github/workflows/desktop-runtime-evidence.yml
    with:
      planArtifact: ${{ needs.plan.outputs.plan_artifact }}
      validationCommit: ${{ needs.plan.outputs.validation_commit }}
      validationTree: ${{ needs.plan.outputs.validation_tree }}
      matrix: ${{ needs.plan.outputs.desktop_matrix }}
      linuxArm64: ${{ fromJSON(needs.plan.outputs.lane_desktop_linux_arm64) }}
      linuxArm64Build: ${{ fromJSON(needs.plan.outputs.lane_desktop_linux_arm64_build) }}
      linuxArm64Test: ${{ fromJSON(needs.plan.outputs.lane_desktop_linux_arm64_test) }}
      linuxArm64Metadata: ${{ fromJSON(needs.plan.outputs.lane_desktop_linux_arm64_metadata) }}
      nativeWrappers: ${{ fromJSON(needs.plan.outputs.native_wrappers) }}

  apple:
    if: needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true' && needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.any_apple == 'true'
    needs: [workflow-lint, plan]
    uses: ./.github/workflows/apple-runtime-evidence.yml
    with:
      planArtifact: ${{ needs.plan.outputs.plan_artifact }}
      validationCommit: ${{ needs.plan.outputs.validation_commit }}
      validationTree: ${{ needs.plan.outputs.validation_tree }}

  consumers:
    if: always() && needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true' && needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.consumer_matrix != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [workflow-lint, plan, product, android, android-runtime-evidence, desktop, apple]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.consumer_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.validation_commit }}
      - if: matrix.lane == 'consumer-desktop' || matrix.lane == 'consumer-node-js' || matrix.lane == 'consumer-node-wasm'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-agent-ci-desktop-*-${{ needs.plan.outputs.validation_tree }}
          path: build/ci/desktop-lanes
      - if: matrix.lane == 'consumer-desktop' || matrix.lane == 'consumer-node-js' || matrix.lane == 'consumer-node-wasm'
        shell: bash
        run: |
          mkdir -p build/ci/desktop-classifiers
          mapfile -t app_archives < <(find build/ci/desktop-lanes -type f -name '*-app-server-*.zip' -print)
          mapfile -t c_abi_archives < <(find build/ci/desktop-lanes -type f -name '*-c-abi-*.zip' -print)
          test "${#app_archives[@]}" -eq 5
          test "${#c_abi_archives[@]}" -eq 5
          cp "${app_archives[@]}" "${c_abi_archives[@]}" build/ci/desktop-classifiers/
          test "$(find build/ci/desktop-classifiers -type f -name '*-app-server-*.zip' | wc -l | tr -d ' ')" -eq 5
          test "$(find build/ci/desktop-classifiers -type f -name '*-c-abi-*.zip' | wc -l | tr -d ' ')" -eq 5
          printf 'DESKTOP_CLASSIFIERS=%s/build/ci/desktop-classifiers\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - if: matrix.lane == 'consumer-android'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-agent-ci-android-${{ needs.plan.outputs.validation_tree }}
          path: build/ci/android-lane
      - if: matrix.lane == 'consumer-android'
        shell: bash
        run: |
          aar=$(find build/ci/android-lane/payload -type f -name codex-agent-runtime-android-release.aar -print -quit)
          evidence=$(find build/ci/android-lane/payload -type f -name android-runtime-evidence.json -print -quit)
          test -n "$aar"
          if [ -n "$evidence" ]; then
            printf 'ANDROID_RELEASE_AAR=%s/%s\nANDROID_EVIDENCE=%s/%s\n' \
              "$GITHUB_WORKSPACE" "$aar" "$GITHUB_WORKSPACE" "$(dirname "$evidence")" >> "$GITHUB_ENV"
          fi
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: ${{ matrix.lane }}
          plan-artifact: ${{ needs.plan.outputs.plan_artifact }}
          validation-commit: ${{ needs.plan.outputs.validation_commit }}
          validation-tree: ${{ needs.plan.outputs.validation_tree }}
          build: ${{ matrix.build }}
          test: ${{ matrix.test }}
          metadata: ${{ matrix.metadata }}
          node-version: ${{ contains(matrix.lane, 'node') && '24.18.0' || 'none' }}

  merge-gate:
    name: CI / merge-gate
    if: always()
    needs: [workflow-lint, plan, product, android, android-runtime-evidence, desktop, apple, consumers]
    runs-on: ubuntu-24.04
    steps:
      - name: Require readiness and successful prerequisites
        env:
          EVENT_AUTHORIZED: ${{ needs.plan.outputs.event_authorized }}
          MERGE_READY: ${{ needs.plan.outputs.merge_ready }}
          REMOTE_BUILD_AUTHORIZED: ${{ needs.plan.outputs.remote_build_authorized }}
          REMOTE_BUILD_AUTHORIZATION_REASON: ${{ needs.plan.outputs.remote_build_authorization_reason }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$EVENT_AUTHORIZED" != true ]; then
            echo 'The workflow-owned event gate did not authorize remote product CI.' >&2
            exit 1
          fi
          if [ "$REMOTE_BUILD_AUTHORIZED" != true ]; then
            echo "Remote product CI is not authorized: $REMOTE_BUILD_AUTHORIZATION_REASON" >&2
            exit 1
          fi
          if [ "$MERGE_READY" != true ]; then
            echo 'The merge-ready label is required before product CI can pass.' >&2
            exit 1
          fi
          if grep -Eq 'failure|cancelled' <<<"$RESULTS"; then
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.validation_commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: build/ci/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-agent-ci-*
          path: build/ci/receipts
      - if: needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.native_wrappers == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-agent-native-wrapper-packages-${{ needs.plan.outputs.validation_tree }}
          path: build/ci/native-wrapper-release
      - if: needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.native_wrappers == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-agent-native-wrapper-host-*-${{ needs.plan.outputs.validation_tree }}
          path: build/ci/native-wrapper-hosts
      - name: Restore the exact reused native-wrapper release
        id: restore-reused-native-wrapper-release
        if: needs.plan.outputs.validation_reused == 'true'
        run: |
          source=build/ci/plan/reused-native-wrapper-release
          if [ ! -d "$source" ]; then
            echo 'restored=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -d "$source/packages"
          test -d "$source/evidence"
          test -d "$source/sdks"
          cp -R "$source" build/ci/native-wrapper-release
          echo 'restored=true' >> "$GITHUB_OUTPUT"
      - name: Require an exact receipt set
        env:
          VALIDATION_REUSED: ${{ needs.plan.outputs.validation_reused }}
        run: |
          if [ "$VALIDATION_REUSED" = true ]; then
            python3 ci/validation_reuse.py materialize --plan build/ci/plan/impact-plan.json \
              --destination build/ci/plan/reused-validation \
              --output build/ci/validation-receipt.json
          else
            python3 ci/receipt.py aggregate --plan build/ci/plan/impact-plan.json \
              --receipts build/ci/receipts --output build/ci/validation-receipt.json
          fi
      - name: Require complete six-language M8 binding parity
        if: >-
          needs.plan.outputs.validation_reused != 'true' &&
          (needs.plan.outputs.lane_ios_swift_tests_test == 'true' || needs.plan.outputs.native_wrappers == 'true')
        env:
          VALIDATION_COMMIT: ${{ needs.plan.outputs.validation_commit }}
          VALIDATION_TREE: ${{ needs.plan.outputs.validation_tree }}
        shell: bash
        run: |
          one_file() {
            mapfile -t matches < <(find build/ci/receipts -type f -name "$1" -print)
            test "${#matches[@]}" -eq 1
            printf '%s\n' "${matches[0]}"
          }
          one_desktop_file() {
            mapfile -t matches < <(find build/ci/receipts -type f \
              -path '*/payload/codex-agent-runtime-desktop/build/*' -name "$1" -print)
            test "${#matches[@]}" -eq 1
            printf '%s\n' "${matches[0]}"
          }
          binding_root=build/ci/cross-language-bindings
          mkdir -p "$binding_root/receipts" "$binding_root/c-abi-packages" "$binding_root/c-abi-proofs"
          release_tool=$(one_file codex-agent-release-tooling.jar)
          api_report=$(one_file canonical-api.json)
          coverage_receipt=$(one_file canonical-coverage.json)
          bootstrap=$(one_desktop_file bootstrap-evidence.json)
          scenario_proof=$(one_desktop_file c-abi-scenarios.json)
          for proof in c-abi-package-macos-arm64.json c-abi-package-macos-x64.json \
              c-abi-package-linux-arm64.json c-abi-package-linux-x64.json c-abi-package-windows-x64.json; do
            cp "$(one_desktop_file "$proof")" "$binding_root/c-abi-proofs/$proof"
          done
          mapfile -t versions < <(jq -r '.libraryVersion' "$binding_root"/c-abi-proofs/*.json | sort -u)
          test "${#versions[@]}" -eq 1
          version=${versions[0]}
          test -n "$version"
          for classifier in macos-arm64 macos-x64 linux-arm64 linux-x64 windows-x64; do
            archive=$(one_desktop_file "*-$version-c-abi-$classifier.zip")
            cp "$archive" "$binding_root/c-abi-packages/$(basename "$archive")"
          done
          java -jar "$release_tool" assemble-c-abi-binding-receipt \
            --repository "$PWD" \
            --bootstrap "$bootstrap" \
            --scenario-proof "$scenario_proof" \
            --packages "$binding_root/c-abi-packages" \
            --proofs "$binding_root/c-abi-proofs" \
            --version "$version" \
            --commit "$VALIDATION_COMMIT" \
            --tree "$VALIDATION_TREE" \
            --output "$binding_root/receipts/c-abi-parity.json"
          for receipt in kotlin-parity.json java-parity.json javascript-typescript-parity.json swift-parity.json objective-c-parity.json; do
            cp "$(one_file "$receipt")" "$binding_root/receipts/$receipt"
          done
          java -jar "$release_tool" audit-cross-language-bindings \
            --phase M8 \
            --api-report "$api_report" \
            --coverage-receipt "$coverage_receipt" \
            --receipts "$binding_root/receipts" \
            --output "$binding_root/binding-obligations-m8.json"
          jq -e '
            .result == "complete" and .phase == "M8" and
            .summary == {
              total: 6116, active: 3324, pending: 2780,
              excluded: 12, satisfied: 3324, missing: 0
            }
          ' "$binding_root/binding-obligations-m8.json" >/dev/null
          mkdir -p "$binding_root/m8"
          cp "$api_report" "$binding_root/m8/canonical-api.json"
          cp "$coverage_receipt" "$binding_root/m8/canonical-coverage.json"
          cp "$binding_root"/receipts/*.json "$binding_root/m8/"
          cp "$binding_root/binding-obligations-m8.json" "$binding_root/m8/"
          test "$(find "$binding_root/m8" -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 9
      - name: Require complete native-wrapper parity through M11
        if: needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.native_wrappers == 'true'
        env:
          VALIDATION_COMMIT: ${{ needs.plan.outputs.validation_commit }}
          VALIDATION_TREE: ${{ needs.plan.outputs.validation_tree }}
        shell: bash
        run: |
          set -euo pipefail
          one_file() {
            mapfile -t matches < <(find build/ci/receipts -type f -name "$1" -print)
            test "${#matches[@]}" -eq 1
            printf '%s\n' "${matches[0]}"
          }
          one_host_evidence() {
            mapfile -t matches < <(find build/ci/native-wrapper-hosts -type f \
              -path "*/evidence/$1/$2.tsv" -print)
            test "${#matches[@]}" -eq 1
            printf '%s\n' "${matches[0]}"
          }
          binding_root=build/ci/cross-language-bindings
          release=build/ci/native-wrapper-release
          release_tool=$(one_file codex-agent-release-tooling.jar)
          api_report=$(one_file canonical-api.json)
          coverage_receipt=$(one_file canonical-coverage.json)
          mapfile -t bootstraps < <(find build/ci/receipts -type f \
            -path '*/payload/codex-agent-runtime-desktop/build/*' \
            -name bootstrap-evidence.json -print)
          test "${#bootstraps[@]}" -eq 1
          bootstrap=${bootstraps[0]}
          for classifier in macos-arm64 macos-x64 linux-arm64 linux-x64 windows-x64; do
            for language in python csharp rust cpp dart; do
              evidence=$(one_host_evidence "$language" "$classifier")
              artifact_root=$(dirname "$(dirname "$(dirname "$evidence")")")
              test -f "$artifact_root/lane-receipt.json"
              host="$binding_root/host/$language"
              mkdir -p "$host"
              cp "$evidence" "$host/$classifier.tsv"
              cp "$artifact_root/lane-receipt.json" "$host/$classifier-lane-receipt.json"
            done
          done
          ./gradlew \
            :codex-agent-runtime-desktop:verifyPythonBindingParity \
            :codex-agent-runtime-desktop:verifyCSharpBindingParity \
            :codex-agent-runtime-desktop:verifyRustBindingParity \
            :codex-agent-runtime-desktop:verifyCppBindingParity \
            :codex-agent-runtime-desktop:verifyDartBindingParity \
            -PcodexAgent.nativeWrapperReleaseDirectory="$PWD/$release" \
            -PcodexAgent.nativeWrapperHostEvidenceDirectory="$PWD/$binding_root/host" \
            -PcodexAgent.nativeWrapperApiReport="$PWD/$api_report" \
            -PcodexAgent.nativeWrapperCoverageReceipt="$PWD/$coverage_receipt" \
            -PcodexAgent.nativeWrapperBootstrapEvidence="$PWD/$bootstrap" \
            --stacktrace

          languages=(python csharp rust cpp dart)
          phases=(M9_PYTHON M9_CSHARP M9_RUST M9_CPP M9_DART)
          satisfied=(3880 4436 4992 5548 6104)
          pending=(2224 1668 1112 556 0)
          previous="$binding_root/m8"
          for index in "${!languages[@]}"; do
            language=${languages[$index]}
            phase=${phases[$index]}
            phase_root="$binding_root/${phase,,}"
            receipts="$phase_root/receipts"
            mkdir -p "$receipts"
            for source in "$previous"/*-parity.json; do
              java -jar "$release_tool" advance-cross-language-binding-receipt \
                --phase "$phase" --source "$source" --output "$receipts/$(basename "$source")"
            done
            cp "codex-agent-runtime-desktop/build/reports/cross-language-api/bindings/$language-parity.json" \
              "$receipts/$language-parity.json"
            audit="$phase_root/binding-obligations-${phase,,}.json"
            java -jar "$release_tool" audit-cross-language-bindings \
              --phase "$phase" \
              --api-report "$api_report" \
              --coverage-receipt "$coverage_receipt" \
              --receipts "$receipts" \
              --output "$audit"
            jq -e --arg phase "$phase" --argjson satisfied "${satisfied[$index]}" \
              --argjson pending "${pending[$index]}" '
                .result == "complete" and .phase == $phase and
                .summary == {
                  total: 6116, active: 6104, pending: $pending,
                  excluded: 12, satisfied: $satisfied, missing: 0
                }
              ' "$audit" >/dev/null
            previous="$receipts"
          done

          m11_receipts="$binding_root/m11-receipts"
          mkdir -p "$m11_receipts"
          for source in "$previous"/*-parity.json; do
            java -jar "$release_tool" advance-cross-language-binding-receipt \
              --phase M11 --source "$source" --output "$m11_receipts/$(basename "$source")"
          done
          m11_audit="$binding_root/binding-obligations-m11.json"
          java -jar "$release_tool" audit-cross-language-bindings \
            --phase M11 \
            --api-report "$api_report" \
            --coverage-receipt "$coverage_receipt" \
            --receipts "$m11_receipts" \
            --output "$m11_audit"
          jq -e '
            .result == "complete" and .phase == "M11" and
            .summary == {
              total: 6116, active: 6104, pending: 0,
              excluded: 12, satisfied: 6104, missing: 0
            }
          ' "$m11_audit" >/dev/null
          mkdir -p "$binding_root/m11"
          cp "$api_report" "$binding_root/m11/canonical-api.json"
          cp "$coverage_receipt" "$binding_root/m11/canonical-coverage.json"
          cp "$m11_receipts"/*.json "$binding_root/m11/"
          cp "$m11_audit" "$binding_root/m11/"
          test "$(find "$binding_root/m11" -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 14
      - name: Stage the exact reusable validation artifact
        env:
          M8_REQUIRED: ${{ needs.plan.outputs.lane_ios_swift_tests_test }}
          M11_REQUIRED: ${{ needs.plan.outputs.native_wrappers }}
        shell: bash
        run: |
          validation_root=build/ci/final-validation
          mkdir -p "$validation_root"
          cp build/ci/plan/impact-plan.json "$validation_root/impact-plan.json"
          cp build/ci/validation-receipt.json "$validation_root/validation-receipt.json"
          if [ -d build/ci/cross-language-bindings/m11 ]; then
            cp build/ci/cross-language-bindings/m11/*.json "$validation_root/"
          elif [ -f build/ci/binding-obligations-m11.json ]; then
            for evidence in canonical-api.json canonical-coverage.json kotlin-parity.json java-parity.json \
                javascript-typescript-parity.json swift-parity.json objective-c-parity.json \
                c-abi-parity.json python-parity.json csharp-parity.json rust-parity.json \
                cpp-parity.json dart-parity.json binding-obligations-m11.json; do
              test -f "build/ci/$evidence"
              cp "build/ci/$evidence" "$validation_root/$evidence"
            done
          elif [ -d build/ci/cross-language-bindings/m8 ]; then
            cp build/ci/cross-language-bindings/m8/*.json "$validation_root/"
          elif [ -f build/ci/binding-obligations-m8.json ]; then
            for evidence in canonical-api.json canonical-coverage.json kotlin-parity.json java-parity.json \
                javascript-typescript-parity.json swift-parity.json objective-c-parity.json \
                c-abi-parity.json binding-obligations-m8.json; do
              test -f "build/ci/$evidence"
              cp "build/ci/$evidence" "$validation_root/$evidence"
            done
          else
            test "$M8_REQUIRED" != true
          fi
          if [ "$M11_REQUIRED" = true ]; then
            test -f "$validation_root/binding-obligations-m11.json"
          fi
          count=$(find "$validation_root" -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$count" -eq 2 || test "$count" -eq 11 || test "$count" -eq 16
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-ci-validation-${{ needs.plan.outputs.validation_tree }}
          path: build/ci/final-validation/*
          compression-level: 0
          retention-days: 90
      - if: steps.restore-reused-native-wrapper-release.outputs.restored == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true
          name: codex-agent-native-wrapper-packages-${{ needs.plan.outputs.validation_tree }}
          path: build/ci/native-wrapper-release
          compression-level: 0
          retention-days: 90
