name: Product Validation

on:
  workflow_call:
    inputs:
      trustedWorkflowSha:
        description: Reviewed SHA matching the caller's literal reusable workflow pin
        required: true
        type: string
      baseCommit:
        required: false
        type: string
      validationCommit:
        required: false
        type: string
      validationTree:
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  dispatch-authorization:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: product-attestation
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      approved: ${{ steps.verify.outputs.approved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.validationCommit }}
      - id: verify
        name: Verify protected approval and exact candidate identity
        env:
          BASE_COMMIT: ${{ inputs.baseCommit }}
          VALIDATION_COMMIT: ${{ inputs.validationCommit }}
          VALIDATION_TREE: ${{ inputs.validationTree }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = codex-agent-labs/codex-agent
          test "$GITHUB_SHA" = "$VALIDATION_COMMIT"
          test "$(git rev-parse 'HEAD^{commit}')" = "$VALIDATION_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$VALIDATION_TREE"
          git cat-file -e "$BASE_COMMIT^{commit}"
          git merge-base --is-ancestor "$BASE_COMMIT" "$VALIDATION_COMMIT"
          environment=$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/product-attestation")
          jq -e '
            .name == "product-attestation" and
            .can_admins_bypass == false and
            .deployment_branch_policy == {
              protected_branches: false,
              custom_branch_policies: true
            } and
            any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length) > 0) and
            any(.protection_rules[]?; .type == "branch_policy")
          ' <<<"$environment" >/dev/null
          policies=$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/product-attestation/deployment-branch-policies")
          jq -e '.total_count > 0 and (.branch_policies | length) == .total_count' \
            <<<"$policies" >/dev/null
          echo 'approved=true' >> "$GITHUB_OUTPUT"

  workflow-lint:
    if: always()
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.3"
          cache: false
      - id: actionlint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/actionlint
          key: actionlint-v1-${{ runner.os }}-${{ runner.arch }}-v1.7.12
      - if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: '"$HOME/go/bin/actionlint"'
      - run: python3 -m unittest discover -s ci/tests -v
      - if: needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true'
        uses: ./.github/actions/setup-kmp
        with:
          cache-read-only: "true"
      - name: Reject configuration-cache-incompatible CI task actions
        if: needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true'
        run: >-
          ./gradlew :build-logic:test
          :codex-agent-sdk:verifyJavaScriptTypeScriptBindingParity
          :codex-agent-runtime-desktop:generateMingwX64MsvcImportLibrary
          --dry-run --configuration-cache --configuration-cache-problems=fail --no-build-cache
      - if: github.event_name == 'pull_request' && steps.actionlint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/actionlint
          key: ${{ steps.actionlint-cache.outputs.cache-primary-key }}

  plan:
    if: always()
    needs: dispatch-authorization
    runs-on: ubuntu-24.04
    outputs:
      merge_ready: ${{ steps.impact.outputs.merge_ready }}
      event_authorized: ${{ steps.event-authorization.outputs.authorized }}
      remote_build_authorized: ${{ steps.impact.outputs.remote_build_authorized }}
      remote_build_authorization_reason: ${{ steps.impact.outputs.remote_build_authorization_reason }}
      validation_commit: ${{ steps.impact.outputs.validation_commit }}
      validation_tree: ${{ steps.impact.outputs.validation_tree }}
      android_evidence_required: ${{ steps.impact.outputs.android_evidence_required }}
      plan_artifact: codex-agent-ci-plan-${{ steps.impact.outputs.validation_tree }}
      plan_id: ${{ steps.upload_plan.outputs.artifact-id }}
      plan_digest: sha256:${{ steps.upload_plan.outputs.artifact-digest }}
      product_matrix: ${{ steps.impact.outputs.product_matrix }}
      consumer_matrix: ${{ steps.impact.outputs.consumer_matrix }}
      desktop_matrix: ${{ steps.impact.outputs.desktop_matrix }}
      any_desktop: ${{ steps.impact.outputs.any_desktop }}
      native_wrappers: ${{ steps.impact.outputs.native_wrappers }}
      any_apple: ${{ steps.impact.outputs.any_apple }}
      lane_android: ${{ steps.impact.outputs.lane_android }}
      lane_android_build: ${{ steps.impact.outputs.lane_android_build }}
      lane_android_test: ${{ steps.impact.outputs.lane_android_test }}
      lane_android_metadata: ${{ steps.impact.outputs.lane_android_metadata }}
      lane_node_js: ${{ steps.impact.outputs.lane_node_js }}
      lane_desktop_linux_arm64: ${{ steps.impact.outputs.lane_desktop_linux_arm64 }}
      lane_desktop_linux_arm64_build: ${{ steps.impact.outputs.lane_desktop_linux_arm64_build }}
      lane_desktop_linux_arm64_test: ${{ steps.impact.outputs.lane_desktop_linux_arm64_test }}
      lane_desktop_linux_arm64_metadata: ${{ steps.impact.outputs.lane_desktop_linux_arm64_metadata }}
      lane_ios_swift_tests_test: ${{ steps.impact.outputs.lane_ios_swift_tests_test }}
      validation_reused: ${{ steps.validation-reuse.outputs.reused }}
      validation_source_run_id: ${{ steps.validation-reuse.outputs.source_run_id }}
      product_full_reuse: ${{ steps.product-reuse.outputs.full_reuse }}
      product_target_jobs_required: ${{ steps.product-reuse.outputs.target_jobs_required }}
      product_reuse_reason: ${{ steps.product-reuse.outputs.product_reuse_reason }}
      contract_reconciliation_required: ${{ steps.product-reuse.outputs.contract_reconciliation_required }}
      contract_next_phase: ${{ steps.product-reuse.outputs.contract_next_phase }}
    steps:
      - id: event-authorization
        env:
          EVENT_AUTHORIZED: >-
            ${{ github.event_name == 'merge_group' && github.event.action == 'checks_requested' && github.sha == github.event.merge_group.head_sha && github.ref == github.event.merge_group.head_ref || github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ci:remote-final' && github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'merge-ready') && contains(github.event.pull_request.labels.*.name, 'ci:remote-final') && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false && github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && needs.dispatch-authorization.result == 'success' && needs.dispatch-authorization.outputs.approved == 'true' && github.sha == inputs.validationCommit }}
        run: |
          case "$EVENT_AUTHORIZED" in
            true|false) ;;
            *) exit 1 ;;
          esac
          echo "authorized=$EVENT_AUTHORIZED" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.validationCommit || github.sha }}
      - id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.baseCommit }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || inputs.validationCommit }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          QUEUE_ENABLED: ${{ vars.CI_MERGE_QUEUE_ENABLED }}
          DISPATCH_APPROVED: ${{ needs.dispatch-authorization.result == 'success' && needs.dispatch-authorization.outputs.approved == 'true' }}
        run: |
          pr="$PR_NUMBER"
          if [ -z "$pr" ] && [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            pr=${GITHUB_REF#*pr-}
            pr=${pr%%-*}
          fi
          flags=()
          [ -z "$pr" ] || flags+=(--pull-request "$pr")
          [ "$DISPATCH_APPROVED" != true ] || flags+=(--dispatch-approved)
          if [ "$FORCE_FULL" = true ] || { [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$QUEUE_ENABLED" != true ]; }; then
            flags+=(--full)
          fi
          flags+=(--require-android-evidence)
          python3 ci/impact.py --base "$BASE_SHA" --target HEAD --head "$HEAD_SHA" \
            --event "$GITHUB_EVENT_NAME" --event-payload "$GITHUB_EVENT_PATH" \
            --github-ref "$GITHUB_REF" --github-sha "$GITHUB_SHA" \
            --output build/ci/impact-plan.json \
            --github-output "$GITHUB_OUTPUT" "${flags[@]}"
      - id: validation-reuse
        if: steps.event-authorization.outputs.authorized == 'true' && steps.impact.outputs.remote_build_authorized == 'true' && github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 ci/validation_reuse.py discover --plan build/ci/impact-plan.json
          --destination build/ci/reused-validation --github-output "$GITHUB_OUTPUT"
      - id: product-reuse
        if: steps.event-authorization.outputs.authorized == 'true' && steps.impact.outputs.remote_build_authorized == 'true' && steps.validation-reuse.outputs.reused != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 ci/product_reuse.py discover --plan build/ci/impact-plan.json \
            --destination build/product-reuse --handoff build/ci/product-reuse \
            --github-output "$GITHUB_OUTPUT"
      - id: upload_plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          name: codex-agent-ci-plan-${{ steps.impact.outputs.validation_tree }}
          path: build/ci
          compression-level: 0
          retention-days: 90
      - if: steps.product-reuse.outputs.full_reuse == 'true' && steps.product-reuse.outputs.product_reuse_reason == 'verified-full-reuse'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          name: codex-agent-product-carrier-${{ steps.impact.outputs.validation_tree }}
          path: build/product-reuse/carrier
          compression-level: 0
          retention-days: 90

  product:
    name: product-${{ matrix.lane }}
    if: needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true' && needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.product_matrix != '[]'
    needs: [workflow-lint, plan]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.product_matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.validation_commit }}
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: ${{ matrix.lane }}
          plan-artifact: ${{ needs.plan.outputs.plan_artifact }}
          validation-commit: ${{ needs.plan.outputs.validation_commit }}
          validation-tree: ${{ needs.plan.outputs.validation_tree }}
          build: ${{ matrix.build }}
          test: ${{ matrix.test }}
          metadata: ${{ matrix.metadata }}
          node-version: ${{ (matrix.lane == 'contracts' || contains(matrix.lane, 'node')) && '24.18.0' || 'none' }}

  contract-continuation:
    name: contract-continuation
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.plan.outputs.validation_reused != 'true' &&
      needs.plan.outputs.contract_reconciliation_required == 'true' &&
      needs.plan.outputs.contract_next_phase != 'none'
    needs: [workflow-lint, plan, product]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      contract_complete: ${{ steps.select_final_state.outputs.contract_complete }}
      state_artifact: codex-agent-contract-phase-state-${{ needs.plan.outputs.validation_tree }}
      state_id: ${{ steps.upload_final_state.outputs.artifact-id }}
      state_digest: sha256:${{ steps.upload_final_state.outputs.artifact-digest }}
      attestation_inputs_artifact: codex-agent-contract-attestation-inputs-${{ needs.plan.outputs.validation_tree }}
      attestation_inputs_id: ${{ steps.upload_attestation_inputs.outputs.artifact-id }}
      attestation_inputs_digest: sha256:${{ steps.upload_attestation_inputs.outputs.artifact-digest }}
      contract_version: ${{ steps.capture_attestation_inputs.outputs.contract_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.validation_commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: build/ci
      - if: needs.plan.outputs.contract_next_phase == 'binary'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-agent-product-phase-contract-contract-binary-common-${{ needs.plan.outputs.validation_tree }}
          path: build/product-phase/contract-contract-binary-common
      - uses: ./.github/actions/setup-kmp
        with:
          cache-read-only: "true"
      - name: Select Contract producer trust
        shell: bash
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) trust_domain=development ;;
            merge_group) trust_domain=release ;;
            *) exit 1 ;;
          esac
          printf 'CONTRACT_TRUST_DOMAIN=%s\n' "$trust_domain" >> "$GITHUB_ENV"
      - name: Reconcile the fresh Contract binary phase
        id: reconcile_binary
        if: needs.plan.outputs.contract_next_phase == 'binary'
        shell: bash
        run: |
          python3 ci/product_reuse.py advance-contract \
            --plan build/ci/impact-plan.json \
            --discovery-root build/ci/product-reuse \
            --phase-shard build/product-phase/contract-contract-binary-common \
            --destination build/contract-state/after-binary \
            --github-output "$GITHUB_OUTPUT"
      - name: Select Contract state after binary reconciliation
        id: select_after_binary
        env:
          INITIAL_NEXT_PHASE: ${{ needs.plan.outputs.contract_next_phase }}
          RECONCILED_COMPLETE: ${{ steps.reconcile_binary.outputs.contract_complete }}
          RECONCILED_NEXT_PHASE: ${{ steps.reconcile_binary.outputs.next_phase }}
        shell: bash
        run: |
          state=build/ci/product-reuse
          next_phase=$INITIAL_NEXT_PHASE
          complete=false
          if [ "$INITIAL_NEXT_PHASE" = binary ]; then
            state=build/contract-state/after-binary
            next_phase=$RECONCILED_NEXT_PHASE
            complete=$RECONCILED_COMPLETE
          fi
          case "$next_phase:$complete" in
            package:false|validation:false|metadata:false|none:true) ;;
            *) exit 1 ;;
          esac
          printf 'state=%s\nnext_phase=%s\ncontract_complete=%s\n' \
            "$state" "$next_phase" "$complete" >> "$GITHUB_OUTPUT"
      - name: Materialize the exact Contract binary stage and receipt
        if: steps.select_after_binary.outputs.next_phase == 'package' || steps.select_after_binary.outputs.next_phase == 'validation'
        shell: bash
        run: |
          python3 ci/product_reuse.py materialize-contract \
            --plan build/ci/impact-plan.json \
            --state-root "${{ steps.select_after_binary.outputs.state }}" \
            --phase binary \
            --destination build/contract-handoff/binary \
            --with-receipt
      - name: Produce and finalize the Contract package phase
        if: steps.select_after_binary.outputs.next_phase == 'package'
        env:
          VALIDATION_COMMIT: ${{ needs.plan.outputs.validation_commit }}
          VALIDATION_TREE: ${{ needs.plan.outputs.validation_tree }}
        shell: bash
        run: |
          ./gradlew ciProductPhase \
            -PcodexAgent.product=contract \
            -PcodexAgent.component=contract \
            -PcodexAgent.phase=package \
            -PcodexAgent.contractBinaryStageRoot="$PWD/build/contract-handoff/binary/stage" \
            -PcodexAgent.candidateCommit="$VALIDATION_COMMIT" \
            -PcodexAgent.candidateTree="$VALIDATION_TREE" \
            --stacktrace
          IFS= read -r contract_version < gradle/release/versions/contract.txt
          python3 -m ci.products restore store-phase \
            --stage-root build/product-stage/contract/contract/package \
            --phase-plan "${{ steps.select_after_binary.outputs.state }}/phase-plans/contract-contract-package-common.json" \
            --producer "${{ steps.select_after_binary.outputs.state }}/producer.json" \
            --product-version "$contract_version" \
            --trust-domain "$CONTRACT_TRUST_DOMAIN" \
            --destination build/product-phase/contract-contract-package-common
      - name: Upload the Contract package phase
        if: steps.select_after_binary.outputs.next_phase == 'package'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          name: codex-agent-product-phase-contract-contract-package-common-${{ needs.plan.outputs.validation_tree }}
          path: build/product-phase/contract-contract-package-common
          compression-level: 0
          retention-days: 90
      - name: Reconcile the fresh Contract package phase
        id: reconcile_package
        if: steps.select_after_binary.outputs.next_phase == 'package'
        shell: bash
        run: |
          python3 ci/product_reuse.py advance-contract \
            --plan build/ci/impact-plan.json \
            --discovery-root build/ci/product-reuse \
            --state-root "${{ steps.select_after_binary.outputs.state }}" \
            --phase-shard build/product-phase/contract-contract-package-common \
            --destination build/contract-state/after-package \
            --github-output "$GITHUB_OUTPUT"
      - name: Select Contract state after package reconciliation
        id: select_after_package
        env:
          CURRENT_COMPLETE: ${{ steps.select_after_binary.outputs.contract_complete }}
          CURRENT_NEXT_PHASE: ${{ steps.select_after_binary.outputs.next_phase }}
          CURRENT_STATE: ${{ steps.select_after_binary.outputs.state }}
          RECONCILED_COMPLETE: ${{ steps.reconcile_package.outputs.contract_complete }}
          RECONCILED_NEXT_PHASE: ${{ steps.reconcile_package.outputs.next_phase }}
        shell: bash
        run: |
          state=$CURRENT_STATE
          next_phase=$CURRENT_NEXT_PHASE
          complete=$CURRENT_COMPLETE
          if [ "$CURRENT_NEXT_PHASE" = package ]; then
            state=build/contract-state/after-package
            next_phase=$RECONCILED_NEXT_PHASE
            complete=$RECONCILED_COMPLETE
          fi
          case "$next_phase:$complete" in
            validation:false|metadata:false|none:true) ;;
            *) exit 1 ;;
          esac
          printf 'state=%s\nnext_phase=%s\ncontract_complete=%s\n' \
            "$state" "$next_phase" "$complete" >> "$GITHUB_OUTPUT"
      - name: Materialize the exact Contract package stage and receipt
        if: steps.select_after_package.outputs.next_phase == 'validation'
        shell: bash
        run: |
          python3 ci/product_reuse.py materialize-contract \
            --plan build/ci/impact-plan.json \
            --state-root "${{ steps.select_after_package.outputs.state }}" \
            --phase package \
            --destination build/contract-handoff/package \
            --with-receipt
      - name: Produce and finalize the Contract validation phase
        if: steps.select_after_package.outputs.next_phase == 'validation'
        env:
          VALIDATION_COMMIT: ${{ needs.plan.outputs.validation_commit }}
          VALIDATION_TREE: ${{ needs.plan.outputs.validation_tree }}
        shell: bash
        run: |
          binary_receipt=$PWD/build/contract-handoff/binary/receipt/phase-receipt.json
          package_receipt=$PWD/build/contract-handoff/package/receipt/phase-receipt.json
          binary_digest=sha256:$(sha256sum "$binary_receipt" | cut -d' ' -f1)
          package_digest=sha256:$(sha256sum "$package_receipt" | cut -d' ' -f1)
          ./gradlew ciProductPhase \
            -PcodexAgent.product=contract \
            -PcodexAgent.component=contract \
            -PcodexAgent.phase=validation \
            -PcodexAgent.contractPackageStageRoot="$PWD/build/contract-handoff/package/stage" \
            -PcodexAgent.contractPackageReceipt="$package_receipt" \
            -PcodexAgent.contractPackageReceiptSha256="$package_digest" \
            -PcodexAgent.contractBinaryReceipt="$binary_receipt" \
            -PcodexAgent.contractBinaryReceiptSha256="$binary_digest" \
            -PcodexAgent.candidateCommit="$VALIDATION_COMMIT" \
            -PcodexAgent.candidateTree="$VALIDATION_TREE" \
            --stacktrace
          IFS= read -r contract_version < gradle/release/versions/contract.txt
          python3 -m ci.products restore store-phase \
            --stage-root build/product-stage/contract/contract/validation \
            --phase-plan "${{ steps.select_after_package.outputs.state }}/phase-plans/contract-contract-validation-common.json" \
            --producer "${{ steps.select_after_package.outputs.state }}/producer.json" \
            --product-version "$contract_version" \
            --trust-domain "$CONTRACT_TRUST_DOMAIN" \
            --destination build/product-phase/contract-contract-validation-common
      - name: Upload the Contract validation phase
        if: steps.select_after_package.outputs.next_phase == 'validation'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          name: codex-agent-product-phase-contract-contract-validation-common-${{ needs.plan.outputs.validation_tree }}
          path: build/product-phase/contract-contract-validation-common
          compression-level: 0
          retention-days: 90
      - name: Reconcile the fresh Contract validation phase
        id: reconcile_validation
        if: steps.select_after_package.outputs.next_phase == 'validation'
        shell: bash
        run: |
          python3 ci/product_reuse.py advance-contract \
            --plan build/ci/impact-plan.json \
            --discovery-root build/ci/product-reuse \
            --state-root "${{ steps.select_after_package.outputs.state }}" \
            --phase-shard build/product-phase/contract-contract-validation-common \
            --destination build/contract-state/after-validation \
            --github-output "$GITHUB_OUTPUT"
      - name: Select Contract state after validation reconciliation
        id: select_after_validation
        env:
          CURRENT_COMPLETE: ${{ steps.select_after_package.outputs.contract_complete }}
          CURRENT_NEXT_PHASE: ${{ steps.select_after_package.outputs.next_phase }}
          CURRENT_STATE: ${{ steps.select_after_package.outputs.state }}
          RECONCILED_COMPLETE: ${{ steps.reconcile_validation.outputs.contract_complete }}
          RECONCILED_NEXT_PHASE: ${{ steps.reconcile_validation.outputs.next_phase }}
        shell: bash
        run: |
          state=$CURRENT_STATE
          next_phase=$CURRENT_NEXT_PHASE
          complete=$CURRENT_COMPLETE
          if [ "$CURRENT_NEXT_PHASE" = validation ]; then
            state=build/contract-state/after-validation
            next_phase=$RECONCILED_NEXT_PHASE
            complete=$RECONCILED_COMPLETE
          fi
          case "$next_phase:$complete" in
            metadata:false|none:true) ;;
            *) exit 1 ;;
          esac
          printf 'state=%s\nnext_phase=%s\ncontract_complete=%s\n' \
            "$state" "$next_phase" "$complete" >> "$GITHUB_OUTPUT"
      - name: Materialize the exact Contract validation stage and receipt
        if: steps.select_after_validation.outputs.next_phase == 'metadata'
        shell: bash
        run: |
          python3 ci/product_reuse.py materialize-contract \
            --plan build/ci/impact-plan.json \
            --state-root "${{ steps.select_after_validation.outputs.state }}" \
            --phase validation \
            --destination build/contract-handoff/validation \
            --with-receipt
      - name: Produce and finalize the deterministic Contract metadata phase
        if: steps.select_after_validation.outputs.next_phase == 'metadata'
        env:
          VALIDATION_COMMIT: ${{ needs.plan.outputs.validation_commit }}
          VALIDATION_TREE: ${{ needs.plan.outputs.validation_tree }}
        shell: bash
        run: |
          ./gradlew ciProductPhase \
            -PcodexAgent.product=contract \
            -PcodexAgent.component=contract \
            -PcodexAgent.phase=metadata \
            -PcodexAgent.contractValidationStageRoot="$PWD/build/contract-handoff/validation/stage" \
            -PcodexAgent.candidateCommit="$VALIDATION_COMMIT" \
            -PcodexAgent.candidateTree="$VALIDATION_TREE" \
            --stacktrace
          IFS= read -r contract_version < gradle/release/versions/contract.txt
          python3 -m ci.products restore store-phase \
            --stage-root build/product-stage/contract/contract/metadata \
            --phase-plan "${{ steps.select_after_validation.outputs.state }}/phase-plans/contract-contract-metadata-common.json" \
            --producer "${{ steps.select_after_validation.outputs.state }}/producer.json" \
            --product-version "$contract_version" \
            --trust-domain "$CONTRACT_TRUST_DOMAIN" \
            --destination build/product-phase/contract-contract-metadata-common
      - name: Upload the Contract metadata phase
        if: steps.select_after_validation.outputs.next_phase == 'metadata'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          name: codex-agent-product-phase-contract-contract-metadata-common-${{ needs.plan.outputs.validation_tree }}
          path: build/product-phase/contract-contract-metadata-common
          compression-level: 0
          retention-days: 90
      - name: Reconcile the fresh Contract metadata phase
        id: reconcile_metadata
        if: steps.select_after_validation.outputs.next_phase == 'metadata'
        shell: bash
        run: |
          python3 ci/product_reuse.py advance-contract \
            --plan build/ci/impact-plan.json \
            --discovery-root build/ci/product-reuse \
            --state-root "${{ steps.select_after_validation.outputs.state }}" \
            --phase-shard build/product-phase/contract-contract-metadata-common \
            --destination build/contract-state/after-metadata \
            --github-output "$GITHUB_OUTPUT"
      - name: Select final Contract continuation state
        id: select_final_state
        env:
          CURRENT_COMPLETE: ${{ steps.select_after_validation.outputs.contract_complete }}
          CURRENT_NEXT_PHASE: ${{ steps.select_after_validation.outputs.next_phase }}
          CURRENT_STATE: ${{ steps.select_after_validation.outputs.state }}
          RECONCILED_COMPLETE: ${{ steps.reconcile_metadata.outputs.contract_complete }}
          RECONCILED_NEXT_PHASE: ${{ steps.reconcile_metadata.outputs.next_phase }}
        shell: bash
        run: |
          state=$CURRENT_STATE
          next_phase=$CURRENT_NEXT_PHASE
          complete=$CURRENT_COMPLETE
          if [ "$CURRENT_NEXT_PHASE" = metadata ]; then
            state=build/contract-state/after-metadata
            next_phase=$RECONCILED_NEXT_PHASE
            complete=$RECONCILED_COMPLETE
          fi
          test "$next_phase:$complete" = none:true
          printf 'state=%s\nnext_phase=%s\ncontract_complete=%s\n' \
            "$state" "$next_phase" "$complete" >> "$GITHUB_OUTPUT"
      - name: Preserve the complete unsigned Contract state for separate attestation
        id: upload_final_state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          name: codex-agent-contract-phase-state-${{ needs.plan.outputs.validation_tree }}
          path: ${{ steps.select_final_state.outputs.state }}
          compression-level: 0
          retention-days: 90
      - name: Capture unsigned Contract attestation inputs from exact original phases
        id: capture_attestation_inputs
        shell: bash
        run: |
          for phase in binary package validation metadata; do
            python3 ci/product_reuse.py materialize-contract \
              --plan build/ci/impact-plan.json \
              --state-root "${{ steps.select_final_state.outputs.state }}" \
              --phase "$phase" \
              --destination "build/contract-attestation-inputs/phases/$phase" \
              --with-receipt
          done
          IFS= read -r contract_version < gradle/release/versions/contract.txt
          originals=build/contract-attestation-inputs/phases
          printf 'contract_version=%s\n' "$contract_version" >> "$GITHUB_OUTPUT"
          python3 -m ci.products.contract_attestation capture-closure \
            --payload "$originals/metadata/stage/outputs/codex-agent-contract-$contract_version.zip" \
            --execution-archive "$originals/binary/stage/outputs/execution/contract-execution.zip" \
            --binary-receipt "$originals/binary/receipt/phase-receipt.json" \
            --package-receipt "$originals/package/receipt/phase-receipt.json" \
            --validation-receipt "$originals/validation/receipt/phase-receipt.json" \
            --metadata-receipt "$originals/metadata/receipt/phase-receipt.json" \
            --output-directory build/contract-attestation-inputs/execution-closure
      - name: Preserve unsigned payload and full original execution closure
        id: upload_attestation_inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          name: codex-agent-contract-attestation-inputs-${{ needs.plan.outputs.validation_tree }}
          path: |
            build/contract-attestation-inputs/phases/metadata/stage
            build/contract-attestation-inputs/execution-closure
          compression-level: 0
          retention-days: 90

  contract-attestation:
    name: contract-attestation
    if: >-
      needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.plan.outputs.validation_reused != 'true' &&
      github.event_name != 'workflow_dispatch' &&
      needs.contract-continuation.result == 'success' &&
      needs.contract-continuation.outputs.contract_complete == 'true'
    needs: [workflow-lint, plan, contract-continuation]
    runs-on: ubuntu-24.04
    environment: product-attestation
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: codex-agent-contract-release-handoff-${{ needs.plan.outputs.validation_tree }}
      artifact_id: ${{ steps.upload_attestation.outputs.artifact-id }}
      artifact_digest: sha256:${{ steps.upload_attestation.outputs.artifact-digest }}
    steps:
      - name: Check out reviewed signer code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codex-agent-labs/codex-agent
          ref: 0953cb9ca87d30cf08b0f1227a204b701cafea75
          path: trusted-source
          persist-credentials: false
      - name: Authenticate original Contract bytes and establish detached release trust
        id: attest
        env:
          TRUSTED_SOURCE_SHA: 0953cb9ca87d30cf08b0f1227a204b701cafea75
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
          ARTIFACT_ID: ${{ needs.contract-continuation.outputs.attestation_inputs_id }}
          ARTIFACT_SHA256: ${{ needs.contract-continuation.outputs.attestation_inputs_digest }}
          CONTRACT_VERSION: ${{ needs.contract-continuation.outputs.contract_version }}
          VALIDATION_TREE: ${{ needs.plan.outputs.validation_tree }}
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_AGENT_PRODUCT_ED25519_PRIVATE_KEY: ${{ secrets.CODEX_AGENT_PRODUCT_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 -B trusted-source/ci/contract_release.py \
            --repository-root "$GITHUB_WORKSPACE/trusted-source" \
            --destination "$RUNNER_TEMP/contract-release-evidence" \
            --trusted-source-sha "$TRUSTED_SOURCE_SHA" \
            --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
            --artifact-id "$ARTIFACT_ID" --artifact-sha256 "$ARTIFACT_SHA256" \
            --contract-version "$CONTRACT_VERSION" --validation-tree "$VALIDATION_TREE"
      - name: Preserve the exact release handoff and all external source evidence
        id: upload_attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          name: codex-agent-contract-release-handoff-${{ needs.plan.outputs.validation_tree }}
          path: ${{ runner.temp }}/contract-release-evidence
          compression-level: 0
          retention-days: 90

  product-resume:
    name: product-resume
    if: >-
      needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.plan.outputs.validation_reused != 'true' &&
      github.event_name != 'workflow_dispatch' &&
      needs.contract-continuation.result == 'success' &&
      needs.contract-continuation.outputs.contract_complete == 'true' &&
      needs.contract-attestation.result == 'success'
    needs: [workflow-lint, plan, contract-continuation, contract-attestation]
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: codex-agent-product-resume-${{ needs.plan.outputs.validation_tree }}
      artifact_id: ${{ steps.upload_resume.outputs.artifact-id }}
      artifact_digest: sha256:${{ steps.upload_resume.outputs.artifact-digest }}
      full_reuse: ${{ steps.resume.outputs.full_reuse }}
      target_jobs_required: ${{ steps.resume.outputs.target_jobs_required }}
      runtime_matrix: ${{ steps.runtime_matrix.outputs.runtime_matrix }}
      runtime_workers_required: ${{ steps.runtime_matrix.outputs.runtime_workers_required }}
      supervisor_key: ${{ steps.runtime_matrix.outputs.supervisor_key }}
      wave_failed: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_id }}
          path: build/product-resume-plan
          merge-multiple: true
      - name: Capture exact original plan, completed state and signed external evidence
        env:
          PLAN_ARTIFACT_ID: ${{ needs.plan.outputs.plan_id }}
          PLAN_ARTIFACT_SHA256: ${{ needs.plan.outputs.plan_digest }}
          STATE_ARTIFACT_ID: ${{ needs.contract-continuation.outputs.state_id }}
          STATE_ARTIFACT_SHA256: ${{ needs.contract-continuation.outputs.state_digest }}
          RELEASE_ARTIFACT_ID: ${{ needs.contract-attestation.outputs.artifact_id }}
          RELEASE_ARTIFACT_SHA256: ${{ needs.contract-attestation.outputs.artifact_digest }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 ci/product_reuse.py capture-product-resume-inputs \
            --plan build/product-resume-plan/impact-plan.json \
            --plan-artifact-id "$PLAN_ARTIFACT_ID" --plan-artifact-sha256 "$PLAN_ARTIFACT_SHA256" \
            --state-artifact-id "$STATE_ARTIFACT_ID" --state-artifact-sha256 "$STATE_ARTIFACT_SHA256" \
            --release-artifact-id "$RELEASE_ARTIFACT_ID" --release-artifact-sha256 "$RELEASE_ARTIFACT_SHA256" \
            --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
            --destination build/product-resume-inputs
      - name: Resume the existing product planner from authenticated Contract bytes
        id: resume
        run: |
          python3 ci/product_reuse.py resume-products \
            --plan build/product-resume-inputs/plan/impact-plan.json \
            --discovery-root build/product-resume-inputs/plan/product-reuse \
            --state-root build/product-resume-inputs/state \
            --contract-handoff build/product-resume-inputs/release/contract-input \
            --destination build/product-resume-state \
            --github-output "$GITHUB_OUTPUT"
      - name: Elect Runtime workers from the verified resumed state
        id: runtime_matrix
        run: |
          python3 -B ci/runtime_workflow.py matrix \
            --plan build/product-resume-inputs/plan/impact-plan.json \
            --discovery-root build/product-resume-state --state-root build/product-resume-state \
            --github-output "$GITHUB_OUTPUT"
      - name: Preserve the resumed state and all original transport evidence
        id: upload_resume
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          name: codex-agent-product-resume-${{ needs.plan.outputs.validation_tree }}
          path: |
            build/product-resume-inputs
            build/product-resume-state
          compression-level: 0
          retention-days: 90

  runtime-linux-arm64-supervisor:
    name: runtime-linux-arm64-supervisor
    needs: [plan, product-resume]
    if: needs.product-resume.outputs.supervisor_key != ''
    runs-on: ubuntu-24.04-arm
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: sha256:${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - id: captured
        uses: ./.github/actions/capture-runtime-state
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.product-resume.outputs.artifact_id }}
          artifact-sha256: ${{ needs.product-resume.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          component: linux-arm64
          phase: binary
          target: linux-arm64
          build-key: ${{ needs.product-resume.outputs.supervisor_key }}
      - uses: ./.github/actions/setup-kmp
        with:
          product-worker: 'true'
          cache-read-only: 'true'
      - id: execute
        env:
          PLAN: ${{ steps.captured.outputs.plan-path }}
          DISCOVERY: ${{ steps.captured.outputs.discovery-root }}
          STATE: ${{ steps.captured.outputs.state-root }}
          BUILD_KEY: ${{ needs.product-resume.outputs.supervisor_key }}
        run: |
          echo "key_hex=${BUILD_KEY#sha256:}" >> "$GITHUB_OUTPUT"
          python3 -B ci/product_reuse.py execute-runtime-supervisor \
            --plan "$PLAN" --discovery-root "$DISCOVERY" --state-root "$STATE" \
            --expected-build-key "$BUILD_KEY" --destination build/runtime-supervisor
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-runtime-supervisor-linux-arm64-${{ steps.execute.outputs.key_hex }}-${{ needs.plan.outputs.validation_tree }}
          path: build/runtime-supervisor/supervisor
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          compression-level: 0
          retention-days: 90
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-runtime-supervisor-diagnostics-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: |
            build/runtime-supervisor
            build/runtime-input/capture-transport.json
          if-no-files-found: warn
          overwrite: false
          include-hidden-files: true
          retention-days: 90

  runtime-workers-1:
    name: runtime-${{ matrix.component }}-${{ matrix.phase }}-${{ matrix.target }}
    needs: [plan, product-resume, runtime-linux-arm64-supervisor]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.product-resume.result == 'success' &&
      needs.product-resume.outputs.runtime_workers_required == 'true' &&
      needs.product-resume.outputs.wave_failed != 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.product-resume.outputs.runtime_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DEVELOPER_DIR: ${{ startsWith(matrix.runner, 'macos-') && '/Applications/Xcode_26.6.app/Contents/Developer' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - id: identity
        shell: bash
        env:
          BUILD_KEY: ${{ matrix.buildKey }}
        run: echo "key_hex=${BUILD_KEY#sha256:}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/run-runtime-product-phase
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.product-resume.outputs.artifact_id }}
          artifact-sha256: ${{ needs.product-resume.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          state-wave: '0'
          component: ${{ matrix.component }}
          phase: ${{ matrix.phase }}
          target: ${{ matrix.target }}
          build-key: ${{ matrix.buildKey }}
          revision: ${{ needs.plan.outputs.validation_commit }}
          supervisor-id: ${{ needs.runtime-linux-arm64-supervisor.outputs.artifact_id }}
          supervisor-sha256: ${{ needs.runtime-linux-arm64-supervisor.outputs.artifact_digest }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-runtime-worker-${{ matrix.component }}-${{ matrix.phase }}-${{ matrix.target }}-${{ steps.identity.outputs.key_hex }}-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: build/runtime-worker
          if-no-files-found: warn
          overwrite: false
          include-hidden-files: true
          compression-level: 0
          retention-days: 90
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-runtime-worker-diagnostics-${{ matrix.component }}-${{ matrix.phase }}-${{ matrix.target }}-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: |
            build/runtime-input/capture-transport.json
            build/runtime-plan
          if-no-files-found: warn
          overwrite: false
          include-hidden-files: true
          retention-days: 90

  runtime-collect-1:
    name: runtime-collect-1
    needs: [plan, product-resume, runtime-workers-1]
    if: >-
      always() && needs.product-resume.result == 'success' &&
      needs.product-resume.outputs.runtime_workers_required == 'true' &&
      needs.product-resume.outputs.wave_failed != 'true'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.collect.outputs.artifact-id }}
      artifact_digest: ${{ steps.collect.outputs.artifact-sha256 }}
      runtime_matrix: ${{ steps.collect.outputs.runtime-matrix }}
      runtime_workers_required: ${{ steps.collect.outputs.runtime-workers-required }}
      wave_failed: ${{ steps.collect.outputs.wave-failed }}
      full_reuse: ${{ steps.collect.outputs.full-reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - id: collect
        uses: ./.github/actions/collect-runtime-wave
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.product-resume.outputs.artifact_id }}
          artifact-sha256: ${{ needs.product-resume.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          state-wave: '0'
          wave: '1'
          tree: ${{ needs.plan.outputs.validation_tree }}

  runtime-workers-2:
    name: runtime-${{ matrix.component }}-${{ matrix.phase }}-${{ matrix.target }}
    needs: [plan, runtime-collect-1]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.runtime-collect-1.result == 'success' &&
      needs.runtime-collect-1.outputs.runtime_workers_required == 'true' &&
      needs.runtime-collect-1.outputs.wave_failed != 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtime-collect-1.outputs.runtime_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DEVELOPER_DIR: ${{ startsWith(matrix.runner, 'macos-') && '/Applications/Xcode_26.6.app/Contents/Developer' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - id: identity
        shell: bash
        env:
          BUILD_KEY: ${{ matrix.buildKey }}
        run: echo "key_hex=${BUILD_KEY#sha256:}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/run-runtime-product-phase
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.runtime-collect-1.outputs.artifact_id }}
          artifact-sha256: ${{ needs.runtime-collect-1.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          state-wave: '1'
          component: ${{ matrix.component }}
          phase: ${{ matrix.phase }}
          target: ${{ matrix.target }}
          build-key: ${{ matrix.buildKey }}
          revision: ${{ needs.plan.outputs.validation_commit }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-runtime-worker-${{ matrix.component }}-${{ matrix.phase }}-${{ matrix.target }}-${{ steps.identity.outputs.key_hex }}-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: build/runtime-worker
          if-no-files-found: warn
          overwrite: false
          include-hidden-files: true
          compression-level: 0
          retention-days: 90
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-runtime-worker-diagnostics-${{ matrix.component }}-${{ matrix.phase }}-${{ matrix.target }}-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: |
            build/runtime-input/capture-transport.json
            build/runtime-plan
          if-no-files-found: warn
          overwrite: false
          include-hidden-files: true
          retention-days: 90

  runtime-collect-2:
    name: runtime-collect-2
    needs: [plan, runtime-collect-1, runtime-workers-2]
    if: >-
      always() && needs.runtime-collect-1.result == 'success' &&
      needs.runtime-collect-1.outputs.runtime_workers_required == 'true' &&
      needs.runtime-collect-1.outputs.wave_failed != 'true'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.collect.outputs.artifact-id }}
      artifact_digest: ${{ steps.collect.outputs.artifact-sha256 }}
      runtime_matrix: ${{ steps.collect.outputs.runtime-matrix }}
      runtime_workers_required: ${{ steps.collect.outputs.runtime-workers-required }}
      wave_failed: ${{ steps.collect.outputs.wave-failed }}
      full_reuse: ${{ steps.collect.outputs.full-reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
