          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        shell: bash
        run: |
          java_home_variable="JAVA_HOME_17_${RUNNER_ARCH}"
          selected_java_home="${!java_home_variable}"
          java_binary=java
          if [ "$RUNNER_OS" = Windows ]; then java_binary=java.exe; fi
          test -f "$selected_java_home/bin/$java_binary"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.contract-validation.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.contract-validation.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.contract-validation.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - id: identity
        shell: bash
        env:
          BUILD_KEY: ${{ matrix.buildKey }}
        run: echo "key_hex=${BUILD_KEY#sha256:}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/run-runtime-product-phase
        with:
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.runtime-collect-3.outputs.artifact_id }}
          artifact-sha256: ${{ needs.runtime-collect-3.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          state-wave: '3'
          component: ${{ matrix.component }}
          phase: ${{ matrix.phase }}
          target: ${{ matrix.target }}
          build-key: ${{ matrix.buildKey }}
          revision: ${{ needs.plan.outputs.validation_commit }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-runtime-worker-${{ matrix.component }}-${{ matrix.phase }}-${{ matrix.target }}-${{ steps.identity.outputs.key_hex }}-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: build/runtime-worker
          if-no-files-found: warn
          overwrite: false
          include-hidden-files: true
          compression-level: 0
          retention-days: 90
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-runtime-worker-diagnostics-${{ matrix.component }}-${{ matrix.phase }}-${{ matrix.target }}-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: |
            build/runtime-input/capture-transport.json
            build/runtime-plan
          if-no-files-found: warn
          overwrite: false
          include-hidden-files: true
          retention-days: 90

  runtime-collect-4:
    name: runtime-collect-4
    needs: [plan, runtime-collect-3, runtime-workers-4, contract-validation]
    if: >-
      always() && needs.runtime-collect-3.result == 'success' &&
      needs.runtime-collect-3.outputs.runtime_workers_required == 'true' &&
      needs.runtime-collect-3.outputs.wave_failed != 'true'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.collect.outputs.artifact-id }}
      artifact_digest: ${{ steps.collect.outputs.artifact-sha256 }}
      runtime_matrix: ${{ steps.collect.outputs.runtime-matrix }}
      runtime_workers_required: ${{ steps.collect.outputs.runtime-workers-required }}
      wave_failed: ${{ steps.collect.outputs.wave-failed }}
      full_reuse: ${{ steps.collect.outputs.full-reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        shell: bash
        run: |
          java_home_variable="JAVA_HOME_17_${RUNNER_ARCH}"
          selected_java_home="${!java_home_variable}"
          java_binary=java
          if [ "$RUNNER_OS" = Windows ]; then java_binary=java.exe; fi
          test -f "$selected_java_home/bin/$java_binary"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.contract-validation.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.contract-validation.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.contract-validation.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - id: collect
        uses: ./.github/actions/collect-runtime-wave
        with:
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.runtime-collect-3.outputs.artifact_id }}
          artifact-sha256: ${{ needs.runtime-collect-3.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          state-wave: '3'
          wave: '4'
          tree: ${{ needs.plan.outputs.validation_tree }}


  runtime-continuation:
    name: runtime-continuation
    needs: [plan, product-resume, runtime-workers-1, runtime-collect-1, runtime-workers-2, runtime-collect-2, runtime-workers-3, runtime-collect-3, runtime-workers-4, runtime-collect-4, contract-validation]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.product-resume.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    outputs:
      state_wave: ${{ steps.parent.outputs.state_wave }}
      artifact_id: ${{ steps.parent.outputs.artifact_id }}
      artifact_digest: ${{ steps.parent.outputs.artifact_digest }}
      native_attestation_matrix: ${{ steps.route.outputs.native_attestation_matrix }}
      aggregate_state: ${{ steps.route.outputs.aggregate_state }}
      aggregate_key: ${{ steps.route.outputs.aggregate_key }}
      aggregate_receipt_sha256: ${{ steps.route.outputs.aggregate_receipt_sha256 }}
      aggregate_required: ${{ steps.route.outputs.aggregate_required }}
      aggregate_payload_complete: ${{ steps.route.outputs.aggregate_payload_complete }}
      sdk_handoff_required: ${{ steps.route.outputs.sdk_handoff_required }}
      sdk_input_selection: ${{ steps.route.outputs.sdk_input_selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        shell: bash
        run: |
          java_home_variable="JAVA_HOME_17_${RUNNER_ARCH}"
          selected_java_home="${!java_home_variable}"
          java_binary=java
          if [ "$RUNNER_OS" = Windows ]; then java_binary=java.exe; fi
          test -f "$selected_java_home/bin/$java_binary"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.contract-validation.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.contract-validation.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.contract-validation.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - name: Select the latest successful original state upload
        id: parent
        env:
          PREDECESSORS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, re
          needs = json.loads(os.environ['PREDECESSORS'])
          selected = None
          for wave in range(5):
              name = 'product-resume' if wave == 0 else f'runtime-collect-{wave}'
              job = needs[name]
              if job['result'] == 'skipped' and wave:
                  continue
              if job['result'] != 'success' or job['outputs'].get('wave_failed') != 'false':
                  raise ValueError('Cannot route failed or incomplete Runtime state')
              outputs = job['outputs']
              artifact = outputs.get('artifact_id', '')
              digest = outputs.get('artifact_digest', '')
              if not re.fullmatch(r'[1-9][0-9]*', artifact) or not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                  raise ValueError('Runtime state upload identity is missing')
              selected = wave, artifact, digest
          if selected is None:
              raise ValueError('No original Runtime state was selected')
          wave, artifact, digest = selected
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'state_wave={wave}\nartifact_id={artifact}\nartifact_digest={digest}\n')
          PY
      - id: captured
        uses: ./.github/actions/capture-runtime-state
        with:
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ steps.parent.outputs.artifact_id }}
          artifact-sha256: ${{ steps.parent.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          state-wave: ${{ steps.parent.outputs.state_wave }}
      - name: Replay exact aggregate predecessors before routing
        id: route
        env:
          SDK_VALIDATION_TOOLING: ${{ steps.tooling.outputs.tooling-policy }}
          SDK_APPLE_VALIDATION_POLICY: ${{ steps.tooling.outputs.apple-policy }}
          PLAN: ${{ steps.captured.outputs.plan-path }}
          DISCOVERY: ${{ steps.captured.outputs.discovery-root }}
          STATE: ${{ steps.captured.outputs.state-root }}
        run: |
          tooling=()
          if [ -n "$SDK_VALIDATION_TOOLING" ]; then tooling=(--sdk-validation-tooling "$SDK_VALIDATION_TOOLING"); fi
          if [ -n "$SDK_APPLE_VALIDATION_POLICY" ]; then tooling+=(--sdk-apple-validation-policy "$SDK_APPLE_VALIDATION_POLICY"); fi
          python3 -B ci/runtime_workflow.py continuation --if-selected ${tooling[@]+"${tooling[@]}"} \
            --plan "$PLAN" --discovery-root "$DISCOVERY" --state-root "$STATE" \
            --sdk-original-workflow-sha "${{ inputs.trustedWorkflowSha }}" \
            --github-output "$GITHUB_OUTPUT"

  runtime-signing-prepare-native:
    name: runtime-signing-prepare-${{ matrix.target }}
    needs: [workflow-lint, plan, runtime-continuation, contract-validation]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      github.event_name != 'workflow_dispatch' &&
      needs.runtime-continuation.result == 'success' &&
      needs.runtime-continuation.outputs.aggregate_state != 'not-selected' &&
      needs.runtime-continuation.outputs.native_attestation_matrix != '{"include":[]}' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtime-continuation.outputs.native_attestation_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codex-agent-labs/codex-agent
          ref: f8d151f4edf415e0b52b6b9a796144120402dc03
          path: trusted-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.validation_commit }}
          path: candidate-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_id }}
          path: ${{ runner.temp }}/runtime-preparation-plan
          merge-multiple: true
      - uses: ./trusted-source/.github/actions/prepare-runtime-signing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          source-sha: f8d151f4edf415e0b52b6b9a796144120402dc03
          workflow-sha: ${{ inputs.trustedWorkflowSha }}
          candidate-root: ${{ github.workspace }}/candidate-source
          plan: ${{ runner.temp }}/runtime-preparation-plan/impact-plan.json
          destination: ${{ runner.temp }}/runtime-signing-preparation
          target: ${{ matrix.target }}
          build-key: ${{ matrix.buildKey }}
          artifact-id: ${{ needs.runtime-continuation.outputs.artifact_id }}
          artifact-sha256: ${{ needs.runtime-continuation.outputs.artifact_digest }}
          state-wave: ${{ needs.runtime-continuation.outputs.state_wave }}
          validation-tree: ${{ needs.plan.outputs.validation_tree }}
          tooling-artifact-id: ${{ needs.contract-validation.outputs.tooling_artifact_id }}
          tooling-artifact-sha256: ${{ needs.contract-validation.outputs.tooling_artifact_sha256 }}
          tooling-transport-producer: ${{ needs.contract-validation.outputs.tooling_transport_producer }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          name: codex-agent-runtime-signing-preparation-${{ matrix.target }}-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-signing-preparation
          compression-level: 0
          retention-days: 90

  runtime-native-attestation:
    name: runtime-native-attestation-${{ matrix.target }}
    needs: [workflow-lint, plan, runtime-continuation, runtime-signing-prepare-native]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      github.event_name != 'workflow_dispatch' &&
      needs.runtime-signing-prepare-native.result == 'success' &&
      needs.runtime-continuation.result == 'success' &&
      needs.runtime-continuation.outputs.aggregate_state != 'not-selected' &&
      needs.runtime-continuation.outputs.native_attestation_matrix != '{"include":[]}' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    environment: product-attestation
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtime-continuation.outputs.native_attestation_matrix) }}
    steps:
      - name: Check out reviewed signer code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codex-agent-labs/codex-agent
          ref: f8d151f4edf415e0b52b6b9a796144120402dc03
          path: trusted-source
          persist-credentials: false
      - name: Check out candidate as inventory data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.validation_commit }}
          path: candidate-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_id }}
          path: ${{ runner.temp }}/runtime-attestation-plan
          merge-multiple: true
      - name: Resolve exact preparation upload without signing secrets
        id: preparation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
        run: |
          set -euo pipefail
          python3 -B trusted-source/ci/runtime_preparation_locator.py \
            --candidate-root "$GITHUB_WORKSPACE/candidate-source" \
            --plan "$RUNNER_TEMP/runtime-attestation-plan/impact-plan.json" \
            --target "$TARGET" --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Verify original selected bytes and preserve or establish detached release trust
        env:
          TRUSTED_SOURCE_SHA: f8d151f4edf415e0b52b6b9a796144120402dc03
          PREPARATION_ID: ${{ steps.preparation.outputs.artifact_id }}
          PREPARATION_SHA256: ${{ steps.preparation.outputs.artifact_sha256 }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
          ARTIFACT_ID: ${{ needs.runtime-continuation.outputs.artifact_id }}
          ARTIFACT_SHA256: ${{ needs.runtime-continuation.outputs.artifact_digest }}
          STATE_WAVE: ${{ needs.runtime-continuation.outputs.state_wave }}
          TARGET: ${{ matrix.target }}
          BUILD_KEY: ${{ matrix.buildKey }}
          VALIDATION_TREE: ${{ needs.plan.outputs.validation_tree }}
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_AGENT_PRODUCT_ED25519_PRIVATE_KEY: ${{ secrets.CODEX_AGENT_PRODUCT_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 -B trusted-source/ci/runtime_release.py \
            --repository-root "$GITHUB_WORKSPACE/trusted-source" \
            --candidate-root "$GITHUB_WORKSPACE/candidate-source" \
            --plan "$RUNNER_TEMP/runtime-attestation-plan/impact-plan.json" \
            --destination "$RUNNER_TEMP/runtime-release-evidence" \
            --target "$TARGET" --expected-build-key "$BUILD_KEY" \
            --artifact-id "$ARTIFACT_ID" --artifact-sha256 "$ARTIFACT_SHA256" \
            --preparation-artifact-id "$PREPARATION_ID" --preparation-artifact-sha256 "$PREPARATION_SHA256" \
            --state-wave "$STATE_WAVE" --trusted-source-sha "$TRUSTED_SOURCE_SHA" \
            --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" --validation-tree "$VALIDATION_TREE"
      - name: Preserve the exact native handoff and external original evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          name: codex-agent-runtime-release-handoff-${{ matrix.target }}-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-release-evidence
          compression-level: 0
          retention-days: 90

  runtime-aggregate:
    name: runtime-runtime-aggregate-metadata-aggregate
    needs: [plan, runtime-continuation, runtime-native-attestation, contract-validation]
    if: >-
      always() &&
      needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.runtime-continuation.result == 'success' &&
      needs.runtime-continuation.outputs.aggregate_required == 'true' &&
      needs.runtime-native-attestation.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.validation_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        shell: bash
        run: |
          java_home_variable="JAVA_HOME_17_${RUNNER_ARCH}"
          selected_java_home="${!java_home_variable}"
          java_binary=java
          if [ "$RUNNER_OS" = Windows ]; then java_binary=java.exe; fi
          test -f "$selected_java_home/bin/$java_binary"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.contract-validation.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.contract-validation.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.contract-validation.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - id: captured
        uses: ./.github/actions/capture-runtime-state
        with:
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.runtime-continuation.outputs.artifact_id }}
          artifact-sha256: ${{ needs.runtime-continuation.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          state-wave: ${{ needs.runtime-continuation.outputs.state_wave }}
          component: runtime-aggregate
          phase: metadata
          target: aggregate
          build-key: ${{ needs.runtime-continuation.outputs.aggregate_key }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-agent-runtime-release-handoff-*-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: build/runtime-native-handoffs
          merge-multiple: false
      - name: Verify and project the five original detached native trust closures
        env:
          TREE: ${{ needs.plan.outputs.validation_tree }}
        run: |
          set -euo pipefail
          handoffs=()
          for target in macos-arm64 macos-x64 linux-arm64 linux-x64 windows-x64; do
            handoffs+=(--variant-handoff "$target=build/runtime-native-handoffs/codex-agent-runtime-release-handoff-$target-$TREE-attempt-$GITHUB_RUN_ATTEMPT/runtime-input")
          done
          python3 -B ci/runtime_workflow.py variant-trust "${handoffs[@]}" \
            --destination build/runtime-variant-trust \
            --keyring gradle/release/product-signing-keys.json --keys-directory gradle/release/keys
      - uses: ./.github/actions/setup-kmp
        with:
          product-worker: 'true'
          cache-read-only: 'true'
          xcode-fingerprint: none
      - id: identity
        env:
          BUILD_KEY: ${{ needs.runtime-continuation.outputs.aggregate_key }}
        run: echo "key_hex=${BUILD_KEY#sha256:}" >> "$GITHUB_OUTPUT"
      - name: Execute only the elected aggregate metadata phase
        env:
          SDK_VALIDATION_TOOLING: ${{ steps.tooling.outputs.tooling-policy }}
          SDK_APPLE_VALIDATION_POLICY: ${{ steps.tooling.outputs.apple-policy }}
          PLAN: ${{ steps.captured.outputs.plan-path }}
          DISCOVERY: ${{ steps.captured.outputs.discovery-root }}
          STATE: ${{ steps.captured.outputs.state-root }}
          BUILD_KEY: ${{ needs.runtime-continuation.outputs.aggregate_key }}
        run: |
          tooling=()
          if [ -n "$SDK_VALIDATION_TOOLING" ]; then tooling=(--sdk-validation-tooling "$SDK_VALIDATION_TOOLING"); fi
          if [ -n "$SDK_APPLE_VALIDATION_POLICY" ]; then tooling+=(--sdk-apple-validation-policy "$SDK_APPLE_VALIDATION_POLICY"); fi
          python3 -B ci/product_reuse.py execute-runtime-aggregate ${tooling[@]+"${tooling[@]}"} \
            --plan "$PLAN" --discovery-root "$DISCOVERY" --state-root "$STATE" \
            --sdk-original-workflow-sha "${{ inputs.trustedWorkflowSha }}" \
            --expected-build-key "$BUILD_KEY" --variant-trust-root build/runtime-variant-trust \
            --destination build/runtime-aggregate-worker
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-runtime-worker-runtime-aggregate-metadata-aggregate-${{ steps.identity.outputs.key_hex }}-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: build/runtime-aggregate-worker
          if-no-files-found: warn
          overwrite: false
          include-hidden-files: true
          compression-level: 0
          retention-days: 90

  runtime-collect-5:
    name: runtime-collect-5
    needs: [plan, runtime-continuation, runtime-aggregate, contract-validation]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.runtime-continuation.result == 'success' &&
      needs.runtime-continuation.outputs.aggregate_required == 'true'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.collect.outputs.artifact-id }}
      artifact_digest: ${{ steps.collect.outputs.artifact-sha256 }}
      wave_failed: ${{ steps.collect.outputs.wave-failed }}
      full_reuse: ${{ steps.collect.outputs.full-reuse }}
      aggregate_payload_complete: ${{ steps.collect.outputs.aggregate-payload-complete }}
      aggregate_key: ${{ steps.collect.outputs.aggregate-key }}
      aggregate_receipt_sha256: ${{ steps.collect.outputs.aggregate-receipt-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.validation_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        shell: bash
        run: |
          java_home_variable="JAVA_HOME_17_${RUNNER_ARCH}"
          selected_java_home="${!java_home_variable}"
          java_binary=java
          if [ "$RUNNER_OS" = Windows ]; then java_binary=java.exe; fi
          test -f "$selected_java_home/bin/$java_binary"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.contract-validation.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.contract-validation.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.contract-validation.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - id: collect
        uses: ./.github/actions/collect-runtime-wave
        with:
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.runtime-continuation.outputs.artifact_id }}
          artifact-sha256: ${{ needs.runtime-continuation.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          state-wave: ${{ needs.runtime-continuation.outputs.state_wave }}
          wave: '5'
          tree: ${{ needs.plan.outputs.validation_tree }}

  runtime-aggregate-continuation:
    name: runtime-aggregate-continuation
    needs: [plan, runtime-continuation, runtime-collect-5, contract-validation]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.runtime-continuation.result == 'success' &&
      needs.runtime-continuation.outputs.aggregate_state != 'not-selected' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    outputs:
      state_wave: ${{ steps.parent.outputs.state_wave }}
      artifact_id: ${{ steps.parent.outputs.artifact_id }}
      artifact_digest: ${{ steps.parent.outputs.artifact_digest }}
      aggregate_key: ${{ steps.route.outputs.aggregate_key }}
      aggregate_receipt_sha256: ${{ steps.route.outputs.aggregate_receipt_sha256 }}
      aggregate_payload_complete: ${{ steps.route.outputs.aggregate_payload_complete }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.validation_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        shell: bash
        run: |
          java_home_variable="JAVA_HOME_17_${RUNNER_ARCH}"
          selected_java_home="${!java_home_variable}"
          java_binary=java
          if [ "$RUNNER_OS" = Windows ]; then java_binary=java.exe; fi
          test -f "$selected_java_home/bin/$java_binary"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.contract-validation.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.contract-validation.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.contract-validation.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - name: Select the exact completed original aggregate state
        id: parent
        env:
          PREDECESSORS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, re
          needs = json.loads(os.environ['PREDECESSORS'])
          prior = needs['runtime-continuation']
          collected = needs['runtime-collect-5']
          if prior['result'] != 'success':
              raise ValueError('Original Runtime continuation did not succeed')
          original = prior['outputs']
          if original['aggregate_required'] == 'true':
              if collected['result'] != 'success' or collected['outputs'].get('wave_failed') != 'false':
                  raise ValueError('Aggregate collection failed or is incomplete')
              selected, wave = collected['outputs'], '5'
          elif original['aggregate_required'] == 'false' and collected['result'] == 'skipped':
              if original.get('aggregate_state') != 'completed':
                  raise ValueError('Original aggregate is not completed')
              selected, wave = original, original['state_wave']
              if not re.fullmatch(r'[0-4]', wave):
                  raise ValueError('Invalid original Runtime state wave')
          else:
              raise ValueError('Unexpected aggregate collection state')
          if selected.get('aggregate_payload_complete') != 'true':
              raise ValueError('Aggregate payload completion is missing')
          key = selected['aggregate_key']
          receipt = selected['aggregate_receipt_sha256']
          artifact, digest = selected['artifact_id'], selected['artifact_digest']
          if key != original['aggregate_key'] or not re.fullmatch(r'[1-9][0-9]*', artifact):
              raise ValueError('Aggregate key or upload identity differs')
          if any(not re.fullmatch(r'sha256:[0-9a-f]{64}', value) for value in (key, receipt, digest)):
              raise ValueError('Aggregate original digest is missing or malformed')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'state_wave={wave}\nartifact_id={artifact}\nartifact_digest={digest}\n')
          PY
      - id: captured
        uses: ./.github/actions/capture-runtime-state
        with:
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ steps.parent.outputs.artifact_id }}
          artifact-sha256: ${{ steps.parent.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          state-wave: ${{ steps.parent.outputs.state_wave }}
      - name: Replay the full completed aggregate closure
        id: route
        env:
          SDK_VALIDATION_TOOLING: ${{ steps.tooling.outputs.tooling-policy }}
          SDK_APPLE_VALIDATION_POLICY: ${{ steps.tooling.outputs.apple-policy }}
          PLAN: ${{ steps.captured.outputs.plan-path }}
          DISCOVERY: ${{ steps.captured.outputs.discovery-root }}
          STATE: ${{ steps.captured.outputs.state-root }}
        run: |
          tooling=()
          if [ -n "$SDK_VALIDATION_TOOLING" ]; then tooling=(--sdk-validation-tooling "$SDK_VALIDATION_TOOLING"); fi
          if [ -n "$SDK_APPLE_VALIDATION_POLICY" ]; then tooling+=(--sdk-apple-validation-policy "$SDK_APPLE_VALIDATION_POLICY"); fi
          python3 -B ci/runtime_workflow.py continuation --require-completed ${tooling[@]+"${tooling[@]}"} \
            --plan "$PLAN" --discovery-root "$DISCOVERY" --state-root "$STATE" \
            --sdk-original-workflow-sha "${{ inputs.trustedWorkflowSha }}" \
            --github-output "$GITHUB_OUTPUT"

  runtime-signing-prepare-aggregate:
    name: runtime-signing-prepare-aggregate
    needs: [workflow-lint, plan, runtime-aggregate-continuation, contract-validation]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      github.event_name != 'workflow_dispatch' &&
      needs.runtime-aggregate-continuation.result == 'success' &&
      needs.runtime-aggregate-continuation.outputs.aggregate_payload_complete == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codex-agent-labs/codex-agent
          ref: f8d151f4edf415e0b52b6b9a796144120402dc03
          path: trusted-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.validation_commit }}
          path: candidate-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_id }}
          path: ${{ runner.temp }}/runtime-preparation-plan
          merge-multiple: true
      - uses: ./trusted-source/.github/actions/prepare-runtime-signing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          source-sha: f8d151f4edf415e0b52b6b9a796144120402dc03
          workflow-sha: ${{ inputs.trustedWorkflowSha }}
          candidate-root: ${{ github.workspace }}/candidate-source
          plan: ${{ runner.temp }}/runtime-preparation-plan/impact-plan.json
          destination: ${{ runner.temp }}/runtime-signing-preparation
          target: aggregate
          build-key: ${{ needs.runtime-aggregate-continuation.outputs.aggregate_key }}
          artifact-id: ${{ needs.runtime-aggregate-continuation.outputs.artifact_id }}
          artifact-sha256: ${{ needs.runtime-aggregate-continuation.outputs.artifact_digest }}
          state-wave: ${{ needs.runtime-aggregate-continuation.outputs.state_wave }}
          validation-tree: ${{ needs.plan.outputs.validation_tree }}
          tooling-artifact-id: ${{ needs.contract-validation.outputs.tooling_artifact_id }}
          tooling-artifact-sha256: ${{ needs.contract-validation.outputs.tooling_artifact_sha256 }}
          tooling-transport-producer: ${{ needs.contract-validation.outputs.tooling_transport_producer }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          name: codex-agent-runtime-signing-preparation-aggregate-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-signing-preparation
          compression-level: 0
          retention-days: 90

  runtime-aggregate-attestation:
    name: runtime-aggregate-attestation
    needs: [workflow-lint, plan, runtime-native-attestation, runtime-aggregate-continuation, runtime-signing-prepare-aggregate]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      github.event_name != 'workflow_dispatch' &&
      needs.runtime-aggregate-continuation.result == 'success' &&
      needs.runtime-aggregate-continuation.outputs.aggregate_payload_complete == 'true' &&
      needs.runtime-signing-prepare-aggregate.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    environment: product-attestation
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: sha256:${{ steps.upload.outputs.artifact-digest }}
      aggregate_key: ${{ needs.runtime-aggregate-continuation.outputs.aggregate_key }}
      aggregate_receipt_sha256: ${{ needs.runtime-aggregate-continuation.outputs.aggregate_receipt_sha256 }}
    steps:
      - name: Check out reviewed signer code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codex-agent-labs/codex-agent
          ref: f8d151f4edf415e0b52b6b9a796144120402dc03
          path: trusted-source
          persist-credentials: false
      - name: Check out candidate as inventory data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.validation_commit }}
          path: candidate-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_id }}
          path: ${{ runner.temp }}/runtime-aggregate-attestation-plan
          merge-multiple: true
      - if: needs.runtime-native-attestation.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-agent-runtime-release-handoff-*-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-aggregate-native-handoffs
          merge-multiple: false
      - name: Resolve exact aggregate preparation upload without signing secrets
        id: preparation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
        run: |
          set -euo pipefail
          python3 -B trusted-source/ci/runtime_preparation_locator.py \
            --candidate-root "$GITHUB_WORKSPACE/candidate-source" \
            --plan "$RUNNER_TEMP/runtime-aggregate-attestation-plan/impact-plan.json" \
            --target aggregate --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Authenticate completed originals and preserve or establish external aggregate trust
        env:
          TRUSTED_SOURCE_SHA: f8d151f4edf415e0b52b6b9a796144120402dc03
          PREPARATION_ID: ${{ steps.preparation.outputs.artifact_id }}
          PREPARATION_SHA256: ${{ steps.preparation.outputs.artifact_sha256 }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
          ARTIFACT_ID: ${{ needs.runtime-aggregate-continuation.outputs.artifact_id }}
          ARTIFACT_SHA256: ${{ needs.runtime-aggregate-continuation.outputs.artifact_digest }}
          STATE_WAVE: ${{ needs.runtime-aggregate-continuation.outputs.state_wave }}
          BUILD_KEY: ${{ needs.runtime-aggregate-continuation.outputs.aggregate_key }}
          NATIVE_RESULT: ${{ needs.runtime-native-attestation.result }}
          VALIDATION_TREE: ${{ needs.plan.outputs.validation_tree }}
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_AGENT_PRODUCT_ED25519_PRIVATE_KEY: ${{ secrets.CODEX_AGENT_PRODUCT_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set --
          if [ "$NATIVE_RESULT" = success ]; then
            for target in macos-arm64 macos-x64 linux-arm64 linux-x64 windows-x64; do
              set -- "$@" --variant-handoff "$target=$RUNNER_TEMP/runtime-aggregate-native-handoffs/codex-agent-runtime-release-handoff-$target-$VALIDATION_TREE-attempt-$GITHUB_RUN_ATTEMPT/runtime-input"
            done
          elif [ "$NATIVE_RESULT" != skipped ]; then
            echo 'Native attestation did not succeed or reuse its complete carrier.' >&2
            exit 1
          fi
          python3 -B trusted-source/ci/runtime_release.py \
            --repository-root "$GITHUB_WORKSPACE/trusted-source" \
            --candidate-root "$GITHUB_WORKSPACE/candidate-source" \
            --plan "$RUNNER_TEMP/runtime-aggregate-attestation-plan/impact-plan.json" \
            --destination "$RUNNER_TEMP/runtime-aggregate-release-evidence" \
            --target aggregate --expected-build-key "$BUILD_KEY" \
            --artifact-id "$ARTIFACT_ID" --artifact-sha256 "$ARTIFACT_SHA256" \
            --preparation-artifact-id "$PREPARATION_ID" --preparation-artifact-sha256 "$PREPARATION_SHA256" \
            --state-wave "$STATE_WAVE" --trusted-source-sha "$TRUSTED_SOURCE_SHA" \
            --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" --validation-tree "$VALIDATION_TREE" \
            "$@"
      - name: Preserve the exact aggregate handoff and external original evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          name: codex-agent-runtime-aggregate-release-handoff-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-aggregate-release-evidence
          compression-level: 0
          retention-days: 90

  sdk-inputs:
    name: sdk-inputs
    needs: [workflow-lint, plan, contract-validation, runtime-continuation, runtime-aggregate-attestation]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.workflow-lint.result == 'success' &&
      needs.runtime-continuation.result == 'success' &&
      needs.runtime-continuation.outputs.sdk_handoff_required == 'true' &&
      (fromJSON(needs.runtime-continuation.outputs.sdk_input_selection || '{}').source == 'released-default' ||
       needs.runtime-aggregate-attestation.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: sha256:${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.validation_commit }}
          fetch-depth: 0
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        run: |
          test -f "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.contract-validation.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.contract-validation.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.contract-validation.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - id: captured
        uses: ./.github/actions/capture-runtime-state
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.runtime-continuation.outputs.artifact_id }}
          artifact-sha256: ${{ needs.runtime-continuation.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          state-wave: ${{ needs.runtime-continuation.outputs.state_wave }}
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
      - name: Stage SDK inputs from the independently verified selection
        id: staged
        env:
          PLAN: ${{ steps.captured.outputs.plan-path }}
          SDK_VALIDATION_TOOLING: ${{ steps.tooling.outputs.tooling-policy }}
          SDK_APPLE_VALIDATION_POLICY: ${{ steps.tooling.outputs.apple-policy }}
          DISCOVERY: ${{ steps.captured.outputs.discovery-root }}
          STATE: ${{ steps.captured.outputs.state-root }}
          SDK_SOURCE: ${{ fromJSON(needs.runtime-continuation.outputs.sdk_input_selection).source }}
          ARTIFACT_ID: ${{ needs.runtime-aggregate-attestation.outputs.artifact_id }}
          ARTIFACT_SHA256: ${{ needs.runtime-aggregate-attestation.outputs.artifact_digest }}
          AGGREGATE_KEY: ${{ needs.runtime-aggregate-attestation.outputs.aggregate_key }}
          AGGREGATE_RECEIPT: ${{ needs.runtime-aggregate-attestation.outputs.aggregate_receipt_sha256 }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fresh=()
          tooling=()
          if [ -n "$SDK_VALIDATION_TOOLING" ]; then tooling=(--sdk-validation-tooling "$SDK_VALIDATION_TOOLING"); fi
          if [ -n "$SDK_APPLE_VALIDATION_POLICY" ]; then tooling+=(--sdk-apple-validation-policy "$SDK_APPLE_VALIDATION_POLICY"); fi
          case "$SDK_SOURCE" in
            released-default) destination="$GITHUB_WORKSPACE/build/sdk-inputs" ;;
            current-runtime)
              destination="$RUNNER_TEMP/sdk-inputs"
              fresh=(--artifact-id "$ARTIFACT_ID" --artifact-sha256 "$ARTIFACT_SHA256"
                --expected-build-key "$AGGREGATE_KEY" --expected-metadata-receipt-sha256 "$AGGREGATE_RECEIPT") ;;
            *) echo 'Unknown replayed SDK input source' >&2; exit 1 ;;
          esac
          python3 -B -m ci.sdk_workflow --plan "$PLAN" --discovery-root "$DISCOVERY" --state-root "$STATE" \
            --destination "$destination" --repository-root "$GITHUB_WORKSPACE" \
            --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
            --keyring "$GITHUB_WORKSPACE/gradle/release/product-signing-keys.json" \
            --keys-directory "$GITHUB_WORKSPACE/gradle/release/keys" ${fresh[@]+"${fresh[@]}"} ${tooling[@]+"${tooling[@]}"}
          printf 'path=%s\n' "$destination" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-agent-sdk-inputs-${{ needs.plan.outputs.validation_tree }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.staged.outputs.path }}
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 1

  android:
    if: needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true' && needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.lane_android == 'true'
    needs: [workflow-lint, plan]
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
      reused: ${{ steps.lane.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.validation_commit }}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: android
          plan-artifact: ${{ needs.plan.outputs.plan_artifact }}
          validation-commit: ${{ needs.plan.outputs.validation_commit }}
          validation-tree: ${{ needs.plan.outputs.validation_tree }}
          build: ${{ needs.plan.outputs.lane_android_build }}
          test: ${{ needs.plan.outputs.lane_android_test }}
          metadata: ${{ needs.plan.outputs.lane_android_metadata }}

  android-runtime-evidence:
    if: >-
      needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.plan.outputs.validation_reused != 'true' &&
      needs.plan.outputs.android_evidence_required == 'true'
    needs: [plan, android]
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: codex-agent-labs/codex-agent/.github/workflows/android-runtime-evidence.yml@main
    with:
      candidateCommit: ${{ needs.plan.outputs.validation_commit }}
      ciRunId: ${{ github.run_id }}
      artifactName: ${{ needs.android.outputs.artifact_name }}
      planArtifact: ${{ needs.plan.outputs.plan_artifact }}

  desktop:
    if: always() && needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true' && needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.any_desktop == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [workflow-lint, plan, product]
    uses: ./.github/workflows/desktop-runtime-evidence.yml
    with:
      planArtifact: ${{ needs.plan.outputs.plan_artifact }}
      validationCommit: ${{ needs.plan.outputs.validation_commit }}
      validationTree: ${{ needs.plan.outputs.validation_tree }}
      matrix: ${{ needs.plan.outputs.desktop_matrix }}
      linuxArm64: ${{ fromJSON(needs.plan.outputs.lane_desktop_linux_arm64) }}
      linuxArm64Build: ${{ fromJSON(needs.plan.outputs.lane_desktop_linux_arm64_build) }}
      linuxArm64Test: ${{ fromJSON(needs.plan.outputs.lane_desktop_linux_arm64_test) }}
      linuxArm64Metadata: ${{ fromJSON(needs.plan.outputs.lane_desktop_linux_arm64_metadata) }}

  sdk-native-wrappers:
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.plan.outputs.validation_reused != 'true' &&
      needs.plan.outputs.native_wrappers == 'true' &&
      needs.sdk-native-prepare.result == 'success'
    needs: [workflow-lint, plan, sdk-plan, sdk-javascript, sdk-native-prepare, sdk-inputs]
    uses: ./.github/workflows/sdk-validation.yml
    with:
      planArtifact: ${{ needs.plan.outputs.plan_artifact }}
      planId: ${{ needs.plan.outputs.plan_id }}
      validationCommit: ${{ needs.plan.outputs.validation_commit }}
      validationTree: ${{ needs.plan.outputs.validation_tree }}
      trustedWorkflowSha: ${{ inputs.trustedWorkflowSha }}
      stateArtifactId: ${{ needs.sdk-javascript.outputs.artifact_id }}
      stateArtifactSha256: ${{ needs.sdk-javascript.outputs.artifact_digest }}
      stateWave: ${{ needs.sdk-javascript.outputs.state_wave }}
      sdkStateWave: ${{ needs.sdk-javascript.outputs.sdk_state_wave }}
      preparationStateArtifactId: ${{ needs.sdk-native-prepare.outputs.preparation_state_id }}
      preparationStateArtifactSha256: ${{ needs.sdk-native-prepare.outputs.preparation_state_digest }}
      preparationStateWave: ${{ needs.sdk-native-prepare.outputs.preparation_state_wave }}
      preparationSdkStateWave: ${{ needs.sdk-native-prepare.outputs.preparation_sdk_state_wave }}
      preparationComponent: ${{ needs.sdk-native-prepare.outputs.preparation_component }}
      preparationPhase: ${{ needs.sdk-native-prepare.outputs.preparation_phase }}
      preparationTarget: ${{ needs.sdk-native-prepare.outputs.preparation_target }}
      preparationBuildKey: ${{ needs.sdk-native-prepare.outputs.preparation_build_key }}
      sdkPreparedArtifactId: ${{ needs.sdk-native-prepare.outputs.artifact_id }}
      sdkPreparedArtifactSha256: ${{ needs.sdk-native-prepare.outputs.artifact_digest }}
      sdkInputsArtifactId: ${{ needs.sdk-inputs.outputs.artifact_id }}
      sdkInputsArtifactSha256: ${{ needs.sdk-inputs.outputs.artifact_digest }}
      toolingRequired: ${{ needs.plan.outputs.tooling_required }}
      toolingArtifactId: ${{ needs.sdk-plan.outputs.tooling_artifact_id }}
      toolingArtifactSha256: ${{ needs.sdk-plan.outputs.tooling_artifact_sha256 }}
      toolingTransportProducer: ${{ needs.sdk-plan.outputs.tooling_transport_producer }}

  apple:
    if: needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true' && needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.any_apple == 'true'
    needs: [workflow-lint, plan]
    uses: ./.github/workflows/apple-runtime-evidence.yml
    with:
      planArtifact: ${{ needs.plan.outputs.plan_artifact }}
      validationCommit: ${{ needs.plan.outputs.validation_commit }}
      validationTree: ${{ needs.plan.outputs.validation_tree }}

  consumers:
    if: always() && needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true' && needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.consumer_matrix != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [workflow-lint, plan, product, android, android-runtime-evidence, desktop, apple]
    uses: ./.github/workflows/sdk-consumer-validation.yml
    with:
      planArtifact: ${{ needs.plan.outputs.plan_artifact }}
      validationCommit: ${{ needs.plan.outputs.validation_commit }}
      validationTree: ${{ needs.plan.outputs.validation_tree }}
      matrix: ${{ needs.plan.outputs.consumer_matrix }}

  sdk-ios-binary-plan:
    needs: [plan, product-resume, contract-validation]
    if: >-
      always() &&
      needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' && needs.product-resume.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      sdk_matrix: ${{ steps.capture.outputs.sdk-matrix }}
      sdk_workers_required: ${{ steps.capture.outputs.sdk-workers-required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        shell: bash
        run: |
          java_home_variable="JAVA_HOME_17_${RUNNER_ARCH}"
          selected_java_home="${!java_home_variable}"
          java_binary=java
          if [ "$RUNNER_OS" = Windows ]; then java_binary=java.exe; fi
          test -f "$selected_java_home/bin/$java_binary"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.contract-validation.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.contract-validation.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.contract-validation.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - id: capture
        uses: ./.github/actions/capture-runtime-state
        with:
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          product: sdk-ios-binary
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.product-resume.outputs.artifact_id }}
          artifact-sha256: ${{ needs.product-resume.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}

  sdk-ios-binary:
    name: sdk-sdk-ios-binary-ios
    needs: [plan, product-resume, sdk-ios-binary-plan, apple, contract-validation]
    if: >-
      always() && needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.sdk-ios-binary-plan.result == 'success' &&
      needs.sdk-ios-binary-plan.outputs.sdk_workers_required == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.sdk-ios-binary-plan.outputs.sdk_matrix || '{"include":[]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        shell: bash
        run: |
          java_home_variable="JAVA_HOME_17_${RUNNER_ARCH}"
          selected_java_home="${!java_home_variable}"
          java_binary=java
          if [ "$RUNNER_OS" = Windows ]; then java_binary=java.exe; fi
          test -f "$selected_java_home/bin/$java_binary"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.contract-validation.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.contract-validation.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.contract-validation.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - uses: ./.github/actions/sdk-ios-binary-worker
        with:
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.product-resume.outputs.artifact_id }}
          artifact-sha256: ${{ needs.product-resume.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          build-key: ${{ matrix.buildKey }}
          tree: ${{ needs.plan.outputs.validation_tree }}
          native-tests-artifact-id: ${{ needs.apple.outputs.native_tests_artifact_id }}
          native-tests-artifact-sha256: ${{ needs.apple.outputs.native_tests_artifact_digest }}
          rust-device-artifact-id: ${{ needs.apple.outputs.rust_device_artifact_id }}
          rust-device-artifact-sha256: ${{ needs.apple.outputs.rust_device_artifact_digest }}
          rust-simulator-artifact-id: ${{ needs.apple.outputs.rust_simulator_artifact_id }}
          rust-simulator-artifact-sha256: ${{ needs.apple.outputs.rust_simulator_artifact_digest }}

  sdk-collect-3:
    name: sdk-collect-3
    needs: [plan, sdk-ios-binary-plan, sdk-ios-binary, runtime-continuation, runtime-aggregate-continuation, contract-validation]
    if: >-
      always() && needs.sdk-ios-binary-plan.result == 'success' &&
      needs.sdk-ios-binary-plan.outputs.sdk_workers_required == 'true' &&
      needs.runtime-continuation.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.collect.outputs.artifact-id }}
      artifact_digest: ${{ steps.collect.outputs.artifact-sha256 }}
      wave_failed: ${{ steps.collect.outputs.wave-failed }}
      full_reuse: ${{ steps.collect.outputs.full-reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        shell: bash
        run: |
          java_home_variable="JAVA_HOME_17_${RUNNER_ARCH}"
          selected_java_home="${!java_home_variable}"
          java_binary=java
          if [ "$RUNNER_OS" = Windows ]; then java_binary=java.exe; fi
          test -f "$selected_java_home/bin/$java_binary"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.contract-validation.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.contract-validation.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.contract-validation.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - id: parent
        env:
          PREDECESSORS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['PREDECESSORS'])
          prior = needs['runtime-continuation']
          selected = prior if prior['outputs'].get('aggregate_state') == 'not-selected' else needs['runtime-aggregate-continuation']
          if selected['result'] != 'success':
              raise ValueError('Latest Runtime state is incomplete; preserve original binary upload')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name in ('artifact_id', 'artifact_digest', 'state_wave'):
                  output.write(name + '=' + selected['outputs'][name] + '\n')
          PY
      - id: collect
        uses: ./.github/actions/collect-runtime-wave
        with:
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          product: sdk-ios-binary
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ steps.parent.outputs.artifact_id }}
          artifact-sha256: ${{ steps.parent.outputs.artifact_digest }}
          state-wave: ${{ steps.parent.outputs.state_wave }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          wave: '3'
          tree: ${{ needs.plan.outputs.validation_tree }}

  sdk-plan:
    needs: [plan, contract-validation, runtime-continuation, runtime-aggregate-continuation, sdk-inputs, sdk-ios-binary-plan, sdk-collect-3]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' && needs.sdk-inputs.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.parent.outputs.artifact_id }}
      artifact_digest: ${{ steps.parent.outputs.artifact_digest }}
      state_wave: ${{ steps.parent.outputs.state_wave }}
      sdk_state_wave: ${{ steps.parent.outputs.sdk_state_wave }}
      sdk_matrix: ${{ steps.capture.outputs.sdk-matrix }}
      sdk_workers_required: ${{ steps.capture.outputs.sdk-workers-required }}
      tooling_artifact_id: ${{ needs.contract-validation.outputs.tooling_artifact_id }}
      tooling_artifact_sha256: ${{ needs.contract-validation.outputs.tooling_artifact_sha256 }}
      tooling_transport_producer: ${{ needs.contract-validation.outputs.tooling_transport_producer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        run: |
          test -f "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.contract-validation.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.contract-validation.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.contract-validation.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - id: parent
        env:
          PREDECESSORS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['PREDECESSORS'])
          source = json.loads(needs['runtime-continuation']['outputs']['sdk_input_selection'])['source']
          if source not in ('released-default', 'current-runtime'):
              raise ValueError('Unknown SDK Runtime source')
          aggregate_state = needs['runtime-continuation']['outputs'].get('aggregate_state')
          if aggregate_state not in ('not-selected', 'ready', 'completed'):
              raise ValueError('Runtime aggregate election is incomplete')
          if source == 'current-runtime' and aggregate_state == 'not-selected':
              raise ValueError('Current Runtime SDK input has no selected aggregate')
          # State history includes current Runtime work even when SDK bytes use an older default.
          parent = needs['runtime-continuation' if aggregate_state == 'not-selected' else 'runtime-aggregate-continuation']
          if parent['result'] != 'success':
              raise ValueError('Latest Runtime predecessor state is incomplete')
          binary_required = needs['sdk-ios-binary-plan']['outputs'].get('sdk_workers_required')
          if binary_required not in ('true', 'false'):
              raise ValueError('SDK iOS binary election is incomplete')
          sdk_wave = ''
          if binary_required == 'true':
              parent = needs['sdk-collect-3']
              if parent['outputs'].get('wave_failed') != 'false':
                  raise ValueError('SDK iOS binary collection failed')
              sdk_wave = '3'
          if parent['result'] != 'success':
              raise ValueError('SDK predecessor state is incomplete')
          from ci.sdk_native_continuation import _locator
          values = {name: parent['outputs'][name] for name in ('artifact_id', 'artifact_digest')}
          values['state_wave'] = '0' if sdk_wave else parent['outputs']['state_wave']
          values['sdk_state_wave'] = sdk_wave
          values = _locator(values)
          if not values['artifact_id']:
              raise ValueError('SDK predecessor upload locator is missing')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, value in values.items():
                  output.write(name + '=' + value + '\n')
          PY
      - id: capture
        uses: ./.github/actions/capture-runtime-state
        with:
          product: sdk
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ steps.parent.outputs.artifact_id }}
          artifact-sha256: ${{ steps.parent.outputs.artifact_digest }}
          state-wave: ${{ steps.parent.outputs.state_wave }}
          sdk-state-wave: ${{ steps.parent.outputs.sdk_state_wave }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}

  sdk-workers-1:
    name: sdk-javascript-${{ matrix.phase }}-node
    needs: [plan, sdk-plan, sdk-inputs]
    if: >-
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.sdk-plan.outputs.sdk_workers_required == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.sdk-plan.outputs.sdk_matrix || '{"include":[]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        run: |
          test -f "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.sdk-plan.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.sdk-plan.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.sdk-plan.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - uses: ./.github/actions/sdk-javascript-worker
        with:
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.sdk-plan.outputs.artifact_id }}
          artifact-sha256: ${{ needs.sdk-plan.outputs.artifact_digest }}
          state-wave: ${{ needs.sdk-plan.outputs.state_wave }}
          sdk-state-wave: ${{ needs.sdk-plan.outputs.sdk_state_wave }}
          sdk-inputs-id: ${{ needs.sdk-inputs.outputs.artifact_id }}
          sdk-inputs-sha256: ${{ needs.sdk-inputs.outputs.artifact_digest }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          phase: ${{ matrix.phase }}
          build-key: ${{ matrix.buildKey }}
          tree: ${{ needs.plan.outputs.validation_tree }}

  sdk-collect-1:
    name: sdk-collect-1
    needs: [plan, sdk-plan, sdk-workers-1]
    if: >-
      always() && needs.sdk-plan.result == 'success' &&
      needs.sdk-plan.outputs.sdk_workers_required == 'true'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.collect.outputs.artifact-id }}
      artifact_digest: ${{ steps.collect.outputs.artifact-sha256 }}
      sdk_matrix: ${{ steps.collect.outputs.sdk-matrix }}
      sdk_workers_required: ${{ steps.collect.outputs.sdk-workers-required }}
      wave_failed: ${{ steps.collect.outputs.wave-failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        run: |
          test -f "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.sdk-plan.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.sdk-plan.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.sdk-plan.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - id: collect
        uses: ./.github/actions/collect-runtime-wave
        with:
          product: sdk
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.sdk-plan.outputs.artifact_id }}
          artifact-sha256: ${{ needs.sdk-plan.outputs.artifact_digest }}
          state-wave: ${{ needs.sdk-plan.outputs.state_wave }}
          sdk-state-wave: ${{ needs.sdk-plan.outputs.sdk_state_wave }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          wave: '1'
          tree: ${{ needs.plan.outputs.validation_tree }}

  sdk-workers-2:
    name: sdk-javascript-${{ matrix.phase }}-node
    needs: [plan, sdk-plan, sdk-collect-1, sdk-inputs]
    if: >-
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.sdk-collect-1.outputs.wave_failed == 'false' &&
      needs.sdk-collect-1.outputs.sdk_workers_required == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.sdk-collect-1.outputs.sdk_matrix || '{"include":[]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        run: |
          test -f "$JAVA_HOME_17_X64/bin/java"
