    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        run: |
          test -f "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.sdk-plan.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.sdk-plan.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.sdk-plan.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - id: collect
        uses: ./.github/actions/collect-runtime-wave
        with:
          product: sdk
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.sdk-collect-1.outputs.artifact_id }}
          artifact-sha256: ${{ needs.sdk-collect-1.outputs.artifact_digest }}
          state-wave: '0'
          sdk-state-wave: '1'
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          wave: '2'
          tree: ${{ needs.plan.outputs.validation_tree }}

  sdk-javascript:
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.runtime-continuation.result == 'success'
    needs: [plan, runtime-continuation, sdk-plan, sdk-collect-1, sdk-collect-2]
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.summary.outputs.artifact_id }}
      artifact_digest: ${{ steps.summary.outputs.artifact_digest }}
      state_wave: ${{ steps.summary.outputs.state_wave }}
      sdk_state_wave: ${{ steps.summary.outputs.sdk_state_wave }}
    steps:
      - id: summary
        name: Fail after collecting every elected JavaScript result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          planned = needs['sdk-plan']
          if planned['result'] == 'skipped':
              if needs['runtime-continuation']['outputs'].get('sdk_handoff_required') != 'false':
                  raise ValueError('Required SDK plan did not execute')
          elif planned['result'] != 'success':
              raise ValueError('SDK replay planning failed')
          else:
              parent = planned['outputs']
              sdk_wave = parent.get('sdk_state_wave', '')
              required = planned['outputs'].get('sdk_workers_required')
              if required not in ('true', 'false'):
                  raise ValueError('SDK work election is missing')
              for wave in (1, 2):
                  job = needs[f'sdk-collect-{wave}']
                  if required == 'true':
                      if job['result'] != 'success' or job['outputs'].get('wave_failed') != 'false':
                          raise ValueError(f'SDK wave {wave} failed or was not collected')
                      parent = job['outputs']
                      sdk_wave = str(wave)
                      required = job['outputs'].get('sdk_workers_required') if wave == 1 else 'false'
                      if required not in ('true', 'false'):
                          raise ValueError('SDK next-wave election is missing')
                  elif job['result'] != 'skipped':
                      raise ValueError('Unelected SDK collection executed')
              state = {name: parent[name] for name in ('artifact_id', 'artifact_digest')}
              state['state_wave'] = '0' if parent is not planned['outputs'] else parent['state_wave']
              state['sdk_state_wave'] = sdk_wave
              if any(not isinstance(value, str) or '\n' in value or '\r' in value for value in state.values()):
                  raise ValueError('Invalid SDK terminal state outputs')
              import re
              if (not re.fullmatch(r'[1-9][0-9]*', state['artifact_id']) or
                      not re.fullmatch(r'sha256:[0-9a-f]{64}', state['artifact_digest']) or
                      state['state_wave'] not in ('0', '1', '2', '3', '4', '5') or
                      state['sdk_state_wave'] not in ('', '1', '2', '3', '4', '5', '6') or
                      (state['sdk_state_wave'] and state['state_wave'] != '0')):
                  raise ValueError('Invalid SDK terminal state artifact identity or wave')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  for name, value in state.items():
                      output.write(name + '=' + value + '\n')
          PY


  sdk-native-plan:
    needs: [plan, sdk-plan, sdk-javascript]
    if: >-
      always() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.sdk-javascript.result == 'success' &&
      needs.sdk-javascript.outputs.artifact_id != '' &&
      needs.sdk-plan.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      sdk_matrix: ${{ steps.capture.outputs.sdk-matrix }}
      sdk_workers_required: ${{ steps.capture.outputs.sdk-workers-required }}
      preparation_component: ${{ steps.preparation.outputs.component }}
      preparation_build_key: ${{ steps.preparation.outputs.build_key }}
      preparation_required: ${{ steps.preparation.outputs.preparation_required }}
      preparation_phase: ${{ steps.preparation.outputs.phase }}
      preparation_target: ${{ steps.preparation.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        run: |
          test -f "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.sdk-plan.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.sdk-plan.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.sdk-plan.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - id: capture
        uses: ./.github/actions/capture-runtime-state
        with:
          product: sdk
          sdk-family: native-package
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
          sdk-apple-validation-policy: ${{ steps.tooling.outputs.apple-policy }}
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.sdk-javascript.outputs.artifact_id }}
          artifact-sha256: ${{ needs.sdk-javascript.outputs.artifact_digest }}
          state-wave: ${{ needs.sdk-javascript.outputs.state_wave }}
          sdk-state-wave: ${{ needs.sdk-javascript.outputs.sdk_state_wave }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
      - id: preparation
        env:
          PLAN: ${{ steps.capture.outputs.plan-path }}
          DISCOVERY: ${{ steps.capture.outputs.discovery-root }}
          STATE: ${{ steps.capture.outputs.state-root }}
          SDK_VALIDATION_TOOLING: ${{ steps.tooling.outputs.tooling-policy }}
          SDK_APPLE_VALIDATION_POLICY: ${{ steps.tooling.outputs.apple-policy }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / 'ci'))
          from ci.product_reuse import inspect_products, _canonical_control
          from ci.sdk_native_continuation import select_preparation_anchor
          from ci.reuse import github_output
          policy = os.environ['SDK_VALIDATION_TOOLING']
          tooling = {'sdk_validation_tooling': _canonical_control(Path(policy), 'Caller SDK tooling')} if policy else {}
          apple_policy = os.environ.get('SDK_APPLE_VALIDATION_POLICY', '')
          if apple_policy:
              tooling['sdk_apple_validation_policy'] = _canonical_control(Path(apple_policy), 'Caller Apple validation policy')
          inspected = inspect_products(Path(os.environ['PLAN']), Path(os.environ['DISCOVERY']), Path(os.environ['STATE']),
              repository_root=Path.cwd(), environ=os.environ,
              sdk_original_workflow_sha=os.environ['TRUSTED_WORKFLOW_SHA'], **tooling)
          github_output(Path(os.environ['GITHUB_OUTPUT']), select_preparation_anchor(inspected['readyPlans']))
          PY

  sdk-native-prepare:
