name: Product Validation

on:
  workflow_call:
    inputs:
      trustedWorkflowSha:
        description: Reviewed SHA matching the caller's literal reusable workflow pin
        required: true
        type: string
      baseCommit:
        required: false
        type: string
      validationCommit:
        required: false
        type: string
      validationTree:
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  dispatch-authorization:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: product-attestation
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      approved: ${{ steps.verify.outputs.approved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.validationCommit }}
      - id: verify
        name: Verify protected approval and exact candidate identity
        env:
          BASE_COMMIT: ${{ inputs.baseCommit }}
          VALIDATION_COMMIT: ${{ inputs.validationCommit }}
          VALIDATION_TREE: ${{ inputs.validationTree }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = codex-agent-labs/codex-agent
          test "$GITHUB_SHA" = "$VALIDATION_COMMIT"
          test "$(git rev-parse 'HEAD^{commit}')" = "$VALIDATION_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$VALIDATION_TREE"
          git cat-file -e "$BASE_COMMIT^{commit}"
          git merge-base --is-ancestor "$BASE_COMMIT" "$VALIDATION_COMMIT"
          environment=$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/product-attestation")
          jq -e '
            .name == "product-attestation" and
            .can_admins_bypass == false and
            .deployment_branch_policy == {
              protected_branches: false,
              custom_branch_policies: true
            } and
            any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length) > 0) and
            any(.protection_rules[]?; .type == "branch_policy")
          ' <<<"$environment" >/dev/null
          policies=$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/product-attestation/deployment-branch-policies")
          jq -e '.total_count > 0 and (.branch_policies | length) == .total_count' \
            <<<"$policies" >/dev/null
          echo 'approved=true' >> "$GITHUB_OUTPUT"

  workflow-lint:
    if: always()
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.3"
          cache: false
      - id: actionlint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/actionlint
          key: actionlint-v1-${{ runner.os }}-${{ runner.arch }}-v1.7.12
      - if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: '"$HOME/go/bin/actionlint"'
      - run: python3 -m unittest discover -s ci/tests -v
      - if: needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true'
        uses: ./.github/actions/setup-kmp
        with:
          cache-read-only: "true"
      - name: Verify standalone build logic without configuring product builds
        if: needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true'
        run: >-
          ./gradlew -p gradle/build-logic test
          --configuration-cache --configuration-cache-problems=fail --no-build-cache
      - if: github.event_name == 'pull_request' && steps.actionlint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/actionlint
          key: ${{ steps.actionlint-cache.outputs.cache-primary-key }}

  plan:
    if: always()
    needs: dispatch-authorization
    runs-on: ubuntu-24.04
    outputs:
      merge_ready: ${{ steps.impact.outputs.merge_ready }}
      event_authorized: ${{ steps.event-authorization.outputs.authorized }}
      remote_build_authorized: ${{ steps.impact.outputs.remote_build_authorized }}
      remote_build_authorization_reason: ${{ steps.impact.outputs.remote_build_authorization_reason }}
      validation_commit: ${{ steps.impact.outputs.validation_commit }}
      validation_tree: ${{ steps.impact.outputs.validation_tree }}
      android_evidence_required: ${{ steps.impact.outputs.android_evidence_required }}
      plan_artifact: codex-agent-ci-plan-${{ steps.impact.outputs.validation_tree }}
      plan_id: ${{ steps.upload_plan.outputs.artifact-id }}
      plan_digest: sha256:${{ steps.upload_plan.outputs.artifact-digest }}
      product_matrix: ${{ steps.product-selection.outputs.product_matrix }}
      contract_matrix: ${{ steps.product-selection.outputs.contract_matrix }}
      consumer_matrix: ${{ steps.impact.outputs.consumer_matrix }}
      desktop_matrix: ${{ steps.impact.outputs.desktop_matrix }}
      any_desktop: ${{ steps.impact.outputs.any_desktop }}
      native_wrappers: ${{ steps.impact.outputs.native_wrappers }}
      any_apple: ${{ steps.impact.outputs.any_apple }}
      lane_android: ${{ steps.impact.outputs.lane_android }}
      lane_android_build: ${{ steps.impact.outputs.lane_android_build }}
      lane_android_test: ${{ steps.impact.outputs.lane_android_test }}
      lane_android_metadata: ${{ steps.impact.outputs.lane_android_metadata }}
      lane_node_js: ${{ steps.impact.outputs.lane_node_js }}
      lane_desktop_linux_arm64: ${{ steps.impact.outputs.lane_desktop_linux_arm64 }}
      lane_desktop_linux_arm64_build: ${{ steps.impact.outputs.lane_desktop_linux_arm64_build }}
      lane_desktop_linux_arm64_test: ${{ steps.impact.outputs.lane_desktop_linux_arm64_test }}
      lane_desktop_linux_arm64_metadata: ${{ steps.impact.outputs.lane_desktop_linux_arm64_metadata }}
      lane_ios_swift_tests_test: ${{ steps.impact.outputs.lane_ios_swift_tests_test }}
      validation_reused: ${{ steps.validation-reuse.outputs.reused }}
      validation_source_run_id: ${{ steps.validation-reuse.outputs.source_run_id }}
      product_full_reuse: ${{ steps.product-reuse.outputs.full_reuse }}
      product_target_jobs_required: ${{ steps.product-reuse.outputs.target_jobs_required }}
      product_reuse_reason: ${{ steps.product-reuse.outputs.product_reuse_reason }}
      contract_reconciliation_required: ${{ steps.product-reuse.outputs.contract_reconciliation_required }}
      contract_next_phase: ${{ steps.product-reuse.outputs.contract_next_phase }}
      tooling_required: ${{ steps.product-reuse.outputs.tooling_required }}
      tooling_miss: ${{ steps.product-reuse.outputs.tooling_miss }}
      tooling_artifact_id: ${{ steps.product-reuse.outputs.tooling_artifact_id }}
      tooling_artifact_sha256: ${{ steps.product-reuse.outputs.tooling_artifact_sha256 }}
      tooling_transport_producer: ${{ steps.product-reuse.outputs.tooling_transport_producer }}
    steps:
      - id: event-authorization
        env:
          EVENT_AUTHORIZED: >-
            ${{ github.event_name == 'merge_group' && github.event.action == 'checks_requested' && github.sha == github.event.merge_group.head_sha && github.ref == github.event.merge_group.head_ref || github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ci:remote-final' && github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'merge-ready') && contains(github.event.pull_request.labels.*.name, 'ci:remote-final') && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false && github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && needs.dispatch-authorization.result == 'success' && needs.dispatch-authorization.outputs.approved == 'true' && github.sha == inputs.validationCommit }}
        run: |
          case "$EVENT_AUTHORIZED" in
            true|false) ;;
            *) exit 1 ;;
          esac
          echo "authorized=$EVENT_AUTHORIZED" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.validationCommit || github.sha }}
      - id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.baseCommit }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || inputs.validationCommit }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          QUEUE_ENABLED: ${{ vars.CI_MERGE_QUEUE_ENABLED }}
          DISPATCH_APPROVED: ${{ needs.dispatch-authorization.result == 'success' && needs.dispatch-authorization.outputs.approved == 'true' }}
        run: |
          pr="$PR_NUMBER"
          if [ -z "$pr" ] && [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            pr=${GITHUB_REF#*pr-}
            pr=${pr%%-*}
          fi
          flags=()
          [ -z "$pr" ] || flags+=(--pull-request "$pr")
          [ "$DISPATCH_APPROVED" != true ] || flags+=(--dispatch-approved)
          if [ "$FORCE_FULL" = true ] || { [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$QUEUE_ENABLED" != true ]; }; then
            flags+=(--full)
          fi
          flags+=(--require-android-evidence)
          python3 ci/impact.py --base "$BASE_SHA" --target HEAD --head "$HEAD_SHA" \
            --event "$GITHUB_EVENT_NAME" --event-payload "$GITHUB_EVENT_PATH" \
            --github-ref "$GITHUB_REF" --github-sha "$GITHUB_SHA" \
            --output build/ci/impact-plan.json \
            --github-output "$GITHUB_OUTPUT" "${flags[@]}"
      - id: validation-reuse
        if: steps.event-authorization.outputs.authorized == 'true' && steps.impact.outputs.remote_build_authorized == 'true' && github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 ci/validation_reuse.py discover --plan build/ci/impact-plan.json
          --destination build/ci/reused-validation --github-output "$GITHUB_OUTPUT"
      - id: product-reuse
        if: steps.event-authorization.outputs.authorized == 'true' && steps.impact.outputs.remote_build_authorized == 'true' && steps.validation-reuse.outputs.reused != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
        run: |
          java_executable=$(readlink -f "$JAVA_HOME_17_X64/bin/java")
          test -f "$java_executable"
          python3 ci/product_reuse.py discover --plan build/ci/impact-plan.json \
            --destination build/product-reuse --handoff build/ci/product-reuse \
            --tooling-java-executable "$java_executable" \
            --tooling-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - id: product-selection
        env:
          ORIGINAL_PRODUCT_MATRIX: ${{ steps.impact.outputs.product_matrix }}
          TOOLING_MISS: ${{ steps.product-reuse.outputs.tooling_miss }}
          AUTHORIZED: ${{ steps.event-authorization.outputs.authorized == 'true' && steps.impact.outputs.remote_build_authorized == 'true' }}
          VALIDATION_REUSED: ${{ steps.validation-reuse.outputs.reused }}
        run: |
          python3 - <<'PY'
          import json, os
          miss = os.environ['TOOLING_MISS']
          if miss not in ('', 'true', 'false'):
              raise ValueError('Invalid tooling miss state')
          matrix = []
          if os.environ['AUTHORIZED'] == 'true' and os.environ['VALIDATION_REUSED'] != 'true':
              matrix = json.loads(os.environ['ORIGINAL_PRODUCT_MATRIX'])
              if miss == 'true' and not any(row['lane'] == 'contracts' for row in matrix):
                  matrix.insert(0, dict(lane='contracts', build=False, test=False, metadata=False))
          contracts = [row for row in matrix if row['lane'] == 'contracts']
          if len(contracts) > 1:
              raise ValueError('Contract product lane is duplicated')
          matrix = [row for row in matrix if row['lane'] != 'contracts']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('product_matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
              output.write('contract_matrix=' + json.dumps({'include': contracts}, separators=(',', ':')) + '\n')
          PY
      - id: upload_plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          name: codex-agent-ci-plan-${{ steps.impact.outputs.validation_tree }}
          path: build/ci
          compression-level: 0
          retention-days: 90
      - if: steps.product-reuse.outputs.full_reuse == 'true' && steps.product-reuse.outputs.product_reuse_reason == 'verified-full-reuse'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          name: codex-agent-product-carrier-${{ steps.impact.outputs.validation_tree }}
          path: build/product-reuse/carrier
          compression-level: 0
          retention-days: 90

  product:
    name: product-${{ matrix.lane }}
    if: needs.plan.outputs.event_authorized == 'true' && needs.plan.outputs.remote_build_authorized == 'true' && needs.plan.outputs.validation_reused != 'true' && needs.plan.outputs.product_matrix != '[]'
    needs: [workflow-lint, plan]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.product_matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.validation_commit }}
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: ${{ matrix.lane }}
          plan-artifact: ${{ needs.plan.outputs.plan_artifact }}
          validation-commit: ${{ needs.plan.outputs.validation_commit }}
          validation-tree: ${{ needs.plan.outputs.validation_tree }}
          build: ${{ matrix.build }}
          test: ${{ matrix.test }}
          metadata: ${{ matrix.metadata }}
          node-version: ${{ contains(matrix.lane, 'node') && '24.18.0' || 'none' }}

  contract-validation:
    name: contract-validation
    needs: [workflow-lint, plan]
    if: >-
      needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.plan.outputs.validation_reused != 'true'
    uses: ./.github/workflows/contract-validation.yml
    with:
      planOutputs: ${{ toJSON(needs.plan.outputs) }}
      trustedWorkflowSha: ${{ inputs.trustedWorkflowSha }}
    secrets: inherit

  product-resume:
    name: product-resume
    if: >-
      always() && !cancelled() && needs.plan.outputs.event_authorized == 'true' &&
      needs.plan.outputs.remote_build_authorized == 'true' &&
      needs.plan.outputs.validation_reused != 'true' &&
      github.event_name != 'workflow_dispatch' &&
      needs.contract-validation.outputs.contract_continuation_result == 'success' &&
      needs.contract-validation.outputs.contract_complete == 'true' &&
      needs.contract-validation.outputs.contract_attestation_result == 'success'
    needs: [workflow-lint, plan, contract-validation]
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: codex-agent-product-resume-${{ needs.plan.outputs.validation_tree }}
      artifact_id: ${{ steps.upload_resume.outputs.artifact-id }}
      artifact_digest: sha256:${{ steps.upload_resume.outputs.artifact-digest }}
      full_reuse: ${{ steps.resume.outputs.full_reuse }}
      target_jobs_required: ${{ steps.resume.outputs.target_jobs_required }}
      runtime_matrix: ${{ steps.runtime_matrix.outputs.runtime_matrix }}
      runtime_workers_required: ${{ steps.runtime_matrix.outputs.runtime_workers_required }}
      supervisor_key: ${{ steps.runtime_matrix.outputs.supervisor_key }}
      wave_failed: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_id }}
          path: build/product-resume-plan
          merge-multiple: true
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        run: |
          test -f "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          artifact-id: ${{ needs.contract-validation.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.contract-validation.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.contract-validation.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - name: Capture exact original plan, completed state and signed external evidence
        env:
          PLAN_ARTIFACT_ID: ${{ needs.plan.outputs.plan_id }}
          PLAN_ARTIFACT_SHA256: ${{ needs.plan.outputs.plan_digest }}
          STATE_ARTIFACT_ID: ${{ needs.contract-validation.outputs.contract_state_id }}
          STATE_ARTIFACT_SHA256: ${{ needs.contract-validation.outputs.contract_state_digest }}
          RELEASE_ARTIFACT_ID: ${{ needs.contract-validation.outputs.contract_attestation_artifact_id }}
          RELEASE_ARTIFACT_SHA256: ${{ needs.contract-validation.outputs.contract_attestation_artifact_digest }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trustedWorkflowSha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 ci/product_reuse.py capture-product-resume-inputs \
            --plan build/product-resume-plan/impact-plan.json \
            --plan-artifact-id "$PLAN_ARTIFACT_ID" --plan-artifact-sha256 "$PLAN_ARTIFACT_SHA256" \
            --state-artifact-id "$STATE_ARTIFACT_ID" --state-artifact-sha256 "$STATE_ARTIFACT_SHA256" \
            --release-artifact-id "$RELEASE_ARTIFACT_ID" --release-artifact-sha256 "$RELEASE_ARTIFACT_SHA256" \
            --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
            --trusted-contract-workflow-path .github/workflows/contract-validation.yml \
            --trusted-contract-continuation-job "product-validation / contract-validation / contract-continuation" \
            --destination build/product-resume-inputs
      - id: apple-policy
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/prepare-sdk-apple-policy
        with:
          plan-path: ${{ github.workspace }}/build/product-resume-inputs/plan/impact-plan.json
          tooling-policy: ${{ steps.tooling.outputs.tooling-policy }}
      - name: Resume the existing product planner from authenticated Contract bytes
        id: resume
        env:
          SDK_VALIDATION_TOOLING: ${{ steps.tooling.outputs.tooling-policy }}
          SDK_APPLE_VALIDATION_POLICY: ${{ steps.apple-policy.outputs.apple-policy }}
        run: |
          tooling=()
          if [ -n "$SDK_VALIDATION_TOOLING" ]; then tooling=(--sdk-validation-tooling "$SDK_VALIDATION_TOOLING"); fi
          if [ -n "$SDK_APPLE_VALIDATION_POLICY" ]; then tooling+=(--sdk-apple-validation-policy "$SDK_APPLE_VALIDATION_POLICY"); fi
          python3 ci/product_reuse.py resume-products \
            --plan build/product-resume-inputs/plan/impact-plan.json \
            --discovery-root build/product-resume-inputs/plan/product-reuse \
            --state-root build/product-resume-inputs/state \
            --contract-handoff build/product-resume-inputs/release/contract-input \
            --destination build/product-resume-state \
            --sdk-original-workflow-sha "${{ inputs.trustedWorkflowSha }}" \
            --github-output "$GITHUB_OUTPUT" ${tooling[@]+"${tooling[@]}"}
      - name: Elect Runtime workers from the verified resumed state
        id: runtime_matrix
        env:
          SDK_VALIDATION_TOOLING: ${{ steps.tooling.outputs.tooling-policy }}
          SDK_APPLE_VALIDATION_POLICY: ${{ steps.apple-policy.outputs.apple-policy }}
        run: |
          tooling=()
          if [ -n "$SDK_VALIDATION_TOOLING" ]; then tooling=(--sdk-validation-tooling "$SDK_VALIDATION_TOOLING"); fi
          if [ -n "$SDK_APPLE_VALIDATION_POLICY" ]; then tooling+=(--sdk-apple-validation-policy "$SDK_APPLE_VALIDATION_POLICY"); fi
          python3 -B ci/runtime_workflow.py matrix \
            --plan build/product-resume-inputs/plan/impact-plan.json \
            --discovery-root build/product-resume-state --state-root build/product-resume-state \
            --sdk-original-workflow-sha "${{ inputs.trustedWorkflowSha }}" \
            --github-output "$GITHUB_OUTPUT" ${tooling[@]+"${tooling[@]}"}
      - name: Preserve the resumed state and all original transport evidence
        id: upload_resume
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          name: codex-agent-product-resume-${{ needs.plan.outputs.validation_tree }}
          path: |
            build/product-resume-inputs
            build/product-resume-state
          compression-level: 0
          retention-days: 90

  runtime-linux-arm64-supervisor:
    name: runtime-linux-arm64-supervisor
    needs: [plan, product-resume, contract-validation]
    if: always() && needs.product-resume.result == 'success' && needs.product-resume.outputs.supervisor_key != ''
    runs-on: ubuntu-24.04-arm
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: sha256:${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.validation_commit }}
      - name: Select installed caller Java for SDK tooling
        if: needs.plan.outputs.tooling_required == 'true'
        shell: bash
        run: |
          java_home_variable="JAVA_HOME_17_${RUNNER_ARCH}"
          selected_java_home="${!java_home_variable}"
          java_binary=java
          if [ "$RUNNER_OS" = Windows ]; then java_binary=java.exe; fi
          test -f "$selected_java_home/bin/$java_binary"
          echo "JAVA_HOME=$selected_java_home" >> "$GITHUB_ENV"
      - id: tooling
        if: needs.plan.outputs.tooling_required == 'true'
        uses: ./.github/actions/capture-sdk-tooling
        with:
          plan-id: ${{ needs.plan.outputs.plan_id }}
          artifact-id: ${{ needs.contract-validation.outputs.tooling_artifact_id }}
          artifact-sha256: ${{ needs.contract-validation.outputs.tooling_artifact_sha256 }}
          transport-producer: ${{ needs.contract-validation.outputs.tooling_transport_producer }}
          trusted-workflow-sha: ${{ inputs.trustedWorkflowSha }}
          trusted-workflow-path: .github/workflows/contract-validation.yml
          trusted-job-name: product-validation / contract-validation / product-contracts
          policy-revision: ${{ needs.plan.outputs.validation_commit }}
      - id: captured
        uses: ./.github/actions/capture-runtime-state
        with:
          sdk-validation-tooling: ${{ steps.tooling.outputs.tooling-policy }}
